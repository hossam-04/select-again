ode>INTERVAL\u003c/code>, MySQL treats a date in arithmetic as the number \u003ccode>YYYYMMDD\u003c/code>. \u003ccode>d + 1\u003c/code> and \u003ccode>later - earlier\u003c/code> look right in the middle of a month and go wrong at month ends. Add with \u003ccode>INTERVAL\u003c/code>, and subtract with \u003ccode>DATEDIFF\u003c/code>.\u003c/p>\n\u003c/aside>\u003cdiv class=\"example\" data-ex=\"expressions-ex10\">\u003c/div>\n\u003cp>\u003ccode>subtracted\u003c/code> is 73 (20250301 − 20250228), and \u003ccode>plus_one\u003c/code> is 20250229, a number rather than a date. This exact mistake is a classic wrong answer to \u003ca class=\"pref\" href=\"#p197\">\u003cspan class=\"pnum\">#197\u003c/span> Rising Temperature\u003c/a>.\u003c/p>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases \u003cspan>· Dates are the least portable part of SQL\u003c/span>\u003c/div>\u003cp>PostgreSQL: \u003ccode>date_trunc(&#39;month&#39;, d)\u003c/code>, \u003ccode>d + INTERVAL &#39;7 days&#39;\u003c/code>, \u003ccode>EXTRACT(YEAR FROM d)\u003c/code>, \u003ccode>to_char(d, &#39;YYYY-MM&#39;)\u003c/code>, and \u003ccode>later - earlier\u003c/code> gives days directly. SQL Server: \u003ccode>DATEADD(day, 7, d)\u003c/code>, \u003ccode>DATEDIFF(day, earlier, later)\u003c/code> (note the reversed order), \u003ccode>FORMAT(d, &#39;yyyy-MM&#39;)\u003c/code>. The ideas carry over; the spellings don&#39;t.\u003c/p>\n\u003c/aside>\u003ch2>Implicit conversion\u003c/h2>\n\u003cp>MySQL converts types quietly. \u003ccode>&#39;10&#39; + 5\u003c/code> is 15, and \u003ccode>&#39;3 apples&#39; + 2\u003c/code> is 5 (with a warning in real MySQL). Comparing a number column to a string compares numerically. This is convenient until it hides a bug. When types differ, cast explicitly: \u003ccode>CAST(x AS SIGNED)\u003c/code>, \u003ccode>CAST(x AS DECIMAL(10,2))\u003c/code>, \u003ccode>CAST(x AS CHAR)\u003c/code>, \u003ccode>CAST(x AS DATE)\u003c/code>.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex11\">\u003c/div>\n\u003cp>Casting the \u003cem>string\u003c/em> \u003ccode>&#39;7.9&#39;\u003c/code> truncates to 7, but casting the \u003cem>number\u003c/em> 7.9 rounds to 8. That&#39;s a genuine MySQL quirk.\u003c/p>\n\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"expressions-q1\">\u003c/div>","examples":[{"id":"expressions-ex1","sql":"SELECT first_name, salary,\n       CASE\n         WHEN salary >= 150000 THEN 'band A'\n         WHEN salary >= 100000 THEN 'band B'   -- only reached if the first WHEN failed\n         ELSE 'band C'\n       END AS band\nFROM employees\nORDER BY salary DESC\nLIMIT 6;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","salary","band"],"rows":[["Nadia",250000,"band A"],["Omar",180000,"band A"],["Lina",150000,"band A"],["Youssef",140000,"band B"],["Karim",125000,"band B"],["Priya",120000,"band B"]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex2","sql":"SELECT order_id, status\nFROM orders\nWHERE order_date >= '2025-01-01'\nORDER BY CASE status WHEN 'pending' THEN 1 WHEN 'shipped' THEN 2 ELSE 3 END, order_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["order_id","status"],"rows":[[23,"pending"],[24,"pending"],[21,"shipped"],[22,"shipped"],[20,"delivered"]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex3","sql":"SELECT first_name,\n       IF(manager_id IS NULL, 'top', 'reports to someone') AS position,\n       salary > 100000 AS six_figures\nFROM employees\nWHERE emp_id \u003c= 5;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","position","six_figures"],"rows":[["Nadia","top",1],["Omar","reports to someone",1],["Lina","reports to someone",1],["Karim","reports to someone",1],["Sara","reports to someone",1]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex4","sql":"SELECT name, price,\n       ROUND(price * 1.14, 2)   AS with_vat,\n       CEIL(price / 100) * 100  AS next_hundred,\n       FORMAT(price * 1000, 0)  AS pretty\nFROM products\nWHERE category = 'Computers';","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","price","with_vat","next_hundred","pretty"],"rows":[["Laptop Pro 14",1899,2164.86,1900,"1,899,000"],["Laptop Air 13",1199,1366.86,1200,"1,199,000"]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex5","sql":"SELECT CONCAT(first_name, ' ', last_name)       AS full_name,\n       UPPER(LEFT(last_name, 3))                 AS code,\n       SUBSTRING_INDEX(email, '@', -1)           AS domain,\n       CHAR_LENGTH(first_name)                   AS name_len\nFROM employees\nWHERE dept_id = 4;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["full_name","code","domain","name_len"],"rows":[["Priya Nair","NAI","acme.test",5],["Ahmed Samir","SAM",null,5],["Julia Rossi","ROS","acme.test",5]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex6","sql":"SELECT name,\n       CONCAT(name, ' \u003c', email, '>')         AS concat_result,\n       CONCAT_WS(' / ', name, email, city)    AS concat_ws_result\nFROM customers\nWHERE email IS NULL OR city IS NULL;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","concat_result","concat_ws_result"],"rows":[["Diego Alvarez",null,"Diego Alvarez / Madrid"],["George Miller","George Miller \u003cgeorge@mail.test>","George Miller / george@mail.test"]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex7","sql":"SELECT email,\n       email REGEXP '^[a-z]+[.][a-z]+@acme[.]test$'               AS default_match,\n       REGEXP_LIKE(email, '^[a-z]+[.][a-z]+@acme[.]test$', 'c')   AS case_sensitive\nFROM employees\nWHERE dept_id = 3;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["email","default_match","case_sensitive"],"rows":[["mariam.fathy@acme.test",1,1],["Leo.Martin@Acme.test",1,0]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex8","sql":"SELECT order_id, order_date,\n       DATE_FORMAT(order_date, '%Y-%m')      AS month,\n       DAYNAME(order_date)                   AS weekday,\n       DATEDIFF('2025-03-31', order_date)    AS days_before_q1_end,\n       LAST_DAY(order_date)                  AS month_end\nFROM orders\nORDER BY order_date DESC\nLIMIT 5;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["order_id","order_date","month","weekday","days_before_q1_end","month_end"],"rows":[[24,"2025-03-02","2025-03","Sunday",29,"2025-03-31"],[23,"2025-02-21","2025-02","Friday",38,"2025-02-28"],[22,"2025-02-07","2025-02","Friday",52,"2025-02-28"],[21,"2025-01-25","2025-01","Saturday",65,"2025-01-31"],[20,"2025-01-12","2025-01","Sunday",78,"2025-01-31"]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex9","sql":"SELECT first_name, hire_date,\n       TIMESTAMPDIFF(YEAR, hire_date, '2025-06-30')  AS full_years,\n       DATE_ADD(hire_date, INTERVAL 90 DAY)          AS probation_ends\nFROM employees\nWHERE dept_id = 1;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","hire_date","full_years","probation_ends"],"rows":[["Omar","2017-06-12",8,"2017-09-10"],["Lina","2018-09-03",6,"2018-12-02"],["Karim","2019-11-18",5,"2020-02-16"],["Sara","2021-02-01",4,"2021-05-02"],["Ben","2022-07-15",2,"2022-10-13"],["Aya","2024-01-08",1,"2024-04-07"]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex10","sql":"SELECT DATE('2025-03-01') - DATE('2025-02-28') AS subtracted,\n       DATEDIFF('2025-03-01', '2025-02-28')    AS datediff_days,\n       DATE('2025-02-28') + 1                  AS plus_one,\n       DATE('2025-02-28') + INTERVAL 1 DAY     AS next_day;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["subtracted","datediff_days","plus_one","next_day"],"rows":[[73,1,20250229,"2025-03-01"]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"expressions-ex11","sql":"SELECT '10' + 5              AS sum_of_text,\n       '3 apples' + 2        AS lenient,\n       CAST('7.9' AS SIGNED) AS cast_text_int,\n       CAST(7.9 AS SIGNED)   AS cast_num_int,\n       CAST(2/3 AS DECIMAL(10,2)) AS two_thirds;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["sum_of_text","lenient","cast_text_int","cast_num_int","two_thirds"],"rows":[[15,5,7,8,0.67]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"expressions-q1","questions":[{"q":"\u003ccode>CONCAT(&#39;Order #&#39;, order_id, &#39; — &#39;, note)\u003c/code> returns NULL for some rows. Why?","options":["\u003ccode>order_id\u003c/code> is a number, so CONCAT fails","\u003ccode>note\u003c/code> is NULL on those rows, and CONCAT returns NULL if any argument is NULL","the em dash is not allowed","CONCAT needs exactly two arguments"],"answer":1,"explain":"\u003cp>Wrap the nullable part (\u003ccode>IFNULL(note, &#39;&#39;)\u003c/code>) or use \u003ccode>CONCAT_WS\u003c/code>, which skips NULLs.\u003c/p>\n"},{"q":"What does \u003ccode>CASE WHEN x &gt; 10 THEN &#39;big&#39; WHEN x &gt; 5 THEN &#39;medium&#39; END\u003c/code> return for x = 3?","options":["\u003ccode>&#39;medium&#39;\u003c/code>","\u003ccode>&#39;&#39;\u003c/code>","NULL","an error"],"answer":2,"explain":"\u003cp>No branch matched and there&#39;s no ELSE, so the result is NULL.\u003c/p>\n"},{"q":"\u003ccode>LENGTH(&#39;héllo&#39;)\u003c/code> vs \u003ccode>CHAR_LENGTH(&#39;héllo&#39;)\u003c/code> in MySQL with utf8mb4?","options":["5 and 5","6 and 5","5 and 6","6 and 6"],"answer":1,"explain":"\u003cp>LENGTH counts bytes, and \u003ccode>é\u003c/code> takes two bytes in UTF-8. For &quot;number of characters&quot; use CHAR_LENGTH.\u003c/p>\n"},{"q":"Which expression gives the first day of the month for a date \u003ccode>d\u003c/code>?","options":["\u003ccode>DAY(d, 1)\u003c/code>","\u003ccode>DATE_FORMAT(d, &#39;%Y-%m-01&#39;)\u003c/code>","\u003ccode>LAST_DAY(d) - 30\u003c/code>","\u003ccode>MONTH(d) || &#39;-01&#39;\u003c/code>"],"answer":1,"explain":"\u003cp>Format the date back to text with the day fixed at 01 (MySQL accepts the result wherever a date is expected). \u003ccode>LAST_DAY(d)\u003c/code> gives the month end.\u003c/p>\n"},{"q":"Which REGEXP call is case-sensitive in MySQL 8?","options":["\u003ccode>mail REGEXP &#39;^[a-z]+@x[.]com$&#39;\u003c/code>","\u003ccode>mail RLIKE &#39;^[a-z]+@x[.]com$&#39;\u003c/code>","\u003ccode>REGEXP_LIKE(mail, &#39;^[a-z]+@x[.]com$&#39;, &#39;c&#39;)\u003c/code>","All of them"],"answer":2,"explain":"\u003cp>REGEXP and RLIKE follow the column&#39;s collation, which is case-insensitive by default. The \u003ccode>&#39;c&#39;\u003c/code> flag forces a case-sensitive match.\u003c/p>\n"}]}],"problems":[610,1873,1667,1683,1517]},{"id":"aggregation","num":4,"title":"Aggregation","summary":"Collapsing rows into answers — counting, summing and averaging per group, filtering groups, and the conditional-aggregation trick behind half of all reporting queries.","clauses":["GROUP BY","HAVING","SELECT"],"kicker":"GROUP BY · HAVING · COUNT · SUM · conditional aggregation","minutes":15,"html":"\u003ch2>Aggregate functions\u003c/h2>\n\u003cp>An aggregate turns many rows into one value. The five you&#39;ll use constantly:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Counts / computes\u003c/th>\u003cth>NULLs\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>COUNT(*)\u003c/code>\u003c/td>\u003ctd>rows\u003c/td>\u003ctd>counted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>COUNT(col)\u003c/code>\u003c/td>\u003ctd>rows where \u003ccode>col\u003c/code> is not NULL\u003c/td>\u003ctd>skipped\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>COUNT(DISTINCT col)\u003c/code>\u003c/td>\u003ctd>distinct non-NULL values\u003c/td>\u003ctd>skipped\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SUM(col)\u003c/code>, \u003ccode>AVG(col)\u003c/code>\u003c/td>\u003ctd>total, mean\u003c/td>\u003ctd>skipped (AVG divides by the non-NULL count)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>MIN(col)\u003c/code>, \u003ccode>MAX(col)\u003c/code>\u003c/td>\u003ctd>smallest, largest (works on dates and text too)\u003c/td>\u003ctd>skipped\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"aggregation-ex1\">\u003c/div>\n\u003cp>Ahmed has no email, so \u003ccode>COUNT(email)\u003c/code> is 15, not 16. The CEO has no department, and \u003ccode>COUNT(DISTINCT dept_id)\u003c/code> ignores her NULL, so it reports 4 departments.\u003c/p>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Empty input\u003c/span>\u003c/div>\u003cp>An aggregate over zero rows still returns one row: \u003ccode>COUNT\u003c/code> gives 0, but \u003ccode>SUM\u003c/code>, \u003ccode>AVG\u003c/code>, \u003ccode>MIN\u003c/code> and \u003ccode>MAX\u003c/code> give \u003cstrong>NULL\u003c/strong>. Wrap them with \u003ccode>IFNULL(SUM(x), 0)\u003c/code> when a total should read 0.\u003c/p>\n\u003c/aside>\u003ch2>GROUP BY: one row per group\u003c/h2>\n\u003cp>\u003ccode>GROUP BY\u003c/code> splits the rows into groups that share the same values, then each aggregate runs once per group:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"aggregation-ex2\">\u003c/div>\n\u003cp>The NULL \u003ccode>dept_id\u003c/code> forms its own group (the CEO). You can group by several columns, or by an expression. Monthly order counts:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"aggregation-ex3\">\u003c/div>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· The golden rule of grouping\u003c/span>\u003c/div>\u003cp>After \u003ccode>GROUP BY\u003c/code>, every column in SELECT must be either \u003cstrong>in the GROUP BY\u003c/strong> or \u003cstrong>inside an aggregate\u003c/strong>. Otherwise, which row&#39;s value would it show? MySQL enforces this with \u003ccode>ONLY_FULL_GROUP_BY\u003c/code> (on by default since 5.7, and on at LeetCode). The one exception is a column \u003cem>determined\u003c/em> by the grouped primary key: after \u003ccode>GROUP BY d.dept_id\u003c/code> you may select \u003ccode>d.name\u003c/code>.\u003c/p>\n\u003c/aside>\u003cdiv class=\"example\" data-ex=\"aggregation-ex4\">\u003c/div>\n\u003cp>This engine ran it and picked an arbitrary \u003ccode>first_name\u003c/code> per group, but MySQL would refuse. Decide what you actually want: \u003ccode>MAX(first_name)\u003c/code>, a \u003ccode>GROUP_CONCAT\u003c/code> of all names, or the top earner per group (that one needs Module 9).\u003c/p>\n\u003ch2>WHERE vs HAVING\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>WHERE\u003c/strong> filters \u003cem>rows\u003c/em>, before grouping. It can&#39;t see aggregates.\u003c/li>\n\u003cli>\u003cstrong>HAVING\u003c/strong> filters \u003cem>groups\u003c/em>, after aggregating. It usually tests an aggregate.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"aggregation-ex5\">\u003c/div>\n\u003cp>A condition that doesn&#39;t involve an aggregate belongs in WHERE. It&#39;s cheaper, because rows are dropped before any grouping work happens.\u003c/p>\n\u003ch2>Conditional aggregation\u003c/h2>\n\u003cp>This is the single most useful aggregation trick. Put a condition \u003cem>inside\u003c/em> the aggregate to count or sum only some rows, and get several answers from one pass:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"aggregation-ex6\">\u003c/div>\n\u003cp>In MySQL a comparison is 1 or 0, so \u003ccode>SUM(cond)\u003c/code> counts the rows where it holds and \u003ccode>AVG(cond)\u003c/code> is the fraction. The portable spelling is \u003ccode>SUM(CASE WHEN cond THEN 1 ELSE 0 END)\u003c/code>, and to sum an amount instead of counting, use \u003ccode>SUM(CASE WHEN cond THEN amount ELSE 0 END)\u003c/code> or \u003ccode>SUM(IF(cond, amount, 0))\u003c/code>.\u003c/p>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· COUNT(condition) counts everything\u003c/span>\u003c/div>\u003cp>\u003ccode>COUNT(status = &#39;cancelled&#39;)\u003c/code> counts every row, because the condition evaluates to 0 or 1 and neither is NULL. To count matches, use \u003ccode>SUM(cond)\u003c/code>, or \u003ccode>COUNT(CASE WHEN cond THEN 1 END)\u003c/code>: the missing ELSE yields NULL, which COUNT skips.\u003c/p>\n\u003c/aside>\u003cdiv class=\"example\" data-ex=\"aggregation-ex7\">\u003c/div>\n\u003ch2>Totals from related rows\u003c/h2>\n\u003cp>Aggregates happily take expressions. Order totals come from the line items:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"aggregation-ex8\">\u003c/div>\n\u003ch2>GROUP_CONCAT: a list per group\u003c/h2>\n\u003cp>\u003ccode>GROUP_CONCAT(expr ORDER BY … SEPARATOR &#39;…&#39;)\u003c/code> glues a group&#39;s values into one string, and \u003ccode>DISTINCT\u003c/code> removes repeats:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"aggregation-ex9\">\u003c/div>\n\u003caside class=\"callout work\">\u003cdiv class=\"callout-label\">On the job \u003cspan>· group_concat_max_len\u003c/span>\u003c/div>\u003cp>MySQL silently truncates \u003ccode>GROUP_CONCAT\u003c/code> results at \u003ccode>group_concat_max_len\u003c/code> bytes, which defaults to \u003cstrong>1024\u003c/strong>. Long lists get cut off without an error. Raise it per session with \u003ccode>SET SESSION group_concat_max_len = 100000;\u003c/code> before relying on long lists.\u003c/p>\n\u003c/aside>\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases\u003c/div>\u003cp>PostgreSQL uses \u003ccode>string_agg(name, &#39;, &#39; ORDER BY price DESC)\u003c/code>, and SQL Server 2017+ uses \u003ccode>STRING_AGG(name, &#39;, &#39;) WITHIN GROUP (ORDER BY price DESC)\u003c/code>. Both have \u003ccode>FILTER (WHERE …)\u003c/code> or \u003ccode>CASE\u003c/code> for conditional aggregates. PostgreSQL enforces the grouping rule just like \u003ccode>ONLY_FULL_GROUP_BY\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>Things you can&#39;t do (and what to do instead)\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Nest aggregates:\u003c/strong> \u003ccode>MAX(COUNT(*))\u003c/code> is an error. Aggregate once in a subquery, then aggregate again outside, or sort and take the top: \u003ccode>ORDER BY COUNT(*) DESC LIMIT 1\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Filter on an aggregate in WHERE:\u003c/strong> use HAVING.\u003c/li>\n\u003cli>\u003cstrong>Mix detail and totals in one row\u003c/strong> without a window function: &quot;each employee with their department&#39;s average&quot; is a job for Module 9&#39;s \u003ccode>AVG(salary) OVER (PARTITION BY dept_id)\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003caside class=\"callout interview\">\u003cdiv class=\"callout-label\">Interview angle \u003cspan>· Read the grain first\u003c/span>\u003c/div>\u003cp>Before writing a GROUP BY, say what one output row represents: &quot;one row per customer per month&quot;. The GROUP BY columns are exactly that grain. Most wrong answers group at the wrong grain, for example per day when the question asks per month, or per (date, product) when it asks per date.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"aggregation-q1\">\u003c/div>","examples":[{"id":"aggregation-ex1","sql":"SELECT COUNT(*)                AS employees,\n       COUNT(email)            AS with_email,\n       COUNT(DISTINCT dept_id) AS departments,\n       SUM(salary)             AS payroll,\n       ROUND(AVG(salary))      AS avg_salary,\n       MIN(hire_date)          AS first_hire,\n       MAX(hire_date)          AS latest_hire\nFROM employees;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["employees","with_email","departments","payroll","avg_salary","first_hire","latest_hire"],"rows":[[16,15,4,1855000,115938,"2016-03-01","2025-01-06"]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"aggregation-ex2","sql":"SELECT dept_id,\n       COUNT(*)            AS headcount,\n       ROUND(AVG(salary))  AS avg_salary,\n       MAX(salary)         AS top_salary\nFROM employees\nGROUP BY dept_id\nORDER BY dept_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["dept_id","headcount","avg_salary","top_salary"],"rows":[[null,1,250000,250000],[1,6,126667,180000],[2,4,95500,140000],[3,2,93500,115000],[4,3,92000,120000]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"aggregation-ex3","sql":"SELECT DATE_FORMAT(order_date, '%Y-%m') AS month,\n       COUNT(*)                          AS orders\nFROM orders\nGROUP BY month            -- MySQL allows the SELECT alias here\nORDER BY month;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["month","orders"],"rows":[["2024-01",2],["2024-02",3],["2024-03",2],["2024-04",1],["2024-05",2],["2024-06",1],["2024-07",2],["2024-08",1],["2024-09",1],["2024-10",1],["2024-11",2],["2024-12",1],["2025-01",2],["2025-02",2],["2025-03",1]],"total":15,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"aggregation-ex4","sql":"SELECT dept_id, first_name, COUNT(*) AS headcount\nFROM employees\nGROUP BY dept_id;","db":"sample","expectError":false,"expectWarning":true,"title":"","output":{"columns":["dept_id","first_name","headcount"],"rows":[[null,"Nadia",1],[1,"Omar",6],[2,"Youssef",4],[3,"Mariam",2],[4,"Priya",3]],"total":5,"explain":false,"error":null,"warnings":["MySQL rejects `first_name` in SELECT (ONLY_FULL_GROUP_BY, error 1055): it is neither in GROUP BY nor inside an aggregate. Add it to GROUP BY, or wrap it in MAX() / ANY_VALUE()."],"notes":[],"summary":[]}},{"id":"aggregation-ex5","sql":"-- departments with at least 3 people hired before 2023\nSELECT dept_id, COUNT(*) AS veterans\nFROM employees\nWHERE hire_date \u003c '2023-01-01'   -- row filter\nGROUP BY dept_id\nHAVING COUNT(*) >= 3;            -- group filter","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["dept_id","veterans"],"rows":[[1,5]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"aggregation-ex6","sql":"SELECT customer_id,\n       COUNT(*)                                       AS orders,\n       SUM(status = 'delivered')                      AS delivered,\n       SUM(status = 'cancelled')                      AS cancelled,\n       ROUND(100 * AVG(status = 'cancelled'), 1)      AS cancel_pct\nFROM orders\nGROUP BY customer_id\nHAVING COUNT(*) >= 3\nORDER BY customer_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["customer_id","orders","delivered","cancelled","cancel_pct"],"rows":[[1,4,3,0,0],[2,3,3,0,0],[3,3,1,1,33.3],[5,3,2,1,33.3],[9,3,2,0,0]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"aggregation-ex7","sql":"SELECT COUNT(status = 'cancelled')                   AS wrong_count,\n       SUM(status = 'cancelled')                     AS sum_count,\n       COUNT(CASE WHEN status = 'cancelled' THEN 1 END) AS count_case\nFROM orders;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["wrong_count","sum_count","count_case"],"rows":[[24,2,2]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"aggregation-ex8","sql":"SELECT order_id,\n       SUM(quantity * unit_price) AS order_total,\n       COUNT(*)                   AS lines\nFROM order_items\nGROUP BY order_id\nHAVING order_total > 2000        -- MySQL allows the alias in HAVING\nORDER BY order_total DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["order_id","order_total","lines"],"rows":[[8,2477,3]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"aggregation-ex9","sql":"SELECT category,\n       COUNT(*) AS n,\n       GROUP_CONCAT(name ORDER BY price DESC SEPARATOR ', ') AS products\nFROM products\nGROUP BY category\nORDER BY n DESC, category;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["category","n","products"],"rows":[["Accessories",4,"4K Monitor, Mechanical Keyboard, USB-C Hub, Wireless Mouse"],["Audio",2,"Noise-Cancelling Headphones, Bluetooth Speaker"],["Computers",2,"Laptop Pro 14, Laptop Air 13"],["Phones",2,"Phone X, Phone Case"],["Wearables",1,"Smart Watch"]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"aggregation-q1","questions":[{"q":"\u003ccode>SELECT COUNT(city), COUNT(*) FROM customers\u003c/code> where 2 of 12 cities are NULL returns…","options":["12, 12","10, 12","12, 10","10, 10"],"answer":1,"explain":"\u003cp>\u003ccode>COUNT(col)\u003c/code> skips NULLs; \u003ccode>COUNT(*)\u003c/code> counts rows.\u003c/p>\n"},{"q":"Where does a condition like \u003ccode>salary &gt; 50000\u003c/code> belong in a grouped query?","options":["WHERE — it filters rows before grouping","HAVING — all conditions in a grouped query go there","Either; MySQL moves it automatically","Inside COUNT()"],"answer":0,"explain":"\u003cp>Row-level conditions go in WHERE. HAVING is for conditions on the groups themselves, typically on aggregates.\u003c/p>\n"},{"q":"What does \u003ccode>SUM(amount)\u003c/code> return for a group where every \u003ccode>amount\u003c/code> is NULL?","options":["0","NULL","an error","the row count"],"answer":1,"explain":"\u003cp>SUM skips NULLs, and with nothing left to add, the result is NULL. Use \u003ccode>IFNULL(SUM(amount), 0)\u003c/code> for a zero.\u003c/p>\n"},{"q":"You need, per country, the number of approved transactions. Which expression is correct?","options":["\u003ccode>COUNT(state = &#39;approved&#39;)\u003c/code>","\u003ccode>SUM(state = &#39;approved&#39;)\u003c/code>","\u003ccode>COUNT(*) WHERE state = &#39;approved&#39;\u003c/code>","\u003ccode>MAX(state = &#39;approved&#39;)\u003c/code>"],"answer":1,"explain":"\u003cp>\u003ccode>COUNT(condition)\u003c/code> counts the 0s as well as the 1s. \u003ccode>SUM(condition)\u003c/code> adds up the 1s. (\u003ccode>COUNT(*) WHERE …\u003c/code> isn&#39;t valid syntax.)\u003c/p>\n"},{"q":"MySQL rejects \u003ccode>SELECT dept_id, first_name, COUNT(*) FROM employees GROUP BY dept_id\u003c/code>. Why?","options":["COUNT needs a column","\u003ccode>first_name\u003c/code> is neither grouped nor aggregated (ONLY_FULL_GROUP_BY)","You can&#39;t group by a nullable column","GROUP BY must list every column"],"answer":1,"explain":"\u003cp>Each group has many first names. Say which one you want: \u003ccode>MAX(first_name)\u003c/code>, \u003ccode>GROUP_CONCAT(first_name)\u003c/code>, or group by it as well.\u003c/p>\n"}]}],"problems":[182,596,2356,1729,586,511,1693,1741,1890,1050,1484,1141,1211,1193,1393]},{"id":"joins","num":5,"title":"Joins","summary":"Combining tables without losing rows you meant to keep or duplicating rows you meant to count once — the source of most wrong answers in real reporting code.","clauses":["FROM","WHERE"],"kicker":"INNER · LEFT · self · anti · semi · CROSS","minutes":17,"html":"\u003ch2>The mental model\u003c/h2>\n\u003cp>A join pairs rows from two tables. Conceptually, it builds every combination and keeps the pairs for which the \u003ccode>ON\u003c/code> condition is TRUE. Two questions decide every join:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Which rows must survive?\u003c/strong> Only matched pairs (INNER), or every row of one side even without a match (LEFT/RIGHT)?\u003c/li>\n\u003cli>\u003cstrong>What is one output row now?\u003c/strong> Joining a customer to their orders changes the grain from \u003cem>customer\u003c/em> to \u003cem>order\u003c/em>. Everything you aggregate afterwards counts at that new grain.\u003c/li>\n\u003c/ol>\n\u003ch2>INNER JOIN: matches only\u003c/h2>\n\u003cdiv class=\"example\" data-ex=\"joins-ex1\">\u003c/div>\n\u003cp>That&#39;s 15 rows for 16 employees. Nadia, the CEO, has \u003ccode>dept_id = NULL\u003c/code>, and \u003ccode>NULL = anything\u003c/code> is never TRUE, so she has no partner and quietly disappears. That&#39;s what INNER means, and it&#39;s also how rows go missing from reports without anyone noticing.\u003c/p>\n\u003ch2>LEFT JOIN: keep every row on the left\u003c/h2>\n\u003cdiv class=\"example\" data-ex=\"joins-ex2\">\u003c/div>\n\u003cp>A left row with no match still appears, with NULLs for the right side. The classic use is counting \u003cem>including zeros\u003c/em>:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"joins-ex3\">\u003c/div>\n\u003cp>Legal has no employees. It still gets a row, and \u003ccode>COUNT(e.emp_id)\u003c/code> correctly says 0, while \u003ccode>COUNT(*)\u003c/code> says 1 because the NULL-padded row is still a row.\u003c/p>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· After a LEFT JOIN, count a column from the right table\u003c/span>\u003c/div>\u003cp>\u003ccode>COUNT(right.id)\u003c/code> counts real matches. \u003ccode>COUNT(*)\u003c/code> counts rows, including the one NULL-filled row a left row gets when nothing matched.\u003c/p>\n\u003c/aside>\u003cp>\u003ccode>RIGHT JOIN\u003c/code> is the mirror image. Nobody needs it, since you can swap the table order and write a LEFT JOIN, which reads more naturally. MySQL has \u003cstrong>no FULL OUTER JOIN\u003c/strong>; Module 7 shows the \u003ccode>UNION\u003c/code> emulation.\u003c/p>\n\u003ch2>ON vs WHERE: the bug everyone writes once\u003c/h2>\n\u003cp>In a LEFT JOIN, a condition on the \u003cstrong>right\u003c/strong> table means very different things in ON and in WHERE:\u003c/p>\n\u003cul>\n\u003cli>In \u003cstrong>ON\u003c/strong>, it restricts \u003cem>which rows can match\u003c/em>, and unmatched left rows survive with NULLs.\u003c/li>\n\u003cli>In \u003cstrong>WHERE\u003c/strong>, it runs \u003cem>after\u003c/em> the join and throws away the NULL-padded rows, silently turning your LEFT JOIN into an INNER JOIN.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"joins-ex4\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"joins-ex5\">\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha\u003c/div>\u003cp>Conditions on the \u003cstrong>left\u003c/strong> table of a LEFT JOIN belong in WHERE. Conditions on the \u003cstrong>right\u003c/strong> table almost always belong in ON. If you see \u003ccode>LEFT JOIN t … WHERE t.col = …\u003c/code>, something is probably wrong. The one exception is \u003ccode>WHERE t.id IS NULL\u003c/code>, which is the anti-join below.\u003c/p>\n\u003c/aside>\u003ch2>Anti-join: rows with \u003cem>no\u003c/em> match\u003c/h2>\n\u003cp>&quot;Customers who never ordered&quot; means left rows whose match is missing:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"joins-ex6\">\u003c/div>\n\u003cp>Test a column that can&#39;t be NULL in a real match, like the right table&#39;s primary key. \u003ccode>NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)\u003c/code> says the same thing and is often clearer. Avoid \u003ccode>NOT IN (subquery)\u003c/code> unless the subquery column can&#39;t be NULL (Module 2).\u003c/p>\n\u003ch2>Semi-join: rows with \u003cem>at least one\u003c/em> match\u003c/h2>\n\u003cp>&quot;Customers who bought a phone&quot;: a plain JOIN repeats each customer once per matching line.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"joins-ex7\">\u003c/div>\n\u003cp>Jamal appears three times and Bilal twice. You could slap \u003ccode>DISTINCT\u003c/code> on it, but the cleaner tool is \u003ccode>EXISTS\u003c/code>, which asks the yes/no question directly and never duplicates (more in Module 6):\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"joins-ex8\">\u003c/div>\n\u003ch2>Self-join: a table meets itself\u003c/h2>\n\u003cp>Hierarchies and &quot;compare with another row of the same table&quot; are self-joins. Give each copy its own alias:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"joins-ex9\">\u003c/div>\n\u003cp>The same trick compares rows of one table: consecutive days (#197), start/end events (#1661), pairs of emails (#182).\u003c/p>\n\u003ch2>Fan-out: when joins multiply your totals\u003c/h2>\n\u003cp>Join a customer to orders (one-to-many), then to order items (one-to-many again), and each order row is repeated once per item. Any COUNT or SUM taken at the wrong grain is now inflated:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"joins-ex10\">\u003c/div>\n\u003cp>Alice placed 4 orders, but \u003ccode>COUNT(*)\u003c/code> counts her 5 order \u003cem>lines\u003c/em>. \u003ccode>COUNT(DISTINCT o.order_id)\u003c/code> recovers the order count. For \u003cem>sums\u003c/em> at the order level (say, a shipping fee stored on orders), DISTINCT won&#39;t save you. Aggregate each child table in a subquery first, then join the pre-aggregated results.\u003c/p>\n\u003caside class=\"callout work\">\u003cdiv class=\"callout-label\">On the job \u003cspan>· The double-join report bug\u003c/span>\u003c/div>\u003cp>&quot;Revenue per customer&quot; joined to both \u003ccode>payments\u003c/code> and \u003ccode>refunds\u003c/code> multiplies each payment by the number of refunds. Rule: never join two independent one-to-many children in the same query before aggregating them.\u003c/p>\n\u003c/aside>\u003ch2>CROSS JOIN: every combination\u003c/h2>\n\u003cp>\u003ccode>CROSS JOIN\u003c/code> has no condition. Every left row pairs with every right row. It&#39;s rarely what you want on real tables, but it&#39;s exactly right for building a \u003cstrong>grid\u003c/strong> that a LEFT JOIN then fills in, such as every student × every subject (#1280) or every day × every product:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"joins-ex11\">\u003c/div>\n\u003ch2>Other join details\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>JOIN … USING (col)\u003c/code> works when both sides name the key identically. The key then appears once in \u003ccode>SELECT *\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>NATURAL JOIN\u003c/code> joins on \u003cem>all\u003c/em> same-named columns automatically. Avoid it, because adding a column later can silently change the join.\u003c/li>\n\u003cli>A comma between tables (\u003ccode>FROM a, b WHERE a.x = b.x\u003c/code>) is an old-style inner join. It works, but explicit \u003ccode>JOIN … ON\u003c/code> keeps join logic apart from filters.\u003c/li>\n\u003cli>Join conditions can be any expression: ranges (\u003ccode>BETWEEN p.start_date AND p.end_date\u003c/code>), inequalities, or \u003ccode>DATEDIFF(a.d, b.d) = 1\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003caside class=\"callout interview\">\u003cdiv class=\"callout-label\">Interview angle \u003cspan>· Say the grain out loud\u003c/span>\u003c/div>\u003cp>Before joining, state what one row of the result will be. After joining, check that COUNT and SUM still count what you think. Interviewers love adding a second one-to-many table to see whether you notice the fan-out.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"joins-q1\">\u003c/div>","examples":[{"id":"joins-ex1","sql":"SELECT e.first_name, e.title, d.name AS department\nFROM employees e\nJOIN departments d ON d.dept_id = e.dept_id      -- JOIN means INNER JOIN\nORDER BY department, e.first_name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","title","department"],"rows":[["Aya","Junior Engineer","Engineering"],["Ben","Engineer","Engineering"],["Karim","Senior Engineer","Engineering"],["Lina","Staff Engineer","Engineering"],["Omar","VP Engineering","Engineering"],["Sara","Engineer","Engineering"],["Ahmed","Accountant","Finance"],["Julia","Financial Analyst","Finance"],["Priya","Finance Manager","Finance"],["Leo","Content Specialist","Marketing"],["Mariam","Marketing Lead","Marketing"],["Emma","Account Executive","Sales"],["Hana","Account Executive","Sales"],["Tom","Sales Associate","Sales"],["Youssef","Sales Director","Sales"]],"total":15,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex2","sql":"SELECT e.first_name, d.name AS department\nFROM employees e\nLEFT JOIN departments d ON d.dept_id = e.dept_id\nWHERE e.emp_id IN (1, 2, 15);","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","department"],"rows":[["Nadia",null],["Omar","Engineering"],["Ahmed","Finance"]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex3","sql":"SELECT d.name,\n       COUNT(e.emp_id) AS headcount,      -- counts matches only\n       COUNT(*)        AS rows_in_group   -- counts the NULL-padded row too\nFROM departments d\nLEFT JOIN employees e ON e.dept_id = d.dept_id\nGROUP BY d.dept_id, d.name\nORDER BY headcount DESC, d.name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","headcount","rows_in_group"],"rows":[["Engineering",6,6],["Sales",4,4],["Finance",3,3],["Marketing",2,2],["Legal",0,1]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex4","sql":"-- Intended: every customer with their 2025 order count. Actual: customers without 2025 orders vanish.\nSELECT c.name, COUNT(o.order_id) AS orders_2025\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nWHERE o.order_date >= '2025-01-01'\nGROUP BY c.customer_id, c.name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","orders_2025"],"rows":[["Alice Green",1],["Chloe Dubois",1],["Ines Costa",1],["Jamal Idris",1],["Mona Adel",1]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex5","sql":"SELECT c.name, COUNT(o.order_id) AS orders_2025\nFROM customers c\nLEFT JOIN orders o\n       ON o.customer_id = c.customer_id\n      AND o.order_date >= '2025-01-01'     -- restrict the matches, keep every customer\nGROUP BY c.customer_id, c.name\nORDER BY orders_2025 DESC, c.name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","orders_2025"],"rows":[["Alice Green",1],["Chloe Dubois",1],["Ines Costa",1],["Jamal Idris",1],["Mona Adel",1],["Bilal Khan",0],["Diego Alvarez",0],["Farah Aziz",0],["George Miller",0],["Hiro Tanaka",0],["Kate Novak",0],["Luis Romero",0]],"total":12,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex6","sql":"SELECT c.name\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.customer_id\nWHERE o.order_id IS NULL;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name"],"rows":[["Kate Novak"],["Luis Romero"]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex7","sql":"SELECT c.name\nFROM customers c\nJOIN orders o       ON o.customer_id = c.customer_id\nJOIN order_items oi ON oi.order_id = o.order_id\nJOIN products p     ON p.product_id = oi.product_id\nWHERE p.category = 'Phones'\nORDER BY c.name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name"],"rows":[["Alice Green"],["Bilal Khan"],["Bilal Khan"],["Farah Aziz"],["Hiro Tanaka"],["Jamal Idris"],["Jamal Idris"],["Jamal Idris"]],"total":8,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex8","sql":"SELECT c.name\nFROM customers c\nWHERE EXISTS (\n  SELECT 1\n  FROM orders o\n  JOIN order_items oi ON oi.order_id = o.order_id\n  JOIN products p     ON p.product_id = oi.product_id\n  WHERE o.customer_id = c.customer_id\n    AND p.category = 'Phones')\nORDER BY c.name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name"],"rows":[["Alice Green"],["Bilal Khan"],["Farah Aziz"],["Hiro Tanaka"],["Jamal Idris"]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex9","sql":"SELECT e.first_name AS employee, e.salary,\n       m.first_name AS manager,  m.salary AS manager_salary\nFROM employees e\nLEFT JOIN employees m ON m.emp_id = e.manager_id\nWHERE e.dept_id = 1\nORDER BY e.emp_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["employee","salary","manager","manager_salary"],"rows":[["Omar",180000,"Nadia",250000],["Lina",150000,"Omar",180000],["Karim",125000,"Omar",180000],["Sara",110000,"Lina",150000],["Ben",110000,"Lina",150000],["Aya",85000,"Karim",125000]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex10","sql":"SELECT c.name,\n       COUNT(*)                   AS orders_wrong,\n       COUNT(DISTINCT o.order_id) AS orders,\n       SUM(oi.quantity)           AS units\nFROM customers c\nJOIN orders o       ON o.customer_id = c.customer_id\nJOIN order_items oi ON oi.order_id = o.order_id\nGROUP BY c.customer_id, c.name\nORDER BY c.customer_id\nLIMIT 4;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","orders_wrong","orders","units"],"rows":[["Alice Green",6,4,7],["Bilal Khan",6,3,8],["Chloe Dubois",4,3,8],["Diego Alvarez",2,2,3]],"total":4,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"joins-ex11","sql":"SELECT d.name, q.quarter\nFROM departments d\nCROSS JOIN (SELECT 1 AS quarter UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4) q\nWHERE d.dept_id \u003c= 2\nORDER BY d.name, q.quarter;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","quarter"],"rows":[["Engineering",1],["Engineering",2],["Engineering",3],["Engineering",4],["Sales",1],["Sales",2],["Sales",3],["Sales",4]],"total":8,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"joins-q1","questions":[{"q":"\u003ccode>SELECT … FROM a LEFT JOIN b ON b.a_id = a.id WHERE b.status = &#39;paid&#39;\u003c/code>: what happens to rows of \u003ccode>a\u003c/code> with no match in \u003ccode>b\u003c/code>?","options":["They appear with NULLs, as usual for a LEFT JOIN","They are removed, because \u003ccode>NULL = &#39;paid&#39;\u003c/code> isn&#39;t TRUE","MySQL raises an error","They appear only if \u003ccode>status\u003c/code> is nullable"],"answer":1,"explain":"\u003cp>The WHERE runs after the join, and for NULL-padded rows the condition is UNKNOWN. Move \u003ccode>b.status = &#39;paid&#39;\u003c/code> into the ON clause to keep every \u003ccode>a\u003c/code> row.\u003c/p>\n"},{"q":"After \u003ccode>departments d LEFT JOIN employees e\u003c/code>, which expression gives 0 for a department with no employees?","options":["\u003ccode>COUNT(*)\u003c/code>","\u003ccode>COUNT(e.emp_id)\u003c/code>","\u003ccode>COUNT(d.dept_id)\u003c/code>","\u003ccode>SUM(1)\u003c/code>"],"answer":1,"explain":"\u003cp>The unmatched department still produces one row with NULL employee columns. \u003ccode>COUNT(*)\u003c/code> and \u003ccode>COUNT(d.dept_id)\u003c/code> count that row, while \u003ccode>COUNT(e.emp_id)\u003c/code> skips the NULL.\u003c/p>\n"},{"q":"Which query finds customers with no orders \u003cstrong>safely\u003c/strong> even if \u003ccode>orders.customer_id\u003c/code> contains NULLs?","options":["\u003ccode>WHERE customer_id NOT IN (SELECT customer_id FROM orders)\u003c/code>","\u003ccode>WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)\u003c/code>","\u003ccode>JOIN orders o ON o.customer_id &lt;&gt; c.customer_id\u003c/code>","\u003ccode>WHERE customer_id &lt;&gt; ALL (SELECT customer_id FROM orders)\u003c/code>"],"answer":1,"explain":"\u003cp>NOT IN and \u003ccode>&lt;&gt; ALL\u003c/code> both return nothing when the subquery contains a NULL. NOT EXISTS only asks whether a matching row exists.\u003c/p>\n"},{"q":"You join customers → orders → order_items and \u003ccode>COUNT(*)\u003c/code> per customer. What are you counting?","options":["customers","orders","order lines (items)","products"],"answer":2,"explain":"\u003cp>The grain after the last join is one row per order item. Use \u003ccode>COUNT(DISTINCT o.order_id)\u003c/code> for orders.\u003c/p>\n"}]}],"problems":[175,1378,1068,181,183,1581,577,197,1661,1280,570,1934,1731,1407,607,1158,1075,1251,1587,1084,1327]},{"id":"subqueries","num":6,"title":"Subqueries and EXISTS","summary":"Queries inside queries — comparing against an aggregate, asking \"is there a matching row?\", and building an intermediate table you then query.","clauses":["WHERE","FROM","SELECT"],"kicker":"scalar · correlated · IN · EXISTS · ANY/ALL · derived tables","minutes":14,"html":"\u003ch2>Where a subquery can go\u003c/h2>\n\u003cp>A subquery is a SELECT in parentheses. What it may return depends on where it sits:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Position\u003c/th>\u003cth>Must return\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Scalar (in SELECT, WHERE, HAVING)\u003c/td>\u003ctd>one value (1 column, at most 1 row)\u003c/td>\u003ctd>\u003ccode>salary &gt; (SELECT AVG(salary) FROM employees)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>After \u003ccode>IN\u003c/code> / \u003ccode>NOT IN\u003c/code>\u003c/td>\u003ctd>one column, any rows\u003c/td>\u003ctd>\u003ccode>dept_id IN (SELECT dept_id FROM departments WHERE location = &#39;Cairo&#39;)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>After \u003ccode>EXISTS\u003c/code>\u003c/td>\u003ctd>anything (only &quot;any rows?&quot; matters)\u003c/td>\u003ctd>\u003ccode>EXISTS (SELECT 1 FROM orders o WHERE …)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>In FROM (a \u003cem>derived table\u003c/em>)\u003c/td>\u003ctd>a table, \u003cstrong>with an alias\u003c/strong>\u003c/td>\u003ctd>\u003ccode>FROM (SELECT …) AS t\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Scalar subqueries\u003c/h2>\n\u003cp>A scalar subquery stands in for a single value, typically an aggregate you want to compare against:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"subqueries-ex1\">\u003c/div>\n\u003cp>Two facts make scalar subqueries powerful:\u003c/p>\n\u003cul>\n\u003cli>If the subquery returns \u003cstrong>no rows\u003c/strong>, its value is \u003cstrong>NULL\u003c/strong> rather than an error. That&#39;s how &quot;return NULL if there is no second-highest salary&quot; is done (#176).\u003c/li>\n\u003cli>If it returns \u003cstrong>more than one row\u003c/strong>, MySQL raises \u003cem>Subquery returns more than 1 row\u003c/em> (error 1242).\u003c/li>\n\u003c/ul>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha\u003c/div>\u003cp>This page&#39;s engine (SQLite) quietly uses the first row when a scalar subquery returns several, instead of raising MySQL&#39;s error 1242. If a Check fails with a surprising value, make sure your scalar subquery really returns at most one row: add the right condition, an aggregate, or \u003ccode>LIMIT 1\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>Correlated subqueries\u003c/h2>\n\u003cp>A \u003cem>correlated\u003c/em> subquery refers to the outer row, so it&#39;s logically re-evaluated for each row. &quot;Employees paid above \u003cstrong>their own department&#39;s\u003c/strong> average&quot;:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"subqueries-ex2\">\u003c/div>\n\u003cp>The same shape in SELECT computes a per-row lookup:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"subqueries-ex3\">\u003c/div>\n\u003caside class=\"callout work\">\u003cdiv class=\"callout-label\">On the job\u003c/div>\u003cp>The optimizer often rewrites correlated subqueries into joins, but not always. On big tables, check the plan (Module 13). A join to a pre-aggregated derived table, or a window function, is frequently the faster formulation of the same question.\u003c/p>\n\u003c/aside>\u003ch2>IN with a subquery, including tuples\u003c/h2>\n\u003cp>\u003ccode>IN (subquery)\u003c/code> tests membership. MySQL also supports \u003cstrong>row constructors\u003c/strong>, so you can match on several columns at once. That gives a compact way to write &quot;rows that equal their group&#39;s maximum&quot;:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"subqueries-ex4\">\u003c/div>\n\u003cp>This returns the top earner per department, including ties if there are any. The CEO&#39;s group has \u003ccode>dept_id = NULL\u003c/code>, and since \u003ccode>NULL = NULL\u003c/code> is not TRUE, she never matches. Remember that when a NULL group matters.\u003c/p>\n\u003ch2>EXISTS and NOT EXISTS\u003c/h2>\n\u003cp>\u003ccode>EXISTS (subquery)\u003c/code> is TRUE as soon as the subquery produces one row. The select list is irrelevant, so write \u003ccode>SELECT 1\u003c/code>. It&#39;s the cleanest way to express semi-joins (at least one match) and anti-joins (no match):\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"subqueries-ex5\">\u003c/div>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· Prefer NOT EXISTS over NOT IN\u003c/span>\u003c/div>\u003cp>\u003ccode>NOT IN (subquery)\u003c/code> returns nothing if the subquery yields a single NULL (Module 2). \u003ccode>NOT EXISTS\u003c/code> has no such trap, and it states the intent exactly: &quot;there is no row such that…&quot;.\u003c/p>\n\u003c/aside>\u003ch2>ANY and ALL\u003c/h2>\n\u003cp>\u003ccode>x &gt; ALL (subquery)\u003c/code> means greater than every value, and \u003ccode>x &gt; ANY (subquery)\u003c/code> means greater than at least one. \u003ccode>= ANY\u003c/code> is the same as \u003ccode>IN\u003c/code>, and \u003ccode>&lt;&gt; ALL\u003c/code> is the same as \u003ccode>NOT IN\u003c/code>, with the same NULL trap.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"subqueries-ex6\">\u003c/div>\n\u003ch2>Derived tables: query a query\u003c/h2>\n\u003cp>A subquery in FROM is a temporary table for the duration of the query. It&#39;s the standard way to \u003cstrong>aggregate first, then filter, join or aggregate again\u003c/strong>:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"subqueries-ex7\">\u003c/div>\n\u003cp>MySQL insists every derived table has an alias (error 1248: \u003cem>Every derived table must have its own alias\u003c/em>). Module 8&#39;s CTEs are the same idea with a name up front, and they read better once there are several steps.\u003c/p>\n\u003ch2>&quot;Return NULL when there&#39;s nothing&quot;\u003c/h2>\n\u003cp>LeetCode loves this requirement. A query that finds nothing returns an \u003cstrong>empty result\u003c/strong>, not a row containing NULL. Two ways to always get one row:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"subqueries-ex8\">\u003c/div>\n\u003col>\n\u003cli>Wrap the query in a \u003cstrong>scalar subquery\u003c/strong> in the SELECT list.\u003c/li>\n\u003cli>Use an \u003cstrong>aggregate without GROUP BY\u003c/strong> (\u003ccode>MAX\u003c/code>, \u003ccode>SUM\u003c/code>, …), which returns one row even over zero input rows.\u003c/li>\n\u003c/ol>\n\u003ch2>Which tool when?\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Filter by an aggregate of the whole table\u003c/strong>: scalar subquery.\u003c/li>\n\u003cli>\u003cstrong>Filter by an aggregate of &quot;my group&quot;\u003c/strong>: correlated subquery, a join to a derived table, or a window function (Module 9).\u003c/li>\n\u003cli>\u003cstrong>Rows with / without a related row\u003c/strong>: \u003ccode>EXISTS\u003c/code> / \u003ccode>NOT EXISTS\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Several steps of aggregation\u003c/strong>: a derived table or CTE.\u003c/li>\n\u003cli>\u003cstrong>Need columns from both sides\u003c/strong>: a join.\u003c/li>\n\u003c/ul>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases\u003c/div>\u003cp>Everything here is standard SQL and works in PostgreSQL and SQL Server. Two MySQL-specific limits: no \u003ccode>LIMIT\u003c/code> directly inside \u003ccode>IN (subquery)\u003c/code> (error 1235, so wrap it in a derived table), and a DELETE/UPDATE can&#39;t select from its own target table in a subquery (error 1093, see Module 11).\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"subqueries-q1\">\u003c/div>","examples":[{"id":"subqueries-ex1","sql":"SELECT first_name, salary,\n       (SELECT ROUND(AVG(salary)) FROM employees) AS company_avg\nFROM employees\nWHERE salary > (SELECT AVG(salary) FROM employees)\nORDER BY salary DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","salary","company_avg"],"rows":[["Nadia",250000,115938],["Omar",180000,115938],["Lina",150000,115938],["Youssef",140000,115938],["Karim",125000,115938],["Priya",120000,115938]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"subqueries-ex2","sql":"SELECT e.first_name, e.dept_id, e.salary\nFROM employees e\nWHERE e.salary > (SELECT AVG(x.salary)\n                  FROM employees x\n                  WHERE x.dept_id = e.dept_id)   -- ties the subquery to the outer row\nORDER BY e.dept_id, e.salary DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","dept_id","salary"],"rows":[["Omar",1,180000],["Lina",1,150000],["Youssef",2,140000],["Mariam",3,115000],["Priya",4,120000]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"subqueries-ex3","sql":"SELECT c.name,\n       (SELECT COUNT(*) FROM orders o WHERE o.customer_id = c.customer_id) AS orders\nFROM customers c\nORDER BY orders DESC, c.name\nLIMIT 5;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","orders"],"rows":[["Alice Green",4],["Bilal Khan",3],["Chloe Dubois",3],["Farah Aziz",3],["Jamal Idris",3]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"subqueries-ex4","sql":"SELECT first_name, dept_id, salary\nFROM employees\nWHERE (dept_id, salary) IN (SELECT dept_id, MAX(salary)\n                            FROM employees\n                            GROUP BY dept_id)\nORDER BY dept_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","dept_id","salary"],"rows":[["Omar",1,180000],["Youssef",2,140000],["Mariam",3,115000],["Priya",4,120000]],"total":4,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"subqueries-ex5","sql":"SELECT p.name, p.category\nFROM products p\nWHERE NOT EXISTS (SELECT 1 FROM order_items oi WHERE oi.product_id = p.product_id);","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","category"],"rows":[["Smart Watch","Wearables"]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"subqueries-ex6","sql":"SELECT name, price\nFROM products\nWHERE price > ALL (SELECT price FROM products WHERE category = 'Accessories')\nORDER BY price;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","price"],"rows":[["Phone X",999],["Laptop Air 13",1199],["Laptop Pro 14",1899]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"subqueries-ex7","sql":"SELECT d.name, t.headcount, t.avg_salary\nFROM (SELECT dept_id, COUNT(*) AS headcount, ROUND(AVG(salary)) AS avg_salary\n      FROM employees\n      GROUP BY dept_id) AS t\nJOIN departments d ON d.dept_id = t.dept_id\nORDER BY t.avg_salary DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","headcount","avg_salary"],"rows":[["Engineering",6,126667],["Sales",4,95500],["Marketing",2,93500],["Finance",3,92000]],"total":4,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"subqueries-ex8","sql":"SELECT\n  (SELECT DISTINCT salary FROM employees\n   ORDER BY salary DESC LIMIT 1 OFFSET 20)          AS twenty_first_highest,  -- scalar subquery: NULL\n  (SELECT MAX(price) FROM products WHERE category = 'Toys') AS max_toy_price;   -- aggregate over nothing: NULL","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["twenty_first_highest","max_toy_price"],"rows":[[null,null]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"subqueries-q1","questions":[{"q":"What does \u003ccode>SELECT (SELECT name FROM products WHERE price &gt; 5000) AS x\u003c/code> return when no product costs over 5000?","options":["An empty result","One row with x = NULL","An error","One row with x = &#39;&#39;"],"answer":1,"explain":"\u003cp>A scalar subquery with no rows evaluates to NULL, and the outer SELECT (which has no FROM) always produces one row.\u003c/p>\n"},{"q":"\u003ccode>WHERE (dept_id, salary) IN (SELECT dept_id, MAX(salary) FROM employees GROUP BY dept_id)\u003c/code> returns…","options":["exactly one employee per department","every employee whose salary equals their department&#39;s maximum, including ties","an error: IN takes one column","all employees"],"answer":1,"explain":"\u003cp>Row constructors compare both columns. Two people sharing the top salary both match.\u003c/p>\n"},{"q":"Which is TRUE about \u003ccode>EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)\u003c/code>?","options":["It fails if \u003ccode>orders\u003c/code> contains NULL customer ids","\u003ccode>SELECT 1\u003c/code> means it only checks the first order","It&#39;s TRUE when at least one matching order exists; the select list is ignored","It returns the number of orders"],"answer":2,"explain":"\u003cp>EXISTS only cares whether any row comes back. \u003ccode>SELECT 1\u003c/code> is a convention: \u003ccode>SELECT *\u003c/code> or \u003ccode>SELECT NULL\u003c/code> behave the same.\u003c/p>\n"},{"q":"MySQL error 1248 &quot;Every derived table must have its own alias&quot; means…","options":["a subquery in FROM needs a name: \u003ccode>FROM (SELECT …) AS t\u003c/code>","every column needs an alias","you can&#39;t join a subquery","you used the same alias twice"],"answer":0,"explain":"\u003cp>Derived tables must be named. PostgreSQL requires it too (optional since version 16).\u003c/p>\n"}]}],"problems":[1978,176,184,1070,550,1174,1164,585,608,1633,619,626]},{"id":"sets","num":7,"title":"Set operations","summary":"Stacking results vertically — combining lists, unpivoting columns into rows, emulating FULL OUTER JOIN, and making zero-count rows appear.","clauses":["SELECT"],"kicker":"UNION · UNION ALL · INTERSECT · EXCEPT","minutes":12,"html":"\u003ch2>Stacking results\u003c/h2>\n\u003cp>Joins put tables side by side. Set operations stack \u003cstrong>results\u003c/strong> on top of each other. The rules:\u003c/p>\n\u003cul>\n\u003cli>Every SELECT must return the \u003cstrong>same number of columns\u003c/strong>, and they&#39;re matched by \u003cstrong>position\u003c/strong>, not by name.\u003c/li>\n\u003cli>The result&#39;s column names come from the \u003cstrong>first\u003c/strong> SELECT.\u003c/li>\n\u003cli>\u003ccode>UNION\u003c/code> removes duplicate rows from the combined result. \u003ccode>UNION ALL\u003c/code> keeps everything.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"sets-ex1\">\u003c/div>\n\u003cp>\u003ccode>ORDER BY\u003c/code> and \u003ccode>LIMIT\u003c/code> at the end apply to the \u003cstrong>whole\u003c/strong> combined result, and they can only use the output column names (or positions).\u003c/p>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· Default to UNION ALL\u003c/span>\u003c/div>\u003cp>\u003ccode>UNION\u003c/code> has to sort or hash the whole result to find duplicates. When the branches can&#39;t overlap, or you \u003cem>want\u003c/em> the duplicates, \u003ccode>UNION ALL\u003c/code> is correct and cheaper. Reach for \u003ccode>UNION\u003c/code> only when removing duplicates is the point.\u003c/p>\n\u003c/aside>\u003cdiv class=\"example\" data-ex=\"sets-ex2\">\u003c/div>\n\u003cp>With \u003ccode>UNION ALL\u003c/code> that would be three rows of &quot;Egypt&quot;.\u003c/p>\n\u003ch2>Sorting or limiting one branch\u003c/h2>\n\u003cp>To apply \u003ccode>ORDER BY … LIMIT\u003c/code> to a single branch, wrap that branch in parentheses. MySQL supports this, and LeetCode&#39;s #1341 is built around it:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"sets-ex3\">\u003c/div>\n\u003ch2>INTERSECT and EXCEPT\u003c/h2>\n\u003cp>\u003ccode>INTERSECT\u003c/code> keeps rows present in both results, and \u003ccode>EXCEPT\u003c/code> keeps rows in the first that aren&#39;t in the second. Both remove duplicates.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"sets-ex4\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"sets-ex5\">\u003c/div>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases \u003cspan>· Version check\u003c/span>\u003c/div>\u003cp>MySQL only added \u003ccode>INTERSECT\u003c/code> and \u003ccode>EXCEPT\u003c/code> in \u003cstrong>8.0.31\u003c/strong> (late 2022). On older servers, and whenever you&#39;re unsure which version a judge runs, write them as \u003ccode>IN\u003c/code> / \u003ccode>EXISTS\u003c/code> (intersection) and \u003ccode>NOT EXISTS\u003c/code> (difference). PostgreSQL and SQL Server have had both for decades. Oracle calls \u003ccode>EXCEPT\u003c/code> \u003ccode>MINUS\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>Emulating FULL OUTER JOIN\u003c/h2>\n\u003cp>MySQL has no \u003ccode>FULL OUTER JOIN\u003c/code>. Build one from a LEFT JOIN plus the rows only the right side has:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"sets-ex6\">\u003c/div>\n\u003cp>The first branch covers every department, including Legal, which has no employees. The second adds employees with no department, which here is only the CEO. Using \u003ccode>UNION ALL\u003c/code> plus an anti-join avoids the accidental de-duplication that \u003ccode>LEFT JOIN … UNION … RIGHT JOIN\u003c/code> performs.\u003c/p>\n\u003ch2>Turning columns into rows (unpivot)\u003c/h2>\n\u003cp>When a table has one column per category (\u003ccode>q1\u003c/code>, \u003ccode>q2\u003c/code>, \u003ccode>q3\u003c/code> …), a \u003ccode>UNION ALL\u003c/code> of one SELECT per column turns it into one row per (item, category), which is the shape SQL likes to aggregate:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"sets-ex7\">\u003c/div>\n\u003cp>(#1795 is exactly this. Module 10 covers the reverse, pivoting rows into columns.)\u003c/p>\n\u003ch2>Rows that must exist even at zero\u003c/h2>\n\u003cp>GROUP BY only produces groups that exist in the data. If a report must always list every category, even ones with no rows, build the category list yourself with \u003ccode>UNION ALL\u003c/code>, then LEFT JOIN the counts onto it:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"sets-ex8\">\u003c/div>\n\u003cp>&quot;returned&quot; isn&#39;t a status any order has, yet it shows up with 0. That&#39;s the pattern behind #1907.\u003c/p>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· UNION when you meant UNION ALL\u003c/span>\u003c/div>\u003cp>Stacking two answers into one column, like &quot;top user&quot; and &quot;top movie&quot; (#1341), with \u003ccode>UNION\u003c/code> silently collapses them into one row when both happen to be the same string. If each branch contributes its own row, use \u003ccode>UNION ALL\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"sets-q1\">\u003c/div>","examples":[{"id":"sets-ex1","sql":"SELECT 'employee' AS kind, email FROM employees WHERE email LIKE '%acme.test'\nUNION ALL\nSELECT 'customer', email FROM customers WHERE email IS NOT NULL\nORDER BY kind, email\nLIMIT 6;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["kind","email"],"rows":[["customer","alice@mail.test"],["customer","bilal@mail.test"],["customer","chloe@mail.test"],["customer","farah@mail.test"],["customer","george@mail.test"],["customer","hiro@mail.test"]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"sets-ex2","sql":"SELECT country FROM customers WHERE city = 'Cairo'\nUNION\nSELECT country FROM customers WHERE city = 'Alexandria';","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["country"],"rows":[["Egypt"]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"sets-ex3","sql":"(SELECT name, price FROM products ORDER BY price DESC LIMIT 1)\nUNION ALL\n(SELECT name, price FROM products ORDER BY price ASC LIMIT 1);","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","price"],"rows":[["Laptop Pro 14",1899],["Phone Case",25]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"sets-ex4","sql":"-- cities where we have both an office and customers\nSELECT location FROM departments WHERE location IS NOT NULL\nINTERSECT\nSELECT city FROM customers;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["location"],"rows":[["Cairo"],["London"]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"sets-ex5","sql":"-- office cities with no customers\nSELECT location FROM departments WHERE location IS NOT NULL\nEXCEPT\nSELECT city FROM customers;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["location"],"rows":[["Berlin"]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"sets-ex6","sql":"SELECT d.name AS department, e.first_name\nFROM departments d\nLEFT JOIN employees e ON e.dept_id = d.dept_id\nUNION ALL\nSELECT NULL, e.first_name\nFROM employees e\nWHERE NOT EXISTS (SELECT 1 FROM departments d WHERE d.dept_id = e.dept_id)\nORDER BY department, first_name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["department","first_name"],"rows":[[null,"Nadia"],["Engineering","Aya"],["Engineering","Ben"],["Engineering","Karim"],["Engineering","Lina"],["Engineering","Omar"],["Engineering","Sara"],["Finance","Ahmed"],["Finance","Julia"],["Finance","Priya"],["Legal",null],["Marketing","Leo"],["Marketing","Mariam"],["Sales","Emma"],["Sales","Hana"],["Sales","Tom"],["Sales","Youssef"]],"total":17,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"sets-ex7","sql":"SELECT 'with email' AS metric, COUNT(email) AS n FROM customers\nUNION ALL\nSELECT 'with city', COUNT(city) FROM customers\nUNION ALL\nSELECT 'referred', COUNT(referred_by) FROM customers;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["metric","n"],"rows":[["with email",11],["with city",11],["referred",7]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"sets-ex8","sql":"SELECT s.status, COUNT(o.order_id) AS orders\nFROM (SELECT 'pending' AS status UNION ALL SELECT 'shipped'\n      UNION ALL SELECT 'delivered' UNION ALL SELECT 'cancelled'\n      UNION ALL SELECT 'returned') s\nLEFT JOIN orders o ON o.status = s.status\nGROUP BY s.status\nORDER BY orders DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["status","orders"],"rows":[["delivered",18],["shipped",2],["pending",2],["cancelled",2],["returned",0]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"sets-q1","questions":[{"q":"\u003ccode>SELECT a FROM t1 UNION SELECT b FROM t2\u003c/code>: what is the result&#39;s column called?","options":["\u003ccode>a\u003c/code>","\u003ccode>b\u003c/code>","\u003ccode>a_b\u003c/code>","It&#39;s an error unless both are named the same"],"answer":0,"explain":"\u003cp>Column names come from the first SELECT. Columns are matched by position.\u003c/p>\n"},{"q":"Where does \u003ccode>ORDER BY price\u003c/code> go to sort the combined result of two SELECTs?","options":["After each SELECT","Once, at the very end","Before the first SELECT","Set operations can&#39;t be sorted"],"answer":1,"explain":"\u003cp>A trailing ORDER BY applies to the whole union. To sort a single branch (usually together with LIMIT), wrap that branch in parentheses.\u003c/p>\n"},{"q":"Why prefer \u003ccode>UNION ALL\u003c/code> over \u003ccode>UNION\u003c/code> when the branches can&#39;t overlap?","options":["UNION ALL keeps NULLs; UNION drops them","UNION must de-duplicate the whole result, which costs a sort or hash","UNION changes column order","There is no difference"],"answer":1,"explain":"\u003cp>Same rows, less work. And when duplicates are meaningful, UNION ALL is the only correct choice.\u003c/p>\n"},{"q":"MySQL has no FULL OUTER JOIN. Which construction replaces \u003ccode>a FULL JOIN b ON …\u003c/code>?","options":["\u003ccode>a CROSS JOIN b\u003c/code>","\u003ccode>a LEFT JOIN b … INTERSECT a RIGHT JOIN b …\u003c/code>","\u003ccode>a LEFT JOIN b …\u003c/code> combined with the \u003ccode>b\u003c/code> rows that have no match in \u003ccode>a\u003c/code>","\u003ccode>a JOIN b … UNION ALL a JOIN b …\u003c/code>"],"answer":2,"explain":"\u003cp>Take all of \u003ccode>a\u003c/code> with its matches, then append the \u003ccode>b\u003c/code> rows nothing matched, using UNION ALL plus an anti-join (or \u003ccode>LEFT … UNION … RIGHT\u003c/code>).\u003c/p>\n"}]}],"problems":[1965,1795,602,1341,1789,1907]},{"id":"ctes","num":8,"title":"CTEs and recursion","summary":"Naming intermediate results so complex queries read top to bottom, and recursive CTEs for date series and org charts.","clauses":["FROM"],"kicker":"WITH · WITH RECURSIVE · series · hierarchies","minutes":10,"html":"\u003ch2>WITH: name your steps\u003c/h2>\n\u003cp>A common table expression (CTE) is a named subquery declared up front. It lets a complicated query read as a sequence of steps instead of nested parentheses:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"ctes-ex1\">\u003c/div>\n\u003cul>\n\u003cli>Each CTE can refer to the ones defined \u003cstrong>before\u003c/strong> it.\u003c/li>\n\u003cli>A CTE can be referenced several times, which a derived table can&#39;t do without copy-pasting.\u003c/li>\n\u003cli>It exists only for this one statement. For something reusable across queries, use a view.\u003c/li>\n\u003c/ul>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases\u003c/div>\u003cp>CTEs arrived in \u003cstrong>MySQL 8.0\u003c/strong>. On 5.7 you&#39;d need derived tables. PostgreSQL may materialize or inline a CTE (you can force it with \u003ccode>MATERIALIZED\u003c/code> / \u003ccode>NOT MATERIALIZED\u003c/code>). MySQL decides on its own and may merge a CTE into the outer query just like a derived table.\u003c/p>\n\u003c/aside>\u003caside class=\"callout tip\">\u003cdiv class=\"callout-label\">Tip \u003cspan>· Grain comments\u003c/span>\u003c/div>\u003cp>Writing a short comment after each CTE, like \u003ccode>-- one row per order\u003c/code>, costs nothing and is the fastest way to catch grain mistakes such as a fan-out (Module 5).\u003c/p>\n\u003c/aside>\u003ch2>Recursive CTEs\u003c/h2>\n\u003cp>A recursive CTE refers to \u003cstrong>itself\u003c/strong>. It has two parts joined by \u003ccode>UNION ALL\u003c/code>:\u003c/p>\n\u003col>\n\u003cli>The \u003cstrong>anchor\u003c/strong> member runs once and produces the starting rows.\u003c/li>\n\u003cli>The \u003cstrong>recursive\u003c/strong> member runs repeatedly, each time on the rows produced by the previous round, until a round produces nothing.\u003c/li>\n\u003c/ol>\n\u003cp>The simplest case is a number series:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"ctes-ex2\">\u003c/div>\n\u003ch3>Date series: filling the gaps\u003c/h3>\n\u003cp>Reports often need a row for \u003cstrong>every\u003c/strong> day, including days with no data. Generate the calendar recursively, then LEFT JOIN the facts:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"ctes-ex3\">\u003c/div>\n\u003cp>Nobody logged in on March 10–12, yet those days appear with 0. A plain \u003ccode>GROUP BY login_date\u003c/code> can never produce them, because it only groups rows that exist.\u003c/p>\n\u003ch3>Walking a hierarchy\u003c/h3>\n\u003cp>Org charts, category trees and bills of materials are stored as a parent pointer (\u003ccode>manager_id\u003c/code>). A recursive CTE walks down the tree one level per round:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"ctes-ex4\">\u003c/div>\n\u003cp>Start from any node instead of the root to get a whole subtree, for example everyone under Omar and their combined payroll:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"ctes-ex5\">\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· The anchor decides the column types (MySQL)\u003c/span>\u003c/div>\u003cp>In MySQL, a recursive CTE&#39;s column types come from the anchor member. If the anchor&#39;s \u003ccode>path\u003c/code> is a short string, longer values built in later rounds fail with \u003cem>Data too long\u003c/em> (or get truncated). That&#39;s why the anchor above uses \u003ccode>CAST(first_name AS CHAR(200))\u003c/code>. The same goes for numbers: an anchor of \u003ccode>1\u003c/code> is an INT.\u003c/p>\n\u003c/aside>\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Recursion depth\u003c/span>\u003c/div>\u003cp>MySQL stops a recursive CTE after \u003cstrong>1000\u003c/strong> rounds by default (\u003ccode>cte_max_recursion_depth\u003c/code>), which bites when generating long date ranges. Raise it per session, \u003ccode>SET SESSION cte_max_recursion_depth = 5000;\u003c/code>, and always include a stop condition. Cyclic data (A manages B manages A) recurses forever unless you track the depth or path.\u003c/p>\n\u003c/aside>\u003ch2>Pairs: every ancestor with every descendant\u003c/h2>\n\u003cp>For &quot;total team size&quot; or &quot;total budget under each manager&quot;, generate every (manager, member) pair recursively, then aggregate once. #3482 is built this way:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"ctes-ex6\">\u003c/div>\n\u003caside class=\"callout interview\">\u003cdiv class=\"callout-label\">Interview angle \u003cspan>· When interviewers ask for recursion\u003c/span>\u003c/div>\u003cp>&quot;Find all reports (direct and indirect)&quot;, &quot;generate missing dates&quot;, &quot;compute each node&#39;s level&quot;: these are the recursive-CTE signals. State the anchor, the recursive step and the stop condition out loud before writing any SQL.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"ctes-q1\">\u003c/div>","examples":[{"id":"ctes-ex1","sql":"WITH order_totals AS (          -- step 1: one row per order\n  SELECT o.order_id, o.customer_id, SUM(oi.quantity * oi.unit_price) AS total\n  FROM orders o\n  JOIN order_items oi ON oi.order_id = o.order_id\n  WHERE o.status \u003c> 'cancelled'\n  GROUP BY o.order_id, o.customer_id\n),\ncustomer_totals AS (            -- step 2: one row per customer\n  SELECT customer_id, COUNT(*) AS orders, SUM(total) AS spent\n  FROM order_totals\n  GROUP BY customer_id\n)\nSELECT c.name, ct.orders, ct.spent\nFROM customer_totals ct\nJOIN customers c ON c.customer_id = ct.customer_id\nWHERE ct.spent > (SELECT AVG(spent) FROM customer_totals)   -- a CTE can be used twice\nORDER BY ct.spent DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","orders","spent"],"rows":[["Jamal Idris",3,4784],["Alice Green",4,4403],["George Miller",1,2477]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"ctes-ex2","sql":"WITH RECURSIVE n AS (\n  SELECT 1 AS x                 -- anchor\n  UNION ALL\n  SELECT x + 1 FROM n           -- recursive member\n  WHERE x \u003c 10                  -- stop condition\n)\nSELECT x, x * x AS square FROM n;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["x","square"],"rows":[[1,1],[2,4],[3,9],[4,16],[5,25],[6,36],[7,49],[8,64],[9,81],[10,100]],"total":10,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"ctes-ex3","sql":"WITH RECURSIVE days AS (\n  SELECT DATE('2025-03-01') AS d\n  UNION ALL\n  SELECT d + INTERVAL 1 DAY FROM days WHERE d \u003c '2025-03-12'\n)\nSELECT days.d, COUNT(DISTINCT l.customer_id) AS active_customers\nFROM days\nLEFT JOIN logins l ON l.login_date = days.d\nGROUP BY days.d\nORDER BY days.d;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["d","active_customers"],"rows":[["2025-03-01",2],["2025-03-02",2],["2025-03-03",2],["2025-03-04",2],["2025-03-05",3],["2025-03-06",3],["2025-03-07",1],["2025-03-08",1],["2025-03-09",2],["2025-03-10",0],["2025-03-11",0],["2025-03-12",0]],"total":12,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"ctes-ex4","sql":"WITH RECURSIVE chain AS (\n  SELECT emp_id, first_name, 1 AS depth,\n         CAST(first_name AS CHAR(200)) AS path          -- widen the column in the anchor\n  FROM employees\n  WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.emp_id, e.first_name, c.depth + 1,\n         CONCAT(c.path, ' > ', e.first_name)\n  FROM employees e\n  JOIN chain c ON e.manager_id = c.emp_id\n)\nSELECT depth, first_name, path\nFROM chain\nORDER BY path;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["depth","first_name","path"],"rows":[[1,"Nadia","Nadia"],[2,"Mariam","Nadia > Mariam"],[3,"Leo","Nadia > Mariam > Leo"],[2,"Omar","Nadia > Omar"],[3,"Karim","Nadia > Omar > Karim"],[4,"Aya","Nadia > Omar > Karim > Aya"],[3,"Lina","Nadia > Omar > Lina"],[4,"Ben","Nadia > Omar > Lina > Ben"],[4,"Sara","Nadia > Omar > Lina > Sara"],[2,"Priya","Nadia > Priya"],[3,"Ahmed","Nadia > Priya > Ahmed"],[3,"Julia","Nadia > Priya > Julia"],[2,"Youssef","Nadia > Youssef"],[3,"Emma","Nadia > Youssef > Emma"],[3,"Hana","Nadia > Youssef > Hana"],[3,"Tom","Nadia > Youssef > Tom"]],"total":16,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"ctes-ex5","sql":"WITH RECURSIVE team AS (\n  SELECT emp_id, first_name, salary FROM employees WHERE emp_id = 2\n  UNION ALL\n  SELECT e.emp_id, e.first_name, e.salary\n  FROM employees e\n  JOIN team t ON e.manager_id = t.emp_id\n)\nSELECT COUNT(*) - 1 AS people_under_omar,\n       SUM(salary)  AS payroll_including_omar\nFROM team;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["people_under_omar","payroll_including_omar"],"rows":[[5,760000]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"ctes-ex6","sql":"WITH RECURSIVE pairs AS (\n  SELECT emp_id AS root_id, emp_id AS member_id, salary FROM employees   -- everyone is in their own subtree\n  UNION ALL\n  SELECT p.root_id, e.emp_id, e.salary\n  FROM pairs p\n  JOIN employees e ON e.manager_id = p.member_id\n)\nSELECT root_id, COUNT(*) - 1 AS team_size, SUM(salary) AS budget\nFROM pairs\nGROUP BY root_id\nHAVING team_size >
