.status.solved { color: var(--ok); font-weight: 600; }
.icon { width: 16px; height: 16px; flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); font-size: 14px; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

/* ---------- prose ---------- */
.lesson { max-width: 780px; }
.prose { max-width: 720px; }
.prose > * + * { margin-top: 0; }
.prose p, .prose ul, .prose ol { margin: 0 0 16px; }
.prose ul, .prose ol { padding-left: 22px; }
.prose li { margin: 6px 0; }
.prose li::marker { color: var(--ink-3); }
.prose h2 { font: 600 28px/1.18 var(--font-cond); letter-spacing: -.01em; margin: 54px 0 14px; text-wrap: balance; }
.prose h3 { font: 600 20px/1.3 var(--font-cond); margin: 32px 0 10px; }
.prose h2 .anchor, .prose h3 .anchor { opacity: 0; margin-left: 8px; font: 400 .7em var(--font-mono); color: var(--ink-3); text-decoration: none; }
.prose h2:hover .anchor, .prose h3:hover .anchor { opacity: 1; }
.prose strong { font-weight: 600; }
.prose :not(pre) > code { font-size: .88em; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 5px; padding: .08em .38em; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.prose blockquote { margin: 16px 0; padding: 2px 16px; border-left: 3px solid var(--rule); color: var(--ink-2); }
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 36px 0; }
.prose img { max-width: 100%; }
.tablewrap { overflow-x: auto; margin: 16px 0 20px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
table.md { border-collapse: collapse; width: 100%; font-size: 14.5px; }
table.md th { text-align: left; font-weight: 600; background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.md td { padding: 8px 12px; border-top: 1px solid var(--rule-2); vertical-align: top; }
table.md td code { white-space: nowrap; }

pre.code { margin: 16px 0 20px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); font: 14px/1.6 var(--font-mono); overflow-x: auto; color: var(--ink); tab-size: 2; }
pre.code code { font: inherit; white-space: pre; }
.t-k { color: var(--c-kw); font-weight: 500; }
.t-f { color: var(--c-fn); }
.t-s { color: var(--c-str); }
.t-n { color: var(--c-num); }
.t-c { color: var(--c-com); font-style: italic; }
.t-t { color: var(--c-type); }
.t-v { color: var(--c-type); }
.t-o { color: var(--c-op); }
details.setup { margin: 16px 0; border: 1px dashed var(--rule); border-radius: var(--radius); background: var(--surface-2); }
details.setup summary { cursor: pointer; padding: 10px 14px; font-size: 14px; color: var(--ink-2); }
details.setup pre.code { margin: 0; border: 0; border-top: 1px dashed var(--rule); border-radius: 0 0 var(--radius) var(--radius); background: transparent; max-height: 340px; overflow: auto; }

/* evaluation order strip (numbered because the order is the content) */
.order-strip { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 !important; margin: 18px 0 26px !important; counter-reset: step; }
.order-strip li { counter-increment: step; margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px 9px; }
.order-strip li::before { content: counter(step); display: block; font: 500 11px/1 var(--font-mono); color: var(--ink-3); margin-bottom: 6px; }
.order-strip b { display: block; font: 600 13.5px/1.2 var(--font-mono); color: var(--accent); }
.order-strip span { display: block; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); margin-top: 3px; }
@media (min-width: 1180px), (min-width: 760px) and (max-width: 1023px) { .order-strip { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.clause-trail { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 18px; font: 500 12px/1 var(--font-mono); }
.clause-trail span { padding: 5px 7px; border-radius: 5px; color: var(--ink-3); border: 1px solid var(--rule-2); background: var(--surface); }
.clause-trail span.on { color: var(--mark-ink); background: var(--mark); border-color: transparent; }
.clause-trail .arrow { border: 0; background: none; padding: 5px 0; color: var(--rule); }

/* callouts */
.callout { margin: 22px 0; padding: 14px 18px 4px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.callout > p, .callout > ul, .callout > ol { font-size: 15.5px; }
.callout-label { font: 600 11.5px/1.4 var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.callout-label span { text-transform: none; letter-spacing: 0; font-family: var(--font-sans); font-weight: 600; font-size: 14.5px; color: var(--ink); }
.callout.gotcha .callout-label { color: var(--mark-ink); }
.callout.gotcha .callout-label { display: inline-block; background: var(--mark); padding: 3px 7px; border-radius: 4px; }
.callout.gotcha .callout-label span { color: var(--mark-ink); }
.callout.key { background: var(--accent-soft); border-color: transparent; }
.callout.key .callout-label { color: var(--accent); }
.callout.dialect { background: var(--surface-2); border-style: dashed; }
.callout pre.code { background: var(--surface-2); }

/* ---------- runnable examples ---------- */
.example { margin: 20px 0 24px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.example .ex-code pre.code { margin: 0; border: 0; border-radius: 0; background: var(--surface-2); }
.example .ex-code .CodeMirror { background: var(--surface-2); }
.ex-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--rule-2); }
.ex-bar .spacer { flex: 1; }
.ex-bar .db { font: 500 11.5px/1 var(--font-mono); color: var(--ink-3); }
.ex-title { padding: 8px 14px; font: 500 12.5px var(--font-mono); color: var(--ink-3); border-bottom: 1px solid var(--rule-2); }
.out { border-top: 1px solid var(--rule-2); }
.out:empty { display: none; }
.out-msg { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; font-size: 14px; line-height: 1.5; border-bottom: 1px solid var(--rule-2); }
.out-msg:last-child { border-bottom: 0; }
.out-msg .icon { margin-top: 3px; }
.out-msg.error { background: var(--bad-soft); color: var(--ink); }
.out-msg.error .icon { color: var(--bad); }
.out-msg.warning { background: var(--warn-soft); }
.out-msg.warning .icon { color: var(--warn); }
.out-msg.note { color: var(--ink-2); font-size: 13px; }
.out-msg .hint { display: block; color: var(--ink-2); margin-top: 2px; }
.out-msg code { font-size: .9em; }
.out-ok { padding: 8px 14px; font: 13px var(--font-mono); color: var(--ink-2); border-bottom: 1px solid var(--rule-2); }

/* result grids */
.result { overflow: auto; max-height: 420px; }
.result.tall { max-height: 640px; }
table.grid { border-collapse: separate; border-spacing: 0; font: 13.5px/1.45 var(--font-mono); min-width: 100%; }
table.grid th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); text-align: left; font-weight: 600; color: var(--ink-2); padding: 7px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.grid td { padding: 6px 14px; border-bottom: 1px solid var(--rule-2); white-space: pre; vertical-align: top; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid .null { color: var(--ink-3); font-size: 11.5px; letter-spacing: .05em; }
table.grid tr.missing td { background: var(--ok-soft); }
table.grid tr.extra td { background: var(--bad-soft); }
table.grid tr.plan td { white-space: pre; }
.result-foot { display: flex; gap: 10px; justify-content: space-between; font: 12px/1.4 var(--font-mono); color: var(--ink-3); padding: 7px 14px; border-top: 1px solid var(--rule-2); background: var(--surface); }
.result-foot:first-child { border-top: 0; }

/* ---------- quizzes ---------- */
.quiz { margin: 22px 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.quiz-q { padding: 16px 18px 12px; }
.quiz-q + .quiz-q { border-top: 1px solid var(--rule-2); }
.quiz-q .qtext { font-weight: 600; margin-bottom: 10px; }
.quiz-q .qnum { font: 500 12px var(--font-mono); color: var(--ink-3); margin-right: 6px; }
.quiz-opts { display: grid; gap: 6px; }
.quiz-opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 15px; line-height: 1.45; }
.quiz-opt:hover:not([disabled]) { border-color: var(--ink-3); }
.quiz-opt .mark { flex: 0 0 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--rule); margin-top: 2px; display: grid; place-items: center; font-size: 11px; }
.quiz-opt[disabled] { cursor: default; }
.quiz-opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.quiz-opt.correct .mark { border-color: var(--ok); background: var(--ok); color: var(--surface); }
.quiz-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz-opt.wrong .mark { border-color: var(--bad); background: var(--bad); color: var(--surface); }
.quiz-explain { margin-top: 10px; font-size: 15px; color: var(--ink-2); }
.quiz-explain p { margin: 0 0 8px; }
.quiz-score { padding: 10px 18px; border-top: 1px solid var(--rule-2); font: 500 13px var(--font-mono); color: var(--ink-3); }
.quiz-prev { padding: 10px 18px 0; border-top: 1px solid var(--rule-2); font: 500 12.5px var(--font-mono); color: var(--ink-3); }
.quiz-prev + .quiz-score { border-top: 0; }

/* ---------- module page ---------- */
.lesson-head { padding-bottom: 26px; margin-bottom: 8px; border-bottom: 1px solid var(--rule); }
.practice { margin-top: 64px; }
.practice h2 { font: 600 28px/1.2 var(--font-cond); margin: 0 0 6px; }
.practice > p { color: var(--ink-2); margin: 0 0 16px; }
.plist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.plist li + li { border-top: 1px solid var(--rule-2); }
.plist a { display: grid; grid-template-columns: 20px 58px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; color: var(--ink); text-decoration: none; }
.plist a:hover { background: var(--surface-2); }
.plist .pnum { font: 500 13px var(--font-mono); color: var(--ink-3); }
.plist .ptitle { font-weight: 500; min-width: 0; }
.plist .ptags { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist .st { color: var(--rule); }
.plist .st.solved { color: var(--ok); }
.plist .st.tried { color: var(--warn); }
@media (max-width: 560px) {
  .plist a { grid-template-columns: 18px minmax(0, 1fr) auto; }
  .plist .pnum { display: none; }
}
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--rule); }
.pager a { display: flex; flex-direction: column; gap: 2px; text-decoration: none; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); max-width: 48%; }
.pager a:hover { border-color: var(--ink-3); }
.pager a small { font: 500 11.5px var(--font-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.pager a.next { margin-left: auto; text-align: right; }

/* ---------- problem page ---------- */
.problem { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "work" "bottom"; max-width: 1480px; }
.p-top { grid-area: top; min-width: 0; }
.p-work { grid-area: work; min-width: 0; }
.p-bottom { grid-area: bottom; min-width: 0; }
@media (min-width: 1280px) {
  .problem { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); grid-template-areas: "top work" "bottom work"; column-gap: 28px; }
  .p-work { position: sticky; top: calc(var(--topbar-h) + 18px); align-self: start; max-height: calc(100vh - var(--topbar-h) - 36px); display: flex; flex-direction: column; }
  .p-work .work-out { overflow: auto; }
}
.p-head .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
.p-head h1.title { font-size: clamp(28px, 3.6vw, 38px); }
.p-num { font: 500 14px var(--font-mono); color: var(--ink-3); }
.p-section { margin-top: 26px; }
.p-section > h2 { font: 600 13px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 0 0 12px; }
.p-task { font-size: 16.5px; }
.p-task p { margin: 0 0 12px; }
.p-task code, .p-bottom :not(pre) > code, .schema-cols code { font-size: .88em; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 5px; padding: .06em .36em; }
.tcard { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); margin-bottom: 14px; overflow: hidden; }
.tcard-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--rule-2); }
.tcard-head .tname { font: 600 14px var(--font-mono); }
.tcard-head .tcount { font: 12px var(--font-mono); color: var(--ink-3); }
.schema-cols { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 9px 14px; border-bottom: 1px solid var(--rule-2); font: 12.5px/1.6 var(--font-mono); color: var(--ink-2); }
.schema-cols .col b { color: var(--ink); font-weight: 500; }
.schema-cols .col .pk { color: var(--accent); font-size: 10.5px; margin-left: 3px; font-weight: 600; }
.schema-cols .col i { font-style: normal; color: var(--ink-3); }
.work-card { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; min-height: 0; box-shadow: var(--shadow); }
.work-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 9px 10px; border-top: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); background: var(--surface); }
.work-bar .spacer { flex: 1; }
.work-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; font: 500 12.5px var(--font-mono); color: var(--ink-3); background: var(--surface); }
.editor-host .CodeMirror { height: auto; min-height: 220px; }
.editor-host textarea.fallback { display: block; width: 100%; min-height: 220px; border: 0; padding: 14px; font: 14px/1.6 var(--font-mono); background: var(--surface-2); color: var(--ink); resize: vertical; }
.work-out { min-height: 60px; }
.work-out .placeholder { padding: 18px 16px; color: var(--ink-3); font-size: 14px; }
.verdict { padding: 14px 16px; border-bottom: 1px solid var(--rule-2); }
.verdict h3 { margin: 0; font: 600 20px/1.2 var(--font-cond); display: flex; align-items: center; gap: 8px; }
.verdict.ok h3 { color: var(--ok); }
.verdict.bad h3 { color: var(--bad); }
.verdict p { margin: 6px 0 0; color: var(--ink-2); font-size: 14.5px; }
.verdict .tests { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.verdict .tests span { font: 500 11.5px/1 var(--font-mono); padding: 5px 7px; border-radius: 5px; border: 1px solid var(--rule); color: var(--ink-3); }
.verdict .tests span.pass { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.verdict .tests span.fail { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.compare { display: grid; grid-template-columns: minmax(0, 1fr); }
.compare > div + div { border-top: 1px solid var(--rule-2); }
.compare h4 { margin: 0; padding: 8px 14px; font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--surface); }
.legend { display: flex; gap: 14px; padding: 8px 14px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hints .hint { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: 12px 16px 2px; margin-bottom: 8px; }
.hints .hint .hl { font: 500 11.5px var(--font-mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.reveal { border: 1px dashed var(--rule); border-radius: var(--radius); padding: 16px; background: var(--surface-2); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.reveal p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.sol { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); margin-bottom: 14px; overflow: hidden; }
.sol-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--rule-2); }
.sol-head b { font-size: 15px; }
.sol pre.code { margin: 0; border: 0; border-radius: 0; background: var(--surface-2); }
.sol .sol-body { padding: 12px 16px 2px; font-size: 15px; }
.sol .sol-body p { margin: 0 0 12px; }
.sol.trap .sol-head b { color: var(--bad); }
.p-notes { font-size: 15px; }
.p-nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 30px; }
@media (max-width: 560px) { .p-nav .btn.ghost { order: 3; flex-basis: 100%; justify-content: center; white-space: normal; text-align: center; } }

/* ---------- home ---------- */
.home { max-width: 1060px; }
.hero { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; padding-bottom: 30px; border-bottom: 1px solid var(--rule); }
@media (min-width: 1100px) { .hero { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.hero h1 { font: 600 clamp(40px, 6vw, 64px)/1.02 var(--font-cond); letter-spacing: -.02em; margin: 10px 0 0; text-wrap: balance; }
.hero h1 .kw { font-family: var(--font-mono); font-weight: 600; color: var(--accent); letter-spacing: -.04em; font-size: .88em; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.stats { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.stats .q { padding: 10px 14px; font: 13px/1.5 var(--font-mono); color: var(--ink-2); border-bottom: 1px solid var(--rule-2); background: var(--surface-2); white-space: pre-wrap; }
.stats table.grid td { white-space: nowrap; }
.stats .bar { display: inline-block; vertical-align: middle; width: 90px; height: 6px; border-radius: 3px; background: var(--rule-2); overflow: hidden; }
.stats .bar i { display: block; height: 100%; background: var(--accent); }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; margin: 44px 0 14px; }
.section-head h2 { font: 600 28px/1.2 var(--font-cond); margin: 0; }
.section-head p { margin: 0; color: var(--ink-2); }
.course-map { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.course-map .q { padding: 10px 14px; font: 13px/1.5 var(--font-mono); color: var(--ink-2); border-bottom: 1px solid var(--rule); background: var(--surface-2); overflow-x: auto; white-space: pre; }
.course-map table.grid { font-family: var(--font-sans); font-size: 14.5px; }
.course-map table.grid th { font-family: var(--font-mono); font-size: 12.5px; }
.course-map table.grid td { white-space: normal; padding: 11px 14px; vertical-align: middle; }
.course-map tr.link { cursor: pointer; }
.course-map tr.link:hover td { background: var(--surface-2); }
.course-map td.n { font: 500 13px var(--font-mono); color: var(--ink-3); width: 44px; }
.course-map td.m a { color: var(--ink); font-weight: 600; text-decoration: none; }
.course-map td.m a:hover { color: var(--accent); }
.course-map td.m small { display: block; font-weight: 400; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.course-map td.c { font: 12px var(--font-mono); color: var(--ink-3); }
.course-map td.p { font: 500 13px var(--font-mono); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .course-map td.c, .course-map th.c { display: none; } }
.how { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 16px; }
.how > div { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; }
.how h3 { margin: 0 0 6px; font: 600 17px/1.3 var(--font-cond); }
.how p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.progress-io { display: grid; gap: 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; }
.progress-io p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.progress-io textarea { display: block; width: 100%; min-height: 76px; font: 12.5px/1.5 var(--font-mono); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); color: var(--ink); resize: vertical; overflow-wrap: anywhere; }

25-03-05'), (5, '2025-03-06'), (5, '2025-03-07'),\n  (7, '2025-03-08'), (7, '2025-03-09');\n","tables":[{"name":"departments","columns":[{"name":"dept_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(50)","pk":false},{"name":"location","type":"VARCHAR(50)","pk":false},{"name":"budget","type":"DECIMAL(12,2)","pk":false}],"count":5},{"name":"employees","columns":[{"name":"emp_id","type":"INT","pk":true},{"name":"first_name","type":"VARCHAR(50)","pk":false},{"name":"last_name","type":"VARCHAR(50)","pk":false},{"name":"email","type":"VARCHAR(100)","pk":false},{"name":"dept_id","type":"INT","pk":false},{"name":"manager_id","type":"INT","pk":false},{"name":"title","type":"VARCHAR(60)","pk":false},{"name":"salary","type":"DECIMAL(10,2)","pk":false},{"name":"hire_date","type":"DATE","pk":false}],"count":16},{"name":"customers","columns":[{"name":"customer_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(60)","pk":false},{"name":"email","type":"VARCHAR(100)","pk":false},{"name":"city","type":"VARCHAR(50)","pk":false},{"name":"country","type":"VARCHAR(50)","pk":false},{"name":"signup_date","type":"DATE","pk":false},{"name":"referred_by","type":"INT","pk":false}],"count":12},{"name":"products","columns":[{"name":"product_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(60)","pk":false},{"name":"category","type":"VARCHAR(30)","pk":false},{"name":"price","type":"DECIMAL(10,2)","pk":false}],"count":11},{"name":"orders","columns":[{"name":"order_id","type":"INT","pk":true},{"name":"customer_id","type":"INT","pk":false},{"name":"order_date","type":"DATE","pk":false},{"name":"status","type":"ENUM('PENDING', 'SHIPPED', 'DELIVERED', 'CANCELLED')","pk":false}],"count":24},{"name":"order_items","columns":[{"name":"order_id","type":"INT","pk":true},{"name":"product_id","type":"INT","pk":true},{"name":"quantity","type":"INT","pk":false},{"name":"unit_price","type":"DECIMAL(10,2)","pk":false}],"count":38},{"name":"logins","columns":[{"name":"customer_id","type":"INT","pk":false},{"name":"login_date","type":"DATE","pk":false}],"count":19}]},"modules":[{"id":"start","num":0,"title":"Start here","summary":"How the course is put together, the database every lesson runs on, and a 12-question warm-up that shows where you're rusty.","clauses":[],"kicker":"how this works · the sample shop · warm-up quiz","minutes":8,"html":"\u003ch2>How this course works\u003c/h2>\n\u003cp>You already know SQL. The goal is to get it \u003cstrong>back into your fingers\u003c/strong>, so every page asks you to do something:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Runnable examples.\u003c/strong> Each grey code box has a \u003cstrong>Run\u003c/strong> button, and \u003cstrong>Edit\u003c/strong> (or a double-click) turns it into an editor. Change the query and run it again. Every run starts from a fresh copy of the data, so you can&#39;t break anything. \u003cstrong>Reset\u003c/strong> restores the original.\u003c/li>\n\u003cli>\u003cstrong>Quick checks.\u003c/strong> A few questions at the end of each module. Answer before reading the explanation.\u003c/li>\n\u003cli>\u003cstrong>LeetCode problems.\u003c/strong> Each module ends with the problems that practice it. Every problem page has the tables, an editor, \u003cstrong>Run\u003c/strong> (your result on the example data) and \u003cstrong>Check\u003c/strong> (the example data plus hidden edge cases). There are hints that open one at a time, solutions with alternatives, and a list of \u003cem>common wrong answers\u003c/em> you can run to see exactly how they fail.\u003c/li>\n\u003cli>\u003cstrong>Progress.\u003c/strong> Solved problems, finished modules and your drafts are saved in this browser.\u003c/li>\n\u003c/ul>\n\u003cp>Keyboard: \u003ckbd>Ctrl\u003c/kbd>/\u003ckbd>⌘\u003c/kbd> + \u003ckbd>Enter\u003c/kbd> runs the editor. On problem pages, add \u003ckbd>Shift\u003c/kbd> to check.\u003c/p>\n\u003caside class=\"callout tip\">\u003cdiv class=\"callout-label\">Tip \u003cspan>· A good order\u003c/span>\u003c/div>\u003cp>Take the warm-up quiz at the bottom of this page first. Skim the modules where you answered confidently, slow down where you didn&#39;t, and do the problems as you finish each module. The \u003cstrong>Cheat sheet\u003c/strong> (top bar) is for review.\u003c/p>\n\u003c/aside>\u003ch2>The sample shop\u003c/h2>\n\u003cp>Every lesson example runs on the same small database: an electronics company and its online shop. It&#39;s small enough to see whole results and seeded with the awkward cases real data has.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Table\u003c/th>\u003cth>Rows\u003c/th>\u003cth>What&#39;s in it\u003c/th>\u003cth>Keys\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>departments\u003c/code>\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Departments. \u003cstrong>Legal has no staff\u003c/strong>\u003c/td>\u003ctd>\u003ccode>dept_id\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>employees\u003c/code>\u003c/td>\u003ctd>16\u003c/td>\u003ctd>Staff with salaries. The \u003cstrong>CEO has no department\u003c/strong>, there are \u003cstrong>salary ties\u003c/strong>, and one email is NULL\u003c/td>\u003ctd>\u003ccode>emp_id\u003c/code>; \u003ccode>dept_id\u003c/code> → departments; \u003ccode>manager_id\u003c/code> → employees\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>customers\u003c/code>\u003c/td>\u003ctd>12\u003c/td>\u003ctd>Shop customers. \u003cstrong>Two never ordered\u003c/strong>, and some have no city or email\u003c/td>\u003ctd>\u003ccode>customer_id\u003c/code>; \u003ccode>referred_by\u003c/code> → customers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>products\u003c/code>\u003c/td>\u003ctd>11\u003c/td>\u003ctd>Catalog. \u003cstrong>The Smart Watch never sold\u003c/strong>\u003c/td>\u003ctd>\u003ccode>product_id\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>orders\u003c/code>\u003c/td>\u003ctd>24\u003c/td>\u003ctd>Orders from Jan 2024 to Mar 2025, with a status\u003c/td>\u003ctd>\u003ccode>order_id\u003c/code>; \u003ccode>customer_id\u003c/code> → customers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>order_items\u003c/code>\u003c/td>\u003ctd>38\u003c/td>\u003ctd>Order lines with the \u003cstrong>price paid at the time\u003c/strong>\u003c/td>\u003ctd>(\u003ccode>order_id\u003c/code>, \u003ccode>product_id\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>logins\u003c/code>\u003c/td>\u003ctd>19\u003c/td>\u003ctd>Customer logins in March 2025, \u003cstrong>including a duplicate\u003c/strong>\u003c/td>\u003ctd>\u003ccode>customer_id\u003c/code> → customers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"start-ex1\">\u003c/div>\n\u003cp>You can explore it freely in the \u003cstrong>Playground\u003c/strong> (top bar), which also lists every table and column.\u003c/p>\n\u003ch2>The engine, and how it differs from MySQL\u003c/h2>\n\u003cp>The page runs \u003cstrong>SQLite\u003c/strong> compiled to JavaScript, plus a translation layer that accepts \u003cstrong>MySQL 8 syntax\u003c/strong>: \u003ccode>IF\u003c/code>, \u003ccode>IFNULL\u003c/code>, \u003ccode>DATE_ADD(… INTERVAL …)\u003c/code>, \u003ccode>DATEDIFF\u003c/code>, \u003ccode>DATE_FORMAT\u003c/code>, \u003ccode>TIMESTAMPDIFF\u003c/code>, \u003ccode>GROUP_CONCAT(… SEPARATOR …)\u003c/code>, \u003ccode>REGEXP\u003c/code> and \u003ccode>REGEXP_LIKE\u003c/code>, \u003ccode>CONCAT\u003c/code> with NULL semantics, decimal \u003ccode>/\u003c/code> and \u003ccode>DIV\u003c/code>, \u003ccode>LEFT\u003c/code>/\u003ccode>RIGHT\u003c/code>, \u003ccode>SUBSTRING_INDEX\u003c/code>, multi-table \u003ccode>DELETE\u003c/code>/\u003ccode>UPDATE\u003c/code>, \u003ccode>ON DUPLICATE KEY UPDATE\u003c/code>, \u003ccode>SHOW TABLES\u003c/code>, \u003ccode>DESCRIBE\u003c/code> and more. Text columns compare case-insensitively like MySQL&#39;s default collation. It also \u003cstrong>warns you\u003c/strong> when MySQL would reject a query that happens to run here: ONLY_FULL_GROUP_BY, aliases in WHERE, error 1093, FULL OUTER JOIN, \u003ccode>||\u003c/code>, reserved words like \u003ccode>rank\u003c/code>, and SQLite-only functions.\u003c/p>\n\u003cp>The remaining differences are small but worth knowing:\u003c/p>\n\u003cul>\n\u003cli>A scalar subquery that returns several rows makes MySQL fail (error 1242). Here it silently uses the first row.\u003c/li>\n\u003cli>MySQL keeps 4 extra decimal digits after each division before later arithmetic. This page keeps full precision, so a final \u003ccode>ROUND\u003c/code> can differ in rare exact-half cases.\u003c/li>\n\u003cli>DECIMAL values show without trailing zeros (\u003ccode>2.5\u003c/code>, not \u003ccode>2.50\u003c/code>). They compare equal either way.\u003c/li>\n\u003cli>Case-insensitive comparison applies to text \u003cstrong>columns\u003c/strong>. Text computed by a function (\u003ccode>LEFT(name, 1) = &#39;m&#39;\u003c/code>) compares case-sensitively here.\u003c/li>\n\u003cli>Comparing a DATETIME with a date-only string at exactly midnight differs (\u003ccode>&#39;2024-01-31 00:00:00&#39; &lt;= &#39;2024-01-31&#39;\u003c/code> is false here, true in MySQL). Half-open ranges avoid the issue entirely, and that&#39;s the habit the course teaches anyway.\u003c/li>\n\u003cli>\u003ccode>UPDATE t SET a = b, b = a\u003c/code> swaps the values here. MySQL applies single-table assignments left to right, so it doesn&#39;t swap.\u003c/li>\n\u003cli>Not supported: user variables (\u003ccode>@x\u003c/code>), stored procedures (functions work only in #177), \u003ccode>WITH ROLLUP\u003c/code>, \u003ccode>XOR\u003c/code>, \u003ccode>LATERAL\u003c/code>, full-text search.\u003c/li>\n\u003cli>\u003ccode>EXPLAIN\u003c/code> shows SQLite&#39;s plan (\u003ccode>SCAN\u003c/code> / \u003ccode>SEARCH … USING INDEX\u003c/code>) rather than MySQL&#39;s table. Module 13 explains both.\u003c/li>\n\u003c/ul>\n\u003cp>When you submit on LeetCode, you&#39;re running real MySQL 8.\u003c/p>\n\u003ch2>Warm-up quiz\u003c/h2>\n\u003cp>Answer quickly and honestly. Each explanation points to the module that covers the idea.\u003c/p>\n\u003cdiv class=\"quiz\" data-quiz=\"start-q1\">\u003c/div>","examples":[{"id":"start-ex1","sql":"SELECT 'departments' AS table_name, COUNT(*) AS n_rows FROM departments\nUNION ALL SELECT 'employees',   COUNT(*) FROM employees\nUNION ALL SELECT 'customers',   COUNT(*) FROM customers\nUNION ALL SELECT 'products',    COUNT(*) FROM products\nUNION ALL SELECT 'orders',      COUNT(*) FROM orders\nUNION ALL SELECT 'order_items', COUNT(*) FROM order_items\nUNION ALL SELECT 'logins',      COUNT(*) FROM logins;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["table_name","n_rows"],"rows":[["departments",5],["employees",16],["customers",12],["products",11],["orders",24],["order_items",38],["logins",19]],"total":7,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"start-q1","questions":[{"q":"Which clause is evaluated first?","options":["SELECT","WHERE","ORDER BY","They run in the order written"],"answer":1,"explain":"\u003cp>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. That&#39;s why WHERE can&#39;t use SELECT aliases. Review: \u003ca class=\"mref\" href=\"#basics\">Query basics\u003c/a>.\u003c/p>\n"},{"q":"\u003ccode>t(x)\u003c/code> holds 1, 5 and NULL. How many rows does \u003ccode>WHERE x &lt;&gt; 5\u003c/code> return?","options":["1","2","3","0"],"answer":0,"explain":"\u003cp>\u003ccode>NULL &lt;&gt; 5\u003c/code> is UNKNOWN, and WHERE keeps only TRUE. Review: \u003ca class=\"mref\" href=\"#filtering\">Filtering and NULL\u003c/a>.\u003c/p>\n"},{"q":"\u003ccode>COUNT(*)\u003c/code> vs \u003ccode>COUNT(email)\u003c/code> when some emails are NULL?","options":["Always equal","\u003ccode>COUNT(email)\u003c/code> is smaller: it skips NULLs","\u003ccode>COUNT(*)\u003c/code> skips NULL rows","\u003ccode>COUNT(email)\u003c/code> errors on NULLs"],"answer":1,"explain":"\u003cp>Aggregates skip NULLs, but \u003ccode>COUNT(*)\u003c/code> counts rows. Review: \u003ca class=\"mref\" href=\"#aggregation\">Aggregation\u003c/a>.\u003c/p>\n"},{"q":"Where does a condition on \u003ccode>COUNT(*)\u003c/code> go?","options":["WHERE","HAVING","ON","ORDER BY"],"answer":1,"explain":"\u003cp>WHERE runs before groups exist. HAVING filters groups. Review: \u003ca class=\"mref\" href=\"#aggregation\">Aggregation\u003c/a>.\u003c/p>\n"},{"q":"\u003ccode>customers c LEFT JOIN orders o ON … WHERE o.status = &#39;paid&#39;\u003c/code> keeps customers without orders?","options":["Yes, that&#39;s what LEFT JOIN does","No: the WHERE on the right table removes the NULL-padded rows","Only if status is nullable","Only with RIGHT JOIN"],"answer":1,"explain":"\u003cp>Move the condition into ON to keep every customer. Review: \u003ca class=\"mref\" href=\"#joins\">Joins\u003c/a>.\u003c/p>\n"},{"q":"\u003ccode>WHERE id NOT IN (SELECT manager_id FROM employees)\u003c/code> returns nothing. Most likely cause?","options":["NOT IN doesn&#39;t work with subqueries","\u003ccode>manager_id\u003c/code> contains a NULL","The subquery needs DISTINCT","id must be indexed"],"answer":1,"explain":"\u003cp>One NULL makes every \u003ccode>id &lt;&gt; NULL\u003c/code> UNKNOWN. Use NOT EXISTS. Review: \u003ca class=\"mref\" href=\"#subqueries\">Subqueries\u003c/a>.\u003c/p>\n"},{"q":"UNION vs UNION ALL?","options":["UNION ALL removes duplicates","UNION removes duplicates; UNION ALL keeps every row and is cheaper","They&#39;re identical in MySQL","UNION needs the same column names"],"answer":1,"explain":"\u003cp>Review: \u003ca class=\"mref\" href=\"#sets\">Set operations\u003c/a>.\u003c/p>\n"},{"q":"A recursive CTE consists of…","options":["one SELECT that calls itself in WHERE","an anchor SELECT, UNION ALL, and a recursive SELECT that references the CTE","a stored procedure with a loop","a view that references itself"],"answer":1,"explain":"\u003cp>Review: \u003ca class=\"mref\" href=\"#ctes\">CTEs and recursion\u003c/a>.\u003c/p>\n"},{"q":"Salaries 90, 80, 80, 70. \u003ccode>RANK()\u003c/code> vs \u003ccode>DENSE_RANK()\u003c/code> for 70 (descending)?","options":["3 and 3","4 and 3","3 and 4","4 and 4"],"answer":1,"explain":"\u003cp>RANK skips after ties, DENSE_RANK doesn&#39;t. Review: \u003ca class=\"mref\" href=\"#windows\">Window functions\u003c/a>.\u003c/p>\n"},{"q":"&quot;The top 3 salaries in each department, ties included&quot;. The standard shape is…","options":["GROUP BY department with LIMIT 3","ORDER BY salary DESC LIMIT 3","DENSE_RANK() partitioned by department in a subquery, then \u003ccode>WHERE rnk &lt;= 3\u003c/code>","a self-join on salary"],"answer":2,"explain":"\u003cp>Review: \u003ca class=\"mref\" href=\"#patterns\">Interview patterns\u003c/a>.\u003c/p>\n"},{"q":"MySQL InnoDB&#39;s default transaction isolation level?","options":["READ UNCOMMITTED","READ COMMITTED","REPEATABLE READ","SERIALIZABLE"],"answer":2,"explain":"\u003cp>Review: \u003ca class=\"mref\" href=\"#modifying\">Changing data\u003c/a>.\u003c/p>\n"},{"q":"Which condition can use an index on \u003ccode>created_at\u003c/code>?","options":["\u003ccode>YEAR(created_at) = 2024\u003c/code>","\u003ccode>DATE(created_at) = &#39;2024-05-01&#39;\u003c/code>","\u003ccode>created_at &gt;= &#39;2024-01-01&#39; AND created_at &lt; &#39;2025-01-01&#39;\u003c/code>","\u003ccode>created_at + INTERVAL 1 DAY &gt; NOW()\u003c/code>"],"answer":2,"explain":"\u003cp>Keep the column bare: sargable conditions. Review: \u003ca class=\"mref\" href=\"#performance\">Indexes and performance\u003c/a>.\u003c/p>\n"}]}],"problems":[]},{"id":"basics","num":1,"title":"Query basics","summary":"The five clauses you use every day — and the order MySQL actually evaluates them in.","clauses":["FROM","WHERE","SELECT","ORDER BY","LIMIT"],"kicker":"SELECT · FROM · WHERE · ORDER BY · LIMIT","minutes":14,"html":"\u003ch2>The one idea that fixes most confusion\u003c/h2>\n\u003cp>You \u003cem>write\u003c/em> a query as \u003ccode>SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT\u003c/code>. The database \u003cem>evaluates\u003c/em> it in a different order:\u003c/p>\n\u003col class=\"order-strip\">\n\u003cli>\u003cb>FROM\u003c/b>\u003cspan>tables &amp; joins\u003c/span>\u003c/li>\n\u003cli>\u003cb>WHERE\u003c/b>\u003cspan>filter rows\u003c/span>\u003c/li>\n\u003cli>\u003cb>GROUP BY\u003c/b>\u003cspan>form groups\u003c/span>\u003c/li>\n\u003cli>\u003cb>HAVING\u003c/b>\u003cspan>filter groups\u003c/span>\u003c/li>\n\u003cli>\u003cb>SELECT\u003c/b>\u003cspan>compute columns\u003c/span>\u003c/li>\n\u003cli>\u003cb>DISTINCT\u003c/b>\u003cspan>drop duplicates\u003c/span>\u003c/li>\n\u003cli>\u003cb>ORDER BY\u003c/b>\u003cspan>sort\u003c/span>\u003c/li>\n\u003cli>\u003cb>LIMIT\u003c/b>\u003cspan>cut\u003c/span>\u003c/li>\n\u003c/ol>\u003cp>Almost every &quot;why doesn&#39;t this work?&quot; moment in SQL comes from forgetting this order:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>WHERE can&#39;t see SELECT aliases.\u003c/strong> They don&#39;t exist yet when WHERE runs.\u003c/li>\n\u003cli>\u003cstrong>WHERE can&#39;t use aggregates\u003c/strong> like \u003ccode>COUNT(*)\u003c/code>, because groups don&#39;t exist yet. That&#39;s what \u003ccode>HAVING\u003c/code> is for.\u003c/li>\n\u003cli>\u003cstrong>Window functions\u003c/strong> (\u003ccode>ROW_NUMBER()\u003c/code> and friends) are computed in the SELECT step, so you can&#39;t filter on them in WHERE either. You wrap the query instead (Module 9).\u003c/li>\n\u003cli>\u003cstrong>ORDER BY runs late\u003c/strong>, so it \u003cem>can\u003c/em> use aliases and expressions from SELECT.\u003c/li>\n\u003cli>\u003cstrong>LIMIT is last\u003c/strong>, so it cuts the final, sorted result.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"basics-ex1\">\u003c/div>\n\u003cp>Now use the alias in WHERE. MySQL would reject this with \u003cem>Unknown column &#39;monthly&#39; in &#39;where clause&#39;\u003c/em>. The page&#39;s engine is more forgiving, so it runs the query and shows MySQL&#39;s objection as a warning:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"basics-ex2\">\u003c/div>\n\u003cp>The fix is to repeat the expression (\u003ccode>WHERE salary / 12 &gt; 10000\u003c/code>), or to compute the alias in a subquery and filter it outside.\u003c/p>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases \u003cspan>· Where aliases are allowed\u003c/span>\u003c/div>\u003cp>MySQL lets you use a SELECT alias in \u003ccode>GROUP BY\u003c/code>, \u003ccode>HAVING\u003c/code> and \u003ccode>ORDER BY\u003c/code>. PostgreSQL allows it in \u003ccode>GROUP BY\u003c/code> and \u003ccode>ORDER BY\u003c/code> but not \u003ccode>HAVING\u003c/code>. SQL Server allows it only in \u003ccode>ORDER BY\u003c/code>. No database allows it in \u003ccode>WHERE\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>SELECT and FROM\u003c/h2>\n\u003cul>\n\u003cli>Pick columns or expressions, and name them with \u003ccode>AS\u003c/code>. The keyword is optional, but it makes aliases easy to spot.\u003c/li>\n\u003cli>\u003ccode>SELECT *\u003c/code> is fine for exploring. In application code, list the columns so a schema change can&#39;t silently reshape your results.\u003c/li>\n\u003cli>When a query touches several tables, \u003cstrong>qualify\u003c/strong> columns (\u003ccode>e.salary\u003c/code>, \u003ccode>d.name\u003c/code>). It prevents &quot;ambiguous column&quot; errors and makes the query readable.\u003c/li>\n\u003cli>Put strings in \u003cstrong>single quotes\u003c/strong>. Wrap awkward identifiers in backticks (\u003ccode>`order`\u003c/code>). In MySQL, \u003ccode>&quot;double quotes&quot;\u003c/code> also make a \u003cem>string\u003c/em>, which surprises people coming from PostgreSQL.\u003c/li>\n\u003c/ul>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Division in MySQL is decimal\u003c/span>\u003c/div>\u003cp>In MySQL, \u003ccode>/\u003c/code> always produces a decimal: \u003ccode>SELECT 7 / 2\u003c/code> gives \u003ccode>3.5000\u003c/code>. PostgreSQL and SQL Server truncate integer division (\u003ccode>7 / 2 = 3\u003c/code>) unless one side is a decimal. For whole-number division in MySQL, use \u003ccode>DIV\u003c/code> (\u003ccode>7 DIV 2 = 3\u003c/code>), and use \u003ccode>%\u003c/code> or \u003ccode>MOD()\u003c/code> for the remainder.\u003c/p>\n\u003c/aside>\u003cdiv class=\"example\" data-ex=\"basics-ex3\">\u003c/div>\n\u003ch2>WHERE, briefly\u003c/h2>\n\u003cp>WHERE keeps only the rows for which the condition is \u003cstrong>true\u003c/strong>. Use comparisons (\u003ccode>=\u003c/code>, \u003ccode>&lt;&gt;\u003c/code> or \u003ccode>!=\u003c/code>, \u003ccode>&lt;\u003c/code>, \u003ccode>&lt;=\u003c/code>, \u003ccode>&gt;\u003c/code>, \u003ccode>&gt;=\u003c/code>) combined with \u003ccode>AND\u003c/code>, \u003ccode>OR\u003c/code> and \u003ccode>NOT\u003c/code>. Module 2 covers the details, including what NULL does to all of this.\u003c/p>\n\u003cp>MySQL&#39;s default collation compares text \u003cstrong>case-insensitively\u003c/strong>, so \u003ccode>&#39;CHEN&#39;\u003c/code> matches \u003ccode>&#39;Chen&#39;\u003c/code>:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"basics-ex4\">\u003c/div>\n\u003ch2>ORDER BY\u003c/h2>\n\u003cul>\n\u003cli>Each key gets its own direction: \u003ccode>ORDER BY dept_id, salary DESC\u003c/code> means department ascending, then salary descending within each department.\u003c/li>\n\u003cli>The default direction is \u003ccode>ASC\u003c/code>. In MySQL, \u003cstrong>NULLs sort first\u003c/strong> in ascending order and last in descending order.\u003c/li>\n\u003cli>You can sort by an alias, an expression, or a column position (\u003ccode>ORDER BY 2\u003c/code>). Avoid positions in real code, because they break as soon as someone reorders the column list.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"basics-ex5\">\u003c/div>\n\u003cp>The CEO has no department (\u003ccode>dept_id\u003c/code> is NULL), so she sorts first. Engineering&#39;s two 110,000 salaries tie, and \u003ccode>emp_id\u003c/code> breaks the tie.\u003c/p>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· Ties are unordered unless you say otherwise\u003c/span>\u003c/div>\u003cp>Rows that tie on every ORDER BY key come back in no guaranteed order, and it can change between runs or versions. Whenever you paginate or pick a &quot;top N&quot;, add a unique tie-breaker (usually the primary key).\u003c/p>\n\u003c/aside>\u003ch2>LIMIT and OFFSET\u003c/h2>\n\u003cp>\u003ccode>LIMIT n\u003c/code> keeps the first \u003cem>n\u003c/em> rows of the final result, and \u003ccode>OFFSET m\u003c/code> skips \u003cem>m\u003c/em> rows before that. MySQL also has a shorthand with the arguments reversed:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"basics-ex6\">\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· LIMIT m, n puts the offset first\u003c/span>\u003c/div>\u003cp>\u003ccode>LIMIT 5, 10\u003c/code> skips 5 rows and returns the next 10 (rows 6–15). It does not mean &quot;rows 5 to 10&quot;. Prefer the explicit \u003ccode>LIMIT 10 OFFSET 5\u003c/code> for readability.\u003c/p>\n\u003c/aside>\u003caside class=\"callout work\">\u003cdiv class=\"callout-label\">On the job \u003cspan>· Deep OFFSETs are slow\u003c/span>\u003c/div>\u003cp>\u003ccode>OFFSET 100000\u003c/code> still reads and throws away 100,000 rows. For pages deep into a large table, use \u003cem>keyset pagination\u003c/em>: \u003ccode>WHERE id &gt; :last_seen_id ORDER BY id LIMIT 50\u003c/code>. Module 13 explains why that uses an index.\u003c/p>\n\u003c/aside>\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases \u003cspan>· Top-N in other databases\u003c/span>\u003c/div>\u003cp>SQL Server uses \u003ccode>SELECT TOP 5 …\u003c/code> or \u003ccode>OFFSET 10 ROWS FETCH NEXT 5 ROWS ONLY\u003c/code>. PostgreSQL and Oracle 12c+ accept the standard \u003ccode>FETCH FIRST 5 ROWS ONLY\u003c/code>, and PostgreSQL also supports \u003ccode>LIMIT\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>DISTINCT\u003c/h2>\n\u003cp>\u003ccode>DISTINCT\u003c/code> removes duplicate \u003cstrong>rows\u003c/strong>, meaning the whole selected tuple, not one column:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"basics-ex7\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"basics-ex8\">\u003c/div>\n\u003cp>The second query returns each \u003cem>(country, city)\u003c/em> pair once. Spain appears once because both Spanish customers live in Madrid. George&#39;s city is NULL, and DISTINCT treats NULLs as equal to each other, so all-NULL duplicates collapse to a single row.\u003c/p>\n\u003caside class=\"callout interview\">\u003cdiv class=\"callout-label\">Interview angle \u003cspan>· Say the evaluation order out loud\u003c/span>\u003c/div>\u003cp>When an interviewer asks why a query fails, walking through \u003cem>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT\u003c/em> usually explains it: an alias in WHERE, an aggregate in WHERE, a window function in WHERE. It also shows you reason about queries rather than guess.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"basics-q1\">\u003c/div>","examples":[{"id":"basics-ex1","sql":"SELECT first_name, last_name, salary / 12 AS monthly\nFROM employees\nWHERE dept_id = 1          -- runs before SELECT: no aliases here\nORDER BY monthly DESC;     -- runs after SELECT: the alias works","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","last_name","monthly"],"rows":[["Omar","Farouk",15000],["Lina","Chen",12500],["Karim","Adel",10416.6666666667],["Sara","Lopez",9166.66666666667],["Ben","Carter",9166.66666666667],["Aya","Mahmoud",7083.33333333333]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"basics-ex2","sql":"SELECT first_name, salary / 12 AS monthly\nFROM employees\nWHERE monthly > 10000;","db":"sample","expectError":false,"expectWarning":true,"title":"","output":{"columns":["first_name","monthly"],"rows":[["Nadia",20833.3333333333],["Omar",15000],["Lina",12500],["Karim",10416.6666666667],["Youssef",11666.6666666667]],"total":5,"explain":false,"error":null,"warnings":["`monthly` is a SELECT alias. MySQL rejects it in WHERE (Unknown column 'monthly' in 'where clause') because WHERE runs before SELECT. Repeat the expression, or filter in an outer query / HAVING."],"notes":[],"summary":[]}},{"id":"basics-ex3","sql":"SELECT 7 / 2 AS decimal_division, 7 DIV 2 AS integer_division, 7 % 2 AS remainder;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["decimal_division","integer_division","remainder"],"rows":[[3.5,3,1]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"basics-ex4","sql":"SELECT first_name, last_name, title\nFROM employees\nWHERE last_name = 'CHEN';","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","last_name","title"],"rows":[["Lina","Chen","Staff Engineer"]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"basics-ex5","sql":"SELECT dept_id, first_name, salary\nFROM employees\nORDER BY dept_id, salary DESC, emp_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["dept_id","first_name","salary"],"rows":[[null,"Nadia",250000],[1,"Omar",180000],[1,"Lina",150000],[1,"Karim",125000],[1,"Sara",110000],[1,"Ben",110000],[1,"Aya",85000],[2,"Youssef",140000],[2,"Emma",90000],[2,"Hana",90000],[2,"Tom",62000],[3,"Mariam",115000],[3,"Leo",72000],[4,"Priya",120000],[4,"Ahmed",78000],[4,"Julia",78000]],"total":16,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"basics-ex6","sql":"SELECT first_name, salary\nFROM employees\nORDER BY salary DESC, emp_id\nLIMIT 3 OFFSET 2;         -- same as LIMIT 2, 3","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","salary"],"rows":[["Lina",150000],["Youssef",140000],["Karim",125000]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"basics-ex7","sql":"SELECT DISTINCT country\nFROM customers\nORDER BY country;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["country"],"rows":[["Czechia"],["Egypt"],["France"],["Japan"],["Portugal"],["Spain"],["UK"],["USA"]],"total":8,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"basics-ex8","sql":"SELECT DISTINCT country, city\nFROM customers\nORDER BY country, city;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["country","city"],"rows":[["Czechia","Prague"],["Egypt","Alexandria"],["Egypt","Cairo"],["France","Paris"],["Japan","Tokyo"],["Portugal","Lisbon"],["Spain","Madrid"],["UK","London"],["USA",null]],"total":9,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"basics-q1","questions":[{"q":"You write \u003ccode>SELECT price * qty AS total FROM items WHERE total &gt; 100\u003c/code>. Why does MySQL reject it?","options":["Aliases can&#39;t contain arithmetic","WHERE is evaluated before SELECT, so \u003ccode>total\u003c/code> doesn&#39;t exist yet","You must use HAVING for any alias","Aliases need backticks"],"answer":1,"explain":"\u003cp>The alias is created in the SELECT step, which runs after WHERE. Repeat the expression in WHERE, or filter in an outer query. (MySQL \u003cem>does\u003c/em> allow the alias in HAVING and ORDER BY.)\u003c/p>\n"},{"q":"What does \u003ccode>LIMIT 5, 10\u003c/code> return in MySQL?","options":["Rows 5 to 10","The first 5 rows, then 10 more","Rows 6 through 15","An error"],"answer":2,"explain":"\u003cp>The first argument is the offset, the second is the count: skip 5 rows, then take 10.\u003c/p>\n"},{"q":"\u003ccode>SELECT DISTINCT dept_id, title FROM employees\u003c/code> removes duplicates of…","options":["\u003ccode>dept_id\u003c/code> only","\u003ccode>title\u003c/code> only","each (dept_id, title) combination","nothing, because DISTINCT needs one column"],"answer":2,"explain":"\u003cp>DISTINCT applies to the entire selected row.\u003c/p>\n"},{"q":"In MySQL, where do NULLs appear with \u003ccode>ORDER BY col ASC\u003c/code>?","options":["First","Last","Randomly","They are excluded"],"answer":0,"explain":"\u003cp>MySQL treats NULL as smaller than any value, so NULLs come first ascending and last descending. PostgreSQL does the opposite by default.\u003c/p>\n"},{"q":"\u003ccode>SELECT 7 / 2\u003c/code> in MySQL returns…","options":["3","3.5000","4","an error: integer division"],"answer":1,"explain":"\u003cp>MySQL&#39;s \u003ccode>/\u003c/code> always returns a decimal. Use \u003ccode>DIV\u003c/code> for integer division. PostgreSQL would return 3.\u003c/p>\n"}]}],"problems":[1757,595,1148,620]},{"id":"filtering","num":2,"title":"Filtering and NULL","summary":"How WHERE really decides, why NULL breaks naive filters, and the NOT IN trap that returns nothing.","clauses":["WHERE"],"kicker":"WHERE · IN · BETWEEN · LIKE · IS NULL","minutes":16,"html":"\u003ch2>WHERE keeps only TRUE\u003c/h2>\n\u003cp>WHERE evaluates its condition for each row and keeps the row only if the result is \u003cstrong>TRUE\u003c/strong>. That sounds obvious until you meet the third truth value, \u003cstrong>UNKNOWN\u003c/strong>, which is what you get whenever NULL takes part in a comparison. Rows whose condition is UNKNOWN are dropped, exactly like FALSE ones.\u003c/p>\n\u003cp>Start with precedence: \u003ccode>AND\u003c/code> binds tighter than \u003ccode>OR\u003c/code>, just as \u003ccode>*\u003c/code> binds tighter than \u003ccode>+\u003c/code>.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex1\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex2\">\u003c/div>\n\u003caside class=\"callout tip\">\u003cdiv class=\"callout-label\">Tip\u003c/div>\u003cp>Whenever a condition mixes \u003ccode>AND\u003c/code> and \u003ccode>OR\u003c/code>, add parentheses, even when the precedence already happens to do the right thing. It costs nothing and saves the next reader a double-take.\u003c/p>\n\u003c/aside>\u003ch2>IN, BETWEEN, LIKE\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>x IN (a, b, c)\u003c/code> is shorthand for \u003ccode>x = a OR x = b OR x = c\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>x BETWEEN lo AND hi\u003c/code> is \u003cstrong>inclusive\u003c/strong> at both ends: \u003ccode>x &gt;= lo AND x &lt;= hi\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>x LIKE pattern\u003c/code> uses \u003ccode>%\u003c/code> for any run of characters (including none) and \u003ccode>_\u003c/code> for exactly one character. With MySQL&#39;s default collation, \u003ccode>LIKE\u003c/code> ignores case.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex3\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex4\">\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· BETWEEN and timestamps\u003c/span>\u003c/div>\u003cp>With \u003ccode>DATETIME\u003c/code> values, \u003ccode>BETWEEN &#39;2024-01-01&#39; AND &#39;2024-01-31&#39;\u003c/code> stops at \u003ccode>2024-01-31 00:00:00\u003c/code>, so events later on the 31st are silently missed. Use a half-open range instead: \u003ccode>ts &gt;= &#39;2024-01-01&#39; AND ts &lt; &#39;2024-02-01&#39;\u003c/code>.\u003c/p>\n\u003c/aside>\u003cdetails class=\"setup\">\u003csummary>Data for these examples: \u003ccode>events\u003c/code>\u003c/summary>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">CREATE\u003c/span> \u003cspan class=\"t-k\">TABLE\u003c/span> \u003cspan class=\"t-f\">events\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>event_id \u003cspan class=\"t-t\">INT\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> happened_at \u003cspan class=\"t-t\">DATETIME\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">INSERT\u003c/span> \u003cspan class=\"t-k\">INTO\u003c/span> events \u003cspan class=\"t-k\">VALUES\u003c/span>\n  \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2024-01-01 09:00:00'\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2024-01-15 12:30:00'\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">3\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2024-01-31 09:30:00'\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">4\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2024-01-31 18:45:00'\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">5\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2024-02-01 08:00:00'\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\u003c/code>\u003c/pre>\u003c/details>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex5\">\u003c/div>\n\u003cp>\u003ccode>BETWEEN\u003c/code> counted 2 events: it silently missed both of January 31st&#39;s events, at 09:30 and 18:45. The half-open range counts all 4. (A MySQL comparison evaluates to 1 or 0, so \u003ccode>SUM(condition)\u003c/code> counts matching rows, a trick you&#39;ll use constantly in Module 4.)\u003c/p>\n\u003cp>To match a literal \u003ccode>%\u003c/code> or \u003ccode>_\u003c/code>, escape it with a backslash (MySQL&#39;s default escape character): \u003ccode>LIKE &#39;%\\_%&#39;\u003c/code> finds values containing an underscore.\u003c/p>\n\u003ch2>NULL: the missing value\u003c/h2>\n\u003cp>NULL means &quot;unknown&quot; or &quot;not applicable&quot;. It isn&#39;t a value you can compare against: any comparison with NULL, even \u003ccode>NULL = NULL\u003c/code>, yields NULL (UNKNOWN), never TRUE.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex6\">\u003c/div>\n\u003cp>Three consequences to memorize:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Test for NULL with \u003ccode>IS NULL\u003c/code> / \u003ccode>IS NOT NULL\u003c/code>\u003c/strong>, never with \u003ccode>= NULL\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Negative filters drop NULLs.\u003c/strong> \u003ccode>WHERE city &lt;&gt; &#39;Cairo&#39;\u003c/code> does not return customers whose city is unknown, because \u003ccode>NULL &lt;&gt; &#39;Cairo&#39;\u003c/code> is UNKNOWN.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>&lt;=&gt;\u003c/code> is MySQL&#39;s NULL-safe equals\u003c/strong>: \u003ccode>a &lt;=&gt; b\u003c/code> is TRUE when both are NULL. The standard spelling, which PostgreSQL supports, is \u003ccode>a IS NOT DISTINCT FROM b\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex7\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex8\">\u003c/div>\n\u003cp>The truth tables, where U is UNKNOWN:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>p\u003c/th>\u003cth>q\u003c/th>\u003cth>p AND q\u003c/th>\u003cth>p OR q\u003c/th>\u003cth>NOT p\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TRUE\u003c/td>\u003ctd>U\u003c/td>\u003ctd>U\u003c/td>\u003ctd>TRUE\u003c/td>\u003ctd>FALSE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FALSE\u003c/td>\u003ctd>U\u003c/td>\u003ctd>FALSE\u003c/td>\u003ctd>U\u003c/td>\u003ctd>TRUE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>U\u003c/td>\u003ctd>U\u003c/td>\u003ctd>U\u003c/td>\u003ctd>U\u003c/td>\u003ctd>U\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>FALSE AND U\u003c/code> is FALSE and \u003ccode>TRUE OR U\u003c/code> is TRUE, because the answer no longer depends on the unknown part. That is also why a single UNKNOWN can quietly sink an entire \u003ccode>AND\u003c/code> chain.\u003c/p>\n\u003ch2>The NOT IN trap\u003c/h2>\n\u003cp>\u003ccode>x NOT IN (a, b, NULL)\u003c/code> means \u003ccode>x &lt;&gt; a AND x &lt;&gt; b AND x &lt;&gt; NULL\u003c/code>. The last term is UNKNOWN for every row, so \u003cstrong>the whole condition can never be TRUE\u003c/strong> and the query returns nothing. This bites hardest with subqueries, where the NULL is invisible:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex9\">\u003c/div>\n\u003cp>\u003ccode>referred_by\u003c/code> contains NULLs (most customers weren&#39;t referred), so the result is empty. Filter the NULLs out of the subquery, or use \u003ccode>NOT EXISTS\u003c/code> (Module 6), which doesn&#39;t have this problem:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex10\">\u003c/div>\n\u003caside class=\"callout interview\">\u003cdiv class=\"callout-label\">Interview angle\u003c/div>\u003cp>&quot;Why does my NOT IN return nothing?&quot; is a classic interview question. The answer: a NULL in the list makes every comparison UNKNOWN. Mention \u003ccode>NOT EXISTS\u003c/code> or a \u003ccode>LEFT JOIN … IS NULL\u003c/code> anti-join as the robust alternatives.\u003c/p>\n\u003c/aside>\u003ch2>Replacing and producing NULLs\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>COALESCE(a, b, c)\u003c/code> returns the first non-NULL argument. It&#39;s standard SQL and works everywhere.\u003c/li>\n\u003cli>\u003ccode>IFNULL(a, b)\u003c/code> is MySQL&#39;s two-argument version (SQL Server calls it \u003ccode>ISNULL(a, b)\u003c/code>, Oracle \u003ccode>NVL\u003c/code>).\u003c/li>\n\u003cli>\u003ccode>NULLIF(a, b)\u003c/code> returns NULL when \u003ccode>a = b\u003c/code>, otherwise \u003ccode>a\u003c/code>. The classic use is \u003ccode>x / NULLIF(y, 0)\u003c/code> to avoid division-by-zero errors. MySQL already returns NULL for \u003ccode>x / 0\u003c/code>, but PostgreSQL and SQL Server raise an error, so the habit is worth keeping.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"filtering-ex11\">\u003c/div>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· NULL is grouped, sorted and deduplicated as one value\u003c/span>\u003c/div>\u003cp>Comparisons treat NULL as unknown, but \u003ccode>GROUP BY\u003c/code>, \u003ccode>DISTINCT\u003c/code> and \u003ccode>ORDER BY\u003c/code> put all NULLs together as one group. Aggregate functions skip NULLs (\u003ccode>SUM\u003c/code>, \u003ccode>AVG\u003c/code>, \u003ccode>COUNT(col)\u003c/code>), while \u003ccode>COUNT(*)\u003c/code> counts rows. Module 4 builds on this.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"filtering-q1\">\u003c/div>","examples":[{"id":"filtering-ex1","sql":"-- Reads as: dept 1, OR (dept 2 AND salary > 100000)\nSELECT first_name, dept_id, salary\nFROM employees\nWHERE dept_id = 1 OR dept_id = 2 AND salary > 100000;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","dept_id","salary"],"rows":[["Omar",1,180000],["Lina",1,150000],["Karim",1,125000],["Sara",1,110000],["Ben",1,110000],["Aya",1,85000],["Youssef",2,140000]],"total":7,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex2","sql":"-- What was probably meant: parentheses first\nSELECT first_name, dept_id, salary\nFROM employees\nWHERE (dept_id = 1 OR dept_id = 2) AND salary > 100000;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","dept_id","salary"],"rows":[["Omar",1,180000],["Lina",1,150000],["Karim",1,125000],["Sara",1,110000],["Ben",1,110000],["Youssef",2,140000]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex3","sql":"SELECT name, city, signup_date\nFROM customers\nWHERE city IN ('Cairo', 'Alexandria')\n  AND signup_date BETWEEN '2024-01-01' AND '2024-06-30';","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","city","signup_date"],"rows":[["Bilal Khan","Cairo","2024-01-19"],["Farah Aziz","Cairo","2024-03-08"]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex4","sql":"SELECT name FROM products\nWHERE name LIKE '%phone%'      -- matches \"Phone X\", \"Phone Case\" and \"…Headphones\"\nORDER BY name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name"],"rows":[["Noise-Cancelling Headphones"],["Phone Case"],["Phone X"]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex5","sql":"SELECT\n  SUM(happened_at BETWEEN '2024-01-01' AND '2024-01-31')           AS between_count,\n  SUM(happened_at >= '2024-01-01' AND happened_at \u003c '2024-02-01')   AS half_open_count\nFROM events;","db":"events","expectError":false,"expectWarning":false,"title":"","output":{"columns":["between_count","half_open_count"],"rows":[[2,4]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex6","sql":"SELECT NULL = NULL      AS eq,\n       NULL \u003c> 1        AS neq,\n       NULL IS NULL     AS is_null,\n       NULL \u003c=> NULL    AS null_safe_eq,\n       1 \u003c=> NULL       AS null_safe_eq_2;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["eq","neq","is_null","null_safe_eq","null_safe_eq_2"],"rows":[[null,null,1,1,0]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex7","sql":"SELECT name, city\nFROM customers\nWHERE city \u003c> 'Cairo';     -- George (city NULL) is missing","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","city"],"rows":[["Alice Green","London"],["Chloe Dubois","Paris"],["Diego Alvarez","Madrid"],["Hiro Tanaka","Tokyo"],["Ines Costa","Lisbon"],["Kate Novak","Prague"],["Luis Romero","Madrid"],["Mona Adel","Alexandria"]],"total":8,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex8","sql":"SELECT name, city\nFROM customers\nWHERE city \u003c> 'Cairo' OR city IS NULL;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","city"],"rows":[["Alice Green","London"],["Chloe Dubois","Paris"],["Diego Alvarez","Madrid"],["George Miller",null],["Hiro Tanaka","Tokyo"],["Ines Costa","Lisbon"],["Kate Novak","Prague"],["Luis Romero","Madrid"],["Mona Adel","Alexandria"]],"total":9,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex9","sql":"-- \"Customers who never referred anyone\"? Returns an empty set.\nSELECT name\nFROM customers\nWHERE customer_id NOT IN (SELECT referred_by FROM customers);","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name"],"rows":[],"total":0,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex10","sql":"SELECT name\nFROM customers\nWHERE customer_id NOT IN (SELECT referred_by FROM customers WHERE referred_by IS NOT NULL)\nORDER BY name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name"],"rows":[["George Miller"],["Hiro Tanaka"],["Ines Costa"],["Kate Novak"],["Luis Romero"],["Mona Adel"]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"filtering-ex11","sql":"SELECT name,\n       COALESCE(city, 'unknown')              AS city,\n       IFNULL(email, CONCAT('(no email) ', country)) AS contact\nFROM customers\nWHERE city IS NULL OR email IS NULL;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","city","contact"],"rows":[["Diego Alvarez","Madrid","(no email) Spain"],["George Miller","unknown","george@mail.test"]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{"events":"CREATE TABLE events (event_id INT, happened_at DATETIME);\nINSERT INTO events VALUES\n  (1, '2024-01-01 09:00:00'), (2, '2024-01-15 12:30:00'),\n  (3, '2024-01-31 09:30:00'), (4, '2024-01-31 18:45:00'), (5, '2024-02-01 08:00:00');"},"quizzes":[{"id":"filtering-q1","questions":[{"q":"Table \u003ccode>t(x)\u003c/code> holds 1, 2 and NULL. How many rows does \u003ccode>SELECT * FROM t WHERE x &lt;&gt; 1\u003c/code> return?","options":["2","1","0","3"],"answer":1,"explain":"\u003cp>Only \u003ccode>2\u003c/code>. For the NULL row, \u003ccode>NULL &lt;&gt; 1\u003c/code> is UNKNOWN, and WHERE keeps only TRUE.\u003c/p>\n"},{"q":"What does \u003ccode>SELECT 5 NOT IN (1, 2, NULL)\u003c/code> return in MySQL?","options":["1 (true)","0 (false)","NULL (unknown)","an error"],"answer":2,"explain":"\u003cp>\u003ccode>5 &lt;&gt; NULL\u003c/code> is UNKNOWN, and \u003ccode>TRUE AND UNKNOWN\u003c/code> is UNKNOWN. In a WHERE clause, that row would be filtered out.\u003c/p>\n"},{"q":"Which condition finds rows where \u003ccode>a\u003c/code> and \u003ccode>b\u003c/code> are equal \u003cstrong>or both NULL\u003c/strong>?","options":["\u003ccode>a = b\u003c/code>","\u003ccode>a = b OR a = NULL\u003c/code>","\u003ccode>a &lt;=&gt; b\u003c/code>","\u003ccode>IFNULL(a, b) = b\u003c/code>"],"answer":2,"explain":"\u003cp>\u003ccode>&lt;=&gt;\u003c/code> is MySQL&#39;s NULL-safe equality (standard SQL: \u003ccode>IS NOT DISTINCT FROM\u003c/code>). \u003ccode>a = NULL\u003c/code> is never TRUE.\u003c/p>\n"},{"q":"\u003ccode>order_date BETWEEN &#39;2024-03-01&#39; AND &#39;2024-03-31&#39;\u003c/code> on a \u003ccode>DATE\u003c/code> column includes…","options":["March 1 to 30","March 1 to 31","March 2 to 30","nothing: BETWEEN needs numbers"],"answer":1,"explain":"\u003cp>BETWEEN is inclusive at both ends. It only becomes dangerous with DATETIME values, where the upper bound means midnight at the start of March 31.\u003c/p>\n"}]}],"problems":[584,1527]},{"id":"expressions","num":3,"title":"Expressions and functions","summary":"Computing new values per row — conditional logic, text surgery, rounding, and date math, the MySQL way.","clauses":["SELECT","WHERE"],"kicker":"CASE · strings · numbers · dates · REGEXP","minutes":18,"html":"\u003ch2>CASE: if/else inside a query\u003c/h2>\n\u003cp>\u003ccode>CASE\u003c/code> evaluates conditions top to bottom and returns the first match. Without an \u003ccode>ELSE\u003c/code>, the default is NULL.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex1\">\u003c/div>\n\u003cp>The \u003cem>simple\u003c/em> form compares a single expression against values: \u003ccode>CASE status WHEN &#39;pending&#39; THEN … WHEN &#39;shipped&#39; THEN … END\u003c/code>. A neat use is a custom sort order:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex2\">\u003c/div>\n\u003cp>MySQL also has \u003ccode>IF(condition, then, else)\u003c/code> for the two-branch case, and conditions are just numbers: \u003ccode>salary &gt; 100000\u003c/code> evaluates to 1 or 0. That makes \u003ccode>SUM(condition)\u003c/code> a row counter and \u003ccode>AVG(condition)\u003c/code> a ratio, a trick that shows up in half the LeetCode aggregation problems.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex3\">\u003c/div>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases\u003c/div>\u003cp>\u003ccode>IF()\u003c/code> is MySQL-only. \u003ccode>CASE\u003c/code> is standard and works in every database, so prefer it in code that might move. SQL Server has \u003ccode>IIF()\u003c/code>, and PostgreSQL booleans are \u003ccode>true\u003c/code>/\u003ccode>false\u003c/code> rather than 1/0: write \u003ccode>SUM(CASE WHEN cond THEN 1 ELSE 0 END)\u003c/code> or \u003ccode>COUNT(*) FILTER (WHERE cond)\u003c/code> there.\u003c/p>\n\u003c/aside>\u003ch2>Numbers\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Example\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ROUND(x, d)\u003c/code>\u003c/td>\u003ctd>\u003ccode>ROUND(2.675, 2)\u003c/code>\u003c/td>\u003ctd>2.68 (half away from zero)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>TRUNCATE(x, d)\u003c/code>\u003c/td>\u003ctd>\u003ccode>TRUNCATE(2.679, 2)\u003c/code>\u003c/td>\u003ctd>2.67\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>CEIL(x)\u003c/code> / \u003ccode>FLOOR(x)\u003c/code>\u003c/td>\u003ctd>\u003ccode>CEIL(4.1)\u003c/code>, \u003ccode>FLOOR(-4.1)\u003c/code>\u003c/td>\u003ctd>5, −5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>x % y\u003c/code>, \u003ccode>MOD(x, y)\u003c/code>\u003c/td>\u003ctd>\u003ccode>17 % 5\u003c/code>\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>x DIV y\u003c/code>\u003c/td>\u003ctd>\u003ccode>17 DIV 5\u003c/code>\u003c/td>\u003ctd>3 (integer division)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ABS\u003c/code>, \u003ccode>POWER\u003c/code>, \u003ccode>SQRT\u003c/code>\u003c/td>\u003ctd>\u003ccode>POWER(2, 10)\u003c/code>\u003c/td>\u003ctd>1024\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex4\">\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Percentages on LeetCode\u003c/span>\u003c/div>\u003cp>Many problems ask for a percentage &quot;rounded to 2 decimal places&quot;. Compute with a decimal on the left, then round once, at the end: \u003ccode>ROUND(100 * hits / total, 2)\u003c/code>. In MySQL \u003ccode>hits / total\u003c/code> is already decimal. In PostgreSQL it would be integer division unless you cast, so writing \u003ccode>100.0 * hits / total\u003c/code> is the portable habit.\u003c/p>\n\u003c/aside>\u003ch2>Strings\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>CONCAT(a, b, …)\u003c/code> joins strings, and returns \u003cstrong>NULL if any argument is NULL\u003c/strong>. \u003ccode>CONCAT_WS(sep, a, b, …)\u003c/code> joins with a separator and \u003cem>skips\u003c/em> NULLs.\u003c/li>\n\u003cli>\u003ccode>UPPER\u003c/code>, \u003ccode>LOWER\u003c/code>, \u003ccode>TRIM\u003c/code>, \u003ccode>REPLACE(s, from, to)\u003c/code>, \u003ccode>REVERSE\u003c/code>, \u003ccode>LPAD(s, n, pad)\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>LEFT(s, n)\u003c/code>, \u003ccode>RIGHT(s, n)\u003c/code>, \u003ccode>SUBSTRING(s, start, len)\u003c/code>. Positions start at \u003cstrong>1\u003c/strong>, and a negative start counts from the end.\u003c/li>\n\u003cli>\u003ccode>CHAR_LENGTH(s)\u003c/code> counts characters. \u003ccode>LENGTH(s)\u003c/code> counts \u003cstrong>bytes\u003c/strong>, so \u003ccode>&#39;é&#39;\u003c/code> is 2.\u003c/li>\n\u003cli>\u003ccode>LOCATE(sub, s)\u003c/code> / \u003ccode>INSTR(s, sub)\u003c/code> give the position (0 if absent). \u003ccode>SUBSTRING_INDEX(s, delim, n)\u003c/code> takes everything before the n-th delimiter, or after it when n is negative, which makes it a handy splitter.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex5\">\u003c/div>\n\u003cp>Ahmed&#39;s email is NULL, so his \u003ccode>domain\u003c/code> is NULL. Now watch what NULL does to \u003ccode>CONCAT\u003c/code>:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex6\">\u003c/div>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases \u003cspan>· String concatenation elsewhere\u003c/span>\u003c/div>\u003cp>PostgreSQL, Oracle and SQLite use \u003ccode>a || b\u003c/code>. SQL Server uses \u003ccode>a + b\u003c/code>. In MySQL, \u003ccode>||\u003c/code> means \u003cstrong>OR\u003c/strong> unless the \u003ccode>PIPES_AS_CONCAT\u003c/code> mode is on, so \u003ccode>&#39;a&#39; || &#39;b&#39;\u003c/code> is 0. This page warns you if you try it.\u003c/p>\n\u003c/aside>\u003ch2>Regular expressions\u003c/h2>\n\u003cp>\u003ccode>col REGEXP pattern\u003c/code> (also \u003ccode>RLIKE\u003c/code>, or the function \u003ccode>REGEXP_LIKE(col, pattern, flags)\u003c/code>) tests a regular expression. MySQL 8 uses the ICU library, and two details matter:\u003c/p>\n\u003cul>\n\u003cli>It&#39;s \u003cstrong>case-insensitive\u003c/strong> by default with the usual collation. Pass \u003ccode>&#39;c&#39;\u003c/code> as the third argument of \u003ccode>REGEXP_LIKE\u003c/code> for a case-sensitive match.\u003c/li>\n\u003cli>Backslashes are string escapes first. To send \u003ccode>\\.\u003c/code> to the regex engine, write \u003ccode>&#39;\\\\.&#39;\u003c/code> in the SQL literal, or sidestep the problem with \u003ccode>[.]\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex7\">\u003c/div>\n\u003cp>\u003ccode>Leo.Martin@Acme.test\u003c/code> passes the default match but fails the case-sensitive one. \u003ccode>REGEXP_REPLACE(s, pattern, replacement)\u003c/code> and \u003ccode>REGEXP_SUBSTR(s, pattern)\u003c/code> round out the family.\u003c/p>\n\u003ch2>Dates and times\u003c/h2>\n\u003cp>Dates in MySQL look like \u003ccode>&#39;YYYY-MM-DD&#39;\u003c/code>, and datetimes like \u003ccode>&#39;YYYY-MM-DD HH:MM:SS&#39;\u003c/code>. Because that format sorts correctly as text, comparing a date column with a string literal just works.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>MySQL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Today / now\u003c/td>\u003ctd>\u003ccode>CURDATE()\u003c/code>, \u003ccode>NOW()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parts\u003c/td>\u003ctd>\u003ccode>YEAR(d)\u003c/code>, \u003ccode>MONTH(d)\u003c/code>, \u003ccode>DAY(d)\u003c/code>, \u003ccode>DAYNAME(d)\u003c/code>, \u003ccode>DAYOFWEEK(d)\u003c/code> (1 = Sunday)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Format\u003c/td>\u003ctd>\u003ccode>DATE_FORMAT(d, &#39;%Y-%m&#39;)\u003c/code>, \u003ccode>&#39;%Y-%m-%d&#39;\u003c/code>, \u003ccode>&#39;%b %e&#39;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add / subtract\u003c/td>\u003ctd>\u003ccode>DATE_ADD(d, INTERVAL 7 DAY)\u003c/code>, \u003ccode>d - INTERVAL 1 MONTH\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Difference in days\u003c/td>\u003ctd>\u003ccode>DATEDIFF(later, earlier)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Difference in other units\u003c/td>\u003ctd>\u003ccode>TIMESTAMPDIFF(MONTH, start, end)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Month start / end\u003c/td>\u003ctd>\u003ccode>DATE_FORMAT(d, &#39;%Y-%m-01&#39;)\u003c/code>, \u003ccode>LAST_DAY(d)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Strip the time\u003c/td>\u003ctd>\u003ccode>DATE(ts)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex8\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"expressions-ex9\">\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Month arithmetic clamps\u003c/span>\u003c/div>\u003cp>\u003ccode>DATE_ADD(&#39;2024-01-31&#39;, INTERVAL 1 MONTH)\u003c/code> is \u003ccode>2024-02-29\u003c/code>: MySQL clamps to the last day of the shorter month. Adding one month and then subtracting one month doesn&#39;t always get you back to where you started.\u003c/p>\n\u003c/aside>\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· \u003ccode>date + 1\u003c/code> is not tomorrow\u003c/span>\u003c/div>\u003cp>Without \u003cc
