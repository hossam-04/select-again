 0\nORDER BY budget DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["root_id","team_size","budget"],"rows":[[1,15,1855000],[2,5,760000],[8,3,382000],[3,2,370000],[14,2,276000],[4,1,210000],[12,1,187000]],"total":7,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"ctes-q1","questions":[{"q":"In a recursive CTE, how many times does the anchor member run?","options":["Once","Once per recursion round","Until it returns no rows","Once per output row"],"answer":0,"explain":"\u003cp>The anchor seeds the recursion. The recursive member then runs round after round on the previous round&#39;s rows.\u003c/p>\n"},{"q":"When does recursion stop?","options":["After exactly 1000 rounds","When a round produces no new rows (or the depth limit is hit)","When the anchor returns NULL","When UNION ALL finds a duplicate"],"answer":1,"explain":"\u003cp>A WHERE in the recursive member eventually filters everything out. MySQL&#39;s \u003ccode>cte_max_recursion_depth\u003c/code> (default 1000) is a safety net that raises an error.\u003c/p>\n"},{"q":"Your recursive \u003ccode>path\u003c/code> column errors with &quot;Data too long&quot; in MySQL. The fix?","options":["Use UNION instead of UNION ALL","Cast the anchor&#39;s value to a wide type, e.g. \u003ccode>CAST(name AS CHAR(500))\u003c/code>","Add ORDER BY inside the CTE","Use a derived table"],"answer":1,"explain":"\u003cp>Column types are fixed by the anchor member, so widen them there.\u003c/p>\n"},{"q":"Which feature needs at least MySQL 8.0?","options":["Derived tables","Correlated subqueries","WITH (CTEs)","UNION ALL"],"answer":2,"explain":"\u003cp>CTEs and window functions both arrived in 8.0. LeetCode runs MySQL 8.\u003c/p>\n"}]}],"problems":[262,3482]},{"id":"windows","num":9,"title":"Window functions","summary":"Calculations across related rows without collapsing them — ranking, previous/next values, running totals and moving averages. The single biggest upgrade to your SQL since you last used it.","clauses":["SELECT","ORDER BY"],"kicker":"OVER · PARTITION BY · ROW_NUMBER · RANK · LAG · running totals","minutes":13,"html":"\u003ch2>Aggregate without collapsing\u003c/h2>\n\u003cp>\u003ccode>GROUP BY\u003c/code> squeezes each group into one row. A \u003cstrong>window function\u003c/strong> computes over a group of related rows but keeps every row, attaching the result to each one:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"windows-ex1\">\u003c/div>\n\u003cp>The anatomy: \u003ccode>function(...) OVER (PARTITION BY … ORDER BY … frame)\u003c/code>.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>PARTITION BY\u003c/code> splits rows into independent groups, like GROUP BY but without collapsing. Leave it out and the whole result is one partition.\u003c/li>\n\u003cli>\u003ccode>ORDER BY\u003c/code> inside OVER orders rows \u003cem>within\u003c/em> each partition. Ranking and LAG/LEAD need it, and it also turns aggregates into running totals.\u003c/li>\n\u003cli>The \u003cstrong>frame\u003c/strong> (\u003ccode>ROWS BETWEEN …\u003c/code>) narrows which rows count, for moving windows.\u003c/li>\n\u003c/ul>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· Windows run late\u003c/span>\u003c/div>\u003cp>Window functions are evaluated after \u003ccode>WHERE\u003c/code>, \u003ccode>GROUP BY\u003c/code> and \u003ccode>HAVING\u003c/code>, just before \u003ccode>ORDER BY\u003c/code>/\u003ccode>LIMIT\u003c/code>. So you \u003cstrong>can&#39;t filter on them in WHERE\u003c/strong>. Compute them in a subquery or CTE and filter outside. That wrapping step is the heart of most window-function patterns.\u003c/p>\n\u003c/aside>\u003ch2>Ranking: ROW_NUMBER, RANK, DENSE_RANK\u003c/h2>\n\u003cp>The three differ only on ties:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"windows-ex2\">\u003c/div>\n\u003cul>\n\u003cli>\u003ccode>ROW_NUMBER\u003c/code> gives 1, 2, 3, 4 and breaks ties arbitrarily, so add a tie-breaker to its ORDER BY when it matters.\u003c/li>\n\u003cli>\u003ccode>RANK\u003c/code> gives 1, 2, 2, 4: ties share a rank, then the numbering skips.\u003c/li>\n\u003cli>\u003ccode>DENSE_RANK\u003c/code> gives 1, 2, 2, 3: ties share a rank and the numbering doesn&#39;t skip.\u003c/li>\n\u003c/ul>\n\u003cp>&quot;Nth highest distinct value&quot; is \u003ccode>DENSE_RANK\u003c/code>. &quot;The first row per group&quot; is \u003ccode>ROW_NUMBER\u003c/code>. &quot;Everyone tied for first&quot; is \u003ccode>RANK\u003c/code> or \u003ccode>DENSE_RANK\u003c/code> = 1.\u003c/p>\n\u003ch3>Top N per group\u003c/h3>\n\u003cp>Rank inside each partition, then filter in an outer query:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"windows-ex3\">\u003c/div>\n\u003cp>Sales shows three people: Youssef, then Emma and Hana tied for second. That&#39;s the behavior #185 asks for.\u003c/p>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· rank is a reserved word\u003c/span>\u003c/div>\u003cp>Since MySQL 8.0.2, \u003ccode>RANK\u003c/code>, \u003ccode>DENSE_RANK\u003c/code>, \u003ccode>ROW_NUMBER\u003c/code>, \u003ccode>LAG\u003c/code>, \u003ccode>LEAD\u003c/code> and the other window function names are reserved words. \u003ccode>… AS rank\u003c/code> is a syntax error. Write \u003ccode>AS `rank`\u003c/code> or choose another name such as \u003ccode>rnk\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>LAG and LEAD: the neighbouring row\u003c/h2>\n\u003cp>\u003ccode>LAG(col, n, default)\u003c/code> reads the value \u003ccode>n\u003c/code> rows earlier within the partition (default n is 1), and \u003ccode>LEAD\u003c/code> reads later rows. They&#39;re how you compare each row with the previous one without a self-join:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"windows-ex4\">\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Previous row is not previous day\u003c/span>\u003c/div>\u003cp>\u003ccode>LAG\u003c/code> returns the previous \u003cem>row\u003c/em>. If days can be missing, &quot;yesterday&#39;s temperature&quot; needs a check that the previous row really is yesterday (#197) or a date-based self-join.\u003c/p>\n\u003c/aside>\u003ch2>Running totals and moving windows\u003c/h2>\n\u003cp>Add \u003ccode>ORDER BY\u003c/code> to an aggregate&#39;s OVER and it becomes cumulative:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"windows-ex5\">\u003c/div>\n\u003cp>The frame clause \u003ccode>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW\u003c/code> means &quot;this row and the two before it&quot;. Other boundaries are \u003ccode>UNBOUNDED PRECEDING\u003c/code>, \u003ccode>n FOLLOWING\u003c/code> and \u003ccode>UNBOUNDED FOLLOWING\u003c/code>.\u003c/p>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· The default frame and ties\u003c/span>\u003c/div>\u003cp>With \u003ccode>ORDER BY\u003c/code> but no frame, the default is \u003ccode>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\u003c/code>. \u003ccode>RANGE\u003c/code> includes every row \u003cstrong>tied\u003c/strong> with the current one, so tied rows all get the same running total. When you want a strict row-by-row running total, say \u003ccode>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\u003c/code>.\u003c/p>\n\u003c/aside>\u003cdiv class=\"example\" data-ex=\"windows-ex6\">\u003c/div>\n\u003cp>Ahmed and Julia both earn 78,000. With the default frame they both show 156,000, but the ROWS frame counts them one at a time.\u003c/p>\n\u003ch2>FIRST_VALUE, LAST_VALUE, NTH_VALUE\u003c/h2>\n\u003cp>These return a value from the first, last or n-th row of the frame. \u003ccode>LAST_VALUE\u003c/code> has a famous trap: with the default frame, the &quot;last&quot; row is the current row. Widen the frame to the whole partition:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"windows-ex7\">\u003c/div>\n\u003cp>The \u003ccode>WINDOW w AS (…)\u003c/code> clause names a window definition so several functions can share it.\u003c/p>\n\u003ch2>Aggregates as annotations\u003c/h2>\n\u003cp>Plain aggregates over a partition annotate each row with group facts, such as a count or a share of the total:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"windows-ex8\">\u003c/div>\n\u003cp>\u003ccode>NTILE(n)\u003c/code> splits ordered rows into n buckets (quartiles, deciles), and \u003ccode>PERCENT_RANK()\u003c/code> / \u003ccode>CUME_DIST()\u003c/code> give relative positions from 0 to 1.\u003c/p>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases\u003c/div>\u003cp>Window functions arrived in \u003cstrong>MySQL 8.0\u003c/strong> and SQLite 3.25, and have been in PostgreSQL and SQL Server for much longer. PostgreSQL adds \u003ccode>FILTER (WHERE …)\u003c/code> on aggregates and \u003ccode>QUALIFY\u003c/code>-style filtering needs a subquery everywhere except Snowflake, BigQuery and DuckDB. MySQL supports \u003ccode>RANGE\u003c/code> frames with date intervals: \u003ccode>RANGE BETWEEN INTERVAL 6 DAY PRECEDING AND CURRENT ROW\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"windows-q1\">\u003c/div>","examples":[{"id":"windows-ex1","sql":"SELECT first_name, dept_id, salary,\n       ROUND(AVG(salary) OVER (PARTITION BY dept_id)) AS dept_avg,\n       salary - ROUND(AVG(salary) OVER (PARTITION BY dept_id)) AS vs_avg\nFROM employees\nWHERE dept_id IS NOT NULL\nORDER BY dept_id, salary DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","dept_id","salary","dept_avg","vs_avg"],"rows":[["Omar",1,180000,126667,53333],["Lina",1,150000,126667,23333],["Karim",1,125000,126667,-1667],["Sara",1,110000,126667,-16667],["Ben",1,110000,126667,-16667],["Aya",1,85000,126667,-41667],["Youssef",2,140000,95500,44500],["Emma",2,90000,95500,-5500],["Hana",2,90000,95500,-5500],["Tom",2,62000,95500,-33500],["Mariam",3,115000,93500,21500],["Leo",3,72000,93500,-21500],["Priya",4,120000,92000,28000],["Ahmed",4,78000,92000,-14000],["Julia",4,78000,92000,-14000]],"total":15,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"windows-ex2","sql":"SELECT first_name, salary,\n       ROW_NUMBER() OVER (ORDER BY salary DESC) AS row_num,\n       RANK()       OVER (ORDER BY salary DESC) AS rnk,\n       DENSE_RANK() OVER (ORDER BY salary DESC) AS dense_rnk\nFROM employees\nWHERE salary \u003c 115000\nORDER BY salary DESC, first_name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","salary","row_num","rnk","dense_rnk"],"rows":[["Ben",110000,2,1,1],["Sara",110000,1,1,1],["Emma",90000,3,3,2],["Hana",90000,4,3,2],["Aya",85000,5,5,3],["Ahmed",78000,6,6,4],["Julia",78000,7,6,4],["Leo",72000,8,8,5],["Tom",62000,9,9,6]],"total":9,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"windows-ex3","sql":"SELECT dept_id, first_name, salary\nFROM (\n  SELECT dept_id, first_name, salary,\n         DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rnk\n  FROM employees\n  WHERE dept_id IS NOT NULL\n) ranked\nWHERE rnk \u003c= 2\nORDER BY dept_id, rnk, first_name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["dept_id","first_name","salary"],"rows":[[1,"Omar",180000],[1,"Lina",150000],[2,"Youssef",140000],[2,"Emma",90000],[2,"Hana",90000],[3,"Mariam",115000],[3,"Leo",72000],[4,"Priya",120000],[4,"Ahmed",78000],[4,"Julia",78000]],"total":10,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"windows-ex4","sql":"SELECT customer_id, order_id, order_date,\n       LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date) AS previous_order,\n       DATEDIFF(order_date,\n                LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date)) AS days_since\nFROM orders\nWHERE customer_id IN (1, 9)\nORDER BY customer_id, order_date;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["customer_id","order_id","order_date","previous_order","days_since"],"rows":[[1,1,"2024-01-10",null,null],[1,3,"2024-02-03","2024-01-10",24],[1,15,"2024-09-14","2024-02-03",224],[1,21,"2025-01-25","2024-09-14",133],[9,13,"2024-07-19",null,null],[9,18,"2024-11-29","2024-07-19",133],[9,23,"2025-02-21","2024-11-29",84]],"total":7,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"windows-ex5","sql":"WITH monthly AS (\n  SELECT DATE_FORMAT(o.order_date, '%Y-%m') AS month,\n         SUM(oi.quantity * oi.unit_price)    AS revenue\n  FROM orders o\n  JOIN order_items oi ON oi.order_id = o.order_id\n  WHERE o.status \u003c> 'cancelled'\n  GROUP BY month\n)\nSELECT month, revenue,\n       SUM(revenue) OVER (ORDER BY month)                                  AS running_total,\n       ROUND(AVG(revenue) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)) AS moving_avg_3m\nFROM monthly\nORDER BY month;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["month","revenue","running_total","moving_avg_3m"],"rows":[["2024-01",2997,2997,2997],["2024-02",1326,4323,2162],["2024-03",1186,5509,1836],["2024-04",2477,7986,1663],["2024-05",291,8277,1318],["2024-06",1428,9705,1399],["2024-07",1898,11603,1206],["2024-08",348,11951,1225],["2024-09",429,12380,892],["2024-10",1858,14238,878],["2024-11",1225,15463,1171],["2024-12",1099,16562,1394],["2025-01",1333,17895,1219],["2025-02",2477,20372,1636],["2025-03",147,20519,1319]],"total":15,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"windows-ex6","sql":"SELECT first_name, salary,\n       SUM(salary) OVER (ORDER BY salary)                                         AS range_default,\n       SUM(salary) OVER (ORDER BY salary ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS rows_frame\nFROM employees\nWHERE dept_id = 4\nORDER BY salary, first_name;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","salary","range_default","rows_frame"],"rows":[["Ahmed",78000,156000,78000],["Julia",78000,156000,156000],["Priya",120000,276000,276000]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"windows-ex7","sql":"SELECT first_name, dept_id, salary,\n       FIRST_VALUE(first_name) OVER w AS top_earner,\n       LAST_VALUE(first_name)  OVER w AS lowest_earner\nFROM employees\nWHERE dept_id IN (2, 3)\nWINDOW w AS (PARTITION BY dept_id ORDER BY salary DESC\n             ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)\nORDER BY dept_id, salary DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","dept_id","salary","top_earner","lowest_earner"],"rows":[["Youssef",2,140000,"Youssef","Tom"],["Emma",2,90000,"Youssef","Tom"],["Hana",2,90000,"Youssef","Tom"],["Tom",2,62000,"Youssef","Tom"],["Mariam",3,115000,"Mariam","Leo"],["Leo",3,72000,"Mariam","Leo"]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"windows-ex8","sql":"SELECT name, category, price,\n       COUNT(*)   OVER (PARTITION BY category)                     AS in_category,\n       ROUND(100 * price / SUM(price) OVER (PARTITION BY category), 1) AS pct_of_category\nFROM products\nORDER BY category, price DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","category","price","in_category","pct_of_category"],"rows":[["4K Monitor","Accessories",449,4,65.5],["Mechanical Keyboard","Accessories",129,4,18.8],["USB-C Hub","Accessories",59,4,8.6],["Wireless Mouse","Accessories",49,4,7.1],["Noise-Cancelling Headphones","Audio",299,2,77.1],["Bluetooth Speaker","Audio",89,2,22.9],["Laptop Pro 14","Computers",1899,2,61.3],["Laptop Air 13","Computers",1199,2,38.7],["Phone X","Phones",999,2,97.6],["Phone Case","Phones",25,2,2.4],["Smart Watch","Wearables",349,1,100]],"total":11,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"windows-q1","questions":[{"q":"Salaries 500, 400, 400, 300 ordered DESC. What does \u003ccode>DENSE_RANK()\u003c/code> give the 300?","options":["4","3","2","NULL"],"answer":1,"explain":"\u003cp>DENSE_RANK doesn&#39;t skip after ties: 1, 2, 2, 3. RANK would give 4.\u003c/p>\n"},{"q":"Why doesn&#39;t \u003ccode>WHERE ROW_NUMBER() OVER (…) = 1\u003c/code> work?","options":["ROW_NUMBER needs PARTITION BY","Window functions are evaluated after WHERE, so WHERE can&#39;t see them","It works in MySQL 8","ROW_NUMBER returns a string"],"answer":1,"explain":"\u003cp>Compute the row number in a subquery or CTE, then filter it in the outer query.\u003c/p>\n"},{"q":"\u003ccode>SUM(x) OVER (ORDER BY d)\u003c/code> with two rows sharing the same \u003ccode>d\u003c/code> gives those rows…","options":["the same running total, which includes both of them","different running totals, row by row","NULL","an error"],"answer":0,"explain":"\u003cp>The default frame is RANGE, which treats tied rows as peers. Use \u003ccode>ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\u003c/code> for strict row-by-row totals.\u003c/p>\n"},{"q":"\u003ccode>LAST_VALUE(name) OVER (PARTITION BY g ORDER BY x)\u003c/code> returns the current row&#39;s name. Why?","options":["LAST_VALUE is broken in MySQL","The default frame ends at the current row, so the current row \u003cem>is\u003c/em> the last one in the frame","It needs DESC ordering","PARTITION BY is ignored"],"answer":1,"explain":"\u003cp>Widen the frame: \u003ccode>ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\u003c/code>, or use \u003ccode>FIRST_VALUE\u003c/code> with the opposite ordering.\u003c/p>\n"},{"q":"Which is a valid MySQL 8 alias for a ranking column?","options":["\u003ccode>AS rank\u003c/code>","\u003ccode>AS `rank`\u003c/code>","\u003ccode>AS RANK()\u003c/code>","\u003ccode>AS &#39;rank()&#39;\u003c/code>"],"answer":1,"explain":"\u003cp>RANK is a reserved word in MySQL 8, so quote it with backticks, or name the column something else.\u003c/p>\n"}]}],"problems":[178,180,1204,1321,177]},{"id":"patterns","num":10,"title":"Interview patterns","summary":"The dozen shapes that most SQL interview questions reduce to, each as a template you can adapt.","clauses":["SELECT","GROUP BY","WHERE"],"kicker":"top-N · gaps & islands · pivots · division · dedupe · median","minutes":14,"html":"\u003cp>Most SQL interview questions reuse a small set of shapes. Recognizing the shape is half the work. Each section below gives the template, a runnable example on the sample database, and the LeetCode problems that use it.\u003c/p>\n\u003ch2>1. Top N per group\u003c/h2>\n\u003cp>\u003cem>&quot;The three highest-paid people in each department&quot;\u003c/em>, \u003cem>&quot;the latest order per customer&quot;\u003c/em>.\u003c/p>\n\u003cp>Rank inside each partition, then filter outside:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"patterns-ex1\">\u003c/div>\n\u003cp>Choose the ranking function by how ties should behave: \u003ccode>ROW_NUMBER\u003c/code> gives exactly N rows, \u003ccode>RANK\u003c/code> includes ties but skips numbers, and \u003ccode>DENSE_RANK\u003c/code> gives the top N \u003cem>distinct values\u003c/em> (#185). Practice: \u003ca class=\"pref\" href=\"#p185\">\u003cspan class=\"pnum\">#185\u003c/span> Department Top Three Salaries\u003c/a>, \u003ca class=\"pref\" href=\"#p184\">\u003cspan class=\"pnum\">#184\u003c/span> Department Highest Salary\u003c/a>, \u003ca class=\"pref\" href=\"#p1070\">\u003cspan class=\"pnum\">#1070\u003c/span> Product Sales Analysis III\u003c/a>.\u003c/p>\n\u003ch2>2. N-th highest value\u003c/h2>\n\u003cp>&quot;Second highest salary&quot;, &quot;N-th highest&quot;. Three interchangeable templates, all returning NULL when there isn&#39;t one:\u003c/p>\n\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-k\">DISTINCT\u003c/span> salary \u003cspan class=\"t-k\">FROM\u003c/span> t \u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> salary \u003cspan class=\"t-k\">DESC\u003c/span> \u003cspan class=\"t-k\">LIMIT\u003c/span> \u003cspan class=\"t-n\">1\u003c/span> \u003cspan class=\"t-k\">OFFSET\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>          \u003cspan class=\"t-c\">-- scalar-subquery wrap\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-f\">MAX\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>salary\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> t \u003cspan class=\"t-k\">WHERE\u003c/span> salary \u003cspan class=\"t-o\">&lt;\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-f\">MAX\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>salary\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> t\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>                \u003cspan class=\"t-c\">-- max below the max\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-f\">MAX\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>salary\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> salary\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">DENSE_RANK\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">OVER\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> salary \u003cspan class=\"t-k\">DESC\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> r \u003cspan class=\"t-k\">FROM\u003c/span> t\u003cspan class=\"t-o\">)\u003c/span> x \u003cspan class=\"t-k\">WHERE\u003c/span> r \u003cspan class=\"t-o\">=\u003c/span> \u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Practice: \u003ca class=\"pref\" href=\"#p176\">\u003cspan class=\"pnum\">#176\u003c/span> Second Highest Salary\u003c/a>, \u003ca class=\"pref\" href=\"#p177\">\u003cspan class=\"pnum\">#177\u003c/span> Nth Highest Salary\u003c/a>.\u003c/p>\n\u003ch2>3. First event per entity\u003c/h2>\n\u003cp>&quot;First login&quot;, &quot;first order&quot;, &quot;the product&#39;s first year&quot;. Find the minimum per entity, then join or filter back to get the rest of that row:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"patterns-ex2\">\u003c/div>\n\u003cp>The follow-up is usually \u003cstrong>retention\u003c/strong>: did they come back the next day, or within 30 days? Join the first event to later events with a date condition. Practice: \u003ca class=\"pref\" href=\"#p511\">\u003cspan class=\"pnum\">#511\u003c/span> Game Play Analysis I\u003c/a>, \u003ca class=\"pref\" href=\"#p550\">\u003cspan class=\"pnum\">#550\u003c/span> Game Play Analysis IV\u003c/a>, \u003ca class=\"pref\" href=\"#p1174\">\u003cspan class=\"pnum\">#1174\u003c/span> Immediate Food Delivery II\u003c/a>.\u003c/p>\n\u003ch2>4. Gaps and islands (consecutive runs)\u003c/h2>\n\u003cp>&quot;Three consecutive days&quot;, &quot;longest streak&quot;, &quot;runs of 3+ rows&quot;. The trick: within a run of consecutive values, \u003ccode>value − row_number\u003c/code> is constant. Each run (an \u003cem>island\u003c/em>) gets its own group key:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"patterns-ex3\">\u003c/div>\n\u003cp>Consecutive dates minus 1, 2, 3, … days all land on the same date, and a gap shifts the key. Deduplicate first: customer 5 logged in twice on March 5, which would otherwise break the run. With integer ids, use \u003ccode>id - ROW_NUMBER() OVER (ORDER BY id)\u003c/code>. For short fixed runs, \u003ccode>LAG\u003c/code>/\u003ccode>LEAD\u003c/code> or a triple self-join also work. Practice: \u003ca class=\"pref\" href=\"#p180\">\u003cspan class=\"pnum\">#180\u003c/span> Consecutive Numbers\u003c/a>, \u003ca class=\"pref\" href=\"#p601\">\u003cspan class=\"pnum\">#601\u003c/span> Human Traffic of Stadium\u003c/a>.\u003c/p>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Keep ROW_NUMBER() on the right of the minus\u003c/span>\u003c/div>\u003cp>MySQL types \u003ccode>ROW_NUMBER()\u003c/code>, \u003ccode>RANK()\u003c/code> and \u003ccode>DENSE_RANK()\u003c/code> as BIGINT UNSIGNED. If a subtraction involving one of them goes below zero, the whole query stops with error 1690 (\u003cem>BIGINT UNSIGNED value is out of range\u003c/em>). \u003ccode>id - ROW_NUMBER() …\u003c/code> is safe for positive ids, because the n-th smallest id is at least n. \u003ccode>ROW_NUMBER() … - id\u003c/code> fails, and so does \u003ccode>a.rn - b.rn\u003c/code> on columns that came from ROW_NUMBER. When the result can be negative, use \u003ccode>CAST(ROW_NUMBER() OVER (…) AS SIGNED)\u003c/code>.\u003c/p>\n\u003c/aside>\u003cp>Here the row number restarts at 1 for each customer, so for customer 2 the subtraction is 1 − 2:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"patterns-ex4\">\u003c/div>\n\u003ch2>5. Running totals and thresholds\u003c/h2>\n\u003cp>&quot;Cumulative revenue&quot;, &quot;the last person who fits under 1000 kg&quot;, &quot;7-day moving average&quot;. Use \u003ccode>SUM(...) OVER (ORDER BY ...)\u003c/code> with an explicit frame when it matters, then filter the running value in an outer query. Aggregate to one row per day before applying row-based frames. Practice: \u003ca class=\"pref\" href=\"#p1204\">\u003cspan class=\"pnum\">#1204\u003c/span> Last Person to Fit in the Bus\u003c/a>, \u003ca class=\"pref\" href=\"#p1321\">\u003cspan class=\"pnum\">#1321\u003c/span> Restaurant Growth\u003c/a>.\u003c/p>\n\u003ch2>6. Pivot: rows to columns\u003c/h2>\n\u003cp>&quot;One column per month / status / store&quot;. Conditional aggregation: one \u003ccode>SUM(CASE …)\u003c/code> or \u003ccode>MAX(CASE …)\u003c/code> per output column.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"patterns-ex5\">\u003c/div>\n\u003cp>SQL has to know the output columns up front. For a truly dynamic set of columns you&#39;d generate the query text in application code (MySQL has no \u003ccode>PIVOT\u003c/code> keyword). The reverse, \u003cstrong>unpivot\u003c/strong>, is a \u003ccode>UNION ALL\u003c/code> per column (Module 7). Practice: \u003ca class=\"pref\" href=\"#p1179\">\u003cspan class=\"pnum\">#1179\u003c/span> Reformat Department Table\u003c/a>, \u003ca class=\"pref\" href=\"#p1193\">\u003cspan class=\"pnum\">#1193\u003c/span> Monthly Transactions I\u003c/a>, \u003ca class=\"pref\" href=\"#p1795\">\u003cspan class=\"pnum\">#1795\u003c/span> Rearrange Products Table\u003c/a>.\u003c/p>\n\u003ch2>7. Relational division: &quot;all of them&quot;\u003c/h2>\n\u003cp>&quot;Customers who bought every product&quot;, &quot;students who took all required courses&quot;. Count the distinct matches and compare with the total:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"patterns-ex6\">\u003c/div>\n\u003cp>\u003ccode>DISTINCT\u003c/code> matters: buying the same product twice must not count as buying two products. The textbook alternative is a double \u003ccode>NOT EXISTS\u003c/code>: &quot;there is no product this customer did not buy&quot;. Practice: \u003ca class=\"pref\" href=\"#p1045\">\u003cspan class=\"pnum\">#1045\u003c/span> Customers Who Bought All Products\u003c/a>.\u003c/p>\n\u003ch2>8. Deduplication\u003c/h2>\n\u003cp>&quot;Keep one row per email&quot;, &quot;the latest record per key&quot;. To \u003cem>select\u003c/em> the survivors, use \u003ccode>ROW_NUMBER() … = 1\u003c/code> or \u003ccode>MIN(id)\u003c/code> per key. To \u003cem>delete\u003c/em> the rest in MySQL, use a self-join DELETE: \u003ccode>DELETE p1 FROM t p1 JOIN t p2 ON p1.key = p2.key AND p1.id &gt; p2.id\u003c/code> (Module 11). Practice: \u003ca class=\"pref\" href=\"#p196\">\u003cspan class=\"pnum\">#196\u003c/span> Delete Duplicate Emails\u003c/a>, \u003ca class=\"pref\" href=\"#p182\">\u003cspan class=\"pnum\">#182\u003c/span> Duplicate Emails\u003c/a>.\u003c/p>\n\u003ch2>9. Median\u003c/h2>\n\u003cp>MySQL has no \u003ccode>MEDIAN()\u003c/code>. Number the rows and average the middle one or two:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"patterns-ex7\">\u003c/div>\n\u003cp>For odd \u003ccode>n\u003c/code> both expressions point at the same middle row. For even \u003ccode>n\u003c/code> they&#39;re the two middle rows, and AVG takes their mean.\u003c/p>\n\u003ch2>10. Pairs and symmetric relationships\u003c/h2>\n\u003cp>&quot;Who has the most friends&quot;, &quot;mutual follows&quot;, &quot;pairs of users who share X&quot;. Two tricks cover almost everything:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Stack both columns\u003c/strong> with \u003ccode>UNION ALL\u003c/code> so each person appears once per relationship, whichever side they&#39;re on (#602).\u003c/li>\n\u003cli>\u003cstrong>Count each pair once\u003c/strong> by requiring \u003ccode>a.id &lt; b.id\u003c/code> in a self-join, which removes (x, y)/(y, x) duplicates and self-pairs.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"example\" data-ex=\"patterns-ex8\">\u003c/div>\n\u003ch2>11. Rates and percentages\u003c/h2>\n\u003cp>&quot;Cancellation rate&quot;, &quot;confirmation rate&quot;, &quot;percentage of users who…&quot;. \u003ccode>ROUND(100 * AVG(condition), 2)\u003c/code> over the right population. The hard part is the \u003cstrong>denominator\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>Which rows count? For example, only trips whose client \u003cem>and\u003c/em> driver are unbanned (#262).\u003c/li>\n\u003cli>Must entities with no activity appear as 0? Then LEFT JOIN, and use \u003ccode>IFNULL(AVG(…), 0)\u003c/code> (#1934).\u003c/li>\n\u003cli>Is it per entity or overall? Is it a ratio of averages or an average of ratios (#1211)?\u003c/li>\n\u003c/ul>\n\u003ch2>12. Fixed categories with zeros\u003c/h2>\n\u003cp>&quot;Report all three categories even when empty&quot;: GROUP BY can&#39;t invent rows, so build the category list yourself and LEFT JOIN (Module 7, #1907).\u003c/p>\n\u003caside class=\"callout interview\">\u003cdiv class=\"callout-label\">Interview angle \u003cspan>· How to use this list\u003c/span>\u003c/div>\u003cp>When you read a question, name the pattern out loud: &quot;this is top-N per group&quot;, &quot;this is gaps and islands&quot;. Then write the template&#39;s skeleton first and fill in the details. It shows structure, and it stops you from improvising a self-join maze.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"patterns-q1\">\u003c/div>","examples":[{"id":"patterns-ex1","sql":"WITH ranked AS (\n  SELECT c.name, o.order_id, o.order_date,\n         ROW_NUMBER() OVER (PARTITION BY o.customer_id ORDER BY o.order_date DESC) AS rn\n  FROM orders o\n  JOIN customers c ON c.customer_id = o.customer_id\n)\nSELECT name, order_id, order_date AS latest_order\nFROM ranked\nWHERE rn = 1\nORDER BY latest_order DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","order_id","latest_order"],"rows":[["Chloe Dubois",24,"2025-03-02"],["Jamal Idris",23,"2025-02-21"],["Ines Costa",22,"2025-02-07"],["Alice Green",21,"2025-01-25"],["Mona Adel",20,"2025-01-12"],["Farah Aziz",19,"2024-12-15"],["Diego Alvarez",17,"2024-11-11"],["Hiro Tanaka",16,"2024-10-01"],["Bilal Khan",14,"2024-08-08"],["George Miller",8,"2024-04-05"]],"total":10,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"patterns-ex2","sql":"SELECT c.name, o.order_id, o.order_date AS first_order, o.status\nFROM orders o\nJOIN customers c ON c.customer_id = o.customer_id\nWHERE (o.customer_id, o.order_date) IN (SELECT customer_id, MIN(order_date)\n                                        FROM orders GROUP BY customer_id)\nORDER BY first_order;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name","order_id","first_order","status"],"rows":[["Alice Green",1,"2024-01-10","delivered"],["Bilal Khan",2,"2024-01-22","delivered"],["Chloe Dubois",4,"2024-02-15","cancelled"],["Diego Alvarez",5,"2024-02-28","delivered"],["Farah Aziz",6,"2024-03-12","delivered"],["George Miller",8,"2024-04-05","delivered"],["Hiro Tanaka",9,"2024-05-02","delivered"],["Ines Costa",11,"2024-06-11","delivered"],["Jamal Idris",13,"2024-07-19","delivered"],["Mona Adel",20,"2025-01-12","delivered"]],"total":10,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"patterns-ex3","sql":"WITH days AS (                        -- one row per customer per day (logins can repeat)\n  SELECT DISTINCT customer_id, login_date FROM logins\n),\ngrouped AS (\n  SELECT customer_id, login_date,\n         DATE_SUB(login_date, INTERVAL ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY login_date) DAY) AS island\n  FROM days\n)\nSELECT customer_id, MIN(login_date) AS streak_start, MAX(login_date) AS streak_end, COUNT(*) AS days\nFROM grouped\nGROUP BY customer_id, island\nHAVING COUNT(*) >= 2\nORDER BY customer_id, streak_start;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["customer_id","streak_start","streak_end","days"],"rows":[[1,"2025-03-01","2025-03-03",3],[1,"2025-03-05","2025-03-06",2],[2,"2025-03-03","2025-03-06",4],[5,"2025-03-04","2025-03-07",4],[7,"2025-03-08","2025-03-09",2]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"patterns-ex4","sql":"SELECT customer_id, login_date,\n       ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY login_date) - customer_id AS oops\nFROM logins;","db":"sample","expectError":true,"expectWarning":false,"title":"","output":{"columns":[],"rows":[],"total":0,"explain":false,"error":{"message":"BIGINT UNSIGNED value is out of range in '(ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY login_date) - customer_id)'","hint":"MySQL error 1690: ROW_NUMBER(), RANK(), DENSE_RANK() and NTILE() return BIGINT UNSIGNED, so arithmetic with them can't go below zero. Subtract the other way round (id - ROW_NUMBER() …), or wrap the call: CAST(ROW_NUMBER() OVER (…) AS SIGNED).","raw":"BIGINT UNSIGNED value is out of range in '(ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY login_date) - customer_id)'"},"warnings":[],"notes":[],"summary":[]}},{"id":"patterns-ex5","sql":"SELECT DATE_FORMAT(order_date, '%Y-%m') AS month,\n       SUM(status = 'delivered') AS delivered,\n       SUM(status = 'shipped')   AS shipped,\n       SUM(status = 'pending')   AS pending,\n       SUM(status = 'cancelled') AS cancelled\nFROM orders\nWHERE order_date >= '2024-10-01'\nGROUP BY month\nORDER BY month;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["month","delivered","shipped","pending","cancelled"],"rows":[["2024-10",1,0,0,0],["2024-11",2,0,0,0],["2024-12",1,0,0,0],["2025-01",1,1,0,0],["2025-02",0,1,1,0],["2025-03",0,0,1,0]],"total":6,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"patterns-ex6","sql":"-- customers who bought every Audio product\nSELECT c.name\nFROM customers c\nJOIN orders o       ON o.customer_id = c.customer_id\nJOIN order_items oi ON oi.order_id = o.order_id\nJOIN products p     ON p.product_id = oi.product_id\nWHERE p.category = 'Audio'\nGROUP BY c.customer_id, c.name\nHAVING COUNT(DISTINCT p.product_id) = (SELECT COUNT(*) FROM products WHERE category = 'Audio');","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["name"],"rows":[["Bilal Khan"]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"patterns-ex7","sql":"WITH ranked AS (\n  SELECT dept_id, salary,\n         ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary) AS rn,\n         COUNT(*)     OVER (PARTITION BY dept_id)                 AS n\n  FROM employees\n  WHERE dept_id IS NOT NULL\n)\nSELECT dept_id, AVG(salary) AS median_salary\nFROM ranked\nWHERE rn IN (FLOOR((n + 1) / 2), CEIL((n + 1) / 2))\nGROUP BY dept_id\nORDER BY dept_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["dept_id","median_salary"],"rows":[[1,117500],[2,90000],[3,93500],[4,78000]],"total":4,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"patterns-ex8","sql":"-- pairs of customers from the same city, each pair listed once\nSELECT a.city, a.name AS customer_a, b.name AS customer_b\nFROM customers a\nJOIN customers b ON b.city = a.city AND a.customer_id \u003c b.customer_id\nORDER BY a.city, customer_a;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["city","customer_a","customer_b"],"rows":[["Cairo","Bilal Khan","Farah Aziz"],["Cairo","Bilal Khan","Jamal Idris"],["Cairo","Farah Aziz","Jamal Idris"],["Madrid","Diego Alvarez","Luis Romero"]],"total":4,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"patterns-q1","questions":[{"q":"&quot;Find the longest run of consecutive login days per user.&quot; Which pattern?","options":["Top N per group","Gaps and islands","Relational division","Pivot"],"answer":1,"explain":"\u003cp>Group consecutive dates with \u003ccode>date − ROW_NUMBER()\u003c/code> (after de-duplicating days), then take the largest group per user.\u003c/p>\n"},{"q":"&quot;Customers who bought every product in the catalog&quot;: what goes in HAVING?","options":["\u003ccode>COUNT(*) = (SELECT COUNT(*) FROM products)\u003c/code>","\u003ccode>COUNT(DISTINCT product_id) = (SELECT COUNT(*) FROM products)\u003c/code>","\u003ccode>MAX(product_id) = (SELECT MAX(product_id) FROM products)\u003c/code>","\u003ccode>COUNT(product_id) &gt; 0\u003c/code>"],"answer":1,"explain":"\u003cp>Repeat purchases inflate \u003ccode>COUNT(*)\u003c/code>. Count distinct products.\u003c/p>\n"},{"q":"You need each department&#39;s top 3 \u003cem>distinct\u003c/em> salaries, ties included. Which function?","options":["ROW_NUMBER","RANK","DENSE_RANK","NTILE(3)"],"answer":2,"explain":"\u003cp>DENSE_RANK numbers distinct values 1, 2, 3 without gaps, so \u003ccode>&lt;= 3\u003c/code> keeps every employee earning one of the top three amounts.\u003c/p>\n"},{"q":"Why deduplicate login days before applying \u003ccode>date − ROW_NUMBER()\u003c/code>?","options":["ROW_NUMBER fails on duplicates","A repeated date takes an extra row number and shifts the group key, splitting one streak in two","DATE_SUB can&#39;t handle duplicates","It&#39;s only for performance"],"answer":1,"explain":"\u003cp>Two logins on the same day would get row numbers k and k+1 for the same date, so the island key changes mid-streak.\u003c/p>\n"}]}],"problems":[185,601,1045,1179]},{"id":"modifying","num":11,"title":"Changing data","summary":"Writing to tables safely — multi-row and INSERT…SELECT, UPDATE and DELETE with joins, MySQL upserts, transactions, and what isolation levels actually protect you from.","clauses":["WHERE"],"kicker":"INSERT · UPDATE · DELETE · upserts · transactions · isolation","minutes":20,"html":"\u003cp>Every example below runs on a fresh copy of the sample database, so experiment freely: nothing you change survives the next Run.\u003c/p>\n\u003ch2>INSERT\u003c/h2>\n\u003cp>Always name the columns. The statement then survives new columns being added, and it documents itself:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex1\">\u003c/div>\n\u003cp>\u003ccode>INSERT … SELECT\u003c/code> copies query results into a table, which is handy for archiving and backfills:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex2\">\u003c/div>\n\u003caside class=\"callout tip\">\u003cdiv class=\"callout-label\">Tip \u003cspan>· AUTO_INCREMENT\u003c/span>\u003c/div>\u003cp>With \u003ccode>id INT AUTO_INCREMENT PRIMARY KEY\u003c/code>, leave \u003ccode>id\u003c/code> out of the column list and MySQL assigns the next number. \u003ccode>LAST_INSERT_ID()\u003c/code> returns it for the current connection, which is safe even with other sessions inserting at the same time.\u003c/p>\n\u003c/aside>\u003ch2>UPDATE\u003c/h2>\n\u003cp>\u003ccode>SET\u003c/code> expressions see each row&#39;s \u003cstrong>old\u003c/strong> values, and \u003ccode>WHERE\u003c/code> picks the rows. Forgetting the WHERE updates every row in the table.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex3\">\u003c/div>\n\u003cp>\u003ccode>CASE\u003c/code> lets one statement apply different changes to different rows (#627):\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex4\">\u003c/div>\n\u003cp>MySQL can update using a \u003cstrong>join\u003c/strong>, reading from other tables to decide what to change:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex5\">\u003c/div>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases\u003c/div>\u003cp>PostgreSQL writes this as \u003ccode>UPDATE employees e SET salary = … FROM departments d WHERE d.dept_id = e.dept_id AND …\u003c/code>. SQL Server uses \u003ccode>UPDATE e SET … FROM employees e JOIN departments d ON …\u003c/code>. Same idea, three spellings.\u003c/p>\n\u003c/aside>\u003ch2>DELETE\u003c/h2>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex6\">\u003c/div>\n\u003cp>The output shows how many rows each statement touched, the way the MySQL client prints \u003cem>Query OK, n rows affected\u003c/em>.\u003c/p>\n\u003cp>MySQL also has a \u003cstrong>multi-table DELETE\u003c/strong>: \u003ccode>DELETE t1 FROM t1 JOIN t2 ON … WHERE …\u003c/code> deletes the rows of \u003ccode>t1\u003c/code> that find a partner. It&#39;s the standard way to remove duplicates (#196).\u003c/p>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Error 1093: reading the table you&#39;re changing\u003c/span>\u003c/div>\u003cp>MySQL refuses a DELETE or UPDATE whose subquery selects from the same table. Wrapping the subquery in a derived table materializes it first and makes it legal.\u003c/p>\n\u003c/aside>\u003cdiv class=\"example\" data-ex=\"modifying-ex7\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex8\">\u003c/div>\n\u003cp>\u003ccode>DELETE FROM t\u003c/code> removes rows one by one (logged, triggers fire, can be rolled back). \u003ccode>TRUNCATE TABLE t\u003c/code> empties the table far faster and resets AUTO_INCREMENT, but in MySQL it can&#39;t be rolled back. \u003ccode>DROP TABLE t\u003c/code> removes the table itself.\u003c/p>\n\u003ch2>Upserts\u003c/h2>\n\u003cp>&quot;Insert, or update if the key already exists&quot;. MySQL has three tools:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex9\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex10\">\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· REPLACE is delete + insert\u003c/span>\u003c/div>\u003cp>\u003ccode>REPLACE\u003c/code> deletes the conflicting row and inserts a new one. Columns you didn&#39;t supply revert to defaults, delete triggers fire, and \u003ccode>ON DELETE CASCADE\u003c/code> children disappear. Prefer \u003ccode>ON DUPLICATE KEY UPDATE\u003c/code>. \u003ccode>INSERT IGNORE\u003c/code> also silences other errors (bad data becomes warnings), so use it deliberately.\u003c/p>\n\u003c/aside>\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases\u003c/div>\u003cp>PostgreSQL and SQLite use \u003ccode>INSERT … ON CONFLICT (key) DO UPDATE SET views = EXCLUDED.views + …\u003c/code>. SQL Server and Oracle have \u003ccode>MERGE\u003c/code>. MySQL 8.0.19+ lets you name the new row (\u003ccode>INSERT … AS new ON DUPLICATE KEY UPDATE views = new.views\u003c/code>) instead of the deprecated \u003ccode>VALUES(col)\u003c/code>.\u003c/p>\n\u003c/aside>\u003ch2>Transactions\u003c/h2>\n\u003cp>A transaction groups statements so they succeed or fail \u003cstrong>together\u003c/strong>. InnoDB tables are transactional. With \u003ccode>autocommit\u003c/code> on (the default), every statement is its own transaction until you open one explicitly:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex11\">\u003c/div>\n\u003cp>Constraints are part of the safety net. The CHECK above stops an overdraft, so the whole statement fails:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"modifying-ex12\">\u003c/div>\n\u003cp>The four ACID guarantees: \u003cstrong>Atomicity\u003c/strong> (all or nothing), \u003cstrong>Consistency\u003c/strong> (constraints hold), \u003cstrong>Isolation\u003c/strong> (concurrent transactions don&#39;t see each other&#39;s half-done work, to a configurable degree), and \u003cstrong>Durability\u003c/strong> (committed means it survives a crash).\u003c/p>\n\u003ch2>Isolation levels\u003c/h2>\n\u003cp>When two sessions work at the same time, these anomalies can happen:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Dirty read\u003c/strong>: you read another transaction&#39;s uncommitted change, which it may later roll back.\u003c/li>\n\u003cli>\u003cstrong>Non-repeatable read\u003c/strong>: you read a row twice in one transaction and get different values, because someone committed in between.\u003c/li>\n\u003cli>\u003cstrong>Phantom read\u003c/strong>: you run the same range query twice and new rows appear.\u003c/li>\n\u003cli>\u003cstrong>Lost update\u003c/strong>: two sessions read a value, both compute a new one, and the second write silently overwrites the first.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Dirty read\u003c/th>\u003cth>Non-repeatable read\u003c/th>\u003cth>Phantom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>READ UNCOMMITTED\u003c/td>\u003ctd>possible\u003c/td>\u003ctd>possible\u003c/td>\u003ctd>possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>READ COMMITTED (PostgreSQL, SQL Server default)\u003c/td>\u003ctd>prevented\u003c/td>\u003ctd>possible\u003c/td>\u003ctd>possible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>REPEATABLE READ (\u003cstrong>MySQL InnoDB default\u003c/strong>)\u003c/td>\u003ctd>prevented\u003c/td>\u003ctd>prevented\u003c/td>\u003ctd>prevented for plain reads*\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SERIALIZABLE\u003c/td>\u003ctd>prevented\u003c/td>\u003ctd>prevented\u003c/td>\u003ctd>prevented\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>*InnoDB&#39;s REPEATABLE READ gives each transaction a consistent snapshot (MVCC). Plain \u003ccode>SELECT\u003c/code>s see the database as of the first read. \u003cem>Locking\u003c/em> reads (\u003ccode>SELECT … FOR UPDATE\u003c/code>) and writes see the latest committed rows and use gap locks to block phantoms.\u003c/p>\n\u003cp>A lost update, step by step (two sessions, both starting from stock = 10):\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Session A\u003c/th>\u003cth>Session B\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003ccode>SELECT stock\u003c/code> → 10\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003ccode>SELECT stock\u003c/code> → 10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003ccode>UPDATE … SET stock = 9\u003c/code> (10 − 1)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ccode>COMMIT\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003ccode>UPDATE … SET stock = 9\u003c/code> (10 − 1)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003ccode>COMMIT\u003c/code>: two sales, stock only dropped by 1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Three standard fixes:\u003c/p>\n\u003col>\n\u003cli>Let the database do the arithmetic atomically: \u003ccode>UPDATE products SET stock = stock - 1 WHERE id = ? AND stock &gt; 0\u003c/code>.\u003c/li>\n\u003cli>Lock the row while you decide: \u003ccode>SELECT stock … FOR UPDATE\u003c/code> inside the transaction, so the other session waits.\u003c/li>\n\u003cli>Optimistic concurrency: keep a \u003ccode>version\u003c/code> column and \u003ccode>UPDATE … SET …, version = version + 1 WHERE id = ? AND version = ?\u003c/code>. If 0 rows were updated, someone got there first, so retry.\u003c/li>\n\u003c/ol>\n\u003caside class=\"callout work\">\u003cdiv class=\"callout-label\">On the job \u003cspan>· Deadlocks are normal\u003c/span>\u003c/div>\u003cp>Two transactions that lock rows in opposite orders will deadlock. InnoDB detects it, kills one of them (error 1213) and lets the other continue. Keep transactions short, touch rows in a consistent order, and have application code retry deadlock victims.\u003c/p>\n\u003c/aside>\u003caside class=\"callout tip\">\u003cdiv class=\"callout-label\">Tip \u003cspan>· Safe-update habits\u003c/span>\u003c/div>\u003cp>Before running an UPDATE or DELETE, run the same WHERE as a \u003ccode>SELECT COUNT(*)\u003c/code> first. In a console, open a transaction so you can roll back. MySQL&#39;s \u003ccode>SET sql_safe_updates = 1\u003c/code> refuses UPDATE/DELETE without a key-based WHERE or a LIMIT.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"modifying-q1\">\u003c/div>","examples":[{"id":"modifying-ex1","sql":"INSERT INTO products (product_id, name, category, price)\nVALUES (12, 'E-reader', 'Accessories', 139.00),\n       (13, 'Stylus',   'Accessories',  29.00);\n\nSELECT * FROM products WHERE product_id >= 11 ORDER BY product_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["product_id","name","category","price"],"rows":[[11,"Smart Watch","Wearables",349],[12,"E-reader","Accessories",139],[13,"Stylus","Accessories",29]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["INSERT: 2 rows affected"]}},{"id":"modifying-ex2","sql":"CREATE TABLE order_archive (order_id INT PRIMARY KEY, customer_id INT, order_date DATE);\n\nINSERT INTO order_archive (order_id, customer_id, order_date)\nSELECT order_id, customer_id, order_date\nFROM orders\nWHERE order_date \u003c '2024-03-01';\n\nSELECT * FROM order_archive;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["order_id","customer_id","order_date"],"rows":[[1,1,"2024-01-10"],[2,2,"2024-01-22"],[3,1,"2024-02-03"],[4,3,"2024-02-15"],[5,4,"2024-02-28"]],"total":5,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["INSERT: 5 rows affected"]}},{"id":"modifying-ex3","sql":"UPDATE employees\nSET salary = ROUND(salary * 1.05)\nWHERE dept_id = 3;\n\nSELECT first_name, salary FROM employees WHERE dept_id = 3;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","salary"],"rows":[["Mariam",120750],["Leo",75600]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["UPDATE: 2 rows affected"]}},{"id":"modifying-ex4","sql":"UPDATE employees\nSET salary = CASE dept_id WHEN 1 THEN salary * 1.10\n                          WHEN 2 THEN salary * 1.05\n                          ELSE salary END\nWHERE dept_id IN (1, 2);\n\nSELECT first_name, dept_id, salary FROM employees WHERE dept_id IN (1, 2) ORDER BY dept_id, emp_id;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","dept_id","salary"],"rows":[["Omar",1,198000],["Lina",1,165000],["Karim",1,137500],["Sara",1,121000],["Ben",1,121000],["Aya",1,93500],["Youssef",2,147000],["Emma",2,94500],["Hana",2,94500],["Tom",2,65100]],"total":10,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["UPDATE: 10 rows affected"]}},{"id":"modifying-ex5","sql":"UPDATE employees e\nJOIN departments d ON d.dept_id = e.dept_id\nSET e.salary = e.salary + 1000\nWHERE d.location = 'Cairo';\n\nSELECT e.first_name, d.location, e.salary\nFROM employees e\nJOIN departments d ON d.dept_id = e.dept_id\nWHERE d.location = 'Cairo';","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["first_name","location","salary"],"rows":[["Youssef","Cairo",141000],["Emma","Cairo",91000],["Hana","Cairo",91000],["Tom","Cairo",63000],["Priya","Cairo",121000],["Ahmed","Cairo",79000],["Julia","Cairo",79000]],"total":7,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["UPDATE: 7 rows affected"]}},{"id":"modifying-ex6","sql":"DELETE FROM order_items\nWHERE order_id IN (SELECT order_id FROM orders WHERE status = 'cancelled');\n\nDELETE FROM orders WHERE status = 'cancelled';\n\nSELECT status, COUNT(*) AS orders FROM orders GROUP BY status;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["status","orders"],"rows":[["delivered",18],["pending",2],["shipped",2]],"total":3,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["DELETE: 2 rows affected","DELETE: 2 rows affected"]}},{"id":"modifying-ex7","sql":"DELETE FROM customers\nWHERE customer_id NOT IN (SELECT customer_id FROM orders)\n  AND signup_date \u003c (SELECT MAX(signup_date) FROM customers);","db":"sample","expectError":false,"expectWarning":true,"title":"","output":{"columns":[],"rows":[],"total":0,"explain":false,"error":null,"warnings":["MySQL rejects this with error 1093: you can't select from 'customers' in a subquery while deleting/updating it. Wrap the subquery in a derived table: … IN (SELECT id FROM (SELECT … FROM customers …) AS t)."],"notes":[],"summary":["DELETE: 2 rows affected"]}},{"id":"modifying-ex8","sql":"DELETE FROM customers\nWHERE customer_id NOT IN (SELECT customer_id FROM orders)\n  AND signup_date \u003c (SELECT latest FROM (SELECT MAX(signup_date) AS latest FROM customers) AS t);\n\nSELECT COUNT(*) AS customers_left FROM customers;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["customers_left"],"rows":[[10]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["DELETE: 2 rows affected"]}},{"id":"modifying-ex9","sql":"CREATE TABLE page_views (page VARCHAR(100) PRIMARY KEY, views INT NOT NULL);\nINSERT INTO page_views VALUES ('/home', 1);\n\nINSERT INTO page_views (page, views)\nVALUES ('/home', 1), ('/pricing', 1)\nON DUPLICATE KEY UPDATE views = views + 1;       -- existing key: update instead\n\nSELECT * FROM page_views ORDER BY page;","db":"empty","expectError":false,"expectWarning":false,"title":"","output":{"columns":["page","views"],"rows":[["/home",2],["/pricing",1]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["INSERT: 1 row affected","INSERT: 2 rows affected"]}},{"id":"modifying-ex10","sql":"CREATE TABLE users (id INT PRIMARY KEY, email VARCHAR(100) UNIQUE, name VARCHAR(50));\nINSERT INTO users VALUES (1, 'a@x.io', 'Ann');\n\nINSERT IGNORE INTO users VALUES (2, 'a@x.io', 'Ann again');  -- duplicate email: skipped, no error\nREPLACE INTO users VALUES (1, 'ann@x.io', 'Ann R.');          -- deletes row 1, inserts the new one\n\nSELECT * FROM users;","db":"empty","expectError":false,"expectWarning":false,"title":"","output":{"columns":["id","email","name"],"rows":[[1,"ann@x.io","Ann R."]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["INSERT: 1 row affected","INSERT: 0 rows affected"]}},{"id":"modifying-ex11","sql":"CREATE TABLE accounts (id INT PRIMARY KEY, owner VARCHAR(20), balance DECIMAL(10,2) CHECK (balance >= 0));\nINSERT INTO accounts VALUES (1, 'Ana', 100), (2, 'Ben', 50);\n\nSTART TRANSACTION;                                          -- transfer 80 from Ana to Ben\nUPDATE accounts SET balance = balance - 80 WHERE id = 1;\nUPDATE accounts SET balance = balance + 80 WHERE id = 2;\nCOMMIT;\n\nSTART TRANSACTION;\nUPDATE accounts SET balance = balance + 500 WHERE id = 2;   -- oops\nROLLBACK;                                                    -- undone\n\nSELECT * FROM accounts;","db":"empty","expectError":false,"expectWarning":false,"title":"","output":{"columns":["id","owner","balance"],"rows":[[1,"Ana",20],[2,"Ben",130]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["INSERT: 2 rows affected","UPDATE: 1 row affected","UPDATE: 1 row affected"]}},{"id":"modifying-ex12","sql":"CREATE TABLE accounts (id INT PRIMARY KEY, balance DECIMAL(10,2) CHECK (balance >= 0));\nINSERT INTO accounts VALUES (1, 100);\nUPDATE accounts SET balance = balance - 150 WHERE id = 1;","db":"empty","expectError":true,"expectWarning":false,"title":"","output":{"columns":[],"rows":[],"total":0,"explain":false,"error":{"message":"Check constraint is violated","hint":"MySQL error 3819: the value breaks a CHECK (or ENUM) rule on this table.","raw":"CHECK constraint failed: balance >= 0"},"warnings":[],"notes":[],"summary":["INSERT: 1 row affected"]}}],"dbs":{},"quizzes":[{"id":"modifying-q1","questions":[{"q":"You run \u003ccode>UPDATE t SET a = b, b = a\u003c/code>. In MySQL, what ends up in \u003ccode>b\u003c/code>?","options":["The original value of \u003ccode>a\u003c/code>","The new value of \u003ccode>a\u003c/code>, which is the old \u003ccode>b\u003c/code>, so \u003ccode>b\u003c/code> is unchanged","NULL","An error"],"answer":1,"explain":"\u003cp>This is a genuine MySQL quirk: single-table UPDATE assignments are applied left to right, so \u003ccode>b = a\u003c/code> sees the already-updated \u003ccode>a\u003c/code>. The SQL standard, PostgreSQL and SQLite all use the old values and would swap. (This page runs SQLite, which swaps.) Use a CASE or a temporary value when you need a swap in MySQL.\u003c/p>\n"},{"q":"Why does MySQL reject \u003ccode>DELETE FROM t WHERE id IN (SELECT id FROM t WHERE …)\u003c/code>?","options":["IN can&#39;t be used in DELETE","Error 1093: the subquery reads the table being modified. Wrap it in a derived table.","DELETE needs a JOIN","It&#39;s allowed in MySQL"],"answer":1,"explain":"\u003cp>\u003ccode>… IN (SELECT id FROM (SELECT id FROM t WHERE …) AS x)\u003c/code> materializes the ids first and is accepted.\u003c/p>\n"},{"q":"What does \u003ccode>INSERT … ON DUPLICATE KEY UPDATE views = views + 1\u003c/code> do when the key already exists?","options":["Inserts a second row","Updates the existing row: its \u003ccode>views\u003c/code> goes up by 1","Deletes the row and inserts a new one","Raises a duplicate-key error"],"answer":1,"explain":"\u003cp>REPLACE would delete and re-insert. ON DUPLICATE KEY UPDATE modifies the existing row in place.\u003c/p>\n"},{"q":"MySQL InnoDB&#39;s default isolation level is…","options":["READ UNCOMMITTED","READ COMMITTED","REPEATABLE READ","SERIALIZABLE"],"answer":2,"explain":"\u003cp>PostgreSQL and SQL Server default to READ COMMITTED. InnoDB defaults to REPEATABLE READ with MVCC snapshots.\u003c/p>\n"},{"q":"Two sessions both read stock = 10, subtract 1 in application code, and write 9. What&#39;s this called, and one fix?","options":["A dirty read; use READ UNCOMMITTED","A lost update; use \u003ccode>UPDATE … SET stock = stock - 1\u003c/code> or \u003ccode>SELECT … FOR UPDATE\u003c/code>","A phantom; use SERIALIZABLE indexes","A deadlock; retry"],"answer":1,"explain":"\u003cp>Do the arithmetic in the database atomically, lock the row before deciding, or use a version check.\u003c/p>\n"}]}],"problems":[627,196]},{"id":"schema","num":12,"title":"Schema design","summary":"Designing tables that keep data correct by construction — choosing types, keys and constraints, normalizing away update anomalies, and knowing when to bend the rules.","clauses":[],"kicker":"types · keys · constraints · normalization · views","minutes":11,"html":"\u003ch2>Choosing column types\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Data\u003c/th>\u003cth>MySQL type\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ids\u003c/td>\u003ctd>\u003ccode>INT\u003c/code> / \u003ccode>BIGINT\u003c/code> (\u003ccode>UNSIGNED\u003c/code> optional)\u003c/td>\u003ctd>BIGINT when you might pass ~2 billion rows\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Money\u003c/td>\u003ctd>\u003ccode>DECIMAL(12, 2)\u003c/code>\u003c/td>\u003ctd>Exact. \u003cstrong>Never\u003c/strong> FLOAT/DOUBLE for money: they&#39;re binary fractions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Short text\u003c/td>\u003ctd>\u003ccode>VARCHAR(n)\u003c/code>\u003c/td>\u003ctd>Variable length. \u003ccode>n\u003c/code> is a limit in characters, not bytes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Long text\u003c/td>\u003ctd>\u003ccode>TEXT\u003c/code>\u003c/td>\u003ctd>For bodies and descriptions. Awkward to index, so don&#39;t use it for keys\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flags\u003c/td>\u003ctd>\u003ccode>BOOLEAN\u003c/code> (a \u003ccode>TINYINT(1)\u003c/code>)\u003c/td>\u003ctd>MySQL stores 0/1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fixed small set\u003c/td>\u003ctd>\u003ccode>ENUM(&#39;a&#39;,&#39;b&#39;)\u003c/code> or a lookup table\u003c/td>\u003ctd>ENUM is compact but changing its values means an ALTER\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Calendar day\u003c/td>\u003ctd>\u003ccode>DATE\u003c/code>\u003c/td>\u003ctd>No time zone involved\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Moment in time\u003c/td>\u003ctd>\u003ccode>DATETIME\u003c/code> or \u003ccode>TIMESTAMP\u003c/code>\u003c/td>\u003ctd>\u003ccode>TIMESTAMP\u003c/code> is stored as UTC and converted to the session time zone. \u003ccode>DATETIME\u003c/code> stores exactly what you give it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flexible attributes\u003c/td>\u003ctd>\u003ccode>JSON\u003c/code>\u003c/td>\u003ctd>Validated JSON with path functions. Don&#39;t use it to dodge schema design\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· FLOAT for money\u003c/span>\u003c/div>\u003cp>\u003ccode>0.1 + 0.2\u003c/code> in floating point is \u003ccode>0.30000000000000004\u003c/code>. With DECIMAL, MySQL stores the exact value, so sums of prices stay exact. Rounding bugs from FLOAT money columns are some of the hardest to track down in finance code.\u003c/p>\n\u003c/aside>\u003ch2>Keys and constraints: let the database say no\u003c/h2>\n\u003cp>Constraints turn business rules into guarantees. Bad data is rejected at write time instead of discovered in a report months later.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"schema-ex1\">\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>PRIMARY KEY\u003c/strong>: unique, not null, one per table. In InnoDB the table is physically stored in primary-key order (the \u003cem>clustered index\u003c/em>).\u003c/li>\n\u003cli>\u003cstrong>UNIQUE\u003c/strong>: no duplicate values, though NULLs are allowed, even several of them.\u003c/li>\n\u003cli>\u003cstrong>NOT NULL\u003c/strong> and \u003cstrong>DEFAULT\u003c/strong>: make missing values impossible, or give them a sensible fallback.\u003c/li>\n\u003cli>\u003cstrong>CHECK\u003c/strong> (enforced since MySQL 8.0.16): any row-level rule.\u003c/li>\n\u003cli>\u003cstrong>FOREIGN KEY\u003c/strong>: the referenced row must exist. The \u003ccode>ON DELETE\u003c/code> action decides what happens to children: \u003ccode>RESTRICT\u003c/code> (the default, block the delete), \u003ccode>CASCADE\u003c/code>, or \u003ccode>SET NULL\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>Watch the constraints fire:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"schema-ex2\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"schema-ex3\">\u003c/div>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· Collation affects uniqueness\u003c/span>\u003c/div>\u003cp>With MySQL&#39;s default case-insensitive collation, \u003ccode>&#39;a@x.io&#39;\u003c/code> and \u003ccode>&#39;A@X.IO&#39;\u003c/code> are \u003cem>equal\u003c/em>, so a UNIQUE email column rejects the second one. That&#39;s usually what you want for emails. Use a \u003ccode>_bin\u003c/code> or \u003ccode>_cs\u003c/code> collation where case must matter.\u003c/p>\n\u003c/aside>\u003ch3>Natural vs surrogate keys\u003c/h3>\n\u003cp>A \u003cem>natural\u003c/em> key comes from the domain (an ISBN, a country code). A \u003cem>surrogate\u003c/em> key is a meaningless generated number. Surrogates don&#39;t change when the real world does: people change emails, and companies change names. So the usual design is a surrogate primary key plus a UNIQUE constraint on the natural key. Many-to-many junction tables often use a \u003cstrong>composite\u003c/strong> primary key instead, like \u003ccode>order_items (order_id, product_id)\u003c/code> in the sample database.\u003c/p>\n\u003ch2>Normalization: one fact in one place\u003c/h2>\n\u003cp>Here&#39;s a &quot;convenient&quot; flat table that repeats customer and product facts on every line:\u003c/p>\n\u003cdetails class=\"setup\">\u003csummary>Data for these examples: \u003ccode>flat\u003c/code>\u003c/summary>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">CREATE\u003c/span> \u003cspan class=\"t-k\">TABLE\u003c/span> \u003cspan class=\"t-f\">order_lines_flat\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\n  order_id \u003cspan class=\"t-t\">INT\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> order_date \u003cspan class=\"t-t\">DATE\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  customer_name \u003cspan class=\"t-f\">VARCHAR\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">50\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> customer_city \u003cspan class=\"t-f\">VARCHAR\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">50\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  product_name \u003cspan class=\"t-f\">VARCHAR\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">50\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> unit_price \u003cspan class=\"t-f\">DECIMAL\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">8\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> quantity \u003cspan class=\"t-t\">INT\u003c/span>\n\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">INSERT\u003c/span> \u003cspan class=\"t-k\">INTO\u003c/span> order_lines_flat \u003cspan class=\"t-k\">VALUES\u003c/span>\n  \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2025-01-05'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'Rosa Diaz'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'Madrid'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>    \u003cspan class=\"t-s\">'Lamp'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>  \u003cspan class=\"t-n\">40.00\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2025-01-05'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'Rosa Diaz'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'Madrid'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>    \u003cspan class=\"t-s\">'Desk'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-n\">220.00\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2025-01-09'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'Rosa Diaz'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'Barcelona'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'Chair'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-n\">90.00\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-n\">4\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">3\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'2025-01-10'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'Tom Hale'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>  \u003cspan class=\"t-s\">'Leeds'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>     \u003cspan class=\"t-s\">'Lamp'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>  \u003cspan class=\"t-n\">45.00\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\u003c/code>\u003c/pre>\u003c/details>\n\u003cdiv class=\"example\" data-ex=\"schema-ex4\">\u003c/div>\n\u003cp>Rosa &quot;lives&quot; in two cities, because someone updated one row and not the others. That&#39;s an \u003cstrong>update anomaly\u003c/strong>. The flat design also has an \u003cem>insertion\u003c/em> anomaly (you can&#39;t record a customer who hasn&#39;t ordered yet) and a \u003cem>deletion\u003c/em> anomaly (delete Tom&#39;s only order and Tom is gone).\u003c/p>\n\u003cp>The normal forms, in practical terms:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>1NF\u003c/strong>: one value per cell. No comma-separated lists or repeating columns like \u003ccode>phone1, phone2, phone3\u003c/code>. (LeetCode #1527 stores conditions as a space-separated list, and querying it needed LIKE gymnastics.)\u003c/li>\n\u003cli>\u003cstrong>2NF\u003c/strong>: every non-key column depends on the \u003cstrong>whole\u003c/strong> key. In \u003ccode>(order_id, product_id) → order_date\u003c/code>, the date depends only on \u003ccode>order_id\u003c/code>, so it belongs in \u003ccode>orders\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>3NF\u003c/strong>: no facts about facts. \u003ccode>customer_city\u003c/code> depends on the customer, not the order, so it belongs in \u003ccode>customers\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">CREATE\u003c/span> \u003cspan class=\"t-k\">TABLE\u003c/span> \u003cspan class=\"t-f\">customers\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>customer_id \u003cspan class=\"t-t\">INT\u003c/span> \u003cspan class=\"t-k\">PRIMARY\u003c/span> \u003cspan class=\"t-k\">KEY\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> name \u003cspan class=\"t-f\">VARCHAR\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">50\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> city \u003cspan class=\"t-f\">VARCHAR\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">50\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">CREATE\u003c/span> \u003cspan class=\"t-k\">TABLE\u003c/span> \u003cspan class=\"t-f\">products\u003c/span>  \u003cspan class=\"t-o\">(\u003c/span>product_id  \u003cspan class=\"t-t\">INT\u003c/span> \u003cspan class=\"t-k\">PRIMARY\u003c/span> \u003cspan class=\"t-k\">KEY\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> name \u003cspan class=\"t-f\">VARCHAR\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">50\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> price \u003cspan class=\"t-f\">DECIMAL\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">8\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">CREATE\u003c/span> \u003cspan class=\"t-k\">TABLE\u003c/span> \u003cspan class=\"t-f\">orders\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\n  order_id    \u003cspan class=\"t-t\">INT\u003c/span> \u003cspan class=\"t-k\">PRIMARY\u003c/span> \u003cspan class=\"t-k\">KEY\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  customer_id \u003cspan class=\"t-t\">INT\u003c/span> \u003cspan class=\"t-k\">NOT\u003c/span> \u003cspan class=\"t-k\">NULL\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  order_date  \u003cspan class=\"t-t\">DATE\u003c/span> \u003cspan class=\"t-k\">NOT\u003c/span> \u003cspan class=\"t-k\">NULL\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  \u003cspan class=\"t-k\">FOREIGN\u003c/span> \u003cspan class=\"t-k\">KEY\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>customer_id\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">REFERENCES\u003c/span> \u003cspan class=\"t-f\">customers\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>customer_id\u003cspan class=\"t-o\">)\u003c/span>\n\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">CREATE\u003c/span> \u003cspan class=\"t-k\">TABLE\u003c/span> \u003cspan class=\"t-f\">order_items\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\n  order_id   \u003cspan class=\"t-t\">INT\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  product_id \u003cspan class=\"t-t\">INT\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  quantity   \u003cspan class=\"t-t\">INT\u003c/span> \u003cspan class=\"t-k\">NOT\u003c/span> \u003cspan class=\"t-k\">NULL\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  unit_price \u003cspan class=\"t-f\">DECIMAL\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">8\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">NOT\u003c/span> \u003cspan class=\"t-k\">NULL\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>          \u003cspan class=\"t-c\">-- price at the time of sale\u003c/span>\n  \u003cspan class=\"t-k\">PRIMARY\u003c/span> \u003cspan class=\"t-k\">KEY\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>order_id\u003cspan class=\"t-o\">,\u003c/span> product_id\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  \u003cspan class=\"t-k\">FOREIGN\u003c/span> \u003cspan class=\"t-k\">KEY\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>order_id\u003cspan class=\"t-o\">)\u003c/span>   \u003cspan class=\"t-k\">REFERENCES\u003c/span> \u003cspan class=\"t-f\">orders\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>order_id\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n  \u003cspan class=\"t-k\">FOREIGN\u003c/span> \u003cspan class=\"t-k\">KEY\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>product_id\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">REFERENCES\u003c/span> \u003cspan class=\"t-f\">products\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>product_id\u003cspan class=\"t-o\">)\u003c/span>\n\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\u003c/code>\u003c/pre>\n\u003caside class=\"callout gotcha\">\u003cdiv class=\"callout-label\">Gotcha \u003cspan>· Inline REFERENCES is silently ignored\u003c/span>\u003c/div>\u003cp>MySQL \u003cem>parses\u003c/em> a column-level \u003ccode>customer_id INT REFERENCES customers(customer_id)\u003c/code> and then ignores it: no foreign key is created. Always write the table-level form \u003ccode>FOREIGN KEY (col) REFERENCES t (col)\u003c/code>. PostgreSQL honours both.\u003c/p>\n\u003c/aside>\u003cp>\u003ccode>unit_price\u003c/code> stays on \u003ccode>order_items\u003c/code> on purpose. It records the price \u003cstrong>at the time of sale\u003c/strong>, which is a different fact from today&#39;s \u003ccode>products.price\u003c/code>. That&#39;s why the sample database keeps both.\u003c/p>\n\u003caside class=\"callout work\">\u003cdiv class=\"callout-label\">On the job \u003cspan>· When to denormalize\u003c/span>\u003c/div>\u003cp>Normalized schemas are the right default for writes (OLTP). Reporting and analytics (OLAP) often denormalize on purpose, with star schemas, summary tables and materialized aggregates, trading storage and refresh work for fast reads. Denormalize \u003cem>deliberately\u003c/em>, from a normalized source of truth, never by accident.\u003c/p>\n\u003c/aside>\u003ch2>Relationship shapes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>One-to-many\u003c/strong>: a foreign key on the &quot;many&quot; side (\u003ccode>orders.customer_id\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>Many-to-many\u003c/strong>: a junction table with two foreign keys (\u003ccode>order_items\u003c/code> between orders and products). Put attributes of the relationship itself, like quantity, on the junction.\u003c/li>\n\u003cli>\u003cstrong>One-to-one\u003c/strong>: a foreign key that&#39;s also UNIQUE, or the same primary key in both tables. It&#39;s used to split rarely-read or sensitive columns out of a hot table.\u003c/li>\n\u003cli>\u003cstrong>Hierarchy\u003c/strong>: a self-referencing foreign key (\u003ccode>employees.manager_id\u003c/code>), queried with recursive CTEs (Module 8).\u003c/li>\n\u003c/ul>\n\u003ch2>Views\u003c/h2>\n\u003cp>A view is a saved query that you can select from like a table. It&#39;s good for hiding join logic and exposing a stable interface to reports:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"schema-ex5\">\u003c/div>\n\u003cp>A view stores no data and re-runs its query on every read. For precomputed results you&#39;d use a summary table refreshed by a job. MySQL has no materialized views.\u003c/p>\n\u003ch2>Conventions that age well\u003c/h2>\n\u003cul>\n\u003cli>Use consistent \u003ccode>snake_case\u003c/code> names, and pick either singular or plural table names and stick with it.\u003c/li>\n\u003cli>Add \u003ccode>created_at DATETIME DEFAULT CURRENT_TIMESTAMP\u003c/code> and \u003ccode>updated_at DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP\u003c/code> on most tables.\u003c/li>\n\u003cli>Store instants in \u003cstrong>UTC\u003c/strong> and convert at the edges.\u003c/li>\n\u003cli>Soft deletes (\u003ccode>deleted_at\u003c/code>) keep history, but every query must then filter them out, and UNIQUE constraints get tricky. Weigh them per table.\u003c/li>\n\u003c/ul>\n\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"schema-q1\">\u003c/div>","examples":[{"id":"schema-ex1","sql":"CREATE TABLE authors (\n  author_id INT AUTO_INCREMENT PRIMARY KEY,\n  name      VARCHAR(100) NOT NULL,\n  email     VARCHAR(255) NOT NULL UNIQUE\n);\nCREATE TABLE books (\n  book_id   INT AUTO_INCREMENT PRIMARY KEY,\n  author_id INT NOT NULL,\n  title     VARCHAR(200) NOT NULL,\n  price     DECIMAL(8,2) NOT NULL CHECK (price >= 0),\n  status    ENUM('draft', 'published') NOT NULL DEFAULT 'draft',\n  FOREIGN KEY (author_id) REFERENCES authors (author_id) ON DELETE CASCADE\n);\nINSERT INTO authors (name, email) VALUES ('Ursula', 'ul@books.test'), ('Octavia', 'ob@books.test');\nINSERT INTO books (author_id, title, price) VALUES (1, 'The Dispossessed', 18.50), (1, 'Earthsea', 15.00), (2, 'Kindred', 16.00);\n\nDELETE FROM autho
