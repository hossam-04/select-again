of join order: the left table decides which rows survive, the SELECT list decides the shape.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT u.unique_id, e.name FROM Employees e JOIN EmployeeUNI u ON u.id = e.id;","html":"\u003cp>Drops employees without a unique id.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employees","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(20)","pk":false}]},{"name":"EmployeeUNI","columns":[{"name":"id","type":"INT","pk":true},{"name":"unique_id","type":"INT","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employees (id INT PRIMARY KEY, name VARCHAR(20));\nCREATE TABLE EmployeeUNI (id INT, unique_id INT, PRIMARY KEY (id, unique_id));\nINSERT INTO Employees VALUES (1, 'Lena'), (4, 'Theo'), (9, 'Priya'), (12, 'Omar'), (15, 'Zoe');\nINSERT INTO EmployeeUNI VALUES (4, 1), (12, 2), (15, 3), (20, 4);","tables":[{"name":"Employees","rows":[[1,"Lena"],[4,"Theo"],[9,"Priya"],[12,"Omar"],[15,"Zoe"]]},{"name":"EmployeeUNI","rows":[[4,1],[12,2],[15,3],[20,4]]}],"runs":[{"expected":{"columns":["unique_id","name"],"rows":[[null,"Lena"],[1,"Theo"],[null,"Priya"],[2,"Omar"],[3,"Zoe"]]}}]},{"name":"Nobody has a unique id","setup":"CREATE TABLE Employees (id INT PRIMARY KEY, name VARCHAR(20));\nCREATE TABLE EmployeeUNI (id INT, unique_id INT, PRIMARY KEY (id, unique_id));\nINSERT INTO Employees VALUES (1, 'Ana'), (2, 'Bo');","tables":[{"name":"Employees","rows":[[1,"Ana"],[2,"Bo"]]},{"name":"EmployeeUNI","rows":[]}],"runs":[{"expected":{"columns":["unique_id","name"],"rows":[[null,"Ana"],[null,"Bo"]]}}]}]},"1393":{"id":1393,"title":"Capital Gain/Loss","slug":"capital-gainloss","difficulty":"Medium","module":"aggregation","patterns":["signed SUM"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>\u003ccode>Stocks\u003c/code> records each &#39;Buy&#39; and &#39;Sell&#39; of a stock with its \u003ccode>price\u003c/code>; every buy is later matched by a sell. For each \u003ccode>stock_name\u003c/code>, return \u003ccode>capital_gain_loss\u003c/code>: the total of all sell prices minus all buy prices. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Give each price a sign: + for Sell, − for Buy.\u003c/p>\n","\u003cp>Then SUM per stock.\u003c/p>\n"],"solution":{"sql":"SELECT stock_name,\n       SUM(CASE WHEN operation = 'Sell' THEN price ELSE -price END) AS capital_gain_loss\nFROM Stocks\nGROUP BY stock_name;","html":"\u003cp>Turning each row into a signed amount makes the whole history one SUM, however many buy/sell cycles there were.\u003c/p>\n"},"alternatives":[{"title":"Two conditional sums","sql":"SELECT stock_name,\n       SUM(IF(operation = 'Sell', price, 0)) - SUM(IF(operation = 'Buy', price, 0)) AS capital_gain_loss\nFROM Stocks\nGROUP BY stock_name;","html":"\u003cp>Same result, spelled as &quot;total sells minus total buys&quot;.\u003c/p>\n"}],"traps":[{"sql":"SELECT stock_name, MAX(price) - MIN(price) AS capital_gain_loss FROM Stocks GROUP BY stock_name;","html":"\u003cp>Price range is not profit: it ignores which prices were buys and which were sells, and how many cycles happened.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Stocks","columns":[{"name":"stock_name","type":"VARCHAR(15)","pk":true},{"name":"operation","type":"ENUM('SELL', 'BUY')","pk":false},{"name":"operation_day","type":"INT","pk":true},{"name":"price","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Stocks (stock_name VARCHAR(15), operation ENUM('Sell', 'Buy'), operation_day INT, price INT, PRIMARY KEY (stock_name, operation_day));\nINSERT INTO Stocks VALUES\n  ('Acme', 'Buy', 1, 500), ('Acme', 'Sell', 3, 800), ('Acme', 'Buy', 5, 700), ('Acme', 'Sell', 8, 600),\n  ('Bolt', 'Buy', 2, 1200), ('Bolt', 'Sell', 4, 900),\n  ('Cirr', 'Buy', 1, 50), ('Cirr', 'Sell', 2, 50);","tables":[{"name":"Stocks","rows":[["Acme","Buy",1,500],["Acme","Sell",3,800],["Acme","Buy",5,700],["Acme","Sell",8,600],["Bolt","Buy",2,1200],["Bolt","Sell",4,900],["Cirr","Buy",1,50],["Cirr","Sell",2,50]]}],"runs":[{"expected":{"columns":["stock_name","capital_gain_loss"],"rows":[["Acme",200],["Bolt",-300],["Cirr",0]]}}]},{"name":"Several round trips","setup":"CREATE TABLE Stocks (stock_name VARCHAR(15), operation ENUM('Sell', 'Buy'), operation_day INT, price INT, PRIMARY KEY (stock_name, operation_day));\nINSERT INTO Stocks VALUES ('Dyno', 'Buy', 1, 100), ('Dyno', 'Sell', 2, 90), ('Dyno', 'Buy', 3, 100), ('Dyno', 'Sell', 4, 90), ('Echo', 'Buy', 5, 10), ('Echo', 'Sell', 9, 1000);","tables":[{"name":"Stocks","rows":[["Dyno","Buy",1,100],["Dyno","Sell",2,90],["Dyno","Buy",3,100],["Dyno","Sell",4,90],["Echo","Buy",5,10],["Echo","Sell",9,1000]]}],"runs":[{"expected":{"columns":["stock_name","capital_gain_loss"],"rows":[["Dyno",-20],["Echo",990]]}}]}]},"1407":{"id":1407,"title":"Top Travellers","slug":"top-travellers","difficulty":"Easy","module":"joins","patterns":["LEFT JOIN + SUM","multi-key ORDER BY"],"sql50":false,"order":true,"kind":"query","taskHtml":"\u003cp>Return each user&#39;s \u003ccode>name\u003c/code> and \u003ccode>travelled_distance\u003c/code> (total ride distance, 0 if they never rode). Order by \u003ccode>travelled_distance\u003c/code> descending, then \u003ccode>name\u003c/code> ascending. Different users can share a name.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Users without rides appear with 0 — LEFT JOIN plus IFNULL.\u003c/p>\n","\u003cp>Group by the user id, not the name.\u003c/p>\n","\u003cp>Two sort keys: distance DESC, then name.\u003c/p>\n"],"solution":{"sql":"SELECT u.name, IFNULL(SUM(r.distance), 0) AS travelled_distance\nFROM Users u\nLEFT JOIN Rides r ON r.user_id = u.id\nGROUP BY u.id, u.name\nORDER BY travelled_distance DESC, u.name;","html":"\u003cp>\u003ccode>SUM\u003c/code> over only NULL-padded rows is NULL, so IFNULL supplies the 0. Grouping by id keeps the two users named Kai apart.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT u.name, IFNULL(SUM(r.distance), 0) AS travelled_distance FROM Users u LEFT JOIN Rides r ON r.user_id = u.id GROUP BY u.name ORDER BY travelled_distance DESC, u.name;","html":"\u003cp>Grouping by name merges the two Kais into one row with 230.\u003c/p>\n"},{"sql":"SELECT u.name, SUM(r.distance) AS travelled_distance FROM Users u LEFT JOIN Rides r ON r.user_id = u.id GROUP BY u.id, u.name ORDER BY travelled_distance DESC, u.name;","html":"\u003cp>Users with no rides show NULL instead of 0.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Users","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(30)","pk":false}]},{"name":"Rides","columns":[{"name":"id","type":"INT","pk":true},{"name":"user_id","type":"INT","pk":false},{"name":"distance","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Users (id INT PRIMARY KEY, name VARCHAR(30));\nCREATE TABLE Rides (id INT PRIMARY KEY, user_id INT, distance INT);\nINSERT INTO Users VALUES (1, 'Kai'), (2, 'Lia'), (3, 'Max'), (4, 'Nell'), (5, 'Otto'), (6, 'Kai');\nINSERT INTO Rides VALUES (1, 1, 120), (2, 1, 30), (3, 2, 150), (4, 4, 500), (5, 6, 80);","tables":[{"name":"Users","rows":[[1,"Kai"],[2,"Lia"],[3,"Max"],[4,"Nell"],[5,"Otto"],[6,"Kai"]]},{"name":"Rides","rows":[[1,1,120],[2,1,30],[3,2,150],[4,4,500],[5,6,80]]}],"runs":[{"expected":{"columns":["name","travelled_distance"],"rows":[["Nell",500],["Kai",150],["Lia",150],["Kai",80],["Max",0],["Otto",0]]}}]},{"name":"Ties on distance","setup":"CREATE TABLE Users (id INT PRIMARY KEY, name VARCHAR(30));\nCREATE TABLE Rides (id INT PRIMARY KEY, user_id INT, distance INT);\nINSERT INTO Users VALUES (1, 'Zoe'), (2, 'Amy'), (3, 'Bo'), (4, 'Amy'); INSERT INTO Rides VALUES (1, 1, 100), (2, 2, 100), (3, 4, 50), (4, 4, 50);","tables":[{"name":"Users","rows":[[1,"Zoe"],[2,"Amy"],[3,"Bo"],[4,"Amy"]]},{"name":"Rides","rows":[[1,1,100],[2,2,100],[3,4,50],[4,4,50]]}],"runs":[{"expected":{"columns":["name","travelled_distance"],"rows":[["Amy",100],["Amy",100],["Zoe",100],["Bo",0]]}}]}]},"1484":{"id":1484,"title":"Group Sold Products By The Date","slug":"group-sold-products-by-the-date","difficulty":"Easy","module":"aggregation","patterns":["GROUP_CONCAT","COUNT(DISTINCT)"],"sql50":true,"order":true,"kind":"query","taskHtml":"\u003cp>\u003ccode>Activities\u003c/code> lists products sold per date and may contain duplicates. For each \u003ccode>sell_date\u003c/code>, return \u003ccode>num_sold\u003c/code> (the number of \u003cstrong>different\u003c/strong> products) and \u003ccode>products\u003c/code>: their names, sorted alphabetically and joined with commas. Order by \u003ccode>sell_date\u003c/code>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Group by date.\u003c/p>\n","\u003cp>\u003ccode>GROUP_CONCAT\u003c/code> builds the list; it accepts \u003ccode>DISTINCT\u003c/code>, \u003ccode>ORDER BY\u003c/code> and \u003ccode>SEPARATOR\u003c/code> inside the parentheses.\u003c/p>\n"],"solution":{"sql":"SELECT sell_date,\n       COUNT(DISTINCT product) AS num_sold,\n       GROUP_CONCAT(DISTINCT product ORDER BY product SEPARATOR ',') AS products\nFROM Activities\nGROUP BY sell_date\nORDER BY sell_date;","html":"\u003cp>DISTINCT removes the repeated \u003ccode>Stapler\u003c/code>; ORDER BY inside \u003ccode>GROUP_CONCAT\u003c/code> sorts the names within each group (the outer ORDER BY only sorts the rows). &#39;,&#39; is MySQL&#39;s default separator; writing it out documents the intent.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT sell_date, COUNT(DISTINCT product) AS num_sold, GROUP_CONCAT(product ORDER BY product) AS products FROM Activities GROUP BY sell_date ORDER BY sell_date;","html":"\u003cp>Without DISTINCT the list repeats products sold more than once that day.\u003c/p>\n"},{"sql":"SELECT sell_date, COUNT(DISTINCT product) AS num_sold, GROUP_CONCAT(DISTINCT product) AS products FROM Activities GROUP BY sell_date ORDER BY sell_date;","html":"\u003cp>Without ORDER BY inside GROUP_CONCAT the names come in whatever order the rows were read.\u003c/p>\n"},{"sql":"SELECT sell_date, COUNT(product) AS num_sold, GROUP_CONCAT(DISTINCT product ORDER BY product) AS products FROM Activities GROUP BY sell_date ORDER BY sell_date;","html":"\u003cp>\u003ccode>COUNT(product)\u003c/code> counts duplicates too.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Activities","columns":[{"name":"sell_date","type":"DATE","pk":false},{"name":"product","type":"VARCHAR(30)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Activities (sell_date DATE, product VARCHAR(30));\nINSERT INTO Activities VALUES\n  ('2024-06-01', 'Stapler'), ('2024-06-01', 'Eraser'), ('2024-06-01', 'Stapler'),\n  ('2024-06-02', 'Ruler'), ('2024-06-03', 'Binder'), ('2024-06-03', 'Tape'),\n  ('2024-06-03', 'Glue'), ('2024-06-03', 'Binder'), ('2024-06-02', 'Ruler');","tables":[{"name":"Activities","rows":[["2024-06-01","Stapler"],["2024-06-01","Eraser"],["2024-06-01","Stapler"],["2024-06-02","Ruler"],["2024-06-03","Binder"],["2024-06-03","Tape"],["2024-06-03","Glue"],["2024-06-03","Binder"],["2024-06-02","Ruler"]]}],"runs":[{"expected":{"columns":["sell_date","num_sold","products"],"rows":[["2024-06-01",2,"Eraser,Stapler"],["2024-06-02",1,"Ruler"],["2024-06-03",3,"Binder,Glue,Tape"]]}}]},{"name":"One product a day, dates out of order","setup":"CREATE TABLE Activities (sell_date DATE, product VARCHAR(30));\nINSERT INTO Activities VALUES ('2024-07-03', 'Pen'), ('2024-07-01', 'Ink'), ('2024-07-01', 'Ink'), ('2024-07-02', 'Clip');","tables":[{"name":"Activities","rows":[["2024-07-03","Pen"],["2024-07-01","Ink"],["2024-07-01","Ink"],["2024-07-02","Clip"]]}],"runs":[{"expected":{"columns":["sell_date","num_sold","products"],"rows":[["2024-07-01",1,"Ink"],["2024-07-02",1,"Clip"],["2024-07-03",1,"Pen"]]}}]}]},"1517":{"id":1517,"title":"Find Users With Valid E-Mails","slug":"find-users-with-valid-e-mails","difficulty":"Easy","module":"expressions","patterns":["REGEXP","case-sensitive match"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Return \u003ccode>user_id\u003c/code>, \u003ccode>name\u003c/code> and \u003ccode>mail\u003c/code> of users whose email is valid. A valid email is a \u003cem>prefix\u003c/em> followed by the domain \u003ccode>@leetcode.com\u003c/code>:\u003c/p>\n\u003cul>\n\u003cli>the prefix \u003cstrong>starts with a letter\u003c/strong> and contains only letters (either case), digits, underscore \u003ccode>_\u003c/code>, period \u003ccode>.\u003c/code> and dash \u003ccode>-\u003c/code>;\u003c/li>\n\u003cli>the domain is \u003cstrong>exactly\u003c/strong> \u003ccode>@leetcode.com\u003c/code>, in lowercase.\u003c/li>\n\u003c/ul>\n\u003cp>Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>This is a job for a regular expression anchored at both ends: \u003ccode>^…$\u003c/code>.\u003c/p>\n","\u003cp>First character: \u003ccode>[A-Za-z]\u003c/code>. Then any number of \u003ccode>[A-Za-z0-9_.-]\u003c/code>.\u003c/p>\n","\u003cp>A bare \u003ccode>.\u003c/code> in a regex matches any character — escape it (\u003ccode>[.]\u003c/code> or \u003ccode>\\\\.\u003c/code>) in the domain.\u003c/p>\n","\u003cp>MySQL&#39;s REGEXP ignores case by default, but the domain must be lowercase. Use \u003ccode>REGEXP_LIKE(mail, pattern, &#39;c&#39;)\u003c/code>.\u003c/p>\n"],"solution":{"sql":"SELECT user_id, name, mail\nFROM Users\nWHERE REGEXP_LIKE(mail, '^[A-Za-z][A-Za-z0-9_.-]*@leetcode[.]com$', 'c');","html":"\u003cul>\n\u003cli>\u003ccode>^[A-Za-z]\u003c/code>: must start with a letter.\u003c/li>\n\u003cli>\u003ccode>[A-Za-z0-9_.-]*\u003c/code>: then any allowed characters (inside brackets \u003ccode>.\u003c/code> is literal and a trailing \u003ccode>-\u003c/code> is literal).\u003c/li>\n\u003cli>\u003ccode>@leetcode[.]com$\u003c/code>: the exact domain, anchored at the end.\u003c/li>\n\u003cli>\u003ccode>&#39;c&#39;\u003c/code>: case-sensitive, so \u003ccode>@LeetCode.com\u003c/code> is rejected.\u003c/li>\n\u003c/ul>\n"},"alternatives":[{"title":"Escaped dot","sql":"SELECT user_id, name, mail\nFROM Users\nWHERE REGEXP_LIKE(mail, '^[a-zA-Z][a-zA-Z0-9_.\\\\-]*@leetcode\\\\.com$', 'c');","html":"\u003cp>Same pattern with backslash escapes. In a MySQL string literal \u003ccode>&#39;\\\\.&#39;\u003c/code> becomes \u003ccode>\\.\u003c/code> for the regex engine — the double backslash is easy to get wrong, which is why \u003ccode>[.]\u003c/code> is popular.\u003c/p>\n"}],"traps":[{"sql":"SELECT user_id, name, mail FROM Users WHERE mail REGEXP '^[A-Za-z][A-Za-z0-9_.-]*@leetcode[.]com$';","html":"\u003cp>Plain REGEXP is case-insensitive in MySQL, so \u003ccode>sami@LeetCode.com\u003c/code> slips through.\u003c/p>\n"},{"sql":"SELECT user_id, name, mail FROM Users WHERE REGEXP_LIKE(mail, '^[A-Za-z][A-Za-z0-9_.-]*@leetcode.com$', 'c');","html":"\u003cp>An unescaped \u003ccode>.\u003c/code> matches any character, so \u003ccode>vik@leetcodeXcom\u003c/code> passes.\u003c/p>\n"},{"sql":"SELECT user_id, name, mail FROM Users WHERE REGEXP_LIKE(mail, '^[A-Za-z][A-Za-z0-9_.-]*@leetcode[.]com', 'c');","html":"\u003cp>Without the \u003ccode>$\u003c/code> anchor, anything may follow the domain — \u003ccode>xia@leetcode.com.evil\u003c/code> passes.\u003c/p>\n"},{"sql":"SELECT user_id, name, mail FROM Users WHERE mail LIKE '%@leetcode.com';","html":"\u003cp>LIKE cannot express the prefix rules: it accepts \u003ccode>9quinn\u003c/code>, \u003ccode>tara#1\u003c/code> and \u003ccode>_wes\u003c/code>.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Users","columns":[{"name":"user_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(30)","pk":false},{"name":"mail","type":"VARCHAR(60)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Users (user_id INT PRIMARY KEY, name VARCHAR(30), mail VARCHAR(60));\nINSERT INTO Users VALUES\n  (1, 'Nora', 'nora.k@leetcode.com'),\n  (2, 'Omar', 'omar_99@leetcode.com'),\n  (3, 'Pia', 'pia@leetcode.co'),\n  (4, 'Quinn', '9quinn@leetcode.com'),\n  (5, 'Rosa', 'rosa-m@leetcode.com'),\n  (6, 'Sami', 'sami@LeetCode.com'),\n  (7, 'Tara', 'tara#1@leetcode.com'),\n  (8, 'Uma', 'Uma.Dev@leetcode.com'),\n  (9, 'Vik', 'vik@leetcodeXcom'),\n  (10, 'Wes', '_wes@leetcode.com'),\n  (11, 'Xia', 'xia@leetcode.com.evil');","tables":[{"name":"Users","rows":[[1,"Nora","nora.k@leetcode.com"],[2,"Omar","omar_99@leetcode.com"],[3,"Pia","pia@leetcode.co"],[4,"Quinn","9quinn@leetcode.com"],[5,"Rosa","rosa-m@leetcode.com"],[6,"Sami","sami@LeetCode.com"],[7,"Tara","tara#1@leetcode.com"],[8,"Uma","Uma.Dev@leetcode.com"],[9,"Vik","vik@leetcodeXcom"],[10,"Wes","_wes@leetcode.com"],[11,"Xia","xia@leetcode.com.evil"]]}],"runs":[{"expected":{"columns":["user_id","name","mail"],"rows":[[1,"Nora","nora.k@leetcode.com"],[2,"Omar","omar_99@leetcode.com"],[5,"Rosa","rosa-m@leetcode.com"],[8,"Uma","Uma.Dev@leetcode.com"]]}}]},{"name":"More prefix rules","setup":"CREATE TABLE Users (user_id INT PRIMARY KEY, name VARCHAR(30), mail VARCHAR(60));\nINSERT INTO Users VALUES (20, 'Ana', 'a@leetcode.com'), (21, 'Ben', '.dot@leetcode.com'), (22, 'Cyd', 'ok@@leetcode.com'), (23, 'Dan', 'Z-9_.x@leetcode.com'), (24, 'Eve', 'q@leetcode.comm');","tables":[{"name":"Users","rows":[[20,"Ana","a@leetcode.com"],[21,"Ben",".dot@leetcode.com"],[22,"Cyd","ok@@leetcode.com"],[23,"Dan","Z-9_.x@leetcode.com"],[24,"Eve","q@leetcode.comm"]]}],"runs":[{"expected":{"columns":["user_id","name","mail"],"rows":[[20,"Ana","a@leetcode.com"],[23,"Dan","Z-9_.x@leetcode.com"]]}}]}]},"1527":{"id":1527,"title":"Patients With a Condition","slug":"patients-with-a-condition","difficulty":"Easy","module":"filtering","patterns":["LIKE patterns","word prefix"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>\u003ccode>conditions\u003c/code> holds zero or more condition codes separated by single spaces. Type I Diabetes codes always \u003cstrong>start with\u003c/strong> \u003ccode>DIAB1\u003c/code> (for example \u003ccode>DIAB100\u003c/code>). Return \u003ccode>patient_id\u003c/code>, \u003ccode>patient_name\u003c/code> and \u003ccode>conditions\u003c/code> for every patient with Type I Diabetes. Any order.\u003c/p>\n\u003cp>A code merely \u003cem>containing\u003c/em> \u003ccode>DIAB1\u003c/code> (like \u003ccode>XDIAB100\u003c/code> or \u003ccode>+DIAB101\u003c/code>) does not count.\u003c/p>\n","notesHtml":"","hints":["\u003cp>A code can sit at the very start of the string, or after a space.\u003c/p>\n","\u003cp>That is two LIKE patterns joined with OR.\u003c/p>\n","\u003cp>\u003ccode>&#39;%DIAB1%&#39;\u003c/code> is too loose — test it against \u003ccode>XDIAB100\u003c/code>.\u003c/p>\n"],"solution":{"sql":"SELECT patient_id, patient_name, conditions\nFROM Patients\nWHERE conditions LIKE 'DIAB1%'\n   OR conditions LIKE '% DIAB1%';","html":"\u003cp>The first pattern catches a code at the start of the list; the second catches one after a space. Anything else that merely contains the letters is rejected.\u003c/p>\n"},"alternatives":[{"title":"Regular expression","sql":"SELECT patient_id, patient_name, conditions\nFROM Patients\nWHERE conditions REGEXP '(^| )DIAB1';","html":"\u003cp>\u003ccode>(^| )\u003c/code> means &quot;start of string or a space&quot;. Avoid \u003ccode>\\b\u003c/code> (word boundary) here: it also matches after \u003ccode>+\u003c/code>, which the problem excludes.\u003c/p>\n"},{"title":"Pad with a leading space","sql":"SELECT patient_id, patient_name, conditions\nFROM Patients\nWHERE CONCAT(' ', conditions) LIKE '% DIAB1%';","html":"\u003cp>Prefixing a space turns &quot;at the start&quot; into &quot;after a space&quot;, so one pattern covers both cases.\u003c/p>\n"}],"traps":[{"sql":"SELECT patient_id, patient_name, conditions FROM Patients WHERE conditions LIKE '%DIAB1%';","html":"\u003cp>Matches \u003ccode>XDIAB100\u003c/code> and \u003ccode>+DIAB101\u003c/code>, whose codes do not start with DIAB1.\u003c/p>\n"},{"sql":"SELECT patient_id, patient_name, conditions FROM Patients WHERE conditions LIKE 'DIAB1%';","html":"\u003cp>Misses patients whose DIAB1 code is not the first one in the list.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Patients","columns":[{"name":"patient_id","type":"INT","pk":true},{"name":"patient_name","type":"VARCHAR(30)","pk":false},{"name":"conditions","type":"VARCHAR(100)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Patients (patient_id INT PRIMARY KEY, patient_name VARCHAR(30), conditions VARCHAR(100));\nINSERT INTO Patients VALUES\n  (1, 'Ada', 'FLU ASTH'),\n  (2, 'Bea', ''),\n  (3, 'Cal', 'DIAB102 ARTH'),\n  (4, 'Dov', 'MIGR DIAB100'),\n  (5, 'Eli', 'DIAB215'),\n  (6, 'Fay', 'XDIAB100'),\n  (7, 'Gil', 'ASTH +DIAB101'),\n  (8, 'Hal', 'DIAB1'),\n  (9, 'Ivy', 'FLU DIAB150 ARTH');","tables":[{"name":"Patients","rows":[[1,"Ada","FLU ASTH"],[2,"Bea",""],[3,"Cal","DIAB102 ARTH"],[4,"Dov","MIGR DIAB100"],[5,"Eli","DIAB215"],[6,"Fay","XDIAB100"],[7,"Gil","ASTH +DIAB101"],[8,"Hal","DIAB1"],[9,"Ivy","FLU DIAB150 ARTH"]]}],"runs":[{"expected":{"columns":["patient_id","patient_name","conditions"],"rows":[[3,"Cal","DIAB102 ARTH"],[4,"Dov","MIGR DIAB100"],[8,"Hal","DIAB1"],[9,"Ivy","FLU DIAB150 ARTH"]]}}]},{"name":"DIAB1 inside other codes","setup":"CREATE TABLE Patients (patient_id INT PRIMARY KEY, patient_name VARCHAR(30), conditions VARCHAR(100));\nINSERT INTO Patients VALUES (1, 'Kim', 'SADIAB100 FLU'), (2, 'Lou', 'ACNE DIAB10'), (3, 'Max', 'DIAB1 DIAB2'), (4, 'Ned', 'XX-DIAB1'), (5, 'Ola', 'COLD');","tables":[{"name":"Patients","rows":[[1,"Kim","SADIAB100 FLU"],[2,"Lou","ACNE DIAB10"],[3,"Max","DIAB1 DIAB2"],[4,"Ned","XX-DIAB1"],[5,"Ola","COLD"]]}],"runs":[{"expected":{"columns":["patient_id","patient_name","conditions"],"rows":[[2,"Lou","ACNE DIAB10"],[3,"Max","DIAB1 DIAB2"]]}}]}]},"1581":{"id":1581,"title":"Customer Who Visited but Did Not Make Any Transactions","slug":"customer-who-visited-but-did-not-make-any-transactions","difficulty":"Easy","module":"joins","patterns":["anti-join","GROUP BY"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Some mall visits ended without any transaction. For each customer who had such visits, return \u003ccode>customer_id\u003c/code> and \u003ccode>count_no_trans\u003c/code> — the number of their visits with no transaction. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>First find visits with no transaction (an anti-join).\u003c/p>\n","\u003cp>Then count those visits per customer.\u003c/p>\n"],"solution":{"sql":"SELECT v.customer_id, COUNT(*) AS count_no_trans\nFROM Visits v\nLEFT JOIN Transactions t ON t.visit_id = v.visit_id\nWHERE t.transaction_id IS NULL\nGROUP BY v.customer_id;","html":"\u003cp>The WHERE keeps only unmatched visits (the anti-join), and each remaining row is exactly one visit, so \u003ccode>COUNT(*)\u003c/code> is right here.\u003c/p>\n"},"alternatives":[{"title":"NOT IN","sql":"SELECT customer_id, COUNT(*) AS count_no_trans\nFROM Visits\nWHERE visit_id NOT IN (SELECT visit_id FROM Transactions)\nGROUP BY customer_id;","html":"\u003cp>Fine when \u003ccode>Transactions.visit_id\u003c/code> can never be NULL; NOT EXISTS is the safer default.\u003c/p>\n"}],"traps":[{"sql":"SELECT v.customer_id, COUNT(*) AS count_no_trans FROM Visits v LEFT JOIN Transactions t ON t.visit_id = v.visit_id GROUP BY v.customer_id;","html":"\u003cp>Without the IS NULL filter every visit is counted — and visit 2 twice, once per transaction.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Visits","columns":[{"name":"visit_id","type":"INT","pk":true},{"name":"customer_id","type":"INT","pk":false}]},{"name":"Transactions","columns":[{"name":"transaction_id","type":"INT","pk":true},{"name":"visit_id","type":"INT","pk":false},{"name":"amount","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Visits (visit_id INT PRIMARY KEY, customer_id INT);\nCREATE TABLE Transactions (transaction_id INT PRIMARY KEY, visit_id INT, amount INT);\nINSERT INTO Visits VALUES (1, 5), (2, 7), (3, 5), (4, 8), (5, 7), (6, 5), (7, 9);\nINSERT INTO Transactions VALUES (100, 2, 50), (101, 2, 30), (102, 4, 20), (103, 6, 70);","tables":[{"name":"Visits","rows":[[1,5],[2,7],[3,5],[4,8],[5,7],[6,5],[7,9]]},{"name":"Transactions","rows":[[100,2,50],[101,2,30],[102,4,20],[103,6,70]]}],"runs":[{"expected":{"columns":["customer_id","count_no_trans"],"rows":[[5,2],[7,1],[9,1]]}}]},{"name":"One customer ever left empty-handed","setup":"CREATE TABLE Visits (visit_id INT PRIMARY KEY, customer_id INT);\nCREATE TABLE Transactions (transaction_id INT PRIMARY KEY, visit_id INT, amount INT);\nINSERT INTO Visits VALUES (10, 1), (11, 1), (12, 2), (13, 3), (14, 3); INSERT INTO Transactions VALUES (1, 10, 5), (2, 11, 5), (3, 12, 5);","tables":[{"name":"Visits","rows":[[10,1],[11,1],[12,2],[13,3],[14,3]]},{"name":"Transactions","rows":[[1,10,5],[2,11,5],[3,12,5]]}],"runs":[{"expected":{"columns":["customer_id","count_no_trans"],"rows":[[3,2]]}}]}]},"1587":{"id":1587,"title":"Bank Account Summary II","slug":"bank-account-summary-ii","difficulty":"Easy","module":"joins","patterns":["JOIN + SUM + HAVING"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>An account&#39;s balance is the sum of all its transaction amounts (negative for money sent). Return \u003ccode>name\u003c/code> and \u003ccode>balance\u003c/code> of users whose balance is \u003cstrong>higher than 10000\u003c/strong>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Sum amounts per account, then keep sums above 10000 — a HAVING condition.\u003c/p>\n","\u003cp>&quot;Higher than&quot; excludes exactly 10000.\u003c/p>\n"],"solution":{"sql":"SELECT u.name, SUM(t.amount) AS balance\nFROM Users u\nJOIN Transactions t ON t.account = u.account\nGROUP BY u.account, u.name\nHAVING SUM(t.amount) > 10000;","html":"\u003cp>Balances only exist after aggregation, so the filter is a HAVING. Jomo and Kara sit exactly at 10000 and are excluded.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT u.name, SUM(t.amount) AS balance FROM Users u JOIN Transactions t ON t.account = u.account GROUP BY u.account, u.name HAVING SUM(t.amount) >= 10000;","html":"\u003cp>Includes balances of exactly 10000.\u003c/p>\n"},{"sql":"SELECT u.name, SUM(t.amount) AS balance FROM Users u JOIN Transactions t ON t.account = u.account WHERE t.amount > 10000 GROUP BY u.account, u.name;","html":"\u003cp>Filters individual transactions, not balances.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Users","columns":[{"name":"account","type":"INT","pk":true},{"name":"name","type":"VARCHAR(20)","pk":false}]},{"name":"Transactions","columns":[{"name":"trans_id","type":"INT","pk":true},{"name":"account","type":"INT","pk":false},{"name":"amount","type":"INT","pk":false},{"name":"transacted_on","type":"DATE","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Users (account INT PRIMARY KEY, name VARCHAR(20));\nCREATE TABLE Transactions (trans_id INT PRIMARY KEY, account INT, amount INT, transacted_on DATE);\nINSERT INTO Users VALUES (700101, 'Ines'), (700102, 'Jomo'), (700103, 'Kara'), (700104, 'Luca'), (700105, 'Mina');\nINSERT INTO Transactions VALUES\n  (1, 700101, 8000, '2024-08-01'), (2, 700101, 5000, '2024-09-01'), (3, 700101, -2500, '2024-09-02'),\n  (4, 700102, 10000, '2024-08-12'),\n  (5, 700103, 4000, '2024-08-07'), (6, 700103, 7500, '2024-08-15'), (7, 700103, -1500, '2024-09-20'),\n  (8, 700105, 16000, '2024-08-30'), (9, 700105, -3000, '2024-09-01');","tables":[{"name":"Users","rows":[[700101,"Ines"],[700102,"Jomo"],[700103,"Kara"],[700104,"Luca"],[700105,"Mina"]]},{"name":"Transactions","rows":[[1,700101,8000,"2024-08-01"],[2,700101,5000,"2024-09-01"],[3,700101,-2500,"2024-09-02"],[4,700102,10000,"2024-08-12"],[5,700103,4000,"2024-08-07"],[6,700103,7500,"2024-08-15"],[7,700103,-1500,"2024-09-20"],[8,700105,16000,"2024-08-30"],[9,700105,-3000,"2024-09-01"]]}],"runs":[{"expected":{"columns":["name","balance"],"rows":[["Ines",10500],["Mina",13000]]}}]},{"name":"Just above, and exactly at, 10000","setup":"CREATE TABLE Users (account INT PRIMARY KEY, name VARCHAR(20));\nCREATE TABLE Transactions (trans_id INT PRIMARY KEY, account INT, amount INT, transacted_on DATE);\nINSERT INTO Users VALUES (1, 'Ari'), (2, 'Bea'), (3, 'Cy'); INSERT INTO Transactions VALUES (1, 1, 10001, '2024-01-01'), (2, 2, 20000, '2024-01-02'), (3, 2, -10000, '2024-01-03');","tables":[{"name":"Users","rows":[[1,"Ari"],[2,"Bea"],[3,"Cy"]]},{"name":"Transactions","rows":[[1,1,10001,"2024-01-01"],[2,2,20000,"2024-01-02"],[3,2,-10000,"2024-01-03"]]}],"runs":[{"expected":{"columns":["name","balance"],"rows":[["Ari",10001]]}}]}]},"1633":{"id":1633,"title":"Percentage of Users Attended a Contest","slug":"percentage-of-users-attended-a-contest","difficulty":"Easy","module":"subqueries","patterns":["scalar subquery denominator"],"sql50":true,"order":true,"kind":"query","taskHtml":"\u003cp>For each contest, return \u003ccode>contest_id\u003c/code> and \u003ccode>percentage\u003c/code>: the share of \u003cstrong>all users\u003c/strong> who registered for it, rounded to 2 decimals. Order by \u003ccode>percentage\u003c/code> descending, then \u003ccode>contest_id\u003c/code> ascending.\u003c/p>\n","notesHtml":"","hints":["\u003cp>The denominator is the number of users in \u003ccode>Users\u003c/code> — including users who never registered.\u003c/p>\n","\u003cp>Get it with a scalar subquery.\u003c/p>\n"],"solution":{"sql":"SELECT contest_id,\n       ROUND(100 * COUNT(user_id) / (SELECT COUNT(*) FROM Users), 2) AS percentage\nFROM Register\nGROUP BY contest_id\nORDER BY percentage DESC, contest_id;","html":"\u003cp>Per contest, registrations ÷ total users. Gael never registered but still counts in the denominator.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT contest_id, ROUND(100 * COUNT(user_id) / (SELECT COUNT(DISTINCT user_id) FROM Register), 2) AS percentage FROM Register GROUP BY contest_id ORDER BY percentage DESC, contest_id;","html":"\u003cp>Divides by users who registered somewhere, missing users who never registered.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Users","columns":[{"name":"user_id","type":"INT","pk":true},{"name":"user_name","type":"VARCHAR(20)","pk":false}]},{"name":"Register","columns":[{"name":"contest_id","type":"INT","pk":true},{"name":"user_id","type":"INT","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Users (user_id INT PRIMARY KEY, user_name VARCHAR(20));\nCREATE TABLE Register (contest_id INT, user_id INT, PRIMARY KEY (contest_id, user_id));\nINSERT INTO Users VALUES (1, 'Ama'), (2, 'Bo'), (3, 'Cleo'), (4, 'Dmitri'), (5, 'Esi'), (6, 'Femi'), (7, 'Gael');\nINSERT INTO Register VALUES\n  (208, 1), (208, 2), (208, 3), (208, 4), (208, 5), (208, 6),\n  (209, 1), (209, 2), (209, 5), (209, 6),\n  (210, 2), (210, 3), (210, 4), (210, 6),\n  (211, 5),\n  (212, 1), (212, 3);","tables":[{"name":"Users","rows":[[1,"Ama"],[2,"Bo"],[3,"Cleo"],[4,"Dmitri"],[5,"Esi"],[6,"Femi"],[7,"Gael"]]},{"name":"Register","rows":[[208,1],[208,2],[208,3],[208,4],[208,5],[208,6],[209,1],[209,2],[209,5],[209,6],[210,2],[210,3],[210,4],[210,6],[211,5],[212,1],[212,3]]}],"runs":[{"expected":{"columns":["contest_id","percentage"],"rows":[[208,85.71],[209,57.14],[210,57.14],[212,28.57],[211,14.29]]}}]},{"name":"A full house and a tie","setup":"CREATE TABLE Users (user_id INT PRIMARY KEY, user_name VARCHAR(20));\nCREATE TABLE Register (contest_id INT, user_id INT, PRIMARY KEY (contest_id, user_id));\nINSERT INTO Users VALUES (1, 'Ana'), (2, 'Bo'), (3, 'Cy'); INSERT INTO Register VALUES (5, 1), (5, 2), (5, 3), (3, 1), (4, 2);","tables":[{"name":"Users","rows":[[1,"Ana"],[2,"Bo"],[3,"Cy"]]},{"name":"Register","rows":[[5,1],[5,2],[5,3],[3,1],[4,2]]}],"runs":[{"expected":{"columns":["contest_id","percentage"],"rows":[[5,100],[3,33.33],[4,33.33]]}}]}]},"1661":{"id":1661,"title":"Average Time of Process per Machine","slug":"average-time-of-process-per-machine","difficulty":"Easy","module":"joins","patterns":["self-join","AVG"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Each process on a machine has a &#39;start&#39; and an &#39;end&#39; row with a float \u003ccode>timestamp\u003c/code> (seconds). For each \u003ccode>machine_id\u003c/code>, return \u003ccode>processing_time\u003c/code>: the average of (end − start) over its processes, rounded to \u003cstrong>3 decimals\u003c/strong>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Pair each start row with the end row of the same machine and process.\u003c/p>\n","\u003cp>Average the differences per machine, then round to 3 places.\u003c/p>\n"],"solution":{"sql":"SELECT s.machine_id,\n       ROUND(AVG(e.timestamp - s.timestamp), 3) AS processing_time\nFROM Activity s\nJOIN Activity e\n  ON e.machine_id = s.machine_id\n AND e.process_id = s.process_id\n AND e.activity_type = 'end'\nWHERE s.activity_type = 'start'\nGROUP BY s.machine_id;","html":"\u003cp>The self-join turns two rows per process into one row with both timestamps; then it is a plain AVG per machine.\u003c/p>\n"},"alternatives":[{"title":"Signed sum without a join","sql":"SELECT machine_id,\n       ROUND(SUM(IF(activity_type = 'end', timestamp, -timestamp)) / COUNT(DISTINCT process_id), 3) AS processing_time\nFROM Activity\nGROUP BY machine_id;","html":"\u003cp>Ends minus starts is the total processing time; divide by the number of processes (not rows — each process has two).\u003c/p>\n"}],"traps":[{"sql":"SELECT s.machine_id, AVG(e.timestamp - s.timestamp) AS processing_time FROM Activity s JOIN Activity e ON e.machine_id = s.machine_id AND e.process_id = s.process_id AND e.activity_type = 'end' WHERE s.activity_type = 'start' GROUP BY s.machine_id;","html":"\u003cp>Not rounded to 3 decimals (machine 3 averages 1.041666…).\u003c/p>\n"},{"sql":"SELECT machine_id, ROUND(SUM(IF(activity_type = 'end', timestamp, -timestamp)) / COUNT(*), 3) AS processing_time FROM Activity GROUP BY machine_id;","html":"\u003cp>Divides by the number of rows, which is twice the number of processes.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Activity","columns":[{"name":"machine_id","type":"INT","pk":true},{"name":"process_id","type":"INT","pk":true},{"name":"activity_type","type":"ENUM('START', 'END')","pk":true},{"name":"timestamp","type":"FLOAT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Activity (machine_id INT, process_id INT, activity_type ENUM('start', 'end'), `timestamp` FLOAT, PRIMARY KEY (machine_id, process_id, activity_type));\nINSERT INTO Activity VALUES\n  (0, 0, 'start', 1.250), (0, 0, 'end', 2.000), (0, 1, 'start', 5.000), (0, 1, 'end', 5.500),\n  (1, 0, 'start', 0.500), (1, 0, 'end', 1.500), (1, 1, 'start', 3.000), (1, 1, 'end', 3.250), (1, 2, 'start', 6.000), (1, 2, 'end', 8.125),\n  (2, 0, 'start', 2.000), (2, 0, 'end', 2.125), (2, 1, 'start', 9.000), (2, 1, 'end', 9.875),\n  (3, 0, 'start', 1.000), (3, 0, 'end', 2.000), (3, 1, 'start', 4.000), (3, 1, 'end', 5.000), (3, 2, 'start', 7.000), (3, 2, 'end', 8.125);","tables":[{"name":"Activity","rows":[[0,0,"start",1.25],[0,0,"end",2],[0,1,"start",5],[0,1,"end",5.5],[1,0,"start",0.5],[1,0,"end",1.5],[1,1,"start",3],[1,1,"end",3.25],[1,2,"start",6],[1,2,"end",8.125],[2,0,"start",2],[2,0,"end",2.125],[2,1,"start",9],[2,1,"end",9.875],[3,0,"start",1],[3,0,"end",2],[3,1,"start",4],[3,1,"end",5],[3,2,"start",7],[3,2,"end",8.125]]}],"runs":[{"expected":{"columns":["machine_id","processing_time"],"rows":[[0,0.625],[1,1.125],[2,0.5],[3,1.042]]}}]},{"name":"Odd numbers of processes","setup":"CREATE TABLE Activity (machine_id INT, process_id INT, activity_type ENUM('start', 'end'), `timestamp` FLOAT, PRIMARY KEY (machine_id, process_id, activity_type));\nINSERT INTO Activity VALUES (5, 0, 'start', 0.5), (5, 0, 'end', 2.75), (5, 1, 'start', 1.0), (5, 1, 'end', 1.25), (5, 2, 'start', 3.0), (5, 2, 'end', 3.125), (6, 0, 'start', 0.0), (6, 0, 'end', 0.75);","tables":[{"name":"Activity","rows":[[5,0,"start",0.5],[5,0,"end",2.75],[5,1,"start",1],[5,1,"end",1.25],[5,2,"start",3],[5,2,"end",3.125],[6,0,"start",0],[6,0,"end",0.75]]}],"runs":[{"expected":{"columns":["machine_id","processing_time"],"rows":[[5,0.875],[6,0.75]]}}]}]},"1667":{"id":1667,"title":"Fix Names in a Table","slug":"fix-names-in-a-table","difficulty":"Easy","module":"expressions","patterns":["string functions","CONCAT"],"sql50":true,"order":true,"kind":"query","taskHtml":"\u003cp>Fix every user&#39;s \u003ccode>name\u003c/code> so that only the first character is uppercase and the rest are lowercase. Return \u003ccode>user_id\u003c/code> and the fixed \u003ccode>name\u003c/code>, ordered by \u003ccode>user_id\u003c/code>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Split the name into its first character and the rest.\u003c/p>\n","\u003cp>\u003ccode>UPPER(LEFT(name, 1))\u003c/code> and \u003ccode>LOWER(SUBSTRING(name, 2))\u003c/code>, then glue them back together.\u003c/p>\n","\u003cp>In MySQL, \u003ccode>||\u003c/code> is not string concatenation — use CONCAT.\u003c/p>\n"],"solution":{"sql":"SELECT user_id,\n       CONCAT(UPPER(LEFT(name, 1)), LOWER(SUBSTRING(name, 2))) AS name\nFROM Users\nORDER BY user_id;","html":"\u003cp>\u003ccode>SUBSTRING(name, 2)\u003c/code> is everything from the second character on (an empty string for one-letter names), so single-character names work too.\u003c/p>\n"},"alternatives":[{"title":"INSERT() into the lower-cased name","sql":"SELECT user_id,\n       INSERT(LOWER(name), 1, 1, UPPER(LEFT(name, 1))) AS name\nFROM Users\nORDER BY user_id;","html":"\u003cp>MySQL&#39;s \u003ccode>INSERT(str, pos, len, new)\u003c/code> replaces \u003ccode>len\u003c/code> characters at \u003ccode>pos\u003c/code> — here, the first character of the lower-cased name.\u003c/p>\n"}],"traps":[{"sql":"SELECT user_id, CONCAT(UPPER(LEFT(name, 1)), SUBSTRING(name, 2)) AS name FROM Users ORDER BY user_id;","html":"\u003cp>The rest of the name keeps its original casing.\u003c/p>\n"},{"sql":"SELECT user_id, UPPER(LEFT(name, 1)) || LOWER(SUBSTRING(name, 2)) AS name FROM Users ORDER BY user_id;","html":"\u003cp>In MySQL \u003ccode>||\u003c/code> is logical OR, so every name becomes 0 or 1.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Users","columns":[{"name":"user_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(40)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Users (user_id INT PRIMARY KEY, name VARCHAR(40));\nINSERT INTO Users VALUES (1, 'nOAH'), (2, 'lIV'), (3, 'SAMIRA'), (4, 'jOsE'), (5, 'q'), (6, 'MaRiA');","tables":[{"name":"Users","rows":[[1,"nOAH"],[2,"lIV"],[3,"SAMIRA"],[4,"jOsE"],[5,"q"],[6,"MaRiA"]]}],"runs":[{"expected":{"columns":["user_id","name"],"rows":[[1,"Noah"],[2,"Liv"],[3,"Samira"],[4,"Jose"],[5,"Q"],[6,"Maria"]]}}]},{"name":"Hyphens, apostrophes and one-letter names","setup":"CREATE TABLE Users (user_id INT PRIMARY KEY, name VARCHAR(40));\nINSERT INTO Users VALUES (7, 'ANNA-MARIE'), (8, 'o''BRIEN'), (9, 'x'), (10, 'Already');","tables":[{"name":"Users","rows":[[7,"ANNA-MARIE"],[8,"o'BRIEN"],[9,"x"],[10,"Already"]]}],"runs":[{"expected":{"columns":["user_id","name"],"rows":[[7,"Anna-marie"],[8,"O'brien"],[9,"X"],[10,"Already"]]}}]}]},"1683":{"id":1683,"title":"Invalid Tweets","slug":"invalid-tweets","difficulty":"Easy","module":"expressions","patterns":["CHAR_LENGTH"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>A tweet is \u003cstrong>invalid\u003c/strong> if its \u003ccode>content\u003c/code> has strictly more than 15 characters (spaces count). Return the \u003ccode>tweet_id\u003c/code> of every invalid tweet, in any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Count characters with \u003ccode>CHAR_LENGTH\u003c/code>.\u003c/p>\n","\u003cp>&quot;Strictly more than 15&quot; means \u003ccode>&gt; 15\u003c/code>: a tweet of exactly 15 characters is fine.\u003c/p>\n"],"solution":{"sql":"SELECT tweet_id\nFROM Tweets\nWHERE CHAR_LENGTH(content) > 15;","html":"\u003cp>\u003ccode>CHAR_LENGTH\u003c/code> counts characters. \u003ccode>LENGTH\u003c/code> counts bytes, which only agrees on plain ASCII text.\u003c/p>\n"},"alternatives":[{"title":"LIKE with sixteen underscores","sql":"SELECT tweet_id\nFROM Tweets\nWHERE content LIKE '________________%';","html":"\u003cp>Each \u003ccode>_\u003c/code> matches exactly one character, so sixteen of them followed by \u003ccode>%\u003c/code> means &quot;at least 16 characters&quot;. It works, but \u003ccode>CHAR_LENGTH\u003c/code> says what you mean.\u003c/p>\n"}],"traps":[{"sql":"SELECT tweet_id FROM Tweets WHERE CHAR_LENGTH(content) >= 15;","html":"\u003cp>A tweet with exactly 15 characters is valid.\u003c/p>\n"},{"sql":"SELECT tweet_id FROM Tweets WHERE LENGTH(content) > 15;","html":"\u003cp>\u003ccode>LENGTH\u003c/code> counts bytes, not characters. \u003ccode>é\u003c/code> takes two bytes in UTF-8, so a 15-character tweet with accents looks too long. It only agrees with CHAR_LENGTH on plain ASCII.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Tweets","columns":[{"name":"tweet_id","type":"INT","pk":true},{"name":"content","type":"VARCHAR(50)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Tweets (tweet_id INT PRIMARY KEY, content VARCHAR(50));\nINSERT INTO Tweets VALUES\n  (1, 'Coffee first'), (2, 'Weekend plans are on hold again'), (3, 'fifteen chars!!'),\n  (4, 'sixteen letters!'), (5, 'Yo'), (6, 'two  spaces ok!');","tables":[{"name":"Tweets","rows":[[1,"Coffee first"],[2,"Weekend plans are on hold again"],[3,"fifteen chars!!"],[4,"sixteen letters!"],[5,"Yo"],[6,"two  spaces ok!"]]}],"runs":[{"expected":{"columns":["tweet_id"],"rows":[[2],[4]]}}]},{"name":"Accented letters count once","setup":"CREATE TABLE Tweets (tweet_id INT PRIMARY KEY, content VARCHAR(50));\nINSERT INTO Tweets VALUES (7, 'café au lait :)'), (8, 'naïve résumé ok!'), (9, '');","tables":[{"name":"Tweets","rows":[[7,"café au lait :)"],[8,"naïve résumé ok!"],[9,""]]}],"runs":[{"expected":{"columns":["tweet_id"],"rows":[[8]]}}]}]},"1693":{"id":1693,"title":"Daily Leads and Partners","slug":"daily-leads-and-partners","difficulty":"Easy","module":"aggregation","patterns":["COUNT(DISTINCT)","multi-column GROUP BY"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>\u003ccode>DailySales\u003c/code> may contain duplicate rows. For each \u003ccode>date_id\u003c/code> and \u003ccode>make_name\u003c/code>, return \u003ccode>unique_leads\u003c/code> (distinct \u003ccode>lead_id\u003c/code>s) and \u003ccode>unique_partners\u003c/code> (distinct \u003ccode>partner_id\u003c/code>s). Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>The grain is (date, make) — group by both.\u003c/p>\n","\u003cp>Count distinct values of each id column.\u003c/p>\n"],"solution":{"sql":"SELECT date_id, make_name,\n       COUNT(DISTINCT lead_id)    AS unique_leads,\n       COUNT(DISTINCT partner_id) AS unique_partners\nFROM DailySales\nGROUP BY date_id, make_name;","html":"\u003cp>Two independent distinct counts over the same group.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT date_id, make_name, COUNT(lead_id) AS unique_leads, COUNT(partner_id) AS unique_partners FROM DailySales GROUP BY date_id, make_name;","html":"\u003cp>Counts rows, including duplicates and repeated ids.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"DailySales","columns":[{"name":"date_id","type":"DATE","pk":false},{"name":"make_name","type":"VARCHAR(20)","pk":false},{"name":"lead_id","type":"INT","pk":false},{"name":"partner_id","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE DailySales (date_id DATE, make_name VARCHAR(20), lead_id INT, partner_id INT);\nINSERT INTO DailySales VALUES\n  ('2024-05-01', 'kia', 1, 10), ('2024-05-01', 'kia', 1, 10), ('2024-05-01', 'kia', 2, 10),\n  ('2024-05-01', 'ford', 1, 11),\n  ('2024-05-02', 'kia', 3, 12), ('2024-05-02', 'kia', 3, 13),\n  ('2024-05-02', 'ford', 4, 11), ('2024-05-02', 'ford', 5, 11), ('2024-05-02', 'ford', 4, 14);","tables":[{"name":"DailySales","rows":[["2024-05-01","kia",1,10],["2024-05-01","kia",1,10],["2024-05-01","kia",2,10],["2024-05-01","ford",1,11],["2024-05-02","kia",3,12],["2024-05-02","kia",3,13],["2024-05-02","ford",4,11],["2024-05-02","ford",5,11],["2024-05-02","ford",4,14]]}],"runs":[{"expected":{"columns":["date_id","make_name","unique_leads","unique_partners"],"rows":[["2024-05-01","ford",1,1],["2024-05-01","kia",2,1],["2024-05-02","ford",2,2],["2024-05-02","kia",1,2]]}}]},{"name":"One make, heavy duplicates","setup":"CREATE TABLE DailySales (date_id DATE, make_name VARCHAR(20), lead_id INT, partner_id INT);\nINSERT INTO DailySales VALUES ('2024-06-01', 'audi', 1, 1), ('2024-06-01', 'audi', 1, 1), ('2024-06-01', 'audi', 1, 1), ('2024-06-01', 'audi', 2, 1);","tables":[{"name":"DailySales","rows":[["2024-06-01","audi",1,1],["2024-06-01","audi",1,1],["2024-06-01","audi",1,1],["2024-06-01","audi",2,1]]}],"runs":[{"expected":{"columns":["date_id","make_name","unique_leads","unique_partners"],"rows":[["2024-06-01","audi",2,1]]}}]}]},"1729":{"id":1729,"title":"Find Followers Count","slug":"find-followers-count","difficulty":"Easy","module":"aggregation","patterns":["GROUP BY","ORDER BY"],"sql50":true,"order":true,"kind":"query","taskHtml":"\u003cp>Each row of \u003ccode>Followers\u003c/code> says \u003ccode>follower_id\u003c/code> follows \u003ccode>user_id\u003c/code>. For each user, return \u003ccode>user_id\u003c/code> and \u003ccode>followers_count\u003c/code>, \u003cstrong>ordered by \u003ccode>user_id\u003c/code>\u003c/strong>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Who is being followed? That column is the group.\u003c/p>\n","\u003cp>Count rows per group and sort.\u003c/p>\n"],"solution":{"sql":"SELECT user_id, COUNT(follower_id) AS followers_count\nFROM Followers\nGROUP BY user_id\nORDER BY user_id;","html":"\u003cp>Group by the followed user; each row in the group is one follower.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT follower_id AS user_id, COUNT(*) AS followers_count FROM Followers GROUP BY follower_id ORDER BY follower_id;","html":"\u003cp>Grouping by \u003ccode>follower_id\u003c/code> counts how many people each user \u003cem>follows\u003c/em>, not their followers.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Followers","columns":[{"name":"user_id","type":"INT","pk":true},{"name":"follower_id","type":"INT","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Followers (user_id INT, follower_id INT, PRIMARY KEY (user_id, follower_id));\nINSERT INTO Followers VALUES (1, 4), (1, 7), (2, 1), (4, 1), (4, 2), (4, 7), (7, 3), (9, 4);","tables":[{"name":"Followers","rows":[[1,4],[1,7],[2,1],[4,1],[4,2],[4,7],[7,3],[9,4]]}],"runs":[{"expected":{"columns":["user_id","followers_count"],"rows":[[1,2],[2,1],[4,3],[7,1],[9,1]]}}]},{"name":"Users inserted out of order","setup":"CREATE TABLE Followers (user_id INT, follower_id INT, PRIMARY KEY (user_id, follower_id));\nINSERT INTO Followers VALUES (12, 3), (5, 12), (5, 3), (3, 5);","tables":[{"name":"Followers","rows":[[12,3],[5,12],[5,3],[3,5]]}],"runs":[{"expected":{"columns":["user_id","followers_count"],"rows":[[3,1],[5,2],[12,1]]}}]}]},"1731":{"id":1731,"title":"The Number of Employees Which Report to Each Employee","slug":"the-number-of-employees-which-report-to-each-employee","difficulty":"Easy","module":"joins","patterns":["self-join","ROUND half up"],"sql50":true,"order":true,"kind":"query","taskHtml":"\u003cp>A manager is an employee with at least one direct report. For each manager, return \u003ccode>employee_id\u003c/code>, \u003ccode>name\u003c/code>, \u003ccode>reports_count\u003c/code> (direct reports) and \u003ccode>average_age\u003c/code> (average age of those reports, \u003cstrong>rounded to the nearest integer\u003c/strong>). Order by \u003ccode>employee_id\u003c/code>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Join each report to their manager (self-join on \u003ccode>reports_to\u003c/code>).\u003c/p>\n","\u003cp>Group per manager; ROUND the average — Ines&#39;s reports average 36.5.\u003c/p>\n"],"solution":{"sql":"SELECT m.employee_id, m.name,\n       COUNT(*)          AS reports_count,\n       ROUND(AVG(e.age)) AS average_age\nFROM Employees m\nJOIN Employees e ON e.reports_to = m.employee_id\nGROUP BY m.employee_id, m.name\nORDER BY m.employee_id;","html":"\u003cp>An INNER self-join keeps only employees who have reports. MySQL rounds 36.5 half away from zero, to 37.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT m.employee_id, m.name, COUNT(*) AS reports_count, FLOOR(AVG(e.age)) AS average_age FROM Employees m JOIN Employees e ON e.reports_to = m.employee_id GROUP BY m.employee_id, m.name ORDER BY m.employee_id;","html":"\u003cp>FLOOR truncates 36.5 to 36; the task asks for rounding.\u003c/p>\n"},{"sql":"SELECT m.employee_id, m.name, COUNT(e.employee_id) AS reports_count, ROUND(AVG(e.age)) AS average_age FROM Employees m LEFT JOIN Employees e ON e.reports_to = m.employee_id GROUP BY m.employee_id, m.name ORDER BY m.employee_id;","html":"\u003cp>A LEFT JOIN also lists employees with no reports, who are not managers.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employees","columns":[{"name":"employee_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(20)","pk":false},{"name":"reports_to","type":"INT","pk":false},{"name":"age","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, name VARCHAR(20), reports_to INT, age INT);\nINSERT INTO Employees VALUES\n  (1, 'Ines', NULL, 50), (2, 'Jack', 1, 36), (3, 'Kofi', 1, 37),\n  (4, 'Lara', NULL, 45), (5, 'Moe', 4, 30), (6, 'Nils', 4, 31), (7, 'Opal', 4, 33),\n  (8, 'Pim', 2, 25), (9, 'Quin', NULL, 60);","tables":[{"name":"Employees","rows":[[1,"Ines",null,50],[2,"Jack",1,36],[3,"Kofi",1,37],[4,"Lara",null,45],[5,"Moe",4,30],[6,"Nils",4,31],[7,"Opal",4,33],[8,"Pim",2,25],[9,"Quin",null,60]]}],"runs":[{"expected":{"columns":["employee_id","name","reports_count","average_age"],"rows":[[1,"Ines",2,37],[2,"Jack",1,25],[4,"Lara",3,31]]}}]},{"name":"Managers who report to managers","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, name VARCHAR(20), reports_to INT, age INT);\nINSERT INTO Employees VALUES (1, 'Ana', NULL, 40), (2, 'Ben', 1, 30), (3, 'Cy', 1, 31), (4, 'Dot', 2, 20), (5, 'Eve', 3, 22), (6, 'Fin', 3, 23);","tables":[{"name":"Employees","rows":[[1,"Ana",null,40],[2,"Ben",1,30],[3,"Cy",1,31],[4,"Dot",2,20],[5,"Eve",3,22],[6,"Fin",3,23]]}],"runs":[{"expected":{"columns":["employee_id","name","reports_count","average_age"],"rows":[[1,"Ana",2,31],[2,"Ben",1,20],[3,"Cy",2,23]]}}]}]},"1741":{"id":1741,"title":"Find Total Time Spent by Each Employee","slug":"find-total-time-spent-by-each-employee","difficulty":"Easy","module":"aggregation","patterns":["SUM of an expression"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>An employee can enter and leave the office several times a day; each row is one visit with \u003ccode>in_time\u003c/code> and \u003ccode>out_time\u003c/code> in minutes. For each day and employee, return \u003ccode>day\u003c/code> (the \u003ccode>event_day\u003c/code>), \u003ccode>emp_id\u003c/code> and \u003ccode>total_time\u003c/code> — the sum of \u003ccode>out_time - in_time\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>The grain is (day, employee).\u003c/p>\n","\u003cp>Aggregate the expression \u003ccode>out_time - in_time\u003c/code>.\u003c/p>\n"],"solution":{"sql":"SELECT event_day AS day, emp_id,\n       SUM(out_time - in_time) AS total_time\nFROM Employees\nGROUP BY event_day, emp_id;","html":"\u003cp>Aggregates accept any per-row expression; the subtraction happens per visit, then SUM adds the visits of each (day, employee) group.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT MIN(event_day) AS day, emp_id, SUM(out_time - in_time) AS total_time FROM Employees GROUP BY emp_id;","html":"\u003cp>Grouping only by employee adds up time across different days.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employees","columns":[{"name":"emp_id","type":"INT","pk":true},{"name":"event_day","type":"DATE","pk":true},{"name":"in_time","type":"INT","pk":true},{"name":"out_time","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employees (emp_id INT, event_day DATE, in_time INT, out_time INT, PRIMARY KEY (emp_id, event_day, in_time));\nINSERT INTO Employees VALUES\n  (7, '2024-03-11', 10, 70), (7, '2024-03-11', 100, 250), (7, '2024-03-14', 5, 45),\n  (8, '2024-03-11', 30, 90), (8, '2024-03-20', 600, 660),\n  (9, '2024-03-20', 1, 2), (9, '2024-03-20', 5, 25);","tables":[{"name":"Employees","rows":[[7,"2024-03-11",10,70],[7,"2024-03-11",100,250],[7,"2024-03-14",5,45],[8,"2024-03-11",30,90],[8,"2024-03-20",600,660],[9,"2024-03-20",1,2],[9,"2024-03-20",5,25]]}],"runs":[{"expected":{"columns":["day","emp_id","total_time"],"rows":[["2024-03-11",7,210],["2024-03-14",7,40],["2024-03-11",8,60],["2024-03-20",8,60],["2024-03-20",9,21]]}}]},{"name":"Many short visits in a day","setup":"CREATE TABLE Employees (emp_id INT, event_day DATE, in_time INT, out_time INT, PRIMARY KEY (emp_id, event_day, in_time));\nINSERT INTO Employees VALUES (1, '2024-04-01', 0, 1), (1, '2024-04-01', 2, 3), (1, '2024-04-01', 4, 10), (2, '2024-04-02', 0, 1439);","tables":[{"name":"Employees","rows":[[1,"2024-04-01",0,1],[1,"2024-04-01",2,3],[1,"2024-04-01",4,10],[2,"2024-04-02",0,1439]]}],"runs":[{"expected":{"columns":["day","emp_id","total_time"],"rows":[["2024-04-01",1,8],["2024-04-02",2,1439]]}}]}]},"1757":{"id":1757,"title":"Recyclable and Low Fat Products","slug":"recyclable-and-low-fat-products","difficulty":"Easy","module":"basics","patterns":["WHERE with AND"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Return the \u003ccode>product_id\u003c/code> of every product that is \u003cstrong>both\u003c/strong> low fat (\u003ccode>low_fats = &#39;Y&#39;\u003c/code>) and recyclable (\u003ccode>recyclable = &#39;Y&#39;\u003c/code>). Any row order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Both conditions have to hold on the same row. Which logical operator is that?\u003c/p>\n","\u003cp>The ENUM columns hold the strings &#39;Y&#39; and &#39;N&#39; — compare them like any text column.\u003c/p>\n"],"solution":{"sql":"SELECT product_id\nFROM Products\nWHERE low_fats = 'Y'\n  AND recyclable = 'Y';","html":"\u003cp>A pure row filter: \u003ccode>WHERE\u003c/code> keeps a row only when the whole condition is TRUE, and \u003ccode>AND\u003c/code> needs both sides TRUE. ENUM values compare as strings.\u003c/p>\n"},"alternatives":[{"title":"Row constructor","sql":"SELECT product_id\nFROM Products\nWHERE (low_fats, recyclable) = ('Y', 'Y');","html":"\u003cp>MySQL can compare tuples: \u003ccode>(a, b) = (x, y)\u003c/code> means \u003ccode>a = x AND b = y\u003c/code>. Handy when you match on several columns at once.\u003c/p>\n"}],"traps":[{"sql":"SELECT product_id FROM Products WHERE low_fats = 'Y' OR recyclable = 'Y';","html":"\u003cp>\u003ccode>OR\u003c/code> keeps products that satisfy just one of the two conditions.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Products","columns":[{"name":"product_id","type":"INT","pk":true},{"name":"low_fats","type":"ENUM('Y','N')","pk":false},{"name":"recyclable","type":"ENUM('Y','N')","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Products (product_id INT PRIMARY KEY, low_fats ENUM('Y','N'), recyclable ENUM('Y','N'));\nINSERT INTO Products VALUES (10,'N','Y'), (11,'Y','Y'), (12,'Y','N'), (13,'N','N'), (14,'Y','Y'), (15,'N','Y'), (16,'Y','Y');","tables":[{"name":"Products","rows":[[10,"N","Y"],[11,"Y","Y"],[12,"Y","N"],[13,"N","N"],[14,"Y","Y"],[15,"N","Y"],[16,"Y","Y"]]}],"runs":[{"expected":{"columns":["product_id"],"rows":[[11],[14],[16]]}}]},{"name":"Nothing qualifies","setup":"CREATE TABLE Products (product_id INT PRIMARY KEY, low_fats ENUM('Y','N'), recyclable ENUM('Y','N'));\nINSERT INTO Products VALUES (1,'Y','N'), (2,'N','Y'), (3,'N','N');","tables":[{"name":"Products","rows":[[1,"Y","N"],[2,"N","Y"],[3,"N","N"]]}],"runs":[{"expected":{"columns":["product_id"],"rows":[]}}]}]},"1789":{"id":1789,"title":"Primary Department for Each Employee","slug":"primary-department-for-each-employee","difficulty":"Easy","module":"sets","patterns":["UNION of two cases"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>An employee can belong to several departments, one of which is flagged primary (\u003ccode>primary_flag = &#39;Y&#39;\u003c/code>). An employee who belongs to a \u003cstrong>single\u003c/strong> department has it flagged &#39;N&#39;. Return \u003ccode>employee_id\u003c/code> and \u003ccode>department_id\u003c/code> of each employee&#39;s primary department — or their only department. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Two disjoint cases: rows flagged Y, and employees with exactly one row.\u003c/p>\n","\u003cp>Answer each case with its own SELECT and stack them.\u003c/p>\n","\u003cp>In the grouped branch, \u003ccode>department_id\u003c/code> is neither grouped nor aggregated — MySQL will complain.\u003c/p>\n"],"solution":{"sql":"SELECT employee_id, department_id\nFROM Employee\nWHERE primary_flag = 'Y'\nUNION\nSELECT employee_id, MAX(department_id) AS department_id\nFROM Employee\nGROUP BY employee_id\nHAVING COUNT(*) = 1;","html":"\u003cp>The grouped branch finds single-department employees; \u003ccode>MAX(department_id)\u003c/code> is just a legal way to fetch the only value (ONLY_FULL_GROUP_BY rejects the bare column).\u003c/p>\n"},"alternatives":[{"title":"Window count","sql":"SELECT employee_id, department_id\nFROM (\n  SELECT e.*, COUNT(*) OVER (PARTITION BY employee_id) AS n\n  FROM Employee e\n) t\nWHERE primary_flag = 'Y' OR n = 1;","html":"\u003cp>Annotate each row with how many departments its employee has, then keep primary rows and only-rows in one pass.\u003c/p>\n"}],"traps":[{"sql":"SELECT employee_id, department_id FROM Employee WHERE primary_flag = 'Y' UNION SELECT employee_id, department_id FROM Employee GROUP BY employee_id HAVING COUNT(*) = 1;","html":"\u003cp>Returns the right rows, but MySQL rejects the bare \u003ccode>department_id\u003c/code> in the grouped branch (ONLY_FULL_GROUP_BY).\u003c/p>\n"},{"sql":"SELECT employee_id, department_id FROM Employee WHERE primary_flag = 'Y';","html":"\u003cp>Misses employees who belong to a single department (flagged N).\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employee","columns":[{"name":"employee_id","type":"INT","pk":true},{"name":"department_id","type":"INT","pk":true},{"name":"primary_flag","type":"ENUM('Y', 'N')","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employee (employee_id INT, department_id INT, primary_flag ENUM('Y', 'N'), PRIMARY KEY (employee_id, department_id));\nINSERT INTO Employee VALUES (1, 2, 'N'), (2, 3, 'N'), (2, 5, 'Y'), (3, 7, 'N'), (4, 1, 'Y'), (4, 2, 'N'), (4, 6, 'N'), (5, 4, 'N');","tables":[{"name":"Employee","rows":[[1,2,"N"],[2,3,"N"],[2,5,"Y"],[3,7,"N"],[4,1,"Y"],[4,2,"N"],[4,6,"N"],[5,4,"N"]]}],"runs":[{"expected":{"columns":["employee_id","department_id"],"rows":[[1,2],[2,5],[3,7],[4,1],[5,4]]}}]},{"name":"Everyone has a single department","setup":"CREATE TABLE Employee (employee_id INT, department_id INT, primary_flag ENUM('Y', 'N'), PRIMARY KEY (employee_id, department_id));\nINSERT INTO Employee VALUES (1, 10, 'N'), (2, 20, 'N');","tables":[{"name":"Employee","rows":[[1,10,"N"],[2,20,"N"]]}],"runs":[{"expected":{"columns":["employee_id","department_id"],"rows":[[1,10],[2,20]]}}]}]},"1795":{"id":1795,"title":"Rearrange Products Table","slug":"rearrange-products-table","difficulty":"Easy","module":"sets","patterns":["unpivot with UNION ALL"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>\u003ccode>Products\u003c/code> has one price column per store (\u003ccode>store1\u003c/code>, \u003ccode>store2\u003c/code>, \u003ccode>store3\u003c/code>); NULL means the store doesn&#39;t sell the product. Rearrange it into rows of (\u003ccode>product_id\u003c/code>, \u003ccode>store\u003c/code>, \u003ccode>price\u003c/code>), where \u003ccode>store\u003c/code> is the column&#39;s name. Skip the NULL prices. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>One SELECT per store column, each labelling its rows with a constant store name.\u003c/p>\n","\u003cp>Stack them with UNION ALL and drop NULL prices.\u003c/p>\n"],"solution":{"sql":"SELECT product_id, 'store1' AS store, store1 AS price FROM Products WHERE store1 IS NOT NULL\nUNION ALL\nSELECT product_id, 'store2', store2 FROM Products WHERE store2 IS NOT NULL\nUNION ALL\nSELECT product_id, 'store3', store3 FROM Products WHERE store3 IS NOT NULL;","html":"\u003cp>Each branch turns one column into rows. Column names come from the first branch, so only it needs aliases.\u003c/p>\n"},"alternatives":[{"title":"Cross join with a list of stores","sql":"SELECT product_id, store, price\nFROM (\n  SELECT p.product_id, s.store,\n         CASE s.store WHEN 'store1' THEN p.store1\n                      WHEN 'store2' THEN p.store2\n                      ELSE p.store3 END AS price\n  FROM Products p\n  CROSS JOIN (SELECT 'store1' AS store UNION ALL SELECT 'store2' UNION ALL SELECT 'store3') s\n) t\nWHERE price IS NOT NULL;","html":"\u003cp>Pair every product with every store, pick the matching column with CASE, then filter in an outer query — \u003ccode>price\u003c/code> is an alias, so WHERE could not use it at the same level.\u003c/p>\n"}],"traps":[{"sql":"SELECT product_id, 'store1' AS store, store1 AS price FROM Products UNION ALL SELECT product_id, 'store2', store2 FROM Products UNION ALL SELECT product_id, 'store3', store3 FROM Products;","html":"\u003cp>Keeps rows with NULL prices for stores that do not sell the product.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Products","columns":[{"name":"product_id","type":"INT","pk":true},{"name":"store1","type":"INT","pk":false},{"name":"store2","type":"INT","pk":false},{"name":"store3","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Products (product_id INT PRIMARY KEY, store1 INT, store2 INT, store3 INT);\nINSERT INTO Products VALUES (10, 50, NULL, 60), (11, 20, 25, 30), (12, NULL, 70, NULL), (13, NULL, NULL, NULL);","tables":[{"name":"Products","rows":[[10,50,null,60],[11,20,25,30],[12,null,70,null],[13,null,null,null]]}],"runs":[{"expected":{"columns":["product_id","store","price"],"rows":[[10,"store1",50],[11,"store1",20],[11,"store2",25],[12,"store2",70],[10,"store3",60],[11,"store3",30]]}}]},{"name":"Only one store sells anything","setup":"CREATE TABLE Products (product_id INT PRIMARY KEY, store1 INT, store2 INT, store3 INT);\nINSERT INTO Products VALUES (1, NULL, NULL, 5), (2, NULL, NULL, NULL);","tables":[{"name":"Products","rows":[[1,null,null,5],[2,null,null,null]]}],"runs":[{"expected":{"columns":["product_id","store","price"],"rows":[[1,"store3",5]]}}]}]},"1873":{"id":1873,"title":"Calculate Special Bonus","slug":"calculate-special-bonus","difficulty":"Easy","module":"expressions","patterns":["CASE / IF","LIKE prefix"],"sql50":false,"order":true,"kind":"query","taskHtml":"\u003cp>An employee&#39;s \u003ccode>bonus\u003c/code> equals their \u003ccode>salary\u003c/code> if their \u003ccode>employee_id\u003c/code> is \u003cstrong>odd\u003c/strong> and their \u003ccode>name\u003c/code> does \u003cstrong>not\u003c/strong> start with \u003ccode>&#39;M&#39;\u003c/code>; otherwise the bonus is 0. Return \u003ccode>employee_id\u003c/code> and \u003ccode>bonus\u003c/code> for \u003cstrong>every\u003c/strong> employee, ordered by \u003ccode>employee_id\u003c/code>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Everyone appears in the output, so the rule belongs in SELECT, not in WHERE.\u003c/p>\n","\u003cp>Odd: \u003ccode>employee_id % 2 = 1\u003c/code>. Doesn&#39;t start with M: \u003ccode>name NOT LIKE &#39;M%&#39;\u003c/code>.\u003c/p>\n"],"solution":{"sql":"SELECT employee_id,\n       CASE WHEN employee_id % 2 = 1 AND name NOT LIKE 'M%'\n            THEN salary ELSE 0 END AS bonus\nFROM Employees\nORDER BY employee_id;","html":"\u003cp>A per-row computed column: \u003ccode>CASE\u003c/code> returns the salary when both conditions hold, else 0.\u003c/p>\n"},"alternatives":[{"title":"IF()","sql":"SELECT employee_id,\n       IF(employee_id % 2 = 1 AND LEFT(name, 1) \u003c> 'M', salary, 0) AS bonus\nFROM Employees\nORDER BY employee_id;","html":"\u003cp>MySQL&#39;s two-branch shorthand, with \u003ccode>LEFT(name, 1)\u003c/code> instead of LIKE.\u003c/p>\n"},{"title":"Multiply by a boolean","sql":"SELECT employee_id,\n       salary * (employee_id % 2 = 1 AND name NOT LIKE 'M%') AS bonus\nFROM Employees\nORDER BY employee_id;","html":"\u003cp>In MySQL a condition is 1 or 0, so multiplying by it zeroes the salary when the rule fails. Clever, but CASE says what you mean.\u003c/p>\n"}],"traps":[{"sql":"SELECT employee_id, salary AS bonus FROM Employees WHERE employee_id % 2 = 1 AND name NOT LIKE 'M%' ORDER BY employee_id;","html":"\u003cp>Filtering drops the employees whose bonus should be 0 — every employee must appear.\u003c/p>\n"},{"sql":"SELECT employee_id, CASE WHEN employee_id % 2 = 1 OR name NOT LIKE 'M%' THEN salary ELSE 0 END AS bonus FROM Employees ORDER BY employee_id;","html":"\u003cp>\u003ccode>OR\u003c/code> pays a bonus when only one condition holds.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employees","columns":[{"name":"employee_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(30)","pk":false},{"name":"salary","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, name VARCHAR(30), salary INT);\nINSERT INTO Employees VALUES\n  (1, 'Maya', 9000), (2, 'Noor', 5000), (3, 'Oscar', 7000), (4, 'Mike', 6000),\n  (5, 'Pedro', 4000), (6, 'Quincy', 3000), (7, 'Mona', 2500), (9, 'Ibrahim', 8000);","tables":[{"name":"Employees","rows":[[1,"Maya",9000],[2,"Noor",5000],[3,"Oscar",7000],[4,"Mike",6000],[5,"Pedro",4000],[6,"Quincy",3000],[7,"Mona",2500],[9,"Ibrahim",8000]]}],"runs":[{"expected":{"columns":["employee_id","bonus"],"rows":[[1,0],[2,0],[3,7000],[4,0],[5,4000],[6,0],[7,0],[9,8000]]}}]},{"name":"An M in the middle of the name","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, name VARCHAR(30), salary INT);\nINSERT INTO Employees VALUES (11, 'Emma', 3000), (12, 'Sam', 2000), (13, 'Adam', 4000), (15, 'Mo', 1000);","tables":[{"name":"Employees","rows":[[11,"Emma",3000],[12,"Sam",2000],[13,"Adam",4000],[15,"Mo",1000]]}],"runs":[{"expected":{"columns":["employee_id","bonus"],"rows":[[11,3000],[12,0],[13,4000],[15,0]]}}]}]},"1890":{"id":1890,"title":"The Latest Login in 2020","slug":"the-latest-login-in-2020","difficulty":"Easy","module":"aggregation","patterns":["MAX per group","date range filter"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>\u003ccode>Logins\u003c/code> records each login as a \u003ccode>time_stamp\u003c/code> (DATETIME). For every user who logged in during \u003cstrong>2020\u003c/strong>, return \u003ccode>user_id\u003c/code> and \u003ccode>last_stamp\u003c/code> — their latest login in 2020. Users with no 2020 login don&#39;t appear. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Filter to 2020 first (WHERE), then aggregate.\u003c/p>\n","\u003cp>Careful with the last day of the year: these are timestamps, not dates.\u003c/p>\n"],"solution":{"sql":"SELECT user_id, MAX(time_stamp) AS last_stamp\nFROM Logins\nWHERE time_stamp >= '2020-01-01' AND time_stamp \u003c '2021-01-01'\nGROUP BY user_id;","html":"\u003cp>A half-open range covers every instant of 2020, including 23:59:59 on Dec 31. Filtering happens before grouping, so users with no 2020 rows form no group at all.\u003c/p>\n"},"alternatives":[{"title":"YEAR()","sql":"SELECT user_id, MAX(time_stamp) AS last_stamp\nFROM Logins\nWHERE YEAR(time_stamp) = 2020\nGROUP BY user_id;","html":"\u003cp>Reads nicely, but wrapping the column in a function prevents MySQL from using an index on \u003ccode>time_stamp\u003c/code> (Module 13). The range form is the habit to build.\u003c/p>\n"}],"traps":[{"sql":"SELECT user_id, MAX(time_stamp) AS last_stamp FROM Logins WHERE time_stamp BETWEEN '2020-01-01' AND '2020-12-31' GROUP BY user_id;","html":"\u003cp>The upper bound means Dec 31 at 00:00:00, so user 9&#39;s login at 23:59:59 that day is lost.\u003c/p>\n"},{"sql":"SELECT user_id, MAX(time_stamp) AS last_stamp FROM Logins GROUP BY user_id HAVING YEAR(MAX(time_stamp)) = 2020;","html":"\u003cp>Takes each user&#39;s overall latest login first — user 3&#39;s latest is in 2021, so user 3 disappears.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Logins","columns":[{"name":"user_id","type":"INT","pk":true},{"name":"time_stamp","type":"DATETIME","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Logins (user_id INT, time_stamp DATETIME, PRIMARY KEY (user_id, time_stamp));\nINSERT INTO Logins VALUES\n  (3, '2020-03-15 08:00:00'), (3, '2020-11-02 19:45:10'), (3, '2021-01-01 00:00:01'),\n  (5, '2019-12-31 23:59:59'), (5, '2021-02-02 10:00:00'),\n  (7, '2020-01-01 00:00:00'),\n  (9, '2020-12-31 23:59:59'), (9, '2020-06-01 12:00:00'), (9, '2019-05-05 05:05:05');","tables":[{"name":"Logins","rows":[[3,"2020-03-15 08:00:00"],[3,"2020-11-02 19:45:10"],[3,"2021-01-01 00:00:01"],[5,"2019-12-31 23:59:59"],[5,"2021-02-02 10:00:00"],[7,"2020-01-01 00:00:00"],[9,"2020-12-31 23:59:59"],[9,"2020-06-01 12:00:00"],[9,"2019-05-05 05:05:05"]]}],"runs":[{"expected":{"columns":["user_id","last_stamp"],"rows":[[3,"2020-11-02 19:45:10"],[7,"2020-01-01 00:00:00"],[9,"2020-12-31 23:59:59"]]}}]},{"name":"Logins right at the year boundaries","setup":"CREATE TABLE Logins (user_id INT, time_stamp DATETIME, PRIMARY KEY (user_id, time_stamp));\nINSERT INTO Logins VALUES (1, '2020-12-31 23:59:59'), (1, '2021-01-01 00:00:00'), (2, '2020-01-01 00:00:00'), (2, '2019-12-31 23:59:59'), (4, '2021-06-01 10:00:00');","tables":[{"name":"Logins","rows":[[1,"2020-12-31 23:59:59"],[1,"2021-01-01 00:00:00"],[2,"2020-01-01 00:00:00"],[2,"2019-12-31 23:59:59"],[4,"2021-06-01 10:00:00"]]}],"runs":[{"expected":{"columns":["user_id","last_stamp"],"rows":[[1,"2020-12-31 23:59:59"],[2,"2020-01-01 00:00:00"]]}}]}]},"1907":{"id":1907,"title":"Count Salary Categories","slug":"count-salary-categories","difficulty":"Medium","module":"sets","patterns":["fixed category list","zero rows at zero count"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Count the accounts in each salary category and return \u003ccode>category\u003c/code> and \u003ccode>accounts_count\u003c/code>:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>&#39;Low Salary&#39;\u003c/code>: income strictly below 20000;\u003c/li>\n\u003cli>\u003ccode>&#39;Average Salary&#39;\u003c/code>: income from 20000 to 50000 inclusive;\u003c/li>\n\u003cli>\u003ccode>&#39;High Salary&#39;\u003c/code>: income strictly above 50000.\u003c/li>\n\u003c/ul>\n\u003cp>All three categories must appear, with 0 when empty. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>GROUP BY only creates groups that have rows — an empty category would vanish.\u003c/p>\n","\u003cp>Produce each category row yourself: one SELECT per category, stacked with UNION ALL.\u003c/p>\n","\u003cp>Count with something that yields 0 (not NULL) on an empty table.\u003c/p>\n"],"solution":{"sql":"SELECT 'Low Salary' AS category, COUNT(CASE WHEN income \u003c 20000 THEN 1 END) AS accounts_count FROM Accounts\nUNION ALL\nSELECT 'Average Salary', COUNT(CASE WHEN income BETWEEN 20000 AND 50000 THEN 1 END) FROM Accounts\nUNION ALL\nSELECT 'High Salary', COUNT(CASE WHEN income > 50000 THEN 1 END) FROM Accounts;","html":"\u003cp>Each branch is an aggregate without GROUP BY, so it always returns exactly one row — even when no account matches, or the table is empty (COUNT gives 0 where SUM would give NULL).\u003c/p>\n"},"alternatives":[{"title":"Category list + LEFT JOIN","sql":"SELECT c.category, COUNT(a.account_id) AS accounts_count\nFROM (SELECT 'Low Salary' AS category UNION ALL SELECT 'Average Salary' UNION ALL SELECT 'High Salary') c\nLEFT JOIN Accounts a\n       ON c.category = CASE WHEN a.income \u003c 20000 THEN 'Low Salary'\n                            WHEN a.income \u003c= 50000 THEN 'Average Salary'\n                            ELSE 'High Salary' END\nGROUP BY c.category;","html":"\u003cp>Build the list of categories, then attach accounts to their category; empty categories keep a NULL-padded row and count 0.\u003c/p>\n"}],"traps":[{"sql":"SELECT CASE WHEN income \u003c 20000 THEN 'Low Salary' WHEN income \u003c= 50000 THEN 'Average Salary' ELSE 'High Salary' END AS category, COUNT(*) AS accounts_count FROM Accounts GROUP BY category;","html":"\u003cp>Categories with no accounts disappear instead of showing 0.\u003c/p>\n"},{"sql":"SELECT 'Low Salary' AS category, SUM(income \u003c 20000) AS accounts_count FROM Accounts UNION ALL SELECT 'Average Salary', SUM(income BETWEEN 20000 AND 50000) FROM Accounts UNION ALL SELECT 'High Salary', SUM(income > 50000) FROM Accounts;","html":"\u003cp>Works until the table is empty: SUM over zero rows is NULL, not 0.\u003c/p>\n"},{"sql":"SELECT 'Low Salary' AS category, COUNT(CASE WHEN income \u003c 20000 THEN 1 END) AS accounts_count FROM Accounts UNION ALL SELECT 'Average Salary', COUNT(CASE WHEN income > 20000 AND income \u003c 50000 THEN 1 END) FROM Accounts UNION ALL SELECT 'High Salary', COUNT(CASE WHEN income > 50000 THEN 1 END) FROM Accounts;","html":"\u003cp>The average range is inclusive at both ends: 20000 and 50000 belong in it.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Accounts","columns":[{"name":"account_id","type":"INT","pk":true},{"name":"income","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Accounts (account_id INT PRIMARY KEY, income INT);\nINSERT INTO Accounts VALUES (1, 19999), (2, 20000), (3, 50000), (4, 50001), (5, 70000), (6, 120000);","tables":[{"name":"Accounts","rows":[[1,19999],[2,20000],[3,50000],[4,50001],[5,70000],[6,120000]]}],"runs":[{"expected":{"columns":["category","accounts_count"],"rows":[["Low Salary",1],["Average Salary",2],["High Salary",3]]}}]},{"name":"No average salaries","setup":"CREATE TABLE Accounts (account_id INT PRIMARY KEY, income INT);\nINSERT INTO Accounts VALUES (1, 5000), (2, 90000);","tables":[{"name":"Accounts","rows":[[1,5000],[2,90000]]}],"runs":[{"expected":{"columns":["category","accounts_count"],"rows":[["Low Salary",1],["Average Salary",0],["High Salary",1]]}}]},{"name":"No accounts at all","setup":"CREATE TABLE Accounts (account_id INT PRIMARY KEY, income INT);\n","tables":[{"name":"Accounts","rows":[]}],"runs":[{"expected":{"columns":["category","accounts_count"],"rows":[["Low Salary",0],["Average Salary",0],["High Salary",0]]}}]}]},"1934":{"id":1934,"title":"Confirmation Rate","slug":"confirmation-rate","difficulty":"Medium","module":"joins","patterns":["LEFT JOIN + AVG(condition)","NULL to 0"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>A user&#39;s \u003cstrong>confirmation rate\u003c/strong> is the number of &#39;confirmed&#39; messages divided by the number of confirmation messages they requested; users who requested none have a rate of 0. Return \u003ccode>user_id\u003c/code> and \u003ccode>confirmation_rate\u003c/code> (rounded to 2 decimals) for \u003cstrong>every\u003c/strong> user in \u003ccode>Signups\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Every signup appears, including users with no confirmations — LEFT JOIN.\u003c/p>\n","\u003cp>The rate is the average of &quot;was this row confirmed?&quot; over a user&#39;s rows.\u003c/p>\n","\u003cp>For users with no rows that average is NULL; the problem wants 0.\u003c/p>\n"],"solution":{"sql":"SELECT s.user_id,\n       ROUND(IFNULL(AVG(c.action = 'confirmed'), 0), 2) AS confirmation_rate\nFROM Signups s\nLEFT JOIN Confirmations c ON c.user_id = s.user_id\nGROUP BY s.user_id;","html":"\u003cp>\u003ccode>AVG(condition)\u003c/code> is the fraction of rows where it holds. User 4 has only a NULL-padded row, whose condition is NULL, so AVG is NULL — IFNULL turns it into 0.\u003c/p>\n"},"alternatives":[{"title":"IF inside AVG","sql":"SELECT s.user_id,\n       ROUND(AVG(IF(c.action = 'confirmed', 1, 0)), 2) AS confirmation_rate\nFROM Signups s\nLEFT JOIN Confirmations c ON c.user_id = s.user_id\nGROUP BY s.user_id;","html":"\u003cp>\u003ccode>IF(NULL, 1, 0)\u003c/code> is 0, so the padded row counts as &quot;not confirmed&quot; and user 4 gets 0.00 without IFNULL.\u003c/p>\n"}],"traps":[{"sql":"SELECT s.user_id, ROUND(AVG(c.action = 'confirmed'), 2) AS confirmation_rate FROM Signups s LEFT JOIN Confirmations c ON c.user_id = s.user_id GROUP BY s.user_id;","html":"\u003cp>User 4 gets NULL instead of 0.\u003c/p>\n"},{"sql":"SELECT c.user_id, ROUND(AVG(c.action = 'confirmed'), 2) AS confirmation_rate FROM Confirmations c GROUP BY c.user_id;","html":"\u003cp>Users who never requested a confirmation are missing entirely.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Signups","columns":[{"name":"user_id","type":"INT","pk":true},{"name":"time_stamp","type":"DATETIME","pk":false}]},{"name":"Confirmations","columns":[{"name":"user_id","type":"INT","pk":true},{"name":"time_stamp","type":"DATETIME","pk":true},{"name":"action","type":"ENUM('CONFIRMED', 'TIMEOUT')","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Signups (user_id INT PRIMARY KEY, time_stamp DATETIME);\nCREATE TABLE Confirmations (user_id INT, time_stamp DATETIME, action ENUM('confirmed', 'timeout'), PRIMARY KEY (user_id, time_stamp));\nINSERT INTO Signups VALUES (1, '2024-03-01 10:00:00'), (2, '2024-03-02 11:00:00'), (3, '2024-03-03 12:00:00'), (4, '2024-03-04 13:00:00'), (5, '2024-03-05 14:00:00');\nINSERT INTO Confirmations VALUES\n  (1, '2024-03-06 09:00:00', 'confirmed'), (1, '2024-03-07 09:00:00', 'timeout'), (1, '2024-03-08 09:00:00', 'confirmed'),\n  (2, '2024-03-06 10:00:00', 'timeout'), (2, '2024-03-07 10:00:00', 'timeout'),\n  (3, '2024-03-06 11:00:00', 'confirmed'),\n  (5, '2024-03-06 12:00:00', 'confirmed'), (5, '2024-03-07 12:00:00', 'timeout'), (5, '2024-03-08 12:00:00', 'timeout'),\n  (5, '2024-03-09 12:00:00', 'confirmed'), (5, '2024-03-10 12:00:00', 'timeout'), (5, '2024-03-11 12:00:00', 'timeout');","tables":[{"name":"Signups","rows":[[1,"2024-03-01 10:00:00"],[2,"2024-03-02 11:00:00"],[3,"2024-03-03 12:00:00"],[4,"2024-03-04 13:00:00"],[5,"2024-03-05 14:00:00"]]},{"name":"Confirmations","rows":[[1,"2024-03-06 09:00:00","confirmed"],[1,"2024-03-07 09:00:00","timeout"],[1,"2024-03-08 09:00:00","confirmed"],[2,"2024-03-06 10:00:00","timeout"],[2,"2024-03-07 10:00:00","timeout"],[3,"2024-03-06 11:00:00","confirmed"],[5,"2024-03-06 12:00:00","confirmed"],[5,"2024-03-07 12:00:00","timeout"],[5,"2024-03-08 12:00:00","timeout"],[5,"2024-03-09 12:00:00","confirmed"],[5,"2024-03-10 12:00:00","timeout"],[5,"2024-03-11 12:00:00","timeout"]]}],"runs":[{"expected":{"columns":["user_id","confirmation_rate"],"rows":[[1,0.67],[2,0],[3,1],[4,0],[5,0.33]]}}]},{"name":"Rates that need rounding","setup":"CREATE TABLE Signups (user_id INT PRIMARY KEY, time_stamp DATETIME);\nCREATE TABLE Confirmations (user_id INT, time_stamp DATETIME, action ENUM('confirmed', 'timeout'), PRIMARY KEY (user_id, time_stamp));\nINSERT INTO Signups VALUES (10, '2024-04-01 09:00:00'), (11, '2024-04-01 10:00:00'), (12, '2024-04-01 11:00:00'); INSERT INTO Confirmations VALUES (1
