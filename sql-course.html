0, '2024-04-02 09:00:00', 'confirmed'), (10, '2024-04-03 09:00:00', 'timeout'), (10, '2024-04-04 09:00:00', 'timeout'), (11, '2024-04-02 10:00:00', 'confirmed'), (11, '2024-04-03 10:00:00', 'confirmed'), (11, '2024-04-04 10:00:00', 'timeout');","tables":[{"name":"Signups","rows":[[10,"2024-04-01 09:00:00"],[11,"2024-04-01 10:00:00"],[12,"2024-04-01 11:00:00"]]},{"name":"Confirmations","rows":[[10,"2024-04-02 09:00:00","confirmed"],[10,"2024-04-03 09:00:00","timeout"],[10,"2024-04-04 09:00:00","timeout"],[11,"2024-04-02 10:00:00","confirmed"],[11,"2024-04-03 10:00:00","confirmed"],[11,"2024-04-04 10:00:00","timeout"]]}],"runs":[{"expected":{"columns":["user_id","confirmation_rate"],"rows":[[10,0.33],[11,0.67],[12,0]]}}]}]},"1965":{"id":1965,"title":"Employees With Missing Information","slug":"employees-with-missing-information","difficulty":"Easy","module":"sets","patterns":["symmetric difference","FULL JOIN emulation"],"sql50":false,"order":true,"kind":"query","taskHtml":"\u003cp>An employee&#39;s information is missing if they have a \u003ccode>name\u003c/code> in \u003ccode>Employees\u003c/code> but no row in \u003ccode>Salaries\u003c/code>, or a row in \u003ccode>Salaries\u003c/code> but no row in \u003ccode>Employees\u003c/code>. Return the \u003ccode>employee_id\u003c/code> of every such employee, ordered by \u003ccode>employee_id\u003c/code>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>There are two kinds of missing: missing salary and missing name.\u003c/p>\n","\u003cp>Find each with an anti-join and stack the two lists.\u003c/p>\n","\u003cp>Alternatively: stack all ids from both tables and keep those that appear only once.\u003c/p>\n"],"solution":{"sql":"SELECT employee_id FROM Employees\nWHERE employee_id NOT IN (SELECT employee_id FROM Salaries)\nUNION\nSELECT employee_id FROM Salaries\nWHERE employee_id NOT IN (SELECT employee_id FROM Employees)\nORDER BY employee_id;","html":"\u003cp>Each branch is one direction of the anti-join; the trailing ORDER BY sorts the combined list. (NOT IN is safe because both columns are primary keys.)\u003c/p>\n"},"alternatives":[{"title":"Ids that appear only once","sql":"SELECT employee_id\nFROM (SELECT employee_id FROM Employees\n      UNION ALL\n      SELECT employee_id FROM Salaries) t\nGROUP BY employee_id\nHAVING COUNT(*) = 1\nORDER BY employee_id;","html":"\u003cp>An id present in both tables appears twice in the stacked list; a missing-information id appears once.\u003c/p>\n"}],"traps":[{"sql":"SELECT e.employee_id FROM Employees e LEFT JOIN Salaries s ON s.employee_id = e.employee_id WHERE s.employee_id IS NULL ORDER BY e.employee_id;","html":"\u003cp>Only one direction: finds missing salaries but not missing names.\u003c/p>\n"},{"sql":"SELECT COALESCE(e.employee_id, s.employee_id) AS employee_id FROM Employees e FULL OUTER JOIN Salaries s ON s.employee_id = e.employee_id WHERE e.name IS NULL OR s.salary IS NULL ORDER BY 1;","html":"\u003cp>Logically right, but MySQL has no FULL OUTER JOIN, so LeetCode rejects it.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employees","columns":[{"name":"employee_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(30)","pk":false}]},{"name":"Salaries","columns":[{"name":"employee_id","type":"INT","pk":true},{"name":"salary","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, name VARCHAR(30));\nCREATE TABLE Salaries (employee_id INT PRIMARY KEY, salary INT);\nINSERT INTO Employees VALUES (1, 'Ann'), (3, 'Bram'), (4, 'Cato'), (8, 'Dora');\nINSERT INTO Salaries VALUES (1, 5000), (2, 6000), (4, 7000), (9, 8000);","tables":[{"name":"Employees","rows":[[1,"Ann"],[3,"Bram"],[4,"Cato"],[8,"Dora"]]},{"name":"Salaries","rows":[[1,5000],[2,6000],[4,7000],[9,8000]]}],"runs":[{"expected":{"columns":["employee_id"],"rows":[[2],[3],[8],[9]]}}]},{"name":"Salaries with no employees at all","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, name VARCHAR(30));\nCREATE TABLE Salaries (employee_id INT PRIMARY KEY, salary INT);\nINSERT INTO Salaries VALUES (3, 100), (1, 200);","tables":[{"name":"Employees","rows":[]},{"name":"Salaries","rows":[[3,100],[1,200]]}],"runs":[{"expected":{"columns":["employee_id"],"rows":[[1],[3]]}}]}]},"1978":{"id":1978,"title":"Employees Whose Manager Left the Company","slug":"employees-whose-manager-left-the-company","difficulty":"Easy","module":"subqueries","patterns":["NOT IN","anti-join"],"sql50":true,"order":true,"kind":"query","taskHtml":"\u003cp>When a manager leaves, their row is deleted but their reports keep the old \u003ccode>manager_id\u003c/code>. Return the \u003ccode>employee_id\u003c/code> of employees who earn \u003cstrong>strictly less than 30000\u003c/strong> and whose manager \u003cstrong>left\u003c/strong> (they have a \u003ccode>manager_id\u003c/code>, but no employee has that id). Order by \u003ccode>employee_id\u003c/code>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Two conditions: salary &lt; 30000, and the manager_id is not any existing employee_id.\u003c/p>\n","\u003cp>Employees with no manager at all (NULL) did not &quot;lose&quot; one.\u003c/p>\n"],"solution":{"sql":"SELECT employee_id\nFROM Employees\nWHERE salary \u003c 30000\n  AND manager_id NOT IN (SELECT employee_id FROM Employees)\nORDER BY employee_id;","html":"\u003cp>NOT IN is safe here: the subquery returns primary keys, which are never NULL. For Eli (\u003ccode>manager_id\u003c/code> NULL), \u003ccode>NULL NOT IN (…)\u003c/code> is UNKNOWN, so he is correctly excluded.\u003c/p>\n"},"alternatives":[{"title":"LEFT JOIN anti-join","sql":"SELECT e.employee_id\nFROM Employees e\nLEFT JOIN Employees m ON m.employee_id = e.manager_id\nWHERE e.salary \u003c 30000\n  AND e.manager_id IS NOT NULL\n  AND m.employee_id IS NULL\nORDER BY e.employee_id;","html":"\u003cp>Here the explicit \u003ccode>manager_id IS NOT NULL\u003c/code> matters: without it, employees who never had a manager would also look &quot;unmatched&quot;.\u003c/p>\n"}],"traps":[{"sql":"SELECT e.employee_id FROM Employees e LEFT JOIN Employees m ON m.employee_id = e.manager_id WHERE e.salary \u003c 30000 AND m.employee_id IS NULL ORDER BY e.employee_id;","html":"\u003cp>Also returns Eli, who has no manager at all — the join finds no match for NULL either.\u003c/p>\n"},{"sql":"SELECT employee_id FROM Employees WHERE salary \u003c= 30000 AND manager_id NOT IN (SELECT employee_id FROM Employees) ORDER BY employee_id;","html":"\u003cp>&quot;Strictly less&quot; excludes a salary of exactly 30000 (Ivo).\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employees","columns":[{"name":"employee_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(20)","pk":false},{"name":"manager_id","type":"INT","pk":false},{"name":"salary","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, name VARCHAR(20), manager_id INT, salary INT);\nINSERT INTO Employees VALUES\n  (1, 'Ari', NULL, 45000), (2, 'Bex', 1, 25000), (3, 'Cam', 7, 21000), (4, 'Dot', 7, 32000),\n  (5, 'Eli', NULL, 15000), (6, 'Fin', 8, 29999), (9, 'Gia', 2, 29000), (10, 'Hal', 11, 28000), (12, 'Ivo', 13, 30000);","tables":[{"name":"Employees","rows":[[1,"Ari",null,45000],[2,"Bex",1,25000],[3,"Cam",7,21000],[4,"Dot",7,32000],[5,"Eli",null,15000],[6,"Fin",8,29999],[9,"Gia",2,29000],[10,"Hal",11,28000],[12,"Ivo",13,30000]]}],"runs":[{"expected":{"columns":["employee_id"],"rows":[[3],[6],[10]]}}]},{"name":"A middle manager left","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, name VARCHAR(20), manager_id INT, salary INT);\nINSERT INTO Employees VALUES (1, 'Ada', NULL, 50000), (3, 'Cal', 2, 10000), (4, 'Dia', 3, 20000), (5, 'Eve', 1, 29000);","tables":[{"name":"Employees","rows":[[1,"Ada",null,50000],[3,"Cal",2,10000],[4,"Dia",3,20000],[5,"Eve",1,29000]]}],"runs":[{"expected":{"columns":["employee_id"],"rows":[[3]]}}]}]},"2356":{"id":2356,"title":"Number of Unique Subjects Taught by Each Teacher","slug":"number-of-unique-subjects-taught-by-each-teacher","difficulty":"Easy","module":"aggregation","patterns":["COUNT(DISTINCT)"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>A teacher can teach the same subject in several departments. For each \u003ccode>teacher_id\u003c/code>, return \u003ccode>cnt\u003c/code>: the number of \u003cstrong>different\u003c/strong> subjects they teach. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>One output row per teacher.\u003c/p>\n","\u003cp>Count distinct subjects, not rows.\u003c/p>\n"],"solution":{"sql":"SELECT teacher_id, COUNT(DISTINCT subject_id) AS cnt\nFROM Teacher\nGROUP BY teacher_id;","html":"\u003cp>Teacher 10 has three rows but only two subjects (subject 4 is taught in two departments).\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT teacher_id, COUNT(*) AS cnt FROM Teacher GROUP BY teacher_id;","html":"\u003cp>Counts (subject, department) rows, so a subject taught in two departments counts twice.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Teacher","columns":[{"name":"teacher_id","type":"INT","pk":false},{"name":"subject_id","type":"INT","pk":true},{"name":"dept_id","type":"INT","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Teacher (teacher_id INT, subject_id INT, dept_id INT, PRIMARY KEY (subject_id, dept_id));\nINSERT INTO Teacher VALUES (10, 4, 1), (10, 4, 2), (10, 6, 1), (11, 1, 3), (11, 2, 3), (11, 3, 3), (11, 5, 3), (12, 7, 2), (12, 7, 5);","tables":[{"name":"Teacher","rows":[[10,4,1],[10,4,2],[10,6,1],[11,1,3],[11,2,3],[11,3,3],[11,5,3],[12,7,2],[12,7,5]]}],"runs":[{"expected":{"columns":["teacher_id","cnt"],"rows":[[10,2],[11,4],[12,1]]}}]},{"name":"One subject in many departments","setup":"CREATE TABLE Teacher (teacher_id INT, subject_id INT, dept_id INT, PRIMARY KEY (subject_id, dept_id));\nINSERT INTO Teacher VALUES (20, 1, 1), (20, 1, 2), (20, 1, 3), (21, 2, 1), (21, 3, 2);","tables":[{"name":"Teacher","rows":[[20,1,1],[20,1,2],[20,1,3],[21,2,1],[21,3,2]]}],"runs":[{"expected":{"columns":["teacher_id","cnt"],"rows":[[20,1],[21,2]]}}]}]},"3482":{"id":3482,"title":"Analyze Organization Hierarchy","slug":"analyze-organization-hierarchy","difficulty":"Hard","module":"ctes","patterns":["recursive CTE","hierarchy levels","subtree totals"],"sql50":false,"order":true,"kind":"query","taskHtml":"\u003cp>\u003ccode>Employees\u003c/code> is an org chart: each row has a \u003ccode>manager_id\u003c/code> (NULL for the CEO). For \u003cstrong>every\u003c/strong> employee return:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>employee_id\u003c/code>, \u003ccode>employee_name\u003c/code>;\u003c/li>\n\u003cli>\u003ccode>level\u003c/code>: 1 for the CEO, 2 for their direct reports, and so on;\u003c/li>\n\u003cli>\u003ccode>team_size\u003c/code>: how many people are under them, directly or indirectly;\u003c/li>\n\u003cli>\u003ccode>budget\u003c/code>: their own salary plus the salaries of everyone under them.\u003c/li>\n\u003c/ul>\n\u003cp>Order by \u003ccode>level\u003c/code> ascending, then \u003ccode>budget\u003c/code> descending, then \u003ccode>employee_name\u003c/code> ascending.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Levels: a recursive CTE that starts at the CEO (level 1) and adds 1 per step down.\u003c/p>\n","\u003cp>Team size and budget need every (manager, member) pair at any depth — another recursive CTE that starts from each employee paired with themselves.\u003c/p>\n","\u003cp>Aggregate the pairs per manager: COUNT(*) − 1 people under them, SUM(salary) including their own.\u003c/p>\n"],"solution":{"sql":"WITH RECURSIVE levels AS (          -- one row per employee, with depth\n  SELECT employee_id, employee_name, 1 AS level\n  FROM Employees\n  WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.employee_id, e.employee_name, l.level + 1\n  FROM Employees e\n  JOIN levels l ON e.manager_id = l.employee_id\n),\npairs AS (                           -- (root, member) for every member of root's subtree, root included\n  SELECT employee_id AS root_id, employee_id AS member_id, salary\n  FROM Employees\n  UNION ALL\n  SELECT p.root_id, e.employee_id, e.salary\n  FROM pairs p\n  JOIN Employees e ON e.manager_id = p.member_id\n)\nSELECT l.employee_id, l.employee_name, l.level,\n       COUNT(*) - 1  AS team_size,\n       SUM(p.salary) AS budget\nFROM levels l\nJOIN pairs p ON p.root_id = l.employee_id\nGROUP BY l.employee_id, l.employee_name, l.level\nORDER BY l.level, budget DESC, l.employee_name;","html":"\u003cp>Two recursions over the same tree: \u003ccode>levels\u003c/code> walks down from the root counting depth; \u003ccode>pairs\u003c/code> walks down from \u003cstrong>every\u003c/strong> node, so each employee ends up paired with everyone beneath them (and themselves). Aggregating the pairs gives both totals at once.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"WITH RECURSIVE levels AS (SELECT employee_id, employee_name, 1 AS level FROM Employees WHERE manager_id IS NULL UNION ALL SELECT e.employee_id, e.employee_name, l.level + 1 FROM Employees e JOIN levels l ON e.manager_id = l.employee_id) SELECT l.employee_id, l.employee_name, l.level, COUNT(r.employee_id) AS team_size, x.salary + IFNULL(SUM(r.salary), 0) AS budget FROM levels l JOIN Employees x ON x.employee_id = l.employee_id LEFT JOIN Employees r ON r.manager_id = l.employee_id GROUP BY l.employee_id, l.employee_name, l.level, x.salary ORDER BY l.level, budget DESC, l.employee_name;","html":"\u003cp>Counts only direct reports; indirect reports (Fox&#39;s team under Cid) are missed.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employees","columns":[{"name":"employee_id","type":"INT","pk":true},{"name":"employee_name","type":"VARCHAR(100)","pk":false},{"name":"manager_id","type":"INT","pk":false},{"name":"salary","type":"INT","pk":false},{"name":"department","type":"VARCHAR(50)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, employee_name VARCHAR(100), manager_id INT, salary INT, department VARCHAR(50));\nINSERT INTO Employees VALUES\n  (1, 'Ada', NULL, 20000, 'Executive'),\n  (2, 'Ben', 1, 12000, 'Sales'), (3, 'Cid', 1, 12000, 'Engineering'),\n  (4, 'Dee', 2, 8000, 'Sales'), (5, 'Eva', 2, 7000, 'Sales'), (6, 'Fox', 3, 9000, 'Engineering'),\n  (7, 'Hal', 6, 5000, 'Engineering'), (8, 'Gil', 6, 5000, 'Engineering'), (9, 'Ivy', 4, 6000, 'Sales');","tables":[{"name":"Employees","rows":[[1,"Ada",null,20000,"Executive"],[2,"Ben",1,12000,"Sales"],[3,"Cid",1,12000,"Engineering"],[4,"Dee",2,8000,"Sales"],[5,"Eva",2,7000,"Sales"],[6,"Fox",3,9000,"Engineering"],[7,"Hal",6,5000,"Engineering"],[8,"Gil",6,5000,"Engineering"],[9,"Ivy",4,6000,"Sales"]]}],"runs":[{"expected":{"columns":["employee_id","employee_name","level","team_size","budget"],"rows":[[1,"Ada",1,8,84000],[2,"Ben",2,3,33000],[3,"Cid",2,3,31000],[6,"Fox",3,2,19000],[4,"Dee",3,1,14000],[5,"Eva",3,0,7000],[9,"Ivy",4,0,6000],[8,"Gil",4,0,5000],[7,"Hal",4,0,5000]]}}]},{"name":"A straight chain","setup":"CREATE TABLE Employees (employee_id INT PRIMARY KEY, employee_name VARCHAR(100), manager_id INT, salary INT, department VARCHAR(50));\nINSERT INTO Employees VALUES (1, 'Ana', NULL, 100, 'X'), (2, 'Ben', 1, 50, 'X'), (3, 'Cy', 2, 25, 'X'), (4, 'Dov', 3, 10, 'X');","tables":[{"name":"Employees","rows":[[1,"Ana",null,100,"X"],[2,"Ben",1,50,"X"],[3,"Cy",2,25,"X"],[4,"Dov",3,10,"X"]]}],"runs":[{"expected":{"columns":["employee_id","employee_name","level","team_size","budget"],"rows":[[1,"Ana",1,3,185],[2,"Ben",2,2,85],[3,"Cy",3,1,35],[4,"Dov",4,0,10]]}}]}]}},"cheatsheet":"\u003csection class=\"sheet-card\">\u003ch2>Evaluation order\u003c/h2>\u003cp>\u003ccode>FROM\u003c/code> + joins → \u003ccode>WHERE\u003c/code> → \u003ccode>GROUP BY\u003c/code> → \u003ccode>HAVING\u003c/code> → \u003ccode>SELECT\u003c/code> (window functions here) → \u003ccode>DISTINCT\u003c/code> → \u003ccode>ORDER BY\u003c/code> → \u003ccode>LIMIT\u003c/code>\u003c/p>\n\u003cul>\n\u003cli>WHERE can&#39;t see SELECT aliases or aggregates.\u003c/li>\n\u003cli>HAVING filters groups. MySQL lets it use SELECT aliases.\u003c/li>\n\u003cli>Window functions can&#39;t be filtered in WHERE, so wrap the query.\u003c/li>\n\u003cli>ORDER BY can use aliases, expressions and positions.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Query skeleton\u003c/h2>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">WITH\u003c/span> step \u003cspan class=\"t-k\">AS\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>                 \u003cspan class=\"t-c\">-- one row per …\u003c/span>\n  \u003cspan class=\"t-k\">SELECT\u003c/span> a\u003cspan class=\"t-o\">,\u003c/span> b\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">SUM\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>x\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">AS\u003c/span> total\n  \u003cspan class=\"t-k\">FROM\u003c/span> t1\n  \u003cspan class=\"t-k\">JOIN\u003c/span> t2 \u003cspan class=\"t-k\">ON\u003c/span> t2\u003cspan class=\"t-o\">.\u003c/span>id \u003cspan class=\"t-o\">=\u003c/span> t1\u003cspan class=\"t-o\">.\u003c/span>t2_id\n  \u003cspan class=\"t-k\">WHERE\u003c/span> t1\u003cspan class=\"t-o\">.\u003c/span>flag \u003cspan class=\"t-o\">=\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\n  \u003cspan class=\"t-k\">GROUP\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> a\u003cspan class=\"t-o\">,\u003c/span> b\n  \u003cspan class=\"t-k\">HAVING\u003c/span> \u003cspan class=\"t-f\">SUM\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>x\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-o\">&gt;\u003c/span> \u003cspan class=\"t-n\">100\u003c/span>\n\u003cspan class=\"t-o\">)\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> a\u003cspan class=\"t-o\">,\u003c/span> b\u003cspan class=\"t-o\">,\u003c/span> total\u003cspan class=\"t-o\">,\u003c/span>\n       \u003cspan class=\"t-f\">RANK\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">OVER\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">PARTITION\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> a \u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> total \u003cspan class=\"t-k\">DESC\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">AS\u003c/span> rnk\n\u003cspan class=\"t-k\">FROM\u003c/span> step\n\u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> a\u003cspan class=\"t-o\">,\u003c/span> rnk\n\u003cspan class=\"t-k\">LIMIT\u003c/span> \u003cspan class=\"t-n\">10\u003c/span> \u003cspan class=\"t-k\">OFFSET\u003c/span> \u003cspan class=\"t-n\">0\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>             \u003cspan class=\"t-c\">-- MySQL also: LIMIT 0, 10\u003c/span>\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>NULL rules\u003c/h2>\u003cul>\n\u003cli>Any comparison with NULL is UNKNOWN, and WHERE keeps only TRUE.\u003c/li>\n\u003cli>Test NULL with \u003ccode>IS NULL\u003c/code> / \u003ccode>IS NOT NULL\u003c/code>. \u003ccode>a &lt;=&gt; b\u003c/code> is NULL-safe equality.\u003c/li>\n\u003cli>\u003ccode>NOT IN (list containing NULL)\u003c/code> matches nothing, so use \u003ccode>NOT EXISTS\u003c/code>.\u003c/li>\n\u003cli>Aggregates skip NULLs. \u003ccode>COUNT(*)\u003c/code> counts rows. \u003ccode>SUM\u003c/code> over no rows is NULL.\u003c/li>\n\u003cli>GROUP BY, DISTINCT and ORDER BY treat NULLs as one group. In MySQL, NULLs sort first when ascending.\u003c/li>\n\u003cli>Fallbacks: \u003ccode>IFNULL(x, 0)\u003c/code>, \u003ccode>COALESCE(a, b, c)\u003c/code>. \u003ccode>NULLIF(a, b)\u003c/code> returns NULL when a = b.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Joins\u003c/h2>\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Join\u003c/th>\u003cth>Keeps\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>JOIN\u003c/code> (INNER)\u003c/td>\u003ctd>matched pairs only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>LEFT JOIN\u003c/code>\u003c/td>\u003ctd>every left row, NULLs when unmatched\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>CROSS JOIN\u003c/code>\u003c/td>\u003ctd>every combination (grids)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FULL (MySQL has none)\u003c/td>\u003ctd>\u003ccode>LEFT JOIN … UNION ALL\u003c/code> right-only rows\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-c\">-- anti-join: rows with no match\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> a\u003cspan class=\"t-o\">.\u003c/span>\u003cspan class=\"t-o\">*\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> a \u003cspan class=\"t-k\">LEFT\u003c/span> \u003cspan class=\"t-k\">JOIN\u003c/span> b \u003cspan class=\"t-k\">ON\u003c/span> b\u003cspan class=\"t-o\">.\u003c/span>a_id \u003cspan class=\"t-o\">=\u003c/span> a\u003cspan class=\"t-o\">.\u003c/span>id \u003cspan class=\"t-k\">WHERE\u003c/span> b\u003cspan class=\"t-o\">.\u003c/span>id \u003cspan class=\"t-k\">IS\u003c/span> \u003cspan class=\"t-k\">NULL\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> a\u003cspan class=\"t-o\">.\u003c/span>\u003cspan class=\"t-o\">*\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> a \u003cspan class=\"t-k\">WHERE\u003c/span> \u003cspan class=\"t-k\">NOT\u003c/span> \u003cspan class=\"t-k\">EXISTS\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-n\">1\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> b \u003cspan class=\"t-k\">WHERE\u003c/span> b\u003cspan class=\"t-o\">.\u003c/span>a_id \u003cspan class=\"t-o\">=\u003c/span> a\u003cspan class=\"t-o\">.\u003c/span>id\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-c\">-- semi-join: rows with at least one match, no duplicates\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> a\u003cspan class=\"t-o\">.\u003c/span>\u003cspan class=\"t-o\">*\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> a \u003cspan class=\"t-k\">WHERE\u003c/span> \u003cspan class=\"t-k\">EXISTS\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-n\">1\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> b \u003cspan class=\"t-k\">WHERE\u003c/span> b\u003cspan class=\"t-o\">.\u003c/span>a_id \u003cspan class=\"t-o\">=\u003c/span> a\u003cspan class=\"t-o\">.\u003c/span>id\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Conditions on the right table of a LEFT JOIN belong in \u003ccode>ON\u003c/code>, not \u003ccode>WHERE\u003c/code>. After a LEFT JOIN, \u003ccode>COUNT(b.id)\u003c/code> counts matches.\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Aggregation\u003c/h2>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">SELECT\u003c/span> k\u003cspan class=\"t-o\">,\u003c/span>\n       \u003cspan class=\"t-f\">COUNT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">*\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">COUNT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>col\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">COUNT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">DISTINCT\u003c/span> col\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n       \u003cspan class=\"t-f\">SUM\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>cond\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>                          \u003cspan class=\"t-c\">-- rows where cond is true\u003c/span>\n       \u003cspan class=\"t-f\">ROUND\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">100\u003c/span> \u003cspan class=\"t-o\">*\u003c/span> \u003cspan class=\"t-f\">AVG\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>cond\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>          \u003cspan class=\"t-c\">-- % of rows\u003c/span>\n       \u003cspan class=\"t-f\">SUM\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">CASE\u003c/span> \u003cspan class=\"t-k\">WHEN\u003c/span> cond \u003cspan class=\"t-k\">THEN\u003c/span> amt \u003cspan class=\"t-k\">ELSE\u003c/span> \u003cspan class=\"t-n\">0\u003c/span> \u003cspan class=\"t-k\">END\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span>\n       \u003cspan class=\"t-f\">GROUP_CONCAT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">DISTINCT\u003c/span> x \u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> x \u003cspan class=\"t-k\">SEPARATOR\u003c/span> \u003cspan class=\"t-s\">','\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\n\u003cspan class=\"t-k\">FROM\u003c/span> t\n\u003cspan class=\"t-k\">GROUP\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> k\n\u003cspan class=\"t-k\">HAVING\u003c/span> \u003cspan class=\"t-f\">COUNT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">*\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-o\">&gt;=\u003c/span> \u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Every selected column must be grouped or aggregated (ONLY_FULL_GROUP_BY).\u003c/li>\n\u003cli>\u003ccode>COUNT(cond)\u003c/code> counts false rows too (it skips only NULL). Use \u003ccode>SUM(cond)\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Window functions\u003c/h2>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-f\">fn\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">OVER\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">PARTITION\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> p \u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> o \u003cspan class=\"t-k\">ROWS\u003c/span> \u003cspan class=\"t-k\">BETWEEN\u003c/span> \u003cspan class=\"t-n\">6\u003c/span> \u003cspan class=\"t-k\">PRECEDING\u003c/span> \u003cspan class=\"t-k\">AND\u003c/span> \u003cspan class=\"t-k\">CURRENT\u003c/span> \u003cspan class=\"t-k\">ROW\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Function\u003c/th>\u003cth>Ties 90, 80, 80, 70\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ROW_NUMBER()\u003c/code>\u003c/td>\u003ctd>1, 2, 3, 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>RANK()\u003c/code>\u003c/td>\u003ctd>1, 2, 2, 4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>DENSE_RANK()\u003c/code>\u003c/td>\u003ctd>1, 2, 2, 3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003ccode>LAG(x, n, default)\u003c/code>, \u003ccode>LEAD(x)\u003c/code>, \u003ccode>FIRST_VALUE\u003c/code>, \u003ccode>LAST_VALUE\u003c/code> (widen the frame!), \u003ccode>NTH_VALUE\u003c/code>, \u003ccode>NTILE(n)\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>SUM(x) OVER (ORDER BY d)\u003c/code> is a running total. The default frame is RANGE, so ties are included together.\u003c/li>\n\u003cli>Share of total: \u003ccode>x / SUM(x) OVER (PARTITION BY g)\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>rank\u003c/code>, \u003ccode>lag\u003c/code>, \u003ccode>lead\u003c/code>… are reserved words in MySQL 8. Backtick them as names.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>CTEs and recursion\u003c/h2>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">WITH\u003c/span> \u003cspan class=\"t-k\">RECURSIVE\u003c/span> seq \u003cspan class=\"t-k\">AS\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\n  \u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-f\">DATE\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-s\">'2025-01-01'\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">AS\u003c/span> d               \u003cspan class=\"t-c\">-- anchor\u003c/span>\n  \u003cspan class=\"t-k\">UNION\u003c/span> \u003cspan class=\"t-k\">ALL\u003c/span>\n  \u003cspan class=\"t-k\">SELECT\u003c/span> d \u003cspan class=\"t-o\">+\u003c/span> \u003cspan class=\"t-k\">INTERVAL\u003c/span> \u003cspan class=\"t-n\">1\u003c/span> DAY \u003cspan class=\"t-k\">FROM\u003c/span> seq           \u003cspan class=\"t-c\">-- step\u003c/span>\n  \u003cspan class=\"t-k\">WHERE\u003c/span> d \u003cspan class=\"t-o\">&lt;\u003c/span> \u003cspan class=\"t-s\">'2025-01-31'\u003c/span>                       \u003cspan class=\"t-c\">-- stop\u003c/span>\n\u003cspan class=\"t-o\">)\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> seq\u003cspan class=\"t-o\">.\u003c/span>d\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">COUNT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>e\u003cspan class=\"t-o\">.\u003c/span>id\u003cspan class=\"t-o\">)\u003c/span>\n\u003cspan class=\"t-k\">FROM\u003c/span> seq \u003cspan class=\"t-k\">LEFT\u003c/span> \u003cspan class=\"t-k\">JOIN\u003c/span> events e \u003cspan class=\"t-k\">ON\u003c/span> e\u003cspan class=\"t-o\">.\u003c/span>day \u003cspan class=\"t-o\">=\u003c/span> seq\u003cspan class=\"t-o\">.\u003c/span>d\n\u003cspan class=\"t-k\">GROUP\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> seq\u003cspan class=\"t-o\">.\u003c/span>d\u003cspan class=\"t-o\">;\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Hierarchy: the anchor is \u003ccode>WHERE manager_id IS NULL\u003c/code>, and the step is \u003ccode>JOIN cte ON e.manager_id = cte.id\u003c/code>. The anchor fixes column types (\u003ccode>CAST(x AS CHAR(200))\u003c/code>). The depth limit is \u003ccode>cte_max_recursion_depth\u003c/code> (1000).\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Set operations\u003c/h2>\u003cul>\n\u003cli>\u003ccode>UNION\u003c/code> de-duplicates. \u003ccode>UNION ALL\u003c/code> keeps all rows and is cheaper.\u003c/li>\n\u003cli>Columns match by position, and names come from the first SELECT.\u003c/li>\n\u003cli>A final \u003ccode>ORDER BY\u003c/code>/\u003ccode>LIMIT\u003c/code> applies to the whole result. Per branch: \u003ccode>(SELECT … LIMIT 1) UNION ALL (SELECT … LIMIT 1)\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>INTERSECT\u003c/code> / \u003ccode>EXCEPT\u003c/code> need MySQL 8.0.31+. Otherwise use \u003ccode>IN\u003c/code> / \u003ccode>NOT EXISTS\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Patterns\u003c/h2>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-c\">-- top N per group\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-o\">*\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> t\u003cspan class=\"t-o\">.\u003c/span>\u003cspan class=\"t-o\">*\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">DENSE_RANK\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">OVER\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">PARTITION\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> g \u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> v \u003cspan class=\"t-k\">DESC\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> r \u003cspan class=\"t-k\">FROM\u003c/span> t\u003cspan class=\"t-o\">)\u003c/span> x \u003cspan class=\"t-k\">WHERE\u003c/span> r \u003cspan class=\"t-o\">&lt;=\u003c/span> \u003cspan class=\"t-n\">3\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-c\">-- N-th highest (NULL if none)\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-k\">DISTINCT\u003c/span> v \u003cspan class=\"t-k\">FROM\u003c/span> t \u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> v \u003cspan class=\"t-k\">DESC\u003c/span> \u003cspan class=\"t-k\">LIMIT\u003c/span> \u003cspan class=\"t-n\">1\u003c/span> \u003cspan class=\"t-k\">OFFSET\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">AS\u003c/span> second\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-c\">-- gaps &amp; islands\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> id \u003cspan class=\"t-o\">-\u003c/span> \u003cspan class=\"t-f\">ROW_NUMBER\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">OVER\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> id\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">AS\u003c/span> grp\u003cspan class=\"t-o\">,\u003c/span> t\u003cspan class=\"t-o\">.\u003c/span>\u003cspan class=\"t-o\">*\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> t\u003cspan class=\"t-o\">;\u003c/span>         \u003cspan class=\"t-c\">-- same grp = same run\u003c/span>\n\u003cspan class=\"t-c\">-- pivot\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> id\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">SUM\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">CASE\u003c/span> \u003cspan class=\"t-k\">WHEN\u003c/span> m \u003cspan class=\"t-o\">=\u003c/span> \u003cspan class=\"t-s\">'Jan'\u003c/span> \u003cspan class=\"t-k\">THEN\u003c/span> v \u003cspan class=\"t-k\">END\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">AS\u003c/span> Jan \u003cspan class=\"t-k\">FROM\u003c/span> t \u003cspan class=\"t-k\">GROUP\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> id\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-c\">-- relational division (\"bought all\")\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> c \u003cspan class=\"t-k\">FROM\u003c/span> t \u003cspan class=\"t-k\">GROUP\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> c \u003cspan class=\"t-k\">HAVING\u003c/span> \u003cspan class=\"t-f\">COUNT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">DISTINCT\u003c/span> p\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-o\">=\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-f\">COUNT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">*\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> products\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-c\">-- delete duplicates, keep smallest id\u003c/span>\n\u003cspan class=\"t-k\">DELETE\u003c/span> p1 \u003cspan class=\"t-k\">FROM\u003c/span> t p1 \u003cspan class=\"t-k\">JOIN\u003c/span> t p2 \u003cspan class=\"t-k\">ON\u003c/span> p1\u003cspan class=\"t-o\">.\u003c/span>k \u003cspan class=\"t-o\">=\u003c/span> p2\u003cspan class=\"t-o\">.\u003c/span>k \u003cspan class=\"t-k\">AND\u003c/span> p1\u003cspan class=\"t-o\">.\u003c/span>id \u003cspan class=\"t-o\">&gt;\u003c/span> p2\u003cspan class=\"t-o\">.\u003c/span>id\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-c\">-- median\u003c/span>\n\u003cspan class=\"t-k\">SELECT\u003c/span> \u003cspan class=\"t-f\">AVG\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>v\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">SELECT\u003c/span> v\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">ROW_NUMBER\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">OVER\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-k\">ORDER\u003c/span> \u003cspan class=\"t-k\">BY\u003c/span> v\u003cspan class=\"t-o\">)\u003c/span> rn\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">COUNT\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">*\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">OVER\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> n \u003cspan class=\"t-k\">FROM\u003c/span> t\u003cspan class=\"t-o\">)\u003c/span> x\n\u003cspan class=\"t-k\">WHERE\u003c/span> rn \u003cspan class=\"t-k\">IN\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-f\">FLOOR\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>n \u003cspan class=\"t-o\">+\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-o\">/\u003c/span> \u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-f\">CEIL\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-o\">(\u003c/span>n \u003cspan class=\"t-o\">+\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-o\">/\u003c/span> \u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Dates (MySQL)\u003c/h2>\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Expression\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>now / today\u003c/td>\u003ctd>\u003ccode>NOW()\u003c/code>, \u003ccode>CURDATE()\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>parts\u003c/td>\u003ctd>\u003ccode>YEAR(d)\u003c/code>, \u003ccode>MONTH(d)\u003c/code>, \u003ccode>DAY(d)\u003c/code>, \u003ccode>DAYNAME(d)\u003c/code>, \u003ccode>DAYOFWEEK(d)\u003c/code> (1 = Sun)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>month key\u003c/td>\u003ctd>\u003ccode>DATE_FORMAT(d, &#39;%Y-%m&#39;)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>month start / end\u003c/td>\u003ctd>\u003ccode>DATE_FORMAT(d, &#39;%Y-%m-01&#39;)\u003c/code>, \u003ccode>LAST_DAY(d)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>shift\u003c/td>\u003ctd>\u003ccode>DATE_ADD(d, INTERVAL 7 DAY)\u003c/code>, \u003ccode>d - INTERVAL 1 MONTH\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>difference\u003c/td>\u003ctd>\u003ccode>DATEDIFF(a, b)\u003c/code> (days), \u003ccode>TIMESTAMPDIFF(MONTH, a, b)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>strip time\u003c/td>\u003ctd>\u003ccode>DATE(ts)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a whole day/year\u003c/td>\u003ctd>\u003ccode>ts &gt;= &#39;2024-01-01&#39; AND ts &lt; &#39;2025-01-01&#39;\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Strings\u003c/h2>\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Need\u003c/th>\u003cth>Expression\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>join\u003c/td>\u003ctd>\u003ccode>CONCAT(a, b)\u003c/code> (NULL if any is NULL), \u003ccode>CONCAT_WS(&#39;, &#39;, a, b)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>case\u003c/td>\u003ctd>\u003ccode>UPPER\u003c/code>, \u003ccode>LOWER\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cut\u003c/td>\u003ctd>\u003ccode>LEFT(s, n)\u003c/code>, \u003ccode>RIGHT(s, n)\u003c/code>, \u003ccode>SUBSTRING(s, start, len)\u003c/code> (1-based)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>split\u003c/td>\u003ctd>\u003ccode>SUBSTRING_INDEX(s, &#39;@&#39;, -1)\u003c/code> → after the last \u003ccode>@\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>length\u003c/td>\u003ctd>\u003ccode>CHAR_LENGTH(s)\u003c/code> (characters), \u003ccode>LENGTH(s)\u003c/code> (bytes)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>find\u003c/td>\u003ctd>\u003ccode>LOCATE(sub, s)\u003c/code>, \u003ccode>INSTR(s, sub)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>patterns\u003c/td>\u003ctd>\u003ccode>LIKE &#39;a%&#39;\u003c/code>, \u003ccode>_\u003c/code> = one char; \u003ccode>REGEXP_LIKE(s, &#39;^a&#39;, &#39;c&#39;)\u003c/code> for case-sensitive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tidy\u003c/td>\u003ctd>\u003ccode>TRIM\u003c/code>, \u003ccode>REPLACE(s, from, to)\u003c/code>, \u003ccode>LPAD(s, n, &#39;0&#39;)\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Numbers and types\u003c/h2>\u003cul>\n\u003cli>\u003ccode>7 / 2\u003c/code> is 3.5 in MySQL (3 in PostgreSQL). Use \u003ccode>7 DIV 2\u003c/code> = 3 and \u003ccode>7 % 2\u003c/code> = 1.\u003c/li>\n\u003cli>\u003ccode>ROUND(x, 2)\u003c/code> rounds exact values (DECIMAL, integers) half away from zero, and FLOAT/DOUBLE half to even. Also \u003ccode>TRUNCATE(x, 2)\u003c/code>, \u003ccode>CEIL\u003c/code>, \u003ccode>FLOOR\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>CAST(x AS SIGNED | UNSIGNED | DECIMAL(10,2) | CHAR | DATE)\u003c/code>.\u003c/li>\n\u003cli>Money: \u003ccode>DECIMAL\u003c/code>, never FLOAT.\u003c/li>\n\u003cli>Conditions are 1/0, so \u003ccode>SUM(cond)\u003c/code> and \u003ccode>AVG(cond)\u003c/code> work.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Changing data\u003c/h2>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">INSERT\u003c/span> \u003cspan class=\"t-k\">INTO\u003c/span> \u003cspan class=\"t-f\">t\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>a\u003cspan class=\"t-o\">,\u003c/span> b\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">VALUES\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'x'\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-s\">'y'\u003c/span>\u003cspan class=\"t-o\">)\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">INSERT\u003c/span> \u003cspan class=\"t-k\">INTO\u003c/span> \u003cspan class=\"t-f\">t\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>a\u003cspan class=\"t-o\">,\u003c/span> b\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">SELECT\u003c/span> a\u003cspan class=\"t-o\">,\u003c/span> b \u003cspan class=\"t-k\">FROM\u003c/span> s \u003cspan class=\"t-k\">WHERE\u003c/span> …\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">UPDATE\u003c/span> t \u003cspan class=\"t-k\">SET\u003c/span> v \u003cspan class=\"t-o\">=\u003c/span> \u003cspan class=\"t-k\">CASE\u003c/span> \u003cspan class=\"t-k\">WHEN\u003c/span> … \u003cspan class=\"t-k\">THEN\u003c/span> … \u003cspan class=\"t-k\">ELSE\u003c/span> v \u003cspan class=\"t-k\">END\u003c/span> \u003cspan class=\"t-k\">WHERE\u003c/span> …\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">UPDATE\u003c/span> t \u003cspan class=\"t-k\">JOIN\u003c/span> s \u003cspan class=\"t-k\">ON\u003c/span> s\u003cspan class=\"t-o\">.\u003c/span>id \u003cspan class=\"t-o\">=\u003c/span> t\u003cspan class=\"t-o\">.\u003c/span>s_id \u003cspan class=\"t-k\">SET\u003c/span> t\u003cspan class=\"t-o\">.\u003c/span>v \u003cspan class=\"t-o\">=\u003c/span> s\u003cspan class=\"t-o\">.\u003c/span>v \u003cspan class=\"t-k\">WHERE\u003c/span> …\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">DELETE\u003c/span> \u003cspan class=\"t-k\">FROM\u003c/span> t \u003cspan class=\"t-k\">WHERE\u003c/span> …\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">INSERT\u003c/span> \u003cspan class=\"t-k\">INTO\u003c/span> \u003cspan class=\"t-f\">t\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>k\u003cspan class=\"t-o\">,\u003c/span> n\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">VALUES\u003c/span> \u003cspan class=\"t-o\">(\u003c/span>\u003cspan class=\"t-s\">'a'\u003c/span>\u003cspan class=\"t-o\">,\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">)\u003c/span> \u003cspan class=\"t-k\">ON\u003c/span> \u003cspan class=\"t-k\">DUPLICATE\u003c/span> \u003cspan class=\"t-k\">KEY\u003c/span> \u003cspan class=\"t-k\">UPDATE\u003c/span> n \u003cspan class=\"t-o\">=\u003c/span> n \u003cspan class=\"t-o\">+\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">INSERT\u003c/span> \u003cspan class=\"t-k\">IGNORE\u003c/span> \u003cspan class=\"t-k\">INTO\u003c/span> t …\u003cspan class=\"t-o\">;\u003c/span>          \u003cspan class=\"t-c\">-- skip duplicate keys\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Run the WHERE as a SELECT first. Error 1093 means you need to wrap the self-referencing subquery in a derived table.\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Transactions\u003c/h2>\u003cpre class=\"code sql\">\u003ccode>\u003cspan class=\"t-k\">START\u003c/span> \u003cspan class=\"t-k\">TRANSACTION\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">UPDATE\u003c/span> accounts \u003cspan class=\"t-k\">SET\u003c/span> balance \u003cspan class=\"t-o\">=\u003c/span> balance \u003cspan class=\"t-o\">-\u003c/span> \u003cspan class=\"t-n\">80\u003c/span> \u003cspan class=\"t-k\">WHERE\u003c/span> id \u003cspan class=\"t-o\">=\u003c/span> \u003cspan class=\"t-n\">1\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">UPDATE\u003c/span> accounts \u003cspan class=\"t-k\">SET\u003c/span> balance \u003cspan class=\"t-o\">=\u003c/span> balance \u003cspan class=\"t-o\">+\u003c/span> \u003cspan class=\"t-n\">80\u003c/span> \u003cspan class=\"t-k\">WHERE\u003c/span> id \u003cspan class=\"t-o\">=\u003c/span> \u003cspan class=\"t-n\">2\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>\n\u003cspan class=\"t-k\">COMMIT\u003c/span>\u003cspan class=\"t-o\">;\u003c/span>                          \u003cspan class=\"t-c\">-- or ROLLBACK;\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>InnoDB defaults to REPEATABLE READ (MVCC snapshots). Prevent lost updates with \u003ccode>SET x = x - 1\u003c/code>, \u003ccode>SELECT … FOR UPDATE\u003c/code>, or version columns.\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2>Indexing rules\u003c/h2>\u003cul>\n\u003cli>Index the columns used in WHERE, JOIN ON, and ORDER BY/GROUP BY.\u003c/li>\n\u003cli>Composite order: equality columns first, then the range or sort column. Leftmost prefix only.\u003c/li>\n\u003cli>Keep indexed columns bare: \u003ccode>d &gt;= … AND d &lt; …\u003c/code>, not \u003ccode>YEAR(d) = …\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>LIKE &#39;abc%&#39;\u003c/code> can use an index. \u003ccode>LIKE &#39;%abc&#39;\u003c/code> can&#39;t.\u003c/li>\n\u003cli>A covering index answers from the index alone.\u003c/li>\n\u003cli>Every index slows writes, so check \u003ccode>EXPLAIN\u003c/code> before and after.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sheet-card\">\u003ch2
