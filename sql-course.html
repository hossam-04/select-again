Y)\nWHERE w.temperature > y.temperature;","html":"\u003cp>Computing the date on one side lets MySQL use an index on \u003ccode>recordDate\u003c/code> for the lookup.\u003c/p>\n"},{"title":"LAG with a gap check","sql":"SELECT id\nFROM (\n  SELECT id, recordDate, temperature,\n         LAG(recordDate)  OVER (ORDER BY recordDate) AS prev_date,\n         LAG(temperature) OVER (ORDER BY recordDate) AS prev_temp\n  FROM Weather\n) t\nWHERE temperature > prev_temp\n  AND DATEDIFF(recordDate, prev_date) = 1;","html":"\u003cp>LAG gives the previous \u003cem>row\u003c/em>; checking that it is also the previous \u003cem>day\u003c/em> handles gaps (Module 9).\u003c/p>\n"}],"traps":[{"sql":"SELECT w.id FROM Weather w JOIN Weather y ON w.id = y.id + 1 WHERE w.temperature > y.temperature;","html":"\u003cp>Assumes ids follow dates day by day. Day 6 (id 5) has no previous day but would be compared with id 4.\u003c/p>\n"},{"sql":"SELECT id FROM (SELECT id, temperature, LAG(temperature) OVER (ORDER BY recordDate) AS prev_temp FROM Weather) t WHERE temperature > prev_temp;","html":"\u003cp>LAG looks at the previous row, which is not always the previous day.\u003c/p>\n"},{"sql":"SELECT w.id FROM Weather w JOIN Weather y ON w.recordDate - y.recordDate = 1 WHERE w.temperature > y.temperature;","html":"\u003cp>Subtracting two DATEs subtracts them as numbers in MySQL: 20240201 − 20240131 = 70, not 1. It works inside a month, then silently misses 1 February. Use DATEDIFF.\u003c/p>\n"},{"sql":"SELECT w.id FROM Weather w JOIN Weather y ON w.recordDate = y.recordDate + 1 WHERE w.temperature > y.temperature;","html":"\u003cp>Same problem: \u003ccode>recordDate + 1\u003c/code> is the number 20240132, not the next date, so the month boundary breaks.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Weather","columns":[{"name":"id","type":"INT","pk":true},{"name":"recordDate","type":"DATE","pk":false},{"name":"temperature","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Weather (id INT PRIMARY KEY, recordDate DATE, temperature INT);\nINSERT INTO Weather VALUES\n  (1, '2024-01-01', 10), (2, '2024-01-02', 25), (3, '2024-01-03', 20), (4, '2024-01-04', 30),\n  (5, '2024-01-06', 35), (6, '2024-01-07', 30), (7, '2024-01-08', 31),\n  (8, '2024-01-09', 12), (9, '2024-01-10', 15),\n  (10, '2024-01-31', 5), (11, '2024-02-01', 8);","tables":[{"name":"Weather","rows":[[1,"2024-01-01",10],[2,"2024-01-02",25],[3,"2024-01-03",20],[4,"2024-01-04",30],[5,"2024-01-06",35],[6,"2024-01-07",30],[7,"2024-01-08",31],[8,"2024-01-09",12],[9,"2024-01-10",15],[10,"2024-01-31",5],[11,"2024-02-01",8]]}],"runs":[{"expected":{"columns":["id"],"rows":[[2],[4],[7],[9],[11]]}}]},{"name":"A year boundary and a leap day","setup":"CREATE TABLE Weather (id INT PRIMARY KEY, recordDate DATE, temperature INT);\nINSERT INTO Weather VALUES (1, '2023-12-31', -5), (2, '2024-01-01', -3), (3, '2024-02-28', 0), (4, '2024-02-29', 1), (5, '2024-03-01', 1), (6, '2024-03-02', 2);","tables":[{"name":"Weather","rows":[[1,"2023-12-31",-5],[2,"2024-01-01",-3],[3,"2024-02-28",0],[4,"2024-02-29",1],[5,"2024-03-01",1],[6,"2024-03-02",2]]}],"runs":[{"expected":{"columns":["id"],"rows":[[2],[4],[6]]}}]}]},"262":{"id":262,"title":"Trips and Users","slug":"trips-and-users","difficulty":"Hard","module":"ctes","patterns":["filter both joined users","rate per day","CTE"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>A trip counts only if \u003cstrong>both\u003c/strong> its client and its driver are unbanned. For each day from \u003cstrong>2013-10-01 to 2013-10-03\u003c/strong> that has at least one counted trip, return \u003ccode>Day\u003c/code> and \u003ccode>Cancellation Rate\u003c/code>: the share of counted trips whose status is a cancellation (by client or driver), rounded to 2 decimals. Any order.\u003c/p>\n\u003cp>Note the output column name contains a space.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Join Users twice — once as the client, once as the driver — and require both to be unbanned.\u003c/p>\n","\u003cp>Restrict to the three days, then group by day.\u003c/p>\n","\u003cp>The rate is the average of \u003ccode>status &lt;&gt; &#39;completed&#39;\u003c/code> over the counted trips.\u003c/p>\n","\u003cp>Quote the output name with backticks: \u003ccode>`Cancellation Rate`\u003c/code>.\u003c/p>\n"],"solution":{"sql":"WITH counted AS (             -- one row per trip with two unbanned users\n  SELECT t.request_at, t.status\n  FROM Trips t\n  JOIN Users c ON c.users_id = t.client_id AND c.banned = 'No'\n  JOIN Users d ON d.users_id = t.driver_id AND d.banned = 'No'\n  WHERE t.request_at BETWEEN '2013-10-01' AND '2013-10-03'\n)\nSELECT request_at AS Day,\n       ROUND(AVG(status \u003c> 'completed'), 2) AS `Cancellation Rate`\nFROM counted\nGROUP BY request_at;","html":"\u003cp>Joining Users under two aliases applies the ban check to each role. Days whose trips were all excluded produce no group at all, which is what the problem wants.\u003c/p>\n"},"alternatives":[{"title":"NOT IN banned users","sql":"SELECT request_at AS Day,\n       ROUND(SUM(status LIKE 'cancelled%') / COUNT(*), 2) AS `Cancellation Rate`\nFROM Trips\nWHERE request_at BETWEEN '2013-10-01' AND '2013-10-03'\n  AND client_id NOT IN (SELECT users_id FROM Users WHERE banned = 'Yes')\n  AND driver_id NOT IN (SELECT users_id FROM Users WHERE banned = 'Yes')\nGROUP BY request_at;","html":"\u003cp>Exclude trips touching any banned id. NOT IN is safe here — users_id is a primary key.\u003c/p>\n"}],"traps":[{"sql":"SELECT t.request_at AS Day, ROUND(AVG(t.status \u003c> 'completed'), 2) AS `Cancellation Rate` FROM Trips t JOIN Users c ON c.users_id = t.client_id AND c.banned = 'No' WHERE t.request_at BETWEEN '2013-10-01' AND '2013-10-03' GROUP BY t.request_at;","html":"\u003cp>Only checks the client; trip 4 has a banned driver and must be excluded.\u003c/p>\n"},{"sql":"SELECT t.request_at AS Day, ROUND(AVG(t.status \u003c> 'completed'), 2) AS `Cancellation Rate` FROM Trips t JOIN Users c ON c.users_id = t.client_id AND c.banned = 'No' JOIN Users d ON d.users_id = t.driver_id AND d.banned = 'No' GROUP BY t.request_at;","html":"\u003cp>Forgets the date range, so Sep 30 and Oct 4 appear.\u003c/p>\n"},{"sql":"SELECT t.request_at AS Day, ROUND(AVG(t.status = 'cancelled_by_driver'), 2) AS `Cancellation Rate` FROM Trips t JOIN Users c ON c.users_id = t.client_id AND c.banned = 'No' JOIN Users d ON d.users_id = t.driver_id AND d.banned = 'No' WHERE t.request_at BETWEEN '2013-10-01' AND '2013-10-03' GROUP BY t.request_at;","html":"\u003cp>Counts only driver cancellations; client cancellations count too.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Trips","columns":[{"name":"id","type":"INT","pk":true},{"name":"client_id","type":"INT","pk":false},{"name":"driver_id","type":"INT","pk":false},{"name":"city_id","type":"INT","pk":false},{"name":"status","type":"ENUM('COMPLETED', 'CANCELLED_BY_DRIVER', 'CANCELLED_BY_CLIENT')","pk":false},{"name":"request_at","type":"VARCHAR(50)","pk":false}]},{"name":"Users","columns":[{"name":"users_id","type":"INT","pk":true},{"name":"banned","type":"VARCHAR(50)","pk":false},{"name":"role","type":"ENUM('CLIENT', 'DRIVER', 'PARTNER')","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Trips (id INT PRIMARY KEY, client_id INT, driver_id INT, city_id INT, status ENUM('completed', 'cancelled_by_driver', 'cancelled_by_client'), request_at VARCHAR(50));\nCREATE TABLE Users (users_id INT PRIMARY KEY, banned VARCHAR(50), role ENUM('client', 'driver', 'partner'));\nINSERT INTO Users VALUES\n  (21, 'No', 'client'), (22, 'Yes', 'client'), (23, 'No', 'client'), (24, 'No', 'client'),\n  (31, 'No', 'driver'), (32, 'No', 'driver'), (33, 'No', 'driver'), (34, 'Yes', 'driver');\nINSERT INTO Trips VALUES\n  (1, 21, 31, 5, 'completed', '2013-10-01'), (2, 22, 32, 5, 'cancelled_by_driver', '2013-10-01'),\n  (3, 23, 33, 7, 'cancelled_by_client', '2013-10-01'), (4, 24, 34, 7, 'completed', '2013-10-01'),\n  (5, 21, 32, 5, 'completed', '2013-10-01'),\n  (6, 22, 31, 7, 'completed', '2013-10-02'), (7, 23, 32, 7, 'cancelled_by_driver', '2013-10-02'), (8, 24, 31, 9, 'cancelled_by_client', '2013-10-02'),\n  (9, 23, 31, 9, 'completed', '2013-10-03'), (10, 24, 32, 9, 'cancelled_by_driver', '2013-10-03'),\n  (11, 21, 33, 9, 'completed', '2013-10-03'), (12, 22, 34, 9, 'cancelled_by_client', '2013-10-03'),\n  (13, 21, 31, 5, 'cancelled_by_client', '2013-10-04'), (14, 23, 32, 5, 'cancelled_by_driver', '2013-09-30');","tables":[{"name":"Trips","rows":[[1,21,31,5,"completed","2013-10-01"],[2,22,32,5,"cancelled_by_driver","2013-10-01"],[3,23,33,7,"cancelled_by_client","2013-10-01"],[4,24,34,7,"completed","2013-10-01"],[5,21,32,5,"completed","2013-10-01"],[6,22,31,7,"completed","2013-10-02"],[7,23,32,7,"cancelled_by_driver","2013-10-02"],[8,24,31,9,"cancelled_by_client","2013-10-02"],[9,23,31,9,"completed","2013-10-03"],[10,24,32,9,"cancelled_by_driver","2013-10-03"],[11,21,33,9,"completed","2013-10-03"],[12,22,34,9,"cancelled_by_client","2013-10-03"],[13,21,31,5,"cancelled_by_client","2013-10-04"],[14,23,32,5,"cancelled_by_driver","2013-09-30"]]},{"name":"Users","rows":[[21,"No","client"],[22,"Yes","client"],[23,"No","client"],[24,"No","client"],[31,"No","driver"],[32,"No","driver"],[33,"No","driver"],[34,"Yes","driver"]]}],"runs":[{"expected":{"columns":["Day","Cancellation Rate"],"rows":[["2013-10-01",0.33],["2013-10-02",1],["2013-10-03",0.33]]}}]},{"name":"A day where every trip involves a banned user","setup":"CREATE TABLE Trips (id INT PRIMARY KEY, client_id INT, driver_id INT, city_id INT, status ENUM('completed', 'cancelled_by_driver', 'cancelled_by_client'), request_at VARCHAR(50));\nCREATE TABLE Users (users_id INT PRIMARY KEY, banned VARCHAR(50), role ENUM('client', 'driver', 'partner'));\nINSERT INTO Users VALUES (21, 'No', 'client'), (22, 'Yes', 'client'), (31, 'No', 'driver');\nINSERT INTO Trips VALUES (1, 21, 31, 1, 'cancelled_by_client', '2013-10-01'), (2, 22, 31, 1, 'completed', '2013-10-02');","tables":[{"name":"Trips","rows":[[1,21,31,1,"cancelled_by_client","2013-10-01"],[2,22,31,1,"completed","2013-10-02"]]},{"name":"Users","rows":[[21,"No","client"],[22,"Yes","client"],[31,"No","driver"]]}],"runs":[{"expected":{"columns":["Day","Cancellation Rate"],"rows":[["2013-10-01",1]]}}]}]},"511":{"id":511,"title":"Game Play Analysis I","slug":"game-play-analysis-i","difficulty":"Easy","module":"aggregation","patterns":["MIN per group"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Each row of \u003ccode>Activity\u003c/code> is one day a player logged in. Return \u003ccode>player_id\u003c/code> and \u003ccode>first_login\u003c/code> — the player&#39;s earliest login date. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>One row per player.\u003c/p>\n","\u003cp>The earliest date is the MIN of the dates.\u003c/p>\n"],"solution":{"sql":"SELECT player_id, MIN(event_date) AS first_login\nFROM Activity\nGROUP BY player_id;","html":"\u003cp>MIN works on dates. Rows are not stored in date order, so &quot;the first row per player&quot; would be meaningless — use an aggregate.\u003c/p>\n"},"alternatives":[{"title":"Window function","sql":"SELECT DISTINCT player_id,\n       FIRST_VALUE(event_date) OVER (PARTITION BY player_id ORDER BY event_date) AS first_login\nFROM Activity;","html":"\u003cp>Overkill here, but the same idea generalizes when you need other columns from the first row (Module 9).\u003c/p>\n"}],"traps":[{"sql":"SELECT player_id, MAX(event_date) AS first_login FROM Activity GROUP BY player_id;","html":"\u003cp>MAX gives the most recent login.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Activity","columns":[{"name":"player_id","type":"INT","pk":true},{"name":"device_id","type":"INT","pk":false},{"name":"event_date","type":"DATE","pk":true},{"name":"games_played","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Activity (player_id INT, device_id INT, event_date DATE, games_played INT, PRIMARY KEY (player_id, event_date));\nINSERT INTO Activity VALUES\n  (4, 1, '2023-11-05', 2), (4, 3, '2023-09-18', 7),\n  (6, 2, '2024-02-29', 1), (6, 2, '2024-01-15', 0),\n  (9, 5, '2023-12-31', 3), (9, 5, '2024-01-01', 4);","tables":[{"name":"Activity","rows":[[4,1,"2023-11-05",2],[4,3,"2023-09-18",7],[6,2,"2024-02-29",1],[6,2,"2024-01-15",0],[9,5,"2023-12-31",3],[9,5,"2024-01-01",4]]}],"runs":[{"expected":{"columns":["player_id","first_login"],"rows":[[4,"2023-09-18"],[6,"2024-01-15"],[9,"2023-12-31"]]}}]},{"name":"Logins across years","setup":"CREATE TABLE Activity (player_id INT, device_id INT, event_date DATE, games_played INT, PRIMARY KEY (player_id, event_date));\nINSERT INTO Activity VALUES (1, 1, '2022-01-01', 0), (1, 2, '2021-12-31', 5), (2, 1, '2020-02-29', 1);","tables":[{"name":"Activity","rows":[[1,1,"2022-01-01",0],[1,2,"2021-12-31",5],[2,1,"2020-02-29",1]]}],"runs":[{"expected":{"columns":["player_id","first_login"],"rows":[[1,"2021-12-31"],[2,"2020-02-29"]]}}]}]},"550":{"id":550,"title":"Game Play Analysis IV","slug":"game-play-analysis-iv","difficulty":"Medium","module":"subqueries","patterns":["first event per user","next-day retention"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Report the \u003cstrong>fraction\u003c/strong> of players who logged in again on the day right after their \u003cstrong>first\u003c/strong> login, rounded to 2 decimals: (players with a login on first_login + 1 day) ÷ (all players). Return one column, \u003ccode>fraction\u003c/code>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Find each player&#39;s first login date (MIN per player).\u003c/p>\n","\u003cp>Then check whether the same player has a row on that date + 1 day.\u003c/p>\n","\u003cp>Divide by the number of players, not the number of rows.\u003c/p>\n"],"solution":{"sql":"SELECT ROUND(COUNT(a.player_id) / COUNT(f.player_id), 2) AS fraction\nFROM (\n  SELECT player_id, MIN(event_date) AS first_day\n  FROM Activity\n  GROUP BY player_id\n) f\nLEFT JOIN Activity a\n       ON a.player_id = f.player_id\n      AND a.event_date = DATE_ADD(f.first_day, INTERVAL 1 DAY);","html":"\u003cp>The derived table has one row per player. The LEFT JOIN finds a next-day login if there is one, so \u003ccode>COUNT(a.player_id)\u003c/code> counts retained players and \u003ccode>COUNT(f.player_id)\u003c/code> counts all players. Player 3 logs in on consecutive days later on, but not right after the first login.\u003c/p>\n"},"alternatives":[{"title":"Tuple IN","sql":"SELECT ROUND(\n  (SELECT COUNT(*) FROM Activity\n   WHERE (player_id, DATE_SUB(event_date, INTERVAL 1 DAY)) IN\n         (SELECT player_id, MIN(event_date) FROM Activity GROUP BY player_id))\n  / (SELECT COUNT(DISTINCT player_id) FROM Activity), 2) AS fraction;","html":"\u003cp>A row counts if &quot;the day before it&quot; was that player&#39;s first login day.\u003c/p>\n"}],"traps":[{"sql":"SELECT ROUND(COUNT(DISTINCT a.player_id) / (SELECT COUNT(DISTINCT player_id) FROM Activity), 2) AS fraction FROM Activity a JOIN Activity b ON b.player_id = a.player_id AND DATEDIFF(b.event_date, a.event_date) = 1;","html":"\u003cp>Counts players with \u003cem>any\u003c/em> two consecutive days — player 3 qualifies later on, but not after the first login.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Activity","columns":[{"name":"player_id","type":"INT","pk":true},{"name":"device_id","type":"INT","pk":false},{"name":"event_date","type":"DATE","pk":true},{"name":"games_played","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Activity (player_id INT, device_id INT, event_date DATE, games_played INT, PRIMARY KEY (player_id, event_date));\nINSERT INTO Activity VALUES\n  (1, 2, '2024-03-01', 5), (1, 2, '2024-03-02', 6),\n  (2, 3, '2024-06-25', 1), (2, 3, '2024-06-27', 2),\n  (3, 1, '2024-03-02', 0), (3, 4, '2024-07-03', 5), (3, 4, '2024-07-04', 1),\n  (4, 1, '2024-01-01', 3),\n  (5, 2, '2024-12-31', 4), (5, 2, '2025-01-01', 2),\n  (6, 1, '2024-05-05', 1), (6, 1, '2024-05-04', 2),\n  (7, 5, '2024-08-08', 9);","tables":[{"name":"Activity","rows":[[1,2,"2024-03-01",5],[1,2,"2024-03-02",6],[2,3,"2024-06-25",1],[2,3,"2024-06-27",2],[3,1,"2024-03-02",0],[3,4,"2024-07-03",5],[3,4,"2024-07-04",1],[4,1,"2024-01-01",3],[5,2,"2024-12-31",4],[5,2,"2025-01-01",2],[6,1,"2024-05-05",1],[6,1,"2024-05-04",2],[7,5,"2024-08-08",9]]}],"runs":[{"expected":{"columns":["fraction"],"rows":[[0.43]]}}]},{"name":"Only a leap-day return","setup":"CREATE TABLE Activity (player_id INT, device_id INT, event_date DATE, games_played INT, PRIMARY KEY (player_id, event_date));\nINSERT INTO Activity VALUES (1, 1, '2024-01-01', 1), (1, 1, '2024-01-03', 1), (2, 1, '2024-02-01', 1), (3, 1, '2024-02-28', 1), (3, 1, '2024-02-29', 1);","tables":[{"name":"Activity","rows":[[1,1,"2024-01-01",1],[1,1,"2024-01-03",1],[2,1,"2024-02-01",1],[3,1,"2024-02-28",1],[3,1,"2024-02-29",1]]}],"runs":[{"expected":{"columns":["fraction"],"rows":[[0.33]]}}]}]},"570":{"id":570,"title":"Managers with at Least 5 Direct Reports","slug":"managers-with-at-least-5-direct-reports","difficulty":"Medium","module":"joins","patterns":["self-join","GROUP BY + HAVING"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Return the \u003ccode>name\u003c/code> of every manager with \u003cstrong>at least five\u003c/strong> direct reports. Any order. Two different employees can share a name.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Count reports per \u003ccode>managerId\u003c/code>.\u003c/p>\n","\u003cp>Group by the manager&#39;s \u003cstrong>id\u003c/strong>, not name — two Anas manage different teams.\u003c/p>\n","\u003cp>Manager 999 has five reports but no row of their own, so there is no name to return.\u003c/p>\n"],"solution":{"sql":"SELECT m.name\nFROM Employee m\nJOIN Employee e ON e.managerId = m.id\nGROUP BY m.id, m.name\nHAVING COUNT(*) >= 5;","html":"\u003cp>Joining reports to their manager and grouping by the manager&#39;s id counts each manager&#39;s team separately, even when names repeat.\u003c/p>\n"},"alternatives":[{"title":"IN with a grouped subquery","sql":"SELECT name\nFROM Employee\nWHERE id IN (SELECT managerId FROM Employee GROUP BY managerId HAVING COUNT(*) >= 5);","html":"\u003cp>Find qualifying manager ids first, then look their names up. Manager 999 is not in the table, so it simply finds no name.\u003c/p>\n"}],"traps":[{"sql":"SELECT m.name FROM Employee m JOIN Employee e ON e.managerId = m.id GROUP BY m.name HAVING COUNT(*) >= 5;","html":"\u003cp>Grouping by name merges the two Anas (3 + 2 reports) into one manager with five.\u003c/p>\n"},{"sql":"SELECT m.name FROM Employee m JOIN Employee e ON e.managerId = m.id GROUP BY m.id, m.name HAVING COUNT(*) > 5;","html":"\u003cp>&quot;At least five&quot; includes exactly five.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employee","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false},{"name":"department","type":"VARCHAR(255)","pk":false},{"name":"managerId","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), department VARCHAR(255), managerId INT);\nINSERT INTO Employee VALUES\n  (101, 'John', 'A', NULL), (102, 'Dan', 'A', 101), (103, 'James', 'A', 101), (104, 'Amy', 'A', 101), (105, 'Anne', 'A', 101), (106, 'Ron', 'B', 101),\n  (201, 'Ana', 'C', NULL), (202, 'Ana', 'C', NULL), (203, 'Bo', 'C', 201), (204, 'Cy', 'C', 201), (205, 'Di', 'C', 201), (206, 'Ed', 'C', 202), (207, 'Flo', 'C', 202),\n  (301, 'Gil', 'D', 999), (302, 'Hal', 'D', 999), (303, 'Ian', 'D', 999), (304, 'Jo', 'D', 999), (305, 'Kay', 'D', 999);","tables":[{"name":"Employee","rows":[[101,"John","A",null],[102,"Dan","A",101],[103,"James","A",101],[104,"Amy","A",101],[105,"Anne","A",101],[106,"Ron","B",101],[201,"Ana","C",null],[202,"Ana","C",null],[203,"Bo","C",201],[204,"Cy","C",201],[205,"Di","C",201],[206,"Ed","C",202],[207,"Flo","C",202],[301,"Gil","D",999],[302,"Hal","D",999],[303,"Ian","D",999],[304,"Jo","D",999],[305,"Kay","D",999]]}],"runs":[{"expected":{"columns":["name"],"rows":[["John"]]}}]},{"name":"Exactly five, and more than five","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), department VARCHAR(255), managerId INT);\nINSERT INTO Employee VALUES (1, 'Zed', 'X', NULL), (2, 'Ari', 'X', 1), (3, 'Bea', 'X', 1), (4, 'Cy', 'X', 1), (5, 'Dov', 'X', 1), (6, 'Eno', 'X', 1), (10, 'Ola', 'Y', NULL), (11, 'Fio', 'Y', 10), (12, 'Gus', 'Y', 10), (13, 'Hana', 'Y', 10), (14, 'Ike', 'Y', 10), (15, 'Jae', 'Y', 10), (16, 'Kit', 'Y', 10);","tables":[{"name":"Employee","rows":[[1,"Zed","X",null],[2,"Ari","X",1],[3,"Bea","X",1],[4,"Cy","X",1],[5,"Dov","X",1],[6,"Eno","X",1],[10,"Ola","Y",null],[11,"Fio","Y",10],[12,"Gus","Y",10],[13,"Hana","Y",10],[14,"Ike","Y",10],[15,"Jae","Y",10],[16,"Kit","Y",10]]}],"runs":[{"expected":{"columns":["name"],"rows":[["Zed"],["Ola"]]}}]}]},"577":{"id":577,"title":"Employee Bonus","slug":"employee-bonus","difficulty":"Easy","module":"joins","patterns":["LEFT JOIN","NULL in filters"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Report \u003ccode>name\u003c/code> and \u003ccode>bonus\u003c/code> for every employee whose bonus is \u003cstrong>less than 1000\u003c/strong>, or who has \u003cstrong>no bonus at all\u003c/strong> (show NULL). Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Employees without a bonus row must appear — LEFT JOIN.\u003c/p>\n","\u003cp>After the join, &quot;no bonus&quot; shows up as NULL. Does \u003ccode>bonus &lt; 1000\u003c/code> keep NULL rows?\u003c/p>\n"],"solution":{"sql":"SELECT e.name, b.bonus\nFROM Employee e\nLEFT JOIN Bonus b ON b.empId = e.empId\nWHERE b.bonus \u003c 1000 OR b.bonus IS NULL;","html":"\u003cp>Here the WHERE on the right table is intended: we \u003cem>want\u003c/em> to filter after the join, and \u003ccode>IS NULL\u003c/code> deliberately keeps the unmatched employees.\u003c/p>\n"},"alternatives":[{"title":"IFNULL","sql":"SELECT e.name, b.bonus\nFROM Employee e\nLEFT JOIN Bonus b ON b.empId = e.empId\nWHERE IFNULL(b.bonus, 0) \u003c 1000;","html":"\u003cp>Treat &quot;no bonus&quot; as 0 for the comparison; the SELECT still shows NULL.\u003c/p>\n"}],"traps":[{"sql":"SELECT e.name, b.bonus FROM Employee e LEFT JOIN Bonus b ON b.empId = e.empId WHERE b.bonus \u003c 1000;","html":"\u003cp>\u003ccode>NULL &lt; 1000\u003c/code> is UNKNOWN, so employees without a bonus are dropped.\u003c/p>\n"},{"sql":"SELECT e.name, b.bonus FROM Employee e LEFT JOIN Bonus b ON b.empId = e.empId WHERE b.bonus \u003c= 1000 OR b.bonus IS NULL;","html":"\u003cp>A bonus of exactly 1000 is not less than 1000.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employee","columns":[{"name":"empId","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false},{"name":"supervisor","type":"INT","pk":false},{"name":"salary","type":"INT","pk":false}]},{"name":"Bonus","columns":[{"name":"empId","type":"INT","pk":true},{"name":"bonus","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employee (empId INT PRIMARY KEY, name VARCHAR(255), supervisor INT, salary INT);\nCREATE TABLE Bonus (empId INT PRIMARY KEY, bonus INT);\nINSERT INTO Employee VALUES (1, 'Ava', NULL, 5000), (2, 'Ben', 1, 3000), (3, 'Cal', 1, 3500), (4, 'Dia', 2, 2000), (5, 'Eli', 2, 2500);\nINSERT INTO Bonus VALUES (2, 500), (3, 1000), (4, 2000);","tables":[{"name":"Employee","rows":[[1,"Ava",null,5000],[2,"Ben",1,3000],[3,"Cal",1,3500],[4,"Dia",2,2000],[5,"Eli",2,2500]]},{"name":"Bonus","rows":[[2,500],[3,1000],[4,2000]]}],"runs":[{"expected":{"columns":["name","bonus"],"rows":[["Ava",null],["Ben",500],["Eli",null]]}}]},{"name":"Bonuses around 1000","setup":"CREATE TABLE Employee (empId INT PRIMARY KEY, name VARCHAR(255), supervisor INT, salary INT);\nCREATE TABLE Bonus (empId INT PRIMARY KEY, bonus INT);\nINSERT INTO Employee VALUES (1, 'Pat', NULL, 100), (2, 'Quin', 1, 100), (3, 'Rex', 1, 100), (4, 'Sid', 1, 100); INSERT INTO Bonus VALUES (1, 999), (2, 1000), (3, 1001);","tables":[{"name":"Employee","rows":[[1,"Pat",null,100],[2,"Quin",1,100],[3,"Rex",1,100],[4,"Sid",1,100]]},{"name":"Bonus","rows":[[1,999],[2,1000],[3,1001]]}],"runs":[{"expected":{"columns":["name","bonus"],"rows":[["Pat",999],["Sid",null]]}}]}]},"584":{"id":584,"title":"Find Customer Referee","slug":"find-customer-referee","difficulty":"Easy","module":"filtering","patterns":["NULL in comparisons","IS NULL"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Each customer may have been referred by another customer (\u003ccode>referee_id\u003c/code>, NULL when nobody referred them). Return the \u003ccode>name\u003c/code> of every customer who was \u003cstrong>not\u003c/strong> referred by the customer with id 2 — including customers with no referrer at all. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>What does \u003ccode>referee_id &lt;&gt; 2\u003c/code> evaluate to when \u003ccode>referee_id\u003c/code> is NULL?\u003c/p>\n","\u003cp>WHERE keeps only rows whose condition is TRUE — UNKNOWN rows are dropped.\u003c/p>\n","\u003cp>Add the NULL case explicitly with \u003ccode>IS NULL\u003c/code>.\u003c/p>\n"],"solution":{"sql":"SELECT name\nFROM Customer\nWHERE referee_id \u003c> 2\n   OR referee_id IS NULL;","html":"\u003cp>For customers without a referrer, \u003ccode>referee_id &lt;&gt; 2\u003c/code> is UNKNOWN, so the first condition alone drops them. \u003ccode>OR referee_id IS NULL\u003c/code> brings them back.\u003c/p>\n"},"alternatives":[{"title":"NULL-safe equality","sql":"SELECT name\nFROM Customer\nWHERE NOT (referee_id \u003c=> 2);","html":"\u003cp>\u003ccode>&lt;=&gt;\u003c/code> never returns UNKNOWN: \u003ccode>NULL &lt;=&gt; 2\u003c/code> is 0 (false), so \u003ccode>NOT\u003c/code> makes it true. PostgreSQL spells this \u003ccode>referee_id IS DISTINCT FROM 2\u003c/code>.\u003c/p>\n"},{"title":"Replace NULL first","sql":"SELECT name\nFROM Customer\nWHERE IFNULL(referee_id, 0) \u003c> 2;","html":"\u003cp>Map NULL to a value that can never be a real id, then compare. Works, but wrapping the column in a function prevents index use on large tables.\u003c/p>\n"}],"traps":[{"sql":"SELECT name FROM Customer WHERE referee_id \u003c> 2;","html":"\u003cp>Silently drops every customer whose \u003ccode>referee_id\u003c/code> is NULL.\u003c/p>\n"},{"sql":"SELECT name FROM Customer WHERE referee_id \u003c> 2 OR referee_id = NULL;","html":"\u003cp>\u003ccode>= NULL\u003c/code> is never TRUE, so this is the same as the first wrong answer. Use \u003ccode>IS NULL\u003c/code>.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Customer","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(25)","pk":false},{"name":"referee_id","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Customer (id INT PRIMARY KEY, name VARCHAR(25), referee_id INT);\nINSERT INTO Customer VALUES\n  (1, 'Amira', NULL), (2, 'Bruno', NULL), (3, 'Chen', 2), (4, 'Dana', 1),\n  (5, 'Elif', NULL), (6, 'Femi', 2), (7, 'Gus', 3), (8, 'Hana', 2);","tables":[{"name":"Customer","rows":[[1,"Amira",null],[2,"Bruno",null],[3,"Chen",2],[4,"Dana",1],[5,"Elif",null],[6,"Femi",2],[7,"Gus",3],[8,"Hana",2]]}],"runs":[{"expected":{"columns":["name"],"rows":[["Amira"],["Bruno"],["Dana"],["Elif"],["Gus"]]}}]},{"name":"Everyone was referred by 2","setup":"CREATE TABLE Customer (id INT PRIMARY KEY, name VARCHAR(25), referee_id INT);\nINSERT INTO Customer VALUES (1, 'Ana', NULL), (2, 'Ben', NULL), (3, 'Cy', 2), (4, 'Di', 2);","tables":[{"name":"Customer","rows":[[1,"Ana",null],[2,"Ben",null],[3,"Cy",2],[4,"Di",2]]}],"runs":[{"expected":{"columns":["name"],"rows":[["Ana"],["Ben"]]}}]}]},"585":{"id":585,"title":"Investments in 2016","slug":"investments-in-2016","difficulty":"Medium","module":"subqueries","patterns":["IN with GROUP BY HAVING","uniqueness test"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Return \u003ccode>tiv_2016\u003c/code>: the sum of \u003ccode>tiv_2016\u003c/code> (rounded to 2 decimals) over policies that\u003c/p>\n\u003cul>\n\u003cli>share their \u003ccode>tiv_2015\u003c/code> value with \u003cstrong>at least one other\u003c/strong> policy, \u003cstrong>and\u003c/strong>\u003c/li>\n\u003cli>are the \u003cstrong>only\u003c/strong> policy at their location — no other policy has the same (\u003ccode>lat\u003c/code>, \u003ccode>lon\u003c/code>) pair.\u003c/li>\n\u003c/ul>\n","notesHtml":"","hints":["\u003cp>Condition 1: tiv_2015 is in the set of values that occur more than once.\u003c/p>\n","\u003cp>Condition 2: (lat, lon) is in the set of pairs that occur exactly once — compare the pair, not lat alone.\u003c/p>\n"],"solution":{"sql":"SELECT ROUND(SUM(tiv_2016), 2) AS tiv_2016\nFROM Insurance\nWHERE tiv_2015 IN (SELECT tiv_2015 FROM Insurance GROUP BY tiv_2015 HAVING COUNT(*) > 1)\n  AND (lat, lon) IN (SELECT lat, lon FROM Insurance GROUP BY lat, lon HAVING COUNT(*) = 1);","html":"\u003cp>Each subquery turns a &quot;compared with every other row&quot; condition into a set membership test built with GROUP BY + HAVING.\u003c/p>\n"},"alternatives":[{"title":"Window counts","sql":"SELECT ROUND(SUM(tiv_2016), 2) AS tiv_2016\nFROM (\n  SELECT tiv_2016,\n         COUNT(*) OVER (PARTITION BY tiv_2015) AS same_tiv,\n         COUNT(*) OVER (PARTITION BY lat, lon) AS same_place\n  FROM Insurance\n) t\nWHERE same_tiv > 1 AND same_place = 1;","html":"\u003cp>Annotate each row with how many rows share its value/location, then filter (Module 9).\u003c/p>\n"}],"traps":[{"sql":"SELECT ROUND(SUM(tiv_2016), 2) AS tiv_2016 FROM Insurance WHERE tiv_2015 IN (SELECT tiv_2015 FROM Insurance GROUP BY tiv_2015 HAVING COUNT(*) > 1) AND lat IN (SELECT lat FROM Insurance GROUP BY lat HAVING COUNT(*) = 1);","html":"\u003cp>Checks latitude alone; policy 1 and 7 share a latitude but are at different locations.\u003c/p>\n"},{"sql":"SELECT ROUND(SUM(tiv_2016), 2) AS tiv_2016 FROM Insurance WHERE tiv_2015 IN (SELECT tiv_2015 FROM Insurance GROUP BY tiv_2015 HAVING COUNT(*) > 1);","html":"\u003cp>Forgets the unique-location condition.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Insurance","columns":[{"name":"pid","type":"INT","pk":true},{"name":"tiv_2015","type":"FLOAT","pk":false},{"name":"tiv_2016","type":"FLOAT","pk":false},{"name":"lat","type":"FLOAT","pk":false},{"name":"lon","type":"FLOAT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Insurance (pid INT PRIMARY KEY, tiv_2015 FLOAT, tiv_2016 FLOAT, lat FLOAT, lon FLOAT);\nINSERT INTO Insurance VALUES\n  (1, 100, 15.5, 1.0, 1.0), (2, 200, 30.0, 2.0, 2.0), (3, 100, 40.25, 3.0, 3.0), (4, 300, 55.0, 4.0, 4.0),\n  (5, 100, 12.0, 5.0, 5.0), (6, 300, 99.0, 3.0, 3.0), (7, 200, 10.0, 1.0, 9.0);","tables":[{"name":"Insurance","rows":[[1,100,15.5,1,1],[2,200,30,2,2],[3,100,40.25,3,3],[4,300,55,4,4],[5,100,12,5,5],[6,300,99,3,3],[7,200,10,1,9]]}],"runs":[{"expected":{"columns":["tiv_2016"],"rows":[[122.5]]}}]},{"name":"A shared location beats a shared value","setup":"CREATE TABLE Insurance (pid INT PRIMARY KEY, tiv_2015 FLOAT, tiv_2016 FLOAT, lat FLOAT, lon FLOAT);\nINSERT INTO Insurance VALUES (1, 50, 1.5, 10, 10), (2, 50, 2.25, 20, 20), (3, 60, 4.0, 30, 30), (4, 50, 8.0, 20, 20);","tables":[{"name":"Insurance","rows":[[1,50,1.5,10,10],[2,50,2.25,20,20],[3,60,4,30,30],[4,50,8,20,20]]}],"runs":[{"expected":{"columns":["tiv_2016"],"rows":[[1.5]]}}]}]},"586":{"id":586,"title":"Customer Placing the Largest Number of Orders","slug":"customer-placing-the-largest-number-of-orders","difficulty":"Easy","module":"aggregation","patterns":["ORDER BY aggregate + LIMIT"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Find the \u003ccode>customer_number\u003c/code> of the customer who placed the most orders. Exactly one customer has more orders than everyone else.\u003c/p>\n\u003cp>\u003cem>Follow-up:\u003c/em> how would you return all tied customers if several shared the maximum?\u003c/p>\n","notesHtml":"","hints":["\u003cp>Count orders per customer.\u003c/p>\n","\u003cp>Sort those counts from high to low and keep the first row.\u003c/p>\n"],"solution":{"sql":"SELECT customer_number\nFROM Orders\nGROUP BY customer_number\nORDER BY COUNT(*) DESC\nLIMIT 1;","html":"\u003cp>ORDER BY can sort groups by an aggregate that is not even in the SELECT list. \u003ccode>LIMIT 1\u003c/code> is safe here only because the problem guarantees a single winner.\u003c/p>\n"},"alternatives":[{"title":"Handles ties: compare with the maximum count","sql":"SELECT customer_number\nFROM Orders\nGROUP BY customer_number\nHAVING COUNT(*) = (\n  SELECT MAX(cnt) FROM (SELECT COUNT(*) AS cnt FROM Orders GROUP BY customer_number) t\n);","html":"\u003cp>Aggregates cannot nest (\u003ccode>MAX(COUNT(*))\u003c/code>), so compute the counts in a derived table and take their MAX. Every customer matching it is returned — the answer to the follow-up.\u003c/p>\n"}],"traps":[{"sql":"SELECT customer_number FROM Orders GROUP BY customer_number ORDER BY COUNT(*) LIMIT 1;","html":"\u003cp>Ascending order returns the customer with the fewest orders.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Orders","columns":[{"name":"order_number","type":"INT","pk":true},{"name":"customer_number","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Orders (order_number INT PRIMARY KEY, customer_number INT);\nINSERT INTO Orders VALUES (1, 7), (2, 3), (3, 7), (4, 5), (5, 3), (6, 7), (7, 9), (8, 5);","tables":[{"name":"Orders","rows":[[1,7],[2,3],[3,7],[4,5],[5,3],[6,7],[7,9],[8,5]]}],"runs":[{"expected":{"columns":["customer_number"],"rows":[[7]]}}]},{"name":"A single order","setup":"CREATE TABLE Orders (order_number INT PRIMARY KEY, customer_number INT);\nINSERT INTO Orders VALUES (1, 42);","tables":[{"name":"Orders","rows":[[1,42]]}],"runs":[{"expected":{"columns":["customer_number"],"rows":[[42]]}}]}]},"595":{"id":595,"title":"Big Countries","slug":"big-countries","difficulty":"Easy","module":"basics","patterns":["WHERE with OR","boundary values"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>A country is \u003cstrong>big\u003c/strong> if its \u003ccode>area\u003c/code> is at least 3,000,000 km² \u003cstrong>or\u003c/strong> its \u003ccode>population\u003c/code> is at least 25,000,000. Return \u003ccode>name\u003c/code>, \u003ccode>population\u003c/code> and \u003ccode>area\u003c/code> of every big country, in any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>&quot;At least&quot; includes the boundary value itself.\u003c/p>\n","\u003cp>Either condition is enough on its own.\u003c/p>\n","\u003cp>Try the data rows sitting exactly on 3,000,000 and 25,000,000 — are they in your result?\u003c/p>\n"],"solution":{"sql":"SELECT name, population, area\nFROM World\nWHERE area >= 3000000\n   OR population >= 25000000;","html":"\u003cp>&quot;At least&quot; is \u003ccode>&gt;=\u003c/code>, and &quot;either condition&quot; is \u003ccode>OR\u003c/code>. The rows \u003cem>Edgeland\u003c/em> and \u003cem>Quorum\u003c/em> sit exactly on the thresholds and must be included; \u003cem>Nearlyland\u003c/em> is one unit short on both.\u003c/p>\n"},"alternatives":[{"title":"UNION of two filters","sql":"SELECT name, population, area FROM World WHERE area >= 3000000\nUNION\nSELECT name, population, area FROM World WHERE population >= 25000000;","html":"\u003cp>\u003ccode>UNION\u003c/code> removes the duplicate rows for countries that pass both tests. With an index on each column, MySQL can run each half as an index range scan — a classic reason people write it this way.\u003c/p>\n"}],"traps":[{"sql":"SELECT name, population, area FROM World WHERE area > 3000000 OR population > 25000000;","html":"\u003cp>\u003ccode>&gt;\u003c/code> drops the countries sitting exactly on the thresholds.\u003c/p>\n"},{"sql":"SELECT name, population, area FROM World WHERE area >= 3000000\nUNION ALL\nSELECT name, population, area FROM World WHERE population >= 25000000;","html":"\u003cp>\u003ccode>UNION ALL\u003c/code> keeps duplicates, so a country that is big by both measures appears twice.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"World","columns":[{"name":"name","type":"VARCHAR(255)","pk":true},{"name":"continent","type":"VARCHAR(255)","pk":false},{"name":"area","type":"INT","pk":false},{"name":"population","type":"INT","pk":false},{"name":"gdp","type":"BIGINT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE World (name VARCHAR(255) PRIMARY KEY, continent VARCHAR(255), area INT, population INT, gdp BIGINT);\nINSERT INTO World VALUES\n  ('Brazil',     'South America', 8515767, 203062512, 2126809000000),\n  ('Nepal',      'Asia',           147516,  29164578,   40828000000),\n  ('Mongolia',   'Asia',          1564116,   3398366,   19872000000),\n  ('Iceland',    'Europe',         103000,    387758,   31020000000),\n  ('Edgeland',   'Europe',        3000000,   1200000,    5000000000),\n  ('Quorum',     'Oceania',         42000,  25000000,    1500000000),\n  ('Nearlyland', 'Africa',        2999999,  24999999,     900000000);","tables":[{"name":"World","rows":[["Brazil","South America",8515767,203062512,2126809000000],["Nepal","Asia",147516,29164578,40828000000],["Mongolia","Asia",1564116,3398366,19872000000],["Iceland","Europe",103000,387758,31020000000],["Edgeland","Europe",3000000,1200000,5000000000],["Quorum","Oceania",42000,25000000,1500000000],["Nearlyland","Africa",2999999,24999999,900000000]]}],"runs":[{"expected":{"columns":["name","population","area"],"rows":[["Brazil",203062512,8515767],["Nepal",29164578,147516],["Edgeland",1200000,3000000],["Quorum",25000000,42000]]}}]},{"name":"Missing figures","setup":"CREATE TABLE World (name VARCHAR(255) PRIMARY KEY, continent VARCHAR(255), area INT, population INT, gdp BIGINT);\nINSERT INTO World VALUES ('Unmapped', 'Asia', NULL, 26000000, 1000), ('Tinyland', 'Europe', 50, NULL, 10), ('Atoll', 'Oceania', 12, 11000, 5);","tables":[{"name":"World","rows":[["Unmapped","Asia",null,26000000,1000],["Tinyland","Europe",50,null,10],["Atoll","Oceania",12,11000,5]]}],"runs":[{"expected":{"columns":["name","population","area"],"rows":[["Unmapped",26000000,null]]}}]}]},"596":{"id":596,"title":"Classes With at Least 5 Students","slug":"classes-with-at-least-5-students","difficulty":"Easy","module":"aggregation","patterns":["GROUP BY + HAVING"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Each row of \u003ccode>Courses\u003c/code> enrolls one student in one class (the pair is unique). Return every \u003ccode>class\u003c/code> that has \u003cstrong>at least five\u003c/strong> students. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Count students per class.\u003c/p>\n","\u003cp>&quot;At least five&quot; is \u003ccode>&gt;= 5\u003c/code> — Math has exactly five.\u003c/p>\n"],"solution":{"sql":"SELECT class\nFROM Courses\nGROUP BY class\nHAVING COUNT(*) >= 5;","html":"\u003cp>Because (student, class) is unique, \u003ccode>COUNT(*)\u003c/code> per class is the number of students.\u003c/p>\n"},"alternatives":[{"title":"Aggregate in a derived table","sql":"SELECT class\nFROM (SELECT class, COUNT(student) AS n FROM Courses GROUP BY class) t\nWHERE n >= 5;","html":"\u003cp>Compute the count first, then filter it with an ordinary WHERE in the outer query. HAVING is just shorthand for this shape.\u003c/p>\n"}],"traps":[{"sql":"SELECT class FROM Courses GROUP BY class HAVING COUNT(*) > 5;","html":"\u003cp>Excludes classes with exactly five students.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Courses","columns":[{"name":"student","type":"VARCHAR(30)","pk":true},{"name":"class","type":"VARCHAR(30)","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Courses (student VARCHAR(30), class VARCHAR(30), PRIMARY KEY (student, class));\nINSERT INTO Courses VALUES\n  ('A', 'Math'), ('B', 'Math'), ('C', 'Math'), ('D', 'Math'), ('E', 'Math'),\n  ('A', 'English'), ('F', 'English'), ('G', 'English'),\n  ('B', 'Biology'), ('C', 'Biology'), ('D', 'Biology'), ('E', 'Biology'), ('F', 'Biology'), ('G', 'Biology'),\n  ('H', 'Art'), ('I', 'Art'), ('J', 'Art'), ('K', 'Art');","tables":[{"name":"Courses","rows":[["A","Math"],["B","Math"],["C","Math"],["D","Math"],["E","Math"],["A","English"],["F","English"],["G","English"],["B","Biology"],["C","Biology"],["D","Biology"],["E","Biology"],["F","Biology"],["G","Biology"],["H","Art"],["I","Art"],["J","Art"],["K","Art"]]}],"runs":[{"expected":{"columns":["class"],"rows":[["Biology"],["Math"]]}}]},{"name":"Nobody reaches five","setup":"CREATE TABLE Courses (student VARCHAR(30), class VARCHAR(30), PRIMARY KEY (student, class));\nINSERT INTO Courses VALUES ('A', 'Chem'), ('B', 'Chem'), ('C', 'Chem'), ('D', 'Chem'), ('A', 'Art');","tables":[{"name":"Courses","rows":[["A","Chem"],["B","Chem"],["C","Chem"],["D","Chem"],["A","Art"]]}],"runs":[{"expected":{"columns":["class"],"rows":[]}}]}]},"601":{"id":601,"title":"Human Traffic of Stadium","slug":"human-traffic-of-stadium","difficulty":"Hard","module":"patterns","patterns":["gaps and islands","consecutive ids"],"sql50":false,"order":true,"kind":"query","taskHtml":"\u003cp>Return every row that belongs to a run of \u003cstrong>three or more consecutive ids\u003c/strong> in which each row has \u003ccode>people &gt;= 100\u003c/code>. Return \u003ccode>id\u003c/code>, \u003ccode>visit_date\u003c/code>, \u003ccode>people\u003c/code>, ordered by \u003ccode>visit_date\u003c/code>. Ids can have gaps; a gap breaks a run.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Keep only busy rows (people &gt;= 100) first.\u003c/p>\n","\u003cp>Within a run of consecutive ids, \u003ccode>id − ROW_NUMBER()\u003c/code> is constant: that is the run&#39;s group key.\u003c/p>\n","\u003cp>Keep groups with at least 3 rows. Id 10 is missing, so 8–9 and 11–14 are separate runs.\u003c/p>\n"],"solution":{"sql":"WITH busy AS (\n  SELECT id, visit_date, people,\n         id - ROW_NUMBER() OVER (ORDER BY id) AS grp\n  FROM Stadium\n  WHERE people >= 100\n)\nSELECT id, visit_date, people\nFROM busy\nWHERE grp IN (SELECT grp FROM busy GROUP BY grp HAVING COUNT(*) >= 3)\nORDER BY visit_date;","html":"\u003cp>Busy ids 4, 5, 6 have row numbers 3, 4, 5 → group 1; ids 11–14 get group 3. Ids 8 and 9 form group 2 of size two, and the missing id 10 keeps them apart from 11–14.\u003c/p>\n"},"alternatives":[{"title":"Run length with a window count","sql":"WITH busy AS (\n  SELECT id, visit_date, people,\n         id - ROW_NUMBER() OVER (ORDER BY id) AS grp\n  FROM Stadium\n  WHERE people >= 100\n)\nSELECT id, visit_date, people\nFROM (SELECT b.*, COUNT(*) OVER (PARTITION BY grp) AS run_len FROM busy b) t\nWHERE run_len >= 3\nORDER BY visit_date;","html":"\u003cp>Annotate each busy row with its run length instead of filtering through a subquery.\u003c/p>\n"},{"title":"Triple self-join","sql":"SELECT DISTINCT s1.id, s1.visit_date, s1.people\nFROM Stadium s1, Stadium s2, Stadium s3\nWHERE s1.people >= 100 AND s2.people >= 100 AND s3.people >= 100\n  AND ((s2.id = s1.id + 1 AND s3.id = s1.id + 2)\n    OR (s2.id = s1.id - 1 AND s3.id = s1.id + 1)\n    OR (s2.id = s1.id - 2 AND s3.id = s1.id - 1))\nORDER BY s1.visit_date;","html":"\u003cp>A row qualifies if it is the first, middle or last of some busy triple. The classic pre-window answer.\u003c/p>\n"}],"traps":[{"sql":"WITH busy AS (SELECT id, visit_date, people, id - ROW_NUMBER() OVER (ORDER BY id) AS grp FROM Stadium WHERE people > 100) SELECT id, visit_date, people FROM busy WHERE grp IN (SELECT grp FROM busy GROUP BY grp HAVING COUNT(*) >= 3) ORDER BY visit_date;","html":"\u003cp>\u003ccode>&gt; 100\u003c/code> drops id 4 (exactly 100 people) and breaks its run.\u003c/p>\n"},{"sql":"SELECT id, visit_date, people FROM (SELECT s.*, COUNT(*) OVER (PARTITION BY grp) AS run_len FROM (SELECT id, visit_date, people, ROW_NUMBER() OVER (ORDER BY id) - ROW_NUMBER() OVER (PARTITION BY people >= 100 ORDER BY id) AS grp FROM Stadium) s WHERE people >= 100) t WHERE run_len >= 3 ORDER BY visit_date;","html":"\u003cp>Groups adjacent \u003cem>rows\u003c/em>, not adjacent ids — rows 9 and 11 look consecutive although id 10 is missing.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Stadium","columns":[{"name":"id","type":"INT","pk":true},{"name":"visit_date","type":"DATE","pk":false},{"name":"people","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Stadium (id INT PRIMARY KEY, visit_date DATE, people INT);\nINSERT INTO Stadium VALUES\n  (1, '2024-03-01', 120), (2, '2024-03-02', 130), (3, '2024-03-03', 80), (4, '2024-03-04', 100),\n  (5, '2024-03-05', 250), (6, '2024-03-06', 300), (7, '2024-03-07', 90), (8, '2024-03-08', 150),\n  (9, '2024-03-09', 160), (11, '2024-03-11', 170), (12, '2024-03-12', 400), (13, '2024-03-13', 500), (14, '2024-03-14', 110);","tables":[{"name":"Stadium","rows":[[1,"2024-03-01",120],[2,"2024-03-02",130],[3,"2024-03-03",80],[4,"2024-03-04",100],[5,"2024-03-05",250],[6,"2024-03-06",300],[7,"2024-03-07",90],[8,"2024-03-08",150],[9,"2024-03-09",160],[11,"2024-03-11",170],[12,"2024-03-12",400],[13,"2024-03-13",500],[14,"2024-03-14",110]]}],"runs":[{"expected":{"columns":["id","visit_date","people"],"rows":[[4,"2024-03-04",100],[5,"2024-03-05",250],[6,"2024-03-06",300],[11,"2024-03-11",170],[12,"2024-03-12",400],[13,"2024-03-13",500],[14,"2024-03-14",110]]}}]},{"name":"Gaps in the ids split runs","setup":"CREATE TABLE Stadium (id INT PRIMARY KEY, visit_date DATE, people INT);\nINSERT INTO Stadium VALUES (1, '2024-05-01', 100), (2, '2024-05-02', 100), (4, '2024-05-04', 100), (5, '2024-05-05', 200), (6, '2024-05-06', 300), (7, '2024-05-07', 50);","tables":[{"name":"Stadium","rows":[[1,"2024-05-01",100],[2,"2024-05-02",100],[4,"2024-05-04",100],[5,"2024-05-05",200],[6,"2024-05-06",300],[7,"2024-05-07",50]]}],"runs":[{"expected":{"columns":["id","visit_date","people"],"rows":[[4,"2024-05-04",100],[5,"2024-05-05",200],[6,"2024-05-06",300]]}}]}]},"602":{"id":602,"title":"Friend Requests II: Who Has the Most Friends","slug":"friend-requests-ii-who-has-the-most-friends","difficulty":"Medium","module":"sets","patterns":["stack both sides of a relationship"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Each row of \u003ccode>RequestAccepted\u003c/code> makes the requester and the accepter friends. Find the person with the \u003cstrong>most friends\u003c/strong> and return \u003ccode>id\u003c/code> and \u003ccode>num\u003c/code> (their number of friends). Exactly one person has the most.\u003c/p>\n","notesHtml":"","hints":["\u003cp>A friendship counts for both people — whichever column they appear in.\u003c/p>\n","\u003cp>Stack both columns into one list of ids with UNION ALL, then count.\u003c/p>\n"],"solution":{"sql":"SELECT id, COUNT(*) AS num\nFROM (\n  SELECT requester_id AS id FROM RequestAccepted\n  UNION ALL\n  SELECT accepter_id FROM RequestAccepted\n) t\nGROUP BY id\nORDER BY num DESC\nLIMIT 1;","html":"\u003cp>After stacking, each occurrence of an id is one friendship. \u003ccode>UNION ALL\u003c/code> matters: plain UNION would collapse the repeated ids.\u003c/p>\n"},"alternatives":[{"title":"Handles ties","sql":"WITH friends AS (\n  SELECT id, COUNT(*) AS num\n  FROM (SELECT requester_id AS id FROM RequestAccepted\n        UNION ALL\n        SELECT accepter_id FROM RequestAccepted) t\n  GROUP BY id\n)\nSELECT id, num FROM friends\nWHERE num = (SELECT MAX(num) FROM friends);","html":"\u003cp>Returns everyone sharing the top count — the follow-up LeetCode asks about (CTEs are Module 8).\u003c/p>\n"}],"traps":[{"sql":"SELECT requester_id AS id, COUNT(*) AS num FROM RequestAccepted GROUP BY requester_id ORDER BY num DESC LIMIT 1;","html":"\u003cp>Counts only requests someone sent, ignoring friendships they accepted.\u003c/p>\n"},{"sql":"SELECT id, COUNT(*) AS num FROM (SELECT requester_id AS id FROM RequestAccepted UNION SELECT accepter_id FROM RequestAccepted) t GROUP BY id ORDER BY num DESC LIMIT 1;","html":"\u003cp>UNION de-duplicates, leaving each id once — every count becomes 1.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"RequestAccepted","columns":[{"name":"requester_id","type":"INT","pk":true},{"name":"accepter_id","type":"INT","pk":true},{"name":"accept_date","type":"DATE","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE RequestAccepted (requester_id INT, accepter_id INT, accept_date DATE, PRIMARY KEY (requester_id, accepter_id));\nINSERT INTO RequestAccepted VALUES\n  (1, 4, '2024-06-03'), (2, 4, '2024-06-05'), (4, 3, '2024-06-08'), (3, 5, '2024-06-09'),\n  (6, 4, '2024-06-10'), (5, 6, '2024-06-11'), (2, 5, '2024-06-12');","tables":[{"name":"RequestAccepted","rows":[[1,4,"2024-06-03"],[2,4,"2024-06-05"],[4,3,"2024-06-08"],[3,5,"2024-06-09"],[6,4,"2024-06-10"],[5,6,"2024-06-11"],[2,5,"2024-06-12"]]}],"runs":[{"expected":{"columns":["id","num"],"rows":[[4,4]]}}]},{"name":"The winner never sent a request","setup":"CREATE TABLE RequestAccepted (requester_id INT, accepter_id INT, accept_date DATE, PRIMARY KEY (requester_id, accepter_id));\nINSERT INTO RequestAccepted VALUES (1, 9, '2024-07-01'), (2, 9, '2024-07-02'), (3, 9, '2024-07-03'), (1, 2, '2024-07-04');","tables":[{"name":"RequestAccepted","rows":[[1,9,"2024-07-01"],[2,9,"2024-07-02"],[3,9,"2024-07-03"],[1,2,"2024-07-04"]]}],"runs":[{"expected":{"columns":["id","num"],"rows":[[9,3]]}}]}]},"607":{"id":607,"title":"Sales Person","slug":"sales-person","difficulty":"Easy","module":"joins","patterns":["anti-join through two tables"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Return the \u003ccode>name\u003c/code> of every salesperson who has \u003cstrong>no\u003c/strong> orders with the company named \u003ccode>RED\u003c/code>. Salespeople with no orders at all qualify. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>First find the salespeople who \u003cem>did\u003c/em> sell to RED (orders joined to company).\u003c/p>\n","\u003cp>Then keep everyone not in that set.\u003c/p>\n","\u003cp>Filtering \u003ccode>company &lt;&gt; &#39;RED&#39;\u003c/code> row by row is not the same question.\u003c/p>\n"],"solution":{"sql":"SELECT name\nFROM SalesPerson\nWHERE sales_id NOT IN (\n  SELECT o.sales_id\n  FROM Orders o\n  JOIN Company c ON c.com_id = o.com_id\n  WHERE c.name = 'RED'\n);","html":"\u003cp>Find the &quot;bad&quot; set, then negate it. NOT IN is safe here because \u003ccode>Orders.sales_id\u003c/code> is never NULL in this data; NOT EXISTS would be safe regardless.\u003c/p>\n"},"alternatives":[{"title":"NOT EXISTS","sql":"SELECT s.name\nFROM SalesPerson s\nWHERE NOT EXISTS (\n  SELECT 1\n  FROM Orders o\n  JOIN Company c ON c.com_id = o.com_id\n  WHERE o.sales_id = s.sales_id AND c.name = 'RED'\n);","html":"\u003cp>Correlated per salesperson: &quot;there is no RED order by this person&quot;.\u003c/p>\n"}],"traps":[{"sql":"SELECT DISTINCT s.name FROM SalesPerson s JOIN Orders o ON o.sales_id = s.sales_id JOIN Company c ON c.com_id = o.com_id WHERE c.name \u003c> 'RED';","html":"\u003cp>Keeps Uri (who also sold to YELLOW) and loses Tao (who has no orders at all).\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"SalesPerson","columns":[{"name":"sales_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false},{"name":"salary","type":"INT","pk":false},{"name":"commission_rate","type":"INT","pk":false},{"name":"hire_date","type":"DATE","pk":false}]},{"name":"Company","columns":[{"name":"com_id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false},{"name":"city","type":"VARCHAR(255)","pk":false}]},{"name":"Orders","columns":[{"name":"order_id","type":"INT","pk":true},{"name":"order_date","type":"DATE","pk":false},{"name":"com_id","type":"INT","pk":false},{"name":"sales_id","type":"INT","pk":false},{"name":"amount","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE SalesPerson (sales_id INT PRIMARY KEY, name VARCHAR(255), salary INT, commission_rate INT, hire_date DATE);\nCREATE TABLE Company (com_id INT PRIMARY KEY, name VARCHAR(255), city VARCHAR(255));\nCREATE TABLE Orders (order_id INT PRIMARY KEY, order_date DATE, com_id INT, sales_id INT, amount INT);\nINSERT INTO SalesPerson VALUES (1, 'Rui', 100000, 6, '2016-04-01'), (2, 'Sol', 12000, 5, '2010-05-01'), (3, 'Tao', 65000, 12, '2008-12-25'), (4, 'Uri', 25000, 25, '2005-01-01'), (5, 'Vee', 50000, 10, '2007-02-03');\nINSERT INTO Company VALUES (1, 'RED', 'Boston'), (2, 'ORANGE', 'New York'), (3, 'YELLOW', 'Boston'), (4, 'GREEN', 'Austin');\nINSERT INTO Orders VALUES (1, '2024-01-01', 3, 4, 10000), (2, '2024-02-01', 4, 5, 5000), (3, '2024-03-01', 1, 1, 50000), (4, '2024-04-01', 1, 4, 25000), (5, '2024-05-01', 2, 2, 8000);","tables":[{"name":"SalesPerson","rows":[[1,"Rui",100000,6,"2016-04-01"],[2,"Sol",12000,5,"2010-05-01"],[3,"Tao",65000,12,"2008-12-25"],[4,"Uri",25000,25,"2005-01-01"],[5,"Vee",50000,10,"2007-02-03"]]},{"name":"Company","rows":[[1,"RED","Boston"],[2,"ORANGE","New York"],[3,"YELLOW","Boston"],[4,"GREEN","Austin"]]},{"name":"Orders","rows":[[1,"2024-01-01",3,4,10000],[2,"2024-02-01",4,5,5000],[3,"2024-03-01",1,1,50000],[4,"2024-04-01",1,4,25000],[5,"2024-05-01",2,2,8000]]}],"runs":[{"expected":{"columns":["name"],"rows":[["Sol"],["Tao"],["Vee"]]}}]},{"name":"No company is called RED","setup":"CREATE TABLE SalesPerson (sales_id INT PRIMARY KEY, name VARCHAR(255), salary INT, commission_rate INT, hire_date DATE);\nCREATE TABLE Company (com_id INT PRIMARY KEY, name VARCHAR(255), city VARCHAR(255));\nCREATE TABLE Orders (order_id INT PRIMARY KEY, order_date DATE, com_id INT, sales_id INT, amount INT);\nINSERT INTO SalesPerson VALUES (1, 'Ann', 1000, 5, '2020-01-01'), (2, 'Ben', 2000, 6, '2021-01-01'); INSERT INTO Company VALUES (1, 'BLUE', 'Oslo'); INSERT INTO Orders VALUES (1, '2024-01-01', 1, 1, 100);","tables":[{"name":"SalesPerson","rows":[[1,"Ann",1000,5,"2020-01-01"],[2,"Ben",2000,6,"2021-01-01"]]},{"name":"Company","rows":[[1,"BLUE","Oslo"]]},{"name":"Orders","rows":[[1,"2024-01-01",1,1,100]]}],"runs":[{"expected":{"columns":["name"],"rows":[["Ann"],["Ben"]]}}]}]},"608":{"id":608,"title":"Tree Node","slug":"tree-node","difficulty":"Medium","module":"subqueries","patterns":["CASE with IN","tree"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>\u003ccode>Tree\u003c/code> stores a valid tree as (\u003ccode>id\u003c/code>, \u003ccode>p_id\u003c/code> = parent id). Label each node: \u003ccode>&#39;Root&#39;\u003c/code> (no parent), \u003ccode>&#39;Inner&#39;\u003c/code> (has a parent and at least one child) or \u003ccode>&#39;Leaf&#39;\u003c/code> (has a parent, no children). Return \u003ccode>id\u003c/code> and \u003ccode>type\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Root: \u003ccode>p_id IS NULL\u003c/code>. Check it first — a lone root has no children but is still Root.\u003c/p>\n","\u003cp>Inner: the node&#39;s id appears as someone&#39;s p_id.\u003c/p>\n","\u003cp>Careful with \u003ccode>NOT IN (SELECT p_id …)\u003c/code>: the root&#39;s p_id is NULL.\u003c/p>\n"],"solution":{"sql":"SELECT id,\n       CASE\n         WHEN p_id IS NULL                    THEN 'Root'\n         WHEN id IN (SELECT p_id FROM Tree)   THEN 'Inner'\n         ELSE 'Leaf'\n       END AS type\nFROM Tree;","html":"\u003cp>CASE checks in order. \u003ccode>id IN (…)\u003c/code> is TRUE if the node is anyone&#39;s parent; when it is not, IN yields UNKNOWN (because of the NULL), which CASE treats as &quot;no&quot; — so ELSE labels it Leaf.\u003c/p>\n"},"alternatives":[{"title":"LEFT JOIN children","sql":"SELECT t.id,\n       CASE\n         WHEN t.p_id IS NULL THEN 'Root'\n         WHEN COUNT(c.id) > 0 THEN 'Inner'\n         ELSE 'Leaf'\n       END AS type\nFROM Tree t\nLEFT JOIN Tree c ON c.p_id = t.id\nGROUP BY t.id, t.p_id;","html":"\u003cp>Count each node&#39;s children with a self-join.\u003c/p>\n"}],"traps":[{"sql":"SELECT id, CASE WHEN p_id IS NULL THEN 'Root' WHEN id NOT IN (SELECT p_id FROM Tree) THEN 'Leaf' ELSE 'Inner' END AS type FROM Tree;","html":"\u003cp>The root&#39;s NULL p_id makes \u003ccode>NOT IN\u003c/code> UNKNOWN for every node, so no node is ever labelled Leaf.\u003c/p>\n"},{"sql":"SELECT id, CASE WHEN id NOT IN (SELECT p_id FROM Tree WHERE p_id IS NOT NULL) THEN 'Leaf' WHEN p_id IS NULL THEN 'Root' ELSE 'Inner' END AS type FROM Tree;","html":"\u003cp>Checks Leaf before Root, so a single-node tree is labelled Leaf.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Tree","columns":[{"name":"id","type":"INT","pk":true},{"name":"p_id","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Tree (id INT PRIMARY KEY, p_id INT);\nINSERT INTO Tree VALUES (1, NULL), (2, 1), (3, 1), (4, 3), (5, 3), (6, 5), (7, 2);","tables":[{"name":"Tree","rows":[[1,null],[2,1],[3,1],[4,3],[5,3],[6,5],[7,2]]}],"runs":[{"expected":{"columns":["id","type"],"rows":[[1,"Root"],[2,"Inner"],[3,"Inner"],[4,"Leaf"],[5,"Inner"],[6,"Leaf"],[7,"Leaf"]]}}]},{"name":"A single node","setup":"CREATE TABLE Tree (id INT PRIMARY KEY, p_id INT);\nINSERT INTO Tree VALUES (1, NULL);","tables":[{"name":"Tree","rows":[[1,null]]}],"runs":[{"expected":{"columns":["id","type"],"rows":[[1,"Root"]]}}]}]},"610":{"id":610,"title":"Triangle Judgement","slug":"triangle-judgement","difficulty":"Easy","module":"expressions","patterns":["CASE","row-wise logic"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Each row holds three segment lengths \u003ccode>x\u003c/code>, \u003ccode>y\u003c/code>, \u003ccode>z\u003c/code>. For every row, return \u003ccode>x\u003c/code>, \u003ccode>y\u003c/code>, \u003ccode>z\u003c/code> and a column \u003ccode>triangle\u003c/code> that is \u003ccode>&#39;Yes&#39;\u003c/code> if the three segments can form a triangle and \u003ccode>&#39;No&#39;\u003c/code> otherwise. Any order.\u003c/p>\n\u003cp>Three lengths form a triangle when \u003cstrong>each\u003c/strong> pair adds up to strictly more than the third.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Check all three inequalities: x + y &gt; z, x + z &gt; y and y + z &gt; x.\u003c/p>\n","\u003cp>Strictly greater: 2, 3, 5 lie flat on a line and are not a triangle.\u003c/p>\n","\u003cp>Return the label with \u003ccode>CASE WHEN … THEN &#39;Yes&#39; ELSE &#39;No&#39; END\u003c/code>.\u003c/p>\n"],"solution":{"sql":"SELECT x, y, z,\n       CASE WHEN x + y > z AND x + z > y AND y + z > x\n            THEN 'Yes' ELSE 'No' END AS triangle\nFROM Triangle;","html":"\u003cp>The triangle inequality must hold for every side. \u003ccode>CASE\u003c/code> turns the combined condition into the requested label.\u003c/p>\n"},"alternatives":[{"title":"IF() and the longest side","sql":"SELECT x, y, z,\n       IF(x + y + z > 2 * GREATEST(x, y, z), 'Yes', 'No') AS triangle\nFROM Triangle;","html":"\u003cp>Only the longest side can break the rule, so it is enough to check that the sum of all three exceeds twice the longest. \u003ccode>GREATEST\u003c/code> is MySQL/PostgreSQL; SQL Server 2022 added it too.\u003c/p>\n"}],"traps":[{"sql":"SELECT x, y, z, CASE WHEN x + y > z THEN 'Yes' ELSE 'No' END AS triangle FROM Triangle;","html":"\u003cp>Only checks one inequality — (20, 7, 8) passes it but is not a triangle.\u003c/p>\n"},{"sql":"SELECT x, y, z, CASE WHEN x + y >= z AND x + z >= y AND y + z >= x THEN 'Yes' ELSE 'No' END AS triangle FROM Triangle;","html":"\u003cp>\u003ccode>&gt;=\u003c/code> accepts degenerate &quot;triangles&quot; such as (2, 3, 5), which are flat lines.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Triangle","columns":[{"name":"x","type":"INT","pk":true},{"name":"y","type":"INT","pk":true},{"name":"z","type":"INT","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Triangle (x INT, y INT, z INT, PRIMARY KEY (x, y, z));\nINSERT INTO Triangle VALUES (7, 8, 20), (20, 7, 8), (9, 12, 15), (6, 8, 10), (2, 3, 5), (4, 4, 4), (3, 3, 7), (2, 9, 9);","tables":[{"name":"Triangle","rows":[[7,8,20],[20,7,8],[9,12,15],[6,8,10],[2,3,5],[4,4,4],[3,3,7],[2,9,9]]}],"runs":[{"expected":{"columns":["x","y","z","triangle"],"rows":[[7,8,20,"No"],[20,7,8,"No"],[9,12,15,"Yes"],[6,8,10,"Yes"],[2,3,5,"No"],[4,4,4,"Yes"],[3,3,7,"No"],[2,9,9,"Yes"]]}}]},{"name":"Flat and thin triangles","setup":"CREATE TABLE Triangle (x INT, y INT, z INT, PRIMARY KEY (x, y, z));\nINSERT INTO Triangle VALUES (5, 2, 3), (10, 10, 1), (1, 1, 1), (0, 5, 5);","tables":[{"name":"Triangle","rows":[[5,2,3],[10,10,1],[1,1,1],[0,5,5]]}],"runs":[{"expected":{"columns":["x","y","z","triangle"],"rows":[[5,2,3,"No"],[10,10,1,"Yes"],[1,1,1,"Yes"],[0,5,5,"No"]]}}]}]},"619":{"id":619,"title":"Biggest Single Number","slug":"biggest-single-number","difficulty":"Easy","module":"subqueries","patterns":["NULL when empty","aggregate over a derived table"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>A \u003cem>single number\u003c/em> appears exactly once in \u003ccode>MyNumbers\u003c/code> (which may contain duplicates). Return the \u003cstrong>largest\u003c/strong> single number in a column \u003ccode>num\u003c/code>, or a single NULL if there is none.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Find the numbers that occur once (GROUP BY + HAVING).\u003c/p>\n","\u003cp>Take their MAX — an aggregate returns NULL when nothing qualifies.\u003c/p>\n"],"solution":{"sql":"SELECT MAX(num) AS num\nFROM (\n  SELECT num\n  FROM MyNumbers\n  GROUP BY num\n  HAVING COUNT(*) = 1\n) t;","html":"\u003cp>The derived table lists singles; MAX over it returns the largest, or NULL over an empty table — exactly the required &quot;one row, possibly NULL&quot;.\u003c/p>\n"},"alternatives":[{"title":"Scalar subquery with LIMIT","sql":"SELECT (\n  SELECT num FROM MyNumbers\n  GROUP BY num HAVING COUNT(*) = 1\n  ORDER BY num DESC LIMIT 1\n) AS num;","html":"\u003cp>Same &quot;wrap it to get NULL&quot; trick as #176.\u003c/p>\n"}],"traps":[{"sql":"SELECT num FROM MyNumbers GROUP BY num HAVING COUNT(*) = 1 ORDER BY num DESC LIMIT 1;","html":"\u003cp>Returns no row at all when there is no single number, instead of NULL.\u003c/p>\n"},{"sql":"SELECT MAX(num) AS num FROM MyNumbers;","html":"\u003cp>The largest number overall (12) appears twice.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"MyNumbers","columns":[{"name":"num","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE MyNumbers (num INT);\nINSERT INTO MyNumbers VALUES (12), (12), (4), (4), (2), (7), (9), (10), (10);","tables":[{"name":"MyNumbers","rows":[[12],[12],[4],[4],[2],[7],[9],[10],[10]]}],"runs":[{"expected":{"columns":["num"],"rows":[[9]]}}]},{"name":"Every number repeats","setup":"CREATE TABLE MyNumbers (num INT);\nINSERT INTO MyNumbers VALUES (2), (2), (7), (7);","tables":[{"name":"MyNumbers","rows":[[2],[2],[7],[7]]}],"runs":[{"expected":{"columns":["num"],"rows":[[null]]}}]}]},"620":{"id":620,"title":"Not Boring Movies","slug":"not-boring-movies","difficulty":"Easy","module":"basics","patterns":["modulo","ORDER BY DESC"],"sql50":true,"order":true,"kind":"query","taskHtml":"\u003cp>Report the movies whose \u003ccode>id\u003c/code> is \u003cstrong>odd\u003c/strong> and whose \u003ccode>description\u003c/code> is not \u003ccode>&#39;boring&#39;\u003c/code>. Return all columns, \u003cstrong>ordered by \u003ccode>rating\u003c/code> descending\u003c/strong>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>An id is odd when dividing by 2 leaves a remainder of 1: \u003ccode>id % 2 = 1\u003c/code> or \u003ccode>MOD(id, 2) = 1\u003c/code>.\u003c/p>\n","\u003cp>Exclude the description with \u003ccode>&lt;&gt; &#39;boring&#39;\u003c/code> (or \u003ccode>!=\u003c/code>).\u003c/p>\n","\u003cp>Highest rating first.\u003c/p>\n"],"solution":{"sql":"SELECT *\nFROM Cinema\nWHERE id % 2 = 1\n  AND description \u003c> 'boring'\nORDER BY rating DESC;","html":"\u003cp>\u003ccode>%\u003c/code> (or \u003ccode>MOD()\u003c/code>) gives the remainder; odd ids leave 1. \u003ccode>DESC\u003c/code> flips the sort so the best-rated film comes first.\u003c/p>\n"},"alternatives":[{"title":"MOD() and !=","sql":"SELECT id, movie, description, rating\nFROM Cinema\nWHERE MOD(id, 2) = 1 AND description != 'boring'\nORDER BY rating DESC;","html":"\u003cp>Same logic with the function form of modulo and the other spelling of &quot;not equal&quot;. Listing columns beats \u003ccode>SELECT *\u003c/code> in real code.\u003c/p>\n"}],"traps":[{"sql":"SELECT * FROM Cinema WHERE id % 2 = 1 AND description \u003c> 'boring' ORDER BY rating;","html":"\u003cp>Ascending order puts the worst movie first; the task wants descending.\u003c/p>\n"},{"sql":"SELECT * FROM Cinema WHERE id % 2 = 0 AND description \u003c> 'boring' ORDER BY rating DESC;","html":"\u003cp>A remainder of 0 means even ids.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Cinema","columns":[{"name":"id","type":"INT","pk":true},{"name":"movie","type":"VARCHAR(255)","pk":false},{"name":"description","type":"VARCHAR(255)","pk":false},{"name":"rating","type":"FLOAT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Cinema (id INT PRIMARY KEY, movie VARCHAR(255), description VARCHAR(255), rating FLOAT);\nINSERT INTO Cinema VALUES\n  (1, 'Tidal Lines',   'drama',    7.8),\n  (2, 'Glass Orchard', 'boring',   5.2),\n  (3, 'Night Ledger',  'thriller', 8.6),\n  (4, 'Paper Moons',   'comedy',   6.9),\n  (5, 'Static Bloom',  'boring',   4.1),\n  (6, 'Low Tide',      'romance',  7.1),\n  (7, 'Iron Choir',    'musical',  9.1),\n  (9, 'Salt Road',     'boring',   6.0),\n  (11, 'Quiet Engine', 'sci-fi',   8.2);","tables":[{"name":"Cinema","rows":[[1,"Tidal Lines","drama",7.8],[2,"Glass Orchard","boring",5.2],[3,"Night Ledger","thriller",8.6],[4,"Paper Moons","comedy",6.9],[5,"Static Bloom","boring",4.1],[6,"Low Tide","romance",7.1],[7,"Iron Choir","musical",9.1],[9,"Salt Road","boring",6],[11,"Quiet Engine","sci-fi",8.2]]}],"runs":[{"expected":{"columns":["id","movie","description","rating"],"rows":[[7,"Iron Choir","musical",9.1],[3,"Night Ledger","thriller",8.6],[11,"Quiet Engine","sci-fi",8.2],[1,"Tidal Lines","drama",7.8]]}}]},{"name":"Odd ids, mostly boring","setup":"CREATE TABLE Cinema (id INT PRIMARY KEY, movie VARCHAR(255), description VARCHAR(255), rating FLOAT);\nINSERT INTO Cinema VALUES (1, 'Dust', 'boring', 5.0), (2, 'Echo', 'fun', 9.0), (3, 'Flint', 'great', 6.5), (8, 'Grove', 'epic', 8.0), (13, 'Haze', 'boring', 7.0), (15, 'Isle', 'calm', 9.5);","tables":[{"name":"Cinema","rows":[[1,"Dust","boring",5],[2,"Echo","fun",9],[3,"Flint","great",6.5],[8,"Grove","epic",8],[13,"Haze","boring",7],[15,"Isle","calm",9.5]]}],"runs":[{"expected":{"columns":["id","movie","description","rating"],"rows":[[15,"Isle","calm",9.5],[3,"Flint","great",6.5]]}}]}]},"626":{"id":626,"title":"Exchange Seats","slug":"exchange-seats","difficulty":"Medium","module":"subqueries","patterns":["CASE on id parity","edge case: odd count"],"sql50":true,"order":true,"kind":"query","taskHtml":"\u003cp>Seat ids run 1, 2, 3, … without gaps. Swap the students in every pair of consecutive seats (1↔2, 3↔4, …). If the number of students is odd, the last one stays put. Return \u003ccode>id\u003c/code> and \u003ccode>student\u003c/code>, ordered by \u003ccode>id\u003c/code>.\u003c/p>\n","notesHtml":"","hints":["\u003cp>It is easier to move the ids than the names: odd ids +1, even ids −1.\u003c/p>\n","\u003cp>Exception: the last id, when it is odd, stays the same. How many seats are there? A scalar subquery can tell you.\u003c/p>\n"],"solution":{"sql":"SELECT CASE\n         WHEN id % 2 = 1 AND id = (SELECT COUNT(*) FROM Seat) THEN id\n         WHEN id % 2 = 1 THEN id + 1\n         ELSE id - 1\n       END AS id,\n       student\nFROM Seat\nORDER BY id;","html":"\u003cp>Renumbering the ids and sorting by the new id swaps each pair. \u003ccode>ORDER BY id\u003c/code> refers to the computed alias (MySQL prefers the alias in ORDER BY).\u003c/p>\n"},"alternatives":[{"title":"LEAD / LAG","sql":"SELECT id,\n       CASE\n         WHEN id % 2 = 1 THEN COALESCE(LEAD(student) OVER (ORDER BY id), student)\n         ELSE LAG(student) OVER (ORDER BY id)\n       END AS student\nFROM Seat\nORDER BY id;","html":"\u003cp>Keep the ids and fetch the neighbour&#39;s name instead; COALESCE keeps the last student when there is no next row.\u003c/p>\n"}],"traps":[{"sql":"SELECT CASE WHEN id % 2 = 1 THEN id + 1 ELSE id - 1 END AS id, student FROM Seat ORDER BY id;","html":"\u003cp>With an odd number of students the last one moves to a seat that does not exist.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Seat","columns":[{"name":"id","type":"INT","pk":true},{"name":"student","type":"VARCHAR(20)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Seat (id INT PRIMARY KEY, student VARCHAR(20));\nINSERT INTO Seat VALUES (1, 'Ines'), (2, 'Jonas'), (3, 'Kira'), (4, 'Lior'), (5, 'Mateo');","tables":[{"name":"Seat","rows":[[1,"Ines"],[2,"Jonas"],[3,"Kira"],[4,"Lior"],[5,"Mateo"]]}],"runs":[{"expected":{"columns":["id","student"],"rows":[[1,"Jonas"],[2,"Ines"],[3,"Lior"],[4,"Kira"],[5,"Mateo"]]}}]},{"name":"Even number of students","setup":"CREATE TABLE Seat (id INT PRIMARY KEY, student VARCHAR(20));\nINSERT INTO Seat VALUES (1, 'Ana'), (2, 'Bo'), (3, 'Cy'), (4, 'Di');","tables":[{"name":"Seat","rows":[[1,"Ana"],[2,"Bo"],[3,"Cy"],[4,"Di"]]}],"runs":[{"expected":{"columns":["id","student"],"rows":[[1,"Bo"],[2,"Ana"],[3,"Di"],[4,"Cy"]]}}]},{"name":"A single student","setup":"CREATE TABLE Seat (id INT PRIMARY KEY, student VARCHAR(20));\nINSERT INTO Seat VALUES (1, 'Solo');","tables":[{"name":"Seat","rows":[[1,"Solo"]]}],"runs":[{"expected":{"columns":["id","student"],"rows":[[1,"Solo"]]}}]}]},"627":{"id":627,"title":"Swap Sex of Employees","slug":"swap-sex-of-employees","difficulty":"Easy","module":"modifying","patterns":["UPDATE with CASE"],"sql50":false,"order":false,"kind":"dml","taskHtml":"\u003cp>Swap every \u003ccode>&#39;m&#39;\u003c/code> and \u003ccode>&#39;f&#39;\u003c/code> in the \u003ccode>sex\u003c/code> column using a \u003cstrong>single UPDATE statement\u003c/strong> (no SELECT, no temporary table). The checker runs your statement and then looks at the whole \u003ccode>Salary\u003c/code> table.\u003c/p>\n","notesHtml":"","hints":["\u003cp>One UPDATE can set different values on different rows — let the new value depend on the old one.\u003c/p>\n","\u003cp>\u003ccode>SET sex = CASE sex WHEN &#39;m&#39; THEN &#39;f&#39; ELSE &#39;m&#39; END\u003c/code>\u003c/p>\n","\u003cp>Two separate UPDATEs do not work: the second undoes the first.\u003c/p>\n"],"solution":{"sql":"UPDATE Salary\nSET sex = CASE sex WHEN 'm' THEN 'f' ELSE 'm' END;","html":"\u003cp>SET expressions see each row&#39;s \u003cem>old\u003c/em> values, so every row flips exactly once in a single pass.\u003c/p>\n"},"alternatives":[{"title":"IF()","sql":"UPDATE Salary\nSET sex = IF(sex = 'm', 'f', 'm');","html":"\u003cp>The two-branch shorthand.\u003c/p>\n"},{"title":"XOR trick","sql":"UPDATE Salary\nSET sex = CHAR(ASCII('m') ^ ASCII('f') ^ ASCII(sex));","html":"\u003cp>\u003ccode>x ^ a ^ b\u003c/code> turns a into b and b into a. Cute for interviews, unreadable in production.\u003c/p>\n"}],"traps":[{"sql":"UPDATE Salary SET sex = 'f' WHERE sex = 'm'; UPDATE Salary SET sex = 'm' WHERE sex = 'f';","html":"\u003cp>The second statement also flips the rows the first one just changed — everybody ends up m.\u003c/p>\n"}],"fn":null,"after":"SELECT * FROM Salary","starter":null,"schema":[{"name":"Salary","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(100)","pk":false},{"name":"sex","type":"ENUM('M', 'F')","pk":false},{"name":"salary","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Salary (id INT PRIMARY KEY, name VARCHAR(100), sex ENUM('m', 'f'), salary INT);\nINSERT INTO Salary VALUES (1, 'Ola', 'm', 2500), (2, 'Pat', 'f', 1500), (3, 'Raj', 'm', 5500), (4, 'Sue', 'f', 500), (5, 'Tim', 'm', 3000);","tables":[{"name":"Salary","rows":[[1,"Ola","m",2500],[2,"Pat","f",1500],[3,"Raj","m",5500],[4,"Sue","f",500],[5,"Tim","m",3000]]}],"runs":[{"expected":{"columns":["id","name","sex","salary"],"rows":[[1,"Ola","f",2500],[2,"Pat","m",1500],[3,"Raj","f",5500],[4,"Sue","m",500],[5,"Tim","f",3000]]}}]},{"name":"Everyone starts as m","setup":"CREATE TABLE Salary (id INT PRIMARY KEY, name VARCHAR(100), sex ENUM('m', 'f'), salary INT);\nINSERT INTO Salary VALUES (1, 'Ana', 'm', 100), (2, 'Bo', 'm', 200);","tables":[{"name":"Salary","rows":[[1,"Ana","m",100],[2,"Bo","m",200]]}],"runs":[{"expected":{"columns":["id","name","sex","salary"],"rows":[[1,"Ana","f",100],[2,"Bo","f",200]]}}]}]},"1045":{"id":1045,"title":"Customers Who Bought All Products","slug":"customers-who-bought-all-products","difficulty":"Medium","module":"patterns","patterns":["relational division"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>\u003ccode>Customer\u003c/code> records purchases (it may contain duplicate rows). Return the \u003ccode>customer_id\u003c/code> of every customer who bought \u003cstrong>every\u003c/strong> product listed in \u003ccode>Product\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Count how many \u003cstrong>different\u003c/strong> products each customer bought.\u003c/p>\n","\u003cp>Compare with the number of products in the catalog (a scalar subquery).\u003c/p>\n"],"solution":{"sql":"SELECT customer_id\nFROM Customer\nGROUP BY customer_id\nHAVING COUNT(DISTINCT product_key) = (SELECT COUNT(*) FROM Product);","html":"\u003cp>Customer 2 has three rows but one product; customer 1 has four rows covering all three. Only distinct counts tell them apart.\u003c/p>\n"},"alternatives":[{"title":"Double NOT EXISTS","sql":"SELECT DISTINCT c.customer_id\nFROM Customer c\nWHERE NOT EXISTS (\n  SELECT 1 FROM Product p\n  WHERE NOT EXISTS (\n    SELECT 1 FROM Customer c2\n    WHERE c2.customer_id = c.customer_id AND c2.product_key = p.product_key\n  )\n);","html":"\u003cp>Relational division in pure logic: there is no product that this customer did not buy.\u003c/p>\n"}],"traps":[{"sql":"SELECT customer_id FROM Customer GROUP BY customer_id HAVING COUNT(*) = (SELECT COUNT(*) FROM Product);","html":"\u003cp>Counts purchase rows, so repeat purchases fool it (customer 2 has three rows of the same product).\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Customer","columns":[{"name":"customer_id","type":"INT","pk":false},{"name":"product_key","type":"INT","pk":false}]},{"name":"Product","columns":[{"name":"product_key","type":"INT","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Customer (customer_id INT, product_key INT);\nCREATE TABLE Product (product_key INT PRIMARY KEY);\nINSERT INTO Product VALUES (10), (20), (30);\nINSERT INTO Customer VALUES (1, 10), (1, 20), (1, 20), (1, 30), (2, 10), (2, 10), (2, 10), (3, 20), (3, 30), (3, 10), (4, 10), (4, 20);","tables":[{"name":"Customer","rows":[[1,10],[1,20],[1,20],[1,30],[2,10],[2,10],[2,10],[3,20],[3,30],[3,10],[4,10],[4,20]]},{"name":"Product","rows":[[10],[20],[30]]}],"runs":[{"expected":{"columns":["customer_id"],"rows":[[1],[3]]}}]},{"name":"A product nobody bought","setup":"CREATE TABLE Customer (customer_id INT, product_key INT);\nCREATE TABLE Product (product_key INT PRIMARY KEY);\nINSERT INTO Product VALUES (1), (2); INSERT INTO Customer VALUES (1, 1), (1, 1), (2, 1);","tables":[{"name":"Customer","rows":[[1,1],[1,1],[2,1]]},{"name":"Product","rows":[[1],[2]]}],"runs":[{"expected":{"columns":["customer_id"],"rows":[]}}]}]},"1050":{"id":1050,"title":"Actors and Directors Who Cooperated At Least Three Times","slug":"actors-and-directors-who-cooperated-at-least-three-times","difficulty":"Easy","module":"aggregation","patterns":["GROUP BY pair","HAVING"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Each row of \u003ccode>ActorDirector\u003c/code> is one collaboration. Return every (\u003ccode>actor_id\u003c/code>, \u003ccode>director_id\u003c/code>) pair that worked together \u003cstrong>at least three times\u003c/strong>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>The group is the pair: group by both columns.\u003c/p>\n","\u003cp>&quot;At least three&quot; is \u003ccode>&gt;= 3\u003c/code>.\u003c/p>\n"],"solution":{"sql":"SELECT actor_id, director_id\nFROM ActorDirector\nGROUP BY actor_id, director_id\nHAVING COUNT(*) >= 3;","html":"\u003cp>Grouping by two columns makes one group per distinct pair.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT actor_id, director_id FROM ActorDirector GROUP BY actor_id, director_id HAVING COUNT(*) > 3;","html":"\u003cp>Drops pairs with exactly three collaborations.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"ActorDirector","columns":[{"name":"actor_id","type":"INT","pk":false},{"name":"director_id","type":"INT","pk":false},{"name":"timestamp","type":"INT","pk":true}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE ActorDirector (actor_id INT, director_id INT, `timestamp` INT PRIMARY KEY);\nINSERT INTO ActorDirector VALUES (4, 7, 0), (4, 7, 1), (4, 7, 2), (4, 8, 3), (4, 8, 4), (5, 7, 5), (5, 7, 6), (5, 7, 7), (5, 7, 8), (6, 9, 9), (6, 9, 10);","tables":[{"name":"ActorDirector","rows":[[4,7,0],[4,7,1],[4,7,2],[4,8,3],[4,8,4],[5,7,5],[5,7,6],[5,7,7],[5,7,8],[6,9,9],[6,9,10]]}],"runs":[{"expected":{"columns":["actor_id","director_id"],"rows":[[4,7],[5,7]]}}]},{"name":"Five films, split across directors","setup":"CREATE TABLE ActorDirector (actor_id INT, director_id INT, `timestamp` INT PRIMARY KEY);\nINSERT INTO ActorDirector VALUES (1, 1, 0), (1, 1, 1), (1, 2, 2), (1, 2, 3), (1, 2, 4), (2, 1, 5), (2, 1, 6);","tables":[{"name":"ActorDirector","rows":[[1,1,0],[1,1,1],[1,2,2],[1,2,3],[1,2,4],[2,1,5],[2,1,6]]}],"runs":[{"expected":{"columns":["actor_id","director_id"],"rows":[[1,2]]}}]}]},"1068":{"id":1068,"title":"Product Sales Analysis I","slug":"product-sales-analysis-i","difficulty":"Easy","module":"joins","patterns":["INNER JOIN"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>For every row of \u003ccode>Sales\u003c/code>, report the \u003ccode>product_name\u003c/code> (from \u003ccode>Product\u003c/code>), \u003ccode>year\u003c/code> and \u003ccode>price\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Look up each sale&#39;s product name through \u003ccode>product_id\u003c/code>.\u003c/p>\n","\u003cp>Every sale has a product, so a plain (inner) JOIN is enough.\u003c/p>\n"],"solution":{"sql":"SELECT p.product_name, s.year, s.price\nFROM Sales s\nJOIN Product p ON p.product_id = s.product_id;","html":"\u003cp>A plain lookup join: every sale has a product (it is a foreign key), so INNER and LEFT give the same result here.\u003c/p>\n"},"alternatives":[{"title":"USING","sql":"SELECT product_name, year, price\nFROM Sales\nJOIN Product USING (product_id);","html":"\u003cp>\u003ccode>USING (col)\u003c/code> is shorthand when the key has the same name in both tables.\u003c/p>\n"}],"traps":[{"sql":"SELECT p.product_name, s.year, s.price FROM Sales s, Product p;","html":"\u003cp>Without a join condition every sale is paired with every product (a cross join).\u003c/p>\n"},{"sql":"SELECT p.product_name, s.year, s.price FROM Product p LEFT JOIN Sales s ON s.product_id = p.product_id;","html":"\u003cp>Starting from Product also lists products that never sold, with NULL year and price. The task wants one row per sale.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Sales","columns":[{"name":"sale_id","type":
