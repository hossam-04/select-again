rs WHERE author_id = 1;          -- ON DELETE CASCADE removes her books too\n\nSELECT b.title, a.name, b.status\nFROM books b\nJOIN authors a ON a.author_id = b.author_id;","db":"empty","expectError":false,"expectWarning":false,"title":"","output":{"columns":["title","name","status"],"rows":[["Kindred","Octavia","draft"]],"total":1,"explain":false,"error":null,"warnings":[],"notes":[],"summary":["INSERT: 2 rows affected","INSERT: 3 rows affected","DELETE: 1 row affected"]}},{"id":"schema-ex2","sql":"CREATE TABLE users (id INT PRIMARY KEY, email VARCHAR(100) NOT NULL UNIQUE);\nINSERT INTO users VALUES (1, 'a@x.io');\nINSERT INTO users VALUES (2, 'A@X.IO');   -- duplicate under the case-insensitive collation","db":"empty","expectError":true,"expectWarning":false,"title":"","output":{"columns":[],"rows":[],"total":0,"explain":false,"error":{"message":"Duplicate entry for key 'users.email'","hint":"MySQL error 1062: a row with that key already exists. Use INSERT IGNORE or ON DUPLICATE KEY UPDATE to handle it.","raw":"UNIQUE constraint failed: users.email"},"warnings":[],"notes":[],"summary":["INSERT: 1 row affected"]}},{"id":"schema-ex3","sql":"CREATE TABLE parents (id INT PRIMARY KEY);\nCREATE TABLE children (id INT PRIMARY KEY, parent_id INT, FOREIGN KEY (parent_id) REFERENCES parents (id));\nINSERT INTO children VALUES (1, 99);      -- no parent 99","db":"empty","expectError":true,"expectWarning":false,"title":"","output":{"columns":[],"rows":[],"total":0,"explain":false,"error":{"message":"Cannot add or update a child row: a foreign key constraint fails","hint":"MySQL error 1452: the referenced parent row must exist first.","raw":"FOREIGN KEY constraint failed"},"warnings":[],"notes":[],"summary":[]}},{"id":"schema-ex4","sql":"SELECT customer_name,\n       COUNT(DISTINCT customer_city)  AS cities_on_file,\n       GROUP_CONCAT(DISTINCT customer_city ORDER BY customer_city) AS cities\nFROM order_lines_flat\nGROUP BY customer_name;","db":"flat","expectError":false,"expectWarning":false,"title":"","output":{"columns":["customer_name","cities_on_file","cities"],"rows":[["Rosa Diaz",2,"Barcelona,Madrid"],["Tom Hale",1,"Leeds"]],"total":2,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}},{"id":"schema-ex5","sql":"CREATE VIEW customer_revenue AS\nSELECT c.customer_id, c.name, c.country,\n       SUM(oi.quantity * oi.unit_price) AS revenue\nFROM customers c\nJOIN orders o       ON o.customer_id = c.customer_id AND o.status \u003c> 'cancelled'\nJOIN order_items oi ON oi.order_id = o.order_id\nGROUP BY c.customer_id, c.name, c.country;\n\nSELECT country, SUM(revenue) AS revenue\nFROM customer_revenue\nGROUP BY country\nORDER BY revenue DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["country","revenue"],"rows":[["Egypt",8800],["UK",4403],["USA",2477],["Portugal",2006],["Japan",1933],["Spain",537],["France",363]],"total":7,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{"flat":"CREATE TABLE order_lines_flat (\n  order_id INT, order_date DATE,\n  customer_name VARCHAR(50), customer_city VARCHAR(50),\n  product_name VARCHAR(50), unit_price DECIMAL(8,2), quantity INT\n);\nINSERT INTO order_lines_flat VALUES\n  (1, '2025-01-05', 'Rosa Diaz', 'Madrid',    'Lamp',  40.00, 1),\n  (1, '2025-01-05', 'Rosa Diaz', 'Madrid',    'Desk', 220.00, 1),\n  (2, '2025-01-09', 'Rosa Diaz', 'Barcelona', 'Chair', 90.00, 4),\n  (3, '2025-01-10', 'Tom Hale',  'Leeds',     'Lamp',  45.00, 2);"},"quizzes":[{"id":"schema-q1","questions":[{"q":"Which type should store an order total like 1999.99?","options":["FLOAT","DOUBLE","DECIMAL(10,2)","VARCHAR(10)"],"answer":2,"explain":"\u003cp>DECIMAL is exact. Binary floats can&#39;t represent most decimal fractions exactly, and the errors accumulate in sums.\u003c/p>\n"},{"q":"\u003ccode>orders(order_id, product_id, order_date, quantity)\u003c/code> with key (order_id, product_id). Which normal form does \u003ccode>order_date\u003c/code> break?","options":["1NF","2NF: it depends on only part of the composite key","3NF","None"],"answer":1,"explain":"\u003cp>The date is a fact about the order, not about the (order, product) line. Move it to an \u003ccode>orders\u003c/code> table.\u003c/p>\n"},{"q":"A UNIQUE column in MySQL can hold…","options":["no NULLs","exactly one NULL","any number of NULLs","NULLs only if the column is NOT NULL"],"answer":2,"explain":"\u003cp>NULL isn&#39;t equal to anything, including another NULL, so several NULLs don&#39;t violate UNIQUE. SQL Server is the odd one out: it allows only one.\u003c/p>\n"},{"q":"\u003ccode>FOREIGN KEY (author_id) REFERENCES authors ON DELETE CASCADE\u003c/code>. Deleting an author…","options":["fails while they have books","also deletes their books","sets the books&#39; author_id to NULL","leaves orphaned books behind"],"answer":1,"explain":"\u003cp>That&#39;s CASCADE. RESTRICT (the default) blocks the delete, and SET NULL keeps the books with a NULL author_id.\u003c/p>\n"}]}],"problems":[]},{"id":"performance","num":13,"title":"Indexes and performance","summary":"What an index really is, how to read a query plan, and the handful of rules that decide whether your query uses one.","clauses":[],"kicker":"B-trees · EXPLAIN · sargable · composite · covering","minutes":16,"html":"\u003ch2>What an index is\u003c/h2>\n\u003cp>A B-tree index is a \u003cstrong>sorted copy\u003c/strong> of one or more columns, with each entry pointing back to its row. Because it&#39;s sorted, the database can:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>find\u003c/strong> a value without reading the whole table (a \u003cem>seek\u003c/em>, roughly log₂(n) steps: about 20 for a million rows),\u003c/li>\n\u003cli>read a \u003cstrong>range\u003c/strong> (\u003ccode>BETWEEN\u003c/code>, \u003ccode>&gt;\u003c/code>, \u003ccode>LIKE &#39;abc%&#39;\u003c/code>) as one contiguous slice,\u003c/li>\n\u003cli>return rows \u003cstrong>already ordered\u003c/strong>, skipping a sort,\u003c/li>\n\u003cli>answer a query \u003cstrong>from the index alone\u003c/strong> when it contains every column the query needs (a \u003cem>covering\u003c/em> index).\u003c/li>\n\u003c/ul>\n\u003cp>In InnoDB the table itself is a B-tree ordered by the primary key (the \u003cem>clustered index\u003c/em>). Every secondary index stores the primary key as its pointer back to the row. That&#39;s one reason short primary keys matter.\u003c/p>\n\u003ch2>Reading a plan with EXPLAIN\u003c/h2>\n\u003cp>\u003ccode>EXPLAIN\u003c/code> shows how the database intends to run a query without running it. In MySQL you get a table with one row per table access. The columns worth reading first:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Column\u003c/th>\u003cth>What to look for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>type\u003c/code>\u003c/td>\u003ctd>Access method, from best to worst: \u003ccode>const\u003c/code> → \u003ccode>eq_ref\u003c/code> → \u003ccode>ref\u003c/code> → \u003ccode>range\u003c/code> → \u003ccode>index\u003c/code> → \u003cstrong>\u003ccode>ALL\u003c/code>\u003c/strong> (a full table scan)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>key\u003c/code>\u003c/td>\u003ctd>The index actually chosen (\u003ccode>NULL\u003c/code> means none)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>rows\u003c/code>\u003c/td>\u003ctd>Estimated rows examined\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Extra\u003c/code>\u003c/td>\u003ctd>\u003ccode>Using index\u003c/code> (covering, good), \u003ccode>Using where\u003c/code>, \u003cstrong>\u003ccode>Using filesort\u003c/code>\u003c/strong> (a sort step), \u003cstrong>\u003ccode>Using temporary\u003c/code>\u003c/strong> (a temp table)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>For example, a lookup by customer before and after adding an index on \u003ccode>orders.customer_id\u003c/code> looks like this in MySQL:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>id\u003c/th>\u003cth>select_type\u003c/th>\u003cth>table\u003c/th>\u003cth>type\u003c/th>\u003cth>possible_keys\u003c/th>\u003cth>key\u003c/th>\u003cth>rows\u003c/th>\u003cth>Extra\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>SIMPLE\u003c/td>\u003ctd>orders\u003c/td>\u003ctd>\u003cstrong>ALL\u003c/strong>\u003c/td>\u003ctd>NULL\u003c/td>\u003ctd>NULL\u003c/td>\u003ctd>24\u003c/td>\u003ctd>Using where\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>SIMPLE\u003c/td>\u003ctd>orders\u003c/td>\u003ctd>\u003cstrong>ref\u003c/strong>\u003c/td>\u003ctd>idx_orders_customer\u003c/td>\u003ctd>idx_orders_customer\u003c/td>\u003ctd>3\u003c/td>\u003ctd>NULL\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>This page runs SQLite, so its \u003ccode>EXPLAIN\u003c/code> prints SQLite&#39;s plan instead: \u003cstrong>\u003ccode>SCAN\u003c/code>\u003c/strong> means a full scan, \u003cstrong>\u003ccode>SEARCH … USING INDEX\u003c/code>\u003c/strong> means an index seek, and \u003cstrong>\u003ccode>USE TEMP B-TREE FOR ORDER BY\u003c/code>\u003c/strong> means a sort. The ideas map one to one.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"performance-ex1\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"performance-ex2\">\u003c/div>\n\u003caside class=\"callout tip\">\u003cdiv class=\"callout-label\">Tip \u003cspan>· EXPLAIN ANALYZE\u003c/span>\u003c/div>\u003cp>MySQL 8.0.18+ has \u003ccode>EXPLAIN ANALYZE\u003c/code>, which actually runs the query and reports real row counts and timings per step. It&#39;s the fastest way to find which step is slow. \u003ccode>EXPLAIN FORMAT=TREE\u003c/code> gives the same tree without running anything.\u003c/p>\n\u003c/aside>\u003ch2>Sargable conditions: don&#39;t wrap the column\u003c/h2>\n\u003cp>An index stores the column&#39;s raw values. Wrap the column in a function or expression and the index can&#39;t be searched, because the database would have to compute the function for every row first. Conditions that \u003cem>can\u003c/em> use an index are called \u003cstrong>sargable\u003c/strong> (Search ARGument ABLE).\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"performance-ex3\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"performance-ex4\">\u003c/div>\n\u003cp>Common index-killers and their rewrites:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Instead of\u003c/th>\u003cth>Write\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>YEAR(d) = 2024\u003c/code>\u003c/td>\u003ctd>\u003ccode>d &gt;= &#39;2024-01-01&#39; AND d &lt; &#39;2025-01-01&#39;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>DATE(ts) = &#39;2024-05-01&#39;\u003c/code>\u003c/td>\u003ctd>\u003ccode>ts &gt;= &#39;2024-05-01&#39; AND ts &lt; &#39;2024-05-02&#39;\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>price * 1.2 &gt; 100\u003c/code>\u003c/td>\u003ctd>\u003ccode>price &gt; 100 / 1.2\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>LOWER(email) = &#39;a@x.io&#39;\u003c/code>\u003c/td>\u003ctd>\u003ccode>email = &#39;a@x.io&#39;\u003c/code> (already case-insensitive in MySQL), or a functional index\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>name LIKE &#39;%son&#39;\u003c/code>\u003c/td>\u003ctd>Can&#39;t use a B-tree. Consider full-text search or a reversed column\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>varchar_col = 42\u003c/code>\u003c/td>\u003ctd>\u003ccode>varchar_col = &#39;42&#39;\u003c/code>. Comparing a string column to a number converts every row in MySQL\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"callout dialect\">\u003cdiv class=\"callout-label\">Other databases \u003cspan>· Functional indexes\u003c/span>\u003c/div>\u003cp>MySQL 8.0.13+ can index an expression, \u003ccode>CREATE INDEX idx ON orders ((YEAR(order_date)))\u003c/code>, and PostgreSQL has had expression indexes for years. They help when you can&#39;t change the query, but a plain range condition on a plain index is usually the better fix.\u003c/p>\n\u003c/aside>\u003ch2>Composite indexes: order matters\u003c/h2>\n\u003cp>An index on \u003ccode>(a, b, c)\u003c/code> is sorted by \u003ccode>a\u003c/code>, then \u003ccode>b\u003c/code> within each \u003ccode>a\u003c/code>, then \u003ccode>c\u003c/code>. It can serve conditions on a \u003cstrong>leftmost prefix\u003c/strong>: \u003ccode>a\u003c/code>, or \u003ccode>a\u003c/code> and \u003ccode>b\u003c/code>, or all three. It can&#39;t serve \u003ccode>b\u003c/code> alone, just as a phone book sorted by (last name, first name) can&#39;t find everyone named &quot;Ana&quot; quickly.\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"performance-ex5\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"performance-ex6\">\u003c/div>\n\u003caside class=\"callout key\">\u003cdiv class=\"callout-label\">Key idea \u003cspan>· Rule of thumb\u003c/span>\u003c/div>\u003cp>Put \u003cstrong>equality\u003c/strong> columns first, then the \u003cstrong>range\u003c/strong> or \u003cstrong>sort\u003c/strong> column. \u003ccode>(customer_id, order_date)\u003c/code> serves &quot;this customer&#39;s orders since June, newest first&quot; with a single seek and no sort. \u003ccode>(order_date, customer_id)\u003c/code> doesn&#39;t.\u003c/p>\n\u003c/aside>\u003ch2>Covering indexes and ORDER BY\u003c/h2>\n\u003cp>When every column the query touches is in the index, the table rows are never read:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"performance-ex7\">\u003c/div>\n\u003cp>An index can also hand rows back \u003cstrong>in order\u003c/strong>, which removes the sort step. Compare the two plans:\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"performance-ex8\">\u003c/div>\n\u003cdiv class=\"example\" data-ex=\"performance-ex9\">\u003c/div>\n\u003ch2>Indexes aren&#39;t free\u003c/h2>\n\u003cul>\n\u003cli>Every INSERT, UPDATE and DELETE must also update every index on the table. Write-heavy tables pay for each extra index.\u003c/li>\n\u003cli>Indexes take disk space and buffer-pool memory.\u003c/li>\n\u003cli>\u003cstrong>Selectivity\u003c/strong> matters. An index on a column with three distinct values (say, \u003ccode>status\u003c/code>) is rarely chosen alone, because reading a third of the table through an index is slower than scanning it. It works better as the second column of a composite index.\u003c/li>\n\u003cli>The optimizer relies on \u003cstrong>statistics\u003c/strong>. Stale statistics produce bad plans, so run \u003ccode>ANALYZE TABLE t\u003c/code> after big data changes.\u003c/li>\n\u003c/ul>\n\u003ch2>Query habits that scale\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Select only the columns you need.\u003c/strong> Beyond bytes on the wire, it&#39;s what makes covering indexes possible.\u003c/li>\n\u003cli>\u003cstrong>Paginate with keysets\u003c/strong>, not large OFFSETs: \u003ccode>WHERE (created_at, id) &lt; (?, ?) ORDER BY created_at DESC, id DESC LIMIT 50\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Avoid N+1 queries\u003c/strong> from application code: one query with a JOIN or \u003ccode>IN (…)\u003c/code> beats a thousand single-row lookups.\u003c/li>\n\u003cli>\u003cstrong>Filter early.\u003c/strong> Conditions in WHERE and join keys on indexed columns cut the rows before joins multiply them.\u003c/li>\n\u003cli>\u003ccode>COUNT(*)\u003c/code> on a big InnoDB table scans an index, and it isn&#39;t free. Cache or approximate counts shown on every page.\u003c/li>\n\u003cli>Watch for \u003cstrong>implicit conversions\u003c/strong> in join keys (INT joined to VARCHAR), which silently disable indexes.\u003c/li>\n\u003c/ul>\n\u003caside class=\"callout interview\">\u003cdiv class=\"callout-label\">Interview angle \u003cspan>· What they&#39;re looking for\u003c/span>\u003c/div>\u003cp>&quot;How would you speed this query up?&quot; Answer with the plan first (EXPLAIN), then the specific fix: which index, with which column order and why. Mention the write cost. Generic answers like &quot;add indexes&quot; or &quot;use a cache&quot; score low.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"performance-q1\">\u003c/div>","examples":[{"id":"performance-ex1","sql":"EXPLAIN SELECT * FROM orders WHERE customer_id = 9;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SCAN orders"]],"total":1,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}},{"id":"performance-ex2","sql":"CREATE INDEX idx_orders_customer ON orders (customer_id);\nEXPLAIN SELECT * FROM orders WHERE customer_id = 9;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SEARCH orders USING INDEX idx_orders_customer (customer_id=?)"]],"total":1,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}},{"id":"performance-ex3","sql":"CREATE INDEX idx_orders_date ON orders (order_date);\nEXPLAIN SELECT order_id FROM orders WHERE YEAR(order_date) = 2024;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SCAN orders"]],"total":1,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}},{"id":"performance-ex4","sql":"CREATE INDEX idx_orders_date ON orders (order_date);\nEXPLAIN SELECT order_id FROM orders WHERE order_date >= '2024-01-01' AND order_date \u003c '2025-01-01';","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SEARCH orders USING INDEX idx_orders_date (order_date>? AND order_date\u003c?)"]],"total":1,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}},{"id":"performance-ex5","sql":"CREATE INDEX idx_orders_cust_date ON orders (customer_id, order_date);\nEXPLAIN SELECT * FROM orders WHERE customer_id = 1 AND order_date >= '2024-06-01';","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SEARCH orders USING INDEX idx_orders_cust_date (customer_id=? AND order_date>?)"]],"total":1,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}},{"id":"performance-ex6","sql":"CREATE INDEX idx_orders_cust_date ON orders (customer_id, order_date);\nEXPLAIN SELECT * FROM orders WHERE order_date >= '2024-06-01';","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SCAN orders"]],"total":1,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}},{"id":"performance-ex7","sql":"CREATE INDEX idx_orders_cust_status ON orders (customer_id, status);\nEXPLAIN SELECT status, COUNT(*) FROM orders WHERE customer_id = 9 GROUP BY status;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SEARCH orders USING COVERING INDEX idx_orders_cust_status (customer_id=?)"]],"total":1,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}},{"id":"performance-ex8","sql":"EXPLAIN SELECT order_id, order_date FROM orders ORDER BY order_date DESC LIMIT 5;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SCAN orders"],["USE TEMP B-TREE FOR ORDER BY"]],"total":2,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}},{"id":"performance-ex9","sql":"CREATE INDEX idx_orders_date ON orders (order_date);\nEXPLAIN SELECT order_id, order_date FROM orders ORDER BY order_date DESC LIMIT 5;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["QUERY PLAN"],"rows":[["SCAN orders USING INDEX idx_orders_date"]],"total":1,"explain":true,"error":null,"warnings":[],"notes":["EXPLAIN shows SQLite's query plan here; MySQL prints a table with type/key/rows columns instead"],"summary":[]}}],"dbs":{},"quizzes":[{"id":"performance-q1","questions":[{"q":"An index on \u003ccode>(last_name, first_name)\u003c/code> can speed up which query?","options":["\u003ccode>WHERE last_name = &#39;Chen&#39; AND first_name LIKE &#39;L%&#39;\u003c/code>","\u003ccode>WHERE first_name = &#39;Lina&#39;\u003c/code>","\u003ccode>WHERE CONCAT(last_name, first_name) = &#39;ChenLina&#39;\u003c/code>","\u003ccode>WHERE last_name LIKE &#39;%en&#39;\u003c/code>"],"answer":0,"explain":"\u003cp>Leftmost prefix, plus a range on the next column. The others skip the first column, wrap it in a function, or start with a wildcard.\u003c/p>\n"},{"q":"\u003ccode>WHERE YEAR(created_at) = 2024\u003c/code> doesn&#39;t use the index on \u003ccode>created_at\u003c/code>. Best rewrite?","options":["\u003ccode>WHERE YEAR(created_at) &gt;= 2024 AND YEAR(created_at) &lt; 2025\u003c/code>","\u003ccode>WHERE created_at &gt;= &#39;2024-01-01&#39; AND created_at &lt; &#39;2025-01-01&#39;\u003c/code>","\u003ccode>WHERE created_at LIKE &#39;2024%&#39;\u003c/code>","Add \u003ccode>FORCE INDEX\u003c/code>"],"answer":1,"explain":"\u003cp>Leave the column bare and move the computation to the constant side. That&#39;s a sargable range.\u003c/p>\n"},{"q":"In MySQL&#39;s EXPLAIN, which \u003ccode>type\u003c/code> value means a full table scan?","options":["ref","range","ALL","const"],"answer":2,"explain":"\u003cp>\u003ccode>ALL\u003c/code> reads every row. \u003ccode>index\u003c/code> reads a whole index, which is cheaper but still a full pass.\u003c/p>\n"},{"q":"Why might MySQL ignore an index on \u003ccode>orders.status\u003c/code> (4 distinct values)?","options":["Indexes don&#39;t work on ENUM columns","Low selectivity: fetching a quarter of the table through the index is slower than scanning it","It needs ANALYZE first, always","Status should be the primary key"],"answer":1,"explain":"\u003cp>The optimizer estimates cost. Low-cardinality columns are more useful as a later column in a composite index.\u003c/p>\n"}]}],"problems":[]},{"id":"playbook","num":14,"title":"Interview playbook","summary":"A repeatable routine for SQL interview questions, the edge-case checklist that catches most wrong answers, MySQL errors decoded, and three timed practice sets.","clauses":[],"kicker":"routine · edge cases · error codes · dialects · mock sets","minutes":9,"html":"\u003ch2>A six-step routine\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Restate the output.\u003c/strong> Exact column names and order, what one row represents (the \u003cem>grain\u003c/em>), and any required sort. Write the final SELECT list first.\u003c/li>\n\u003cli>\u003cstrong>Interrogate the edge cases.\u003c/strong> NULLs? Duplicates? Ties? Empty input? Inclusive or exclusive boundaries? Rounding? Ask, or state your assumption out loud.\u003c/li>\n\u003cli>\u003cstrong>Sketch the flow.\u003c/strong> Which tables, which join types (does every row on one side have to survive?), which filters, what gets aggregated, and at what grain.\u003c/li>\n\u003cli>\u003cstrong>Build in named steps.\u003c/strong> One CTE per idea, each with a comment saying its grain. It&#39;s easier to write, to debug and to explain.\u003c/li>\n\u003cli>\u003cstrong>Test by hand.\u003c/strong> Walk the sample rows through each step, then one edge case such as an empty group or a tie.\u003c/li>\n\u003cli>\u003cstrong>Polish.\u003c/strong> Simplify, then mention indexes or complexity if there&#39;s time. Interviewers remember a clear explanation more than a clever trick.\u003c/li>\n\u003c/ol>\n\u003cp>A worked example on the sample shop: \u003cem>&quot;For each country, the customer who spent the most in 2024 (ties included), with their share of the country&#39;s 2024 revenue.&quot;\u003c/em>\u003c/p>\n\u003cdiv class=\"example\" data-ex=\"playbook-ex1\">\u003c/div>\n\u003ch2>The edge-case checklist\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Check\u003c/th>\u003cth>What goes wrong\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>NULLs in filters\u003c/td>\u003ctd>\u003ccode>x &lt;&gt; 5\u003c/code> and \u003ccode>NOT IN (…)\u003c/code> silently drop or kill rows\u003c/td>\u003ctd>\u003ccode>IS NULL\u003c/code> branches, \u003ccode>&lt;=&gt;\u003c/code>, \u003ccode>NOT EXISTS\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NULLs in results\u003c/td>\u003ctd>Sums over nothing are NULL, not 0\u003c/td>\u003ctd>\u003ccode>IFNULL(SUM(x), 0)\u003c/code>, \u003ccode>COUNT(col)\u003c/code> after LEFT JOIN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duplicates\u003c/td>\u003ctd>Double counting, repeated names\u003c/td>\u003ctd>\u003ccode>DISTINCT\u003c/code>, \u003ccode>COUNT(DISTINCT …)\u003c/code>, group by id\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ties\u003c/td>\u003ctd>&quot;Top 1&quot; returns one of several\u003c/td>\u003ctd>\u003ccode>RANK\u003c/code>/\u003ccode>DENSE_RANK\u003c/code>, or an explicit tie-breaker\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Empty input\u003c/td>\u003ctd>Query returns \u003cem>no row\u003c/em> when one row with NULL is required\u003c/td>\u003ctd>Scalar-subquery wrap or an aggregate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Boundaries\u003c/td>\u003ctd>\u003ccode>&gt;\u003c/code> vs \u003ccode>&gt;=\u003c/code>, BETWEEN on DATETIME, leap days\u003c/td>\u003ctd>Half-open ranges: \u003ccode>&gt;= start AND &lt; next_start\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Division and rounding\u003c/td>\u003ctd>Integer division (PostgreSQL), rounding too early\u003c/td>\u003ctd>\u003ccode>100.0 * a / b\u003c/code>, round once at the end\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Grain after joins\u003c/td>\u003ctd>Fan-out inflates SUM and COUNT\u003c/td>\u003ctd>Aggregate before joining, \u003ccode>COUNT(DISTINCT id)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Output format\u003c/td>\u003ctd>Wrong column names or order\u003c/td>\u003ctd>Alias exactly, and backtick names with spaces or reserved words\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ordering\u003c/td>\u003ctd>Right rows, wrong order\u003c/td>\u003ctd>ORDER BY with every tie-breaker the question states\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Phrase → technique\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>When the question says…\u003c/th>\u003cth>Reach for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>&quot;for each X, the top/first/latest N&quot;\u003c/td>\u003ctd>window rank in a subquery, filter \u003ccode>rn &lt;= N\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;consecutive&quot;, &quot;in a row&quot;, &quot;streak&quot;\u003c/td>\u003ctd>\u003ccode>LAG\u003c/code>/\u003ccode>LEAD\u003c/code>, self-join on id + 1, or gaps and islands\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;the first time&quot;, &quot;initial&quot;\u003c/td>\u003ctd>\u003ccode>MIN(date)\u003c/code> per entity + join back, or \u003ccode>ROW_NUMBER() = 1\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;never&quot;, &quot;without any&quot;\u003c/td>\u003ctd>anti-join (\u003ccode>LEFT JOIN … IS NULL\u003c/code> / \u003ccode>NOT EXISTS\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;at least one&quot;\u003c/td>\u003ctd>\u003ccode>EXISTS\u003c/code> / semi-join\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;all of&quot;, &quot;every&quot;\u003c/td>\u003ctd>relational division: \u003ccode>COUNT(DISTINCT) = total\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;percentage&quot;, &quot;rate&quot;, &quot;ratio&quot;\u003c/td>\u003ctd>\u003ccode>ROUND(100 * AVG(condition), 2)\u003c/code> over the right denominator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;running&quot;, &quot;cumulative&quot;, &quot;so far&quot;\u003c/td>\u003ctd>\u003ccode>SUM(...) OVER (ORDER BY ...)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;moving average&quot;, &quot;last 7 days&quot;\u003c/td>\u003ctd>window frame \u003ccode>ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\u003c/code>, or a range self-join\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;include days/categories with none&quot;\u003c/td>\u003ctd>calendar or category list + LEFT JOIN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;one column per month/status&quot;\u003c/td>\u003ctd>conditional aggregation (pivot)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;compare with the previous/next&quot;\u003c/td>\u003ctd>\u003ccode>LAG\u003c/code> / \u003ccode>LEAD\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;hierarchy&quot;, &quot;all reports&quot;, &quot;level&quot;\u003c/td>\u003ctd>recursive CTE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;N-th highest&quot;\u003c/td>\u003ctd>\u003ccode>DENSE_RANK\u003c/code>, or \u003ccode>DISTINCT … LIMIT 1 OFFSET N-1\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;delete duplicates&quot;, &quot;swap values&quot;\u003c/td>\u003ctd>self-join DELETE, \u003ccode>UPDATE … CASE\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>MySQL errors, decoded\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Error\u003c/th>\u003cth>Message (short)\u003c/th>\u003cth>Usual cause\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1054\u003c/td>\u003ctd>Unknown column &#39;x&#39; in &#39;where clause&#39;\u003c/td>\u003ctd>A SELECT alias used in WHERE, or a typo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1055\u003c/td>\u003ctd>… isn&#39;t in GROUP BY (ONLY_FULL_GROUP_BY)\u003c/td>\u003ctd>Selected a column that&#39;s neither grouped nor aggregated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1064\u003c/td>\u003ctd>You have an error in your SQL syntax\u003c/td>\u003ctd>Missing comma, reserved word such as \u003ccode>rank\u003c/code> used as a name, PostgreSQL syntax\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1093\u003c/td>\u003ctd>You can&#39;t specify target table … for update\u003c/td>\u003ctd>DELETE/UPDATE subquery reads the same table: wrap it in a derived table\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1111\u003c/td>\u003ctd>Invalid use of group function\u003c/td>\u003ctd>An aggregate in WHERE: move it to HAVING\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1235\u003c/td>\u003ctd>This version doesn&#39;t yet support &#39;LIMIT &amp; IN … subquery&#39;\u003c/td>\u003ctd>Wrap the LIMIT subquery in a derived table\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1242\u003c/td>\u003ctd>Subquery returns more than 1 row\u003c/td>\u003ctd>A scalar subquery isn&#39;t scalar: add a condition, an aggregate or LIMIT 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1248\u003c/td>\u003ctd>Every derived table must have its own alias\u003c/td>\u003ctd>\u003ccode>FROM (SELECT …) AS t\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>MySQL ↔ PostgreSQL ↔ SQL Server\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable class=\"md\">\u003cthead>\u003ctr>\u003cth>Task\u003c/th>\u003cth>MySQL\u003c/th>\u003cth>PostgreSQL\u003c/th>\u003cth>SQL Server\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>First n rows\u003c/td>\u003ctd>\u003ccode>LIMIT n OFFSET m\u003c/code>\u003c/td>\u003ctd>same, or \u003ccode>FETCH FIRST n ROWS ONLY\u003c/code>\u003c/td>\u003ctd>\u003ccode>TOP n\u003c/code> / \u003ccode>OFFSET m ROWS FETCH NEXT n ROWS ONLY\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Quote identifiers\u003c/td>\u003ctd>\u003ccode>`name`\u003c/code>\u003c/td>\u003ctd>\u003ccode>&quot;name&quot;\u003c/code>\u003c/td>\u003ctd>\u003ccode>[name]\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Concatenate\u003c/td>\u003ctd>\u003ccode>CONCAT(a, b)\u003c/code>\u003c/td>\u003ctd>\u003ccode>a || b\u003c/code>\u003c/td>\u003ctd>\u003ccode>a + b\u003c/code> / \u003ccode>CONCAT\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NULL fallback\u003c/td>\u003ctd>\u003ccode>IFNULL(a, b)\u003c/code>\u003c/td>\u003ctd>\u003ccode>COALESCE(a, b)\u003c/code>\u003c/td>\u003ctd>\u003ccode>ISNULL(a, b)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add days\u003c/td>\u003ctd>\u003ccode>DATE_ADD(d, INTERVAL 7 DAY)\u003c/code>\u003c/td>\u003ctd>\u003ccode>d + INTERVAL &#39;7 days&#39;\u003c/code>\u003c/td>\u003ctd>\u003ccode>DATEADD(day, 7, d)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Day difference\u003c/td>\u003ctd>\u003ccode>DATEDIFF(later, earlier)\u003c/code>\u003c/td>\u003ctd>\u003ccode>later - earlier\u003c/code>\u003c/td>\u003ctd>\u003ccode>DATEDIFF(day, earlier, later)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Format date\u003c/td>\u003ctd>\u003ccode>DATE_FORMAT(d, &#39;%Y-%m&#39;)\u003c/code>\u003c/td>\u003ctd>\u003ccode>to_char(d, &#39;YYYY-MM&#39;)\u003c/code>\u003c/td>\u003ctd>\u003ccode>FORMAT(d, &#39;yyyy-MM&#39;)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Truncate to month\u003c/td>\u003ctd>\u003ccode>DATE_FORMAT(d, &#39;%Y-%m-01&#39;)\u003c/code>\u003c/td>\u003ctd>\u003ccode>date_trunc(&#39;month&#39;, d)\u003c/code>\u003c/td>\u003ctd>\u003ccode>DATETRUNC(month, d)\u003c/code> (2022)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>String aggregate\u003c/td>\u003ctd>\u003ccode>GROUP_CONCAT(x ORDER BY x SEPARATOR &#39;,&#39;)\u003c/code>\u003c/td>\u003ctd>\u003ccode>string_agg(x, &#39;,&#39; ORDER BY x)\u003c/code>\u003c/td>\u003ctd>\u003ccode>STRING_AGG(x, &#39;,&#39;) WITHIN GROUP (ORDER BY x)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>7 / 2\u003c/code>\u003c/td>\u003ctd>3.5000\u003c/td>\u003ctd>3\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Boolean in SUM\u003c/td>\u003ctd>\u003ccode>SUM(cond)\u003c/code>\u003c/td>\u003ctd>\u003ccode>SUM(cond::int)\u003c/code> / \u003ccode>COUNT(*) FILTER (WHERE cond)\u003c/code>\u003c/td>\u003ctd>\u003ccode>SUM(CASE WHEN cond THEN 1 ELSE 0 END)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Upsert\u003c/td>\u003ctd>\u003ccode>ON DUPLICATE KEY UPDATE\u003c/code>\u003c/td>\u003ctd>\u003ccode>ON CONFLICT … DO UPDATE\u003c/code>\u003c/td>\u003ctd>\u003ccode>MERGE\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Auto id\u003c/td>\u003ctd>\u003ccode>AUTO_INCREMENT\u003c/code>\u003c/td>\u003ctd>\u003ccode>GENERATED … AS IDENTITY\u003c/code> / \u003ccode>SERIAL\u003c/code>\u003c/td>\u003ctd>\u003ccode>IDENTITY(1,1)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regex match\u003c/td>\u003ctd>\u003ccode>REGEXP\u003c/code> / \u003ccode>REGEXP_LIKE\u003c/code>\u003c/td>\u003ctd>\u003ccode>~\u003c/code> / \u003ccode>~*\u003c/code>\u003c/td>\u003ctd>not built in (LIKE patterns)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Timed practice sets\u003c/h2>\n\u003cp>Do each set in one sitting, without hints, against the clock. Then read every solution, including the alternatives. That second reading is where most of the learning happens.\u003c/p>\n\u003cp>\u003cstrong>Set A: warm-up, 25 minutes.\u003c/strong> \u003ca class=\"pref\" href=\"#p1757\">\u003cspan class=\"pnum\">#1757\u003c/span> Recyclable and Low Fat Products\u003c/a>, \u003ca class=\"pref\" href=\"#p584\">\u003cspan class=\"pnum\">#584\u003c/span> Find Customer Referee\u003c/a>, \u003ca class=\"pref\" href=\"#p1378\">\u003cspan class=\"pnum\">#1378\u003c/span> Replace Employee ID With The Unique Identifier\u003c/a>, \u003ca class=\"pref\" href=\"#p1581\">\u003cspan class=\"pnum\">#1581\u003c/span> Customer Who Visited but Did Not Make Any Transactions\u003c/a>, \u003ca class=\"pref\" href=\"#p1729\">\u003cspan class=\"pnum\">#1729\u003c/span> Find Followers Count\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Set B: core interview level, 45 minutes.\u003c/strong> \u003ca class=\"pref\" href=\"#p1934\">\u003cspan class=\"pnum\">#1934\u003c/span> Confirmation Rate\u003c/a>, \u003ca class=\"pref\" href=\"#p550\">\u003cspan class=\"pnum\">#550\u003c/span> Game Play Analysis IV\u003c/a>, \u003ca class=\"pref\" href=\"#p1164\">\u003cspan class=\"pnum\">#1164\u003c/span> Product Price at a Given Date\u003c/a>, \u003ca class=\"pref\" href=\"#p1907\">\u003cspan class=\"pnum\">#1907\u003c/span> Count Salary Categories\u003c/a>, \u003ca class=\"pref\" href=\"#p602\">\u003cspan class=\"pnum\">#602\u003c/span> Friend Requests II: Who Has the Most Friends\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Set C: hard, 60 minutes.\u003c/strong> \u003ca class=\"pref\" href=\"#p185\">\u003cspan class=\"pnum\">#185\u003c/span> Department Top Three Salaries\u003c/a>, \u003ca class=\"pref\" href=\"#p262\">\u003cspan class=\"pnum\">#262\u003c/span> Trips and Users\u003c/a>, \u003ca class=\"pref\" href=\"#p601\">\u003cspan class=\"pnum\">#601\u003c/span> Human Traffic of Stadium\u003c/a>, \u003ca class=\"pref\" href=\"#p1321\">\u003cspan class=\"pnum\">#1321\u003c/span> Restaurant Growth\u003c/a>, \u003ca class=\"pref\" href=\"#p3482\">\u003cspan class=\"pnum\">#3482\u003c/span> Analyze Organization Hierarchy\u003c/a>\u003c/p>\n\u003caside class=\"callout interview\">\u003cdiv class=\"callout-label\">Interview angle \u003cspan>· Say it while you type\u003c/span>\u003c/div>\u003cp>Silence reads as being stuck. Narrate the routine as you go: &quot;one row per customer, so I&#39;ll group by customer id; revenue could double-count if I join items before orders are filtered, so…&quot;. Even a half-finished query with clear reasoning often passes.\u003c/p>\n\u003c/aside>\u003ch2>Quick check\u003c/h2>\n\u003cdiv class=\"quiz\" data-quiz=\"playbook-q1\">\u003c/div>","examples":[{"id":"playbook-ex1","sql":"WITH spend AS (                    -- one row per customer: 2024 revenue, cancelled orders excluded\n  SELECT c.customer_id, c.name, c.country,\n         SUM(oi.quantity * oi.unit_price) AS spent\n  FROM customers c\n  JOIN orders o       ON o.customer_id = c.customer_id\n                     AND o.status \u003c> 'cancelled'\n                     AND o.order_date >= '2024-01-01' AND o.order_date \u003c '2025-01-01'\n  JOIN order_items oi ON oi.order_id = o.order_id\n  GROUP BY c.customer_id, c.name, c.country\n),\nranked AS (                        -- add per-country rank and total\n  SELECT s.*,\n         RANK() OVER (PARTITION BY country ORDER BY spent DESC) AS rnk,\n         SUM(spent) OVER (PARTITION BY country)                 AS country_total\n  FROM spend s\n)\nSELECT country, name, spent,\n       ROUND(100 * spent / country_total, 1) AS pct_of_country\nFROM ranked\nWHERE rnk = 1\nORDER BY spent DESC;","db":"sample","expectError":false,"expectWarning":false,"title":"","output":{"columns":["country","name","spent","pct_of_country"],"rows":[["UK","Alice Green",3404,100],["Egypt","Jamal Idris",2885,43.9],["USA","George Miller",2477,100],["Japan","Hiro Tanaka",1933,100],["Portugal","Ines Costa",1428,100],["Spain","Diego Alvarez",537,100],["France","Chloe Dubois",216,100]],"total":7,"explain":false,"error":null,"warnings":[],"notes":[],"summary":[]}}],"dbs":{},"quizzes":[{"id":"playbook-q1","questions":[{"q":"The question asks for &quot;each department&#39;s highest earners, including ties&quot;. Which is safest?","options":["\u003ccode>ORDER BY salary DESC LIMIT 1\u003c/code> per department","\u003ccode>ROW_NUMBER() … = 1\u003c/code>","\u003ccode>RANK()\u003c/code> or \u003ccode>DENSE_RANK() … = 1\u003c/code> in a subquery","\u003ccode>MAX(salary)\u003c/code> with the name in GROUP BY"],"answer":2,"explain":"\u003cp>Only the rank functions keep every tied top earner. ROW_NUMBER picks one arbitrarily.\u003c/p>\n"},{"q":"MySQL says &quot;Invalid use of group function&quot; (1111). You most likely…","options":["forgot an alias","used an aggregate like COUNT() in WHERE","used LIMIT in a subquery","quoted a column with double quotes"],"answer":1,"explain":"\u003cp>Aggregates belong in SELECT or HAVING, never in WHERE.\u003c/p>\n"},{"q":"A result should list every month, even months with no sales. The shape is…","options":["GROUP BY month with HAVING COUNT(*) &gt;= 0","a generated calendar (recursive CTE or list) LEFT JOINed to the sales","ORDER BY month with NULLS FIRST","UNION of the sales with itself"],"answer":1,"explain":"\u003cp>GROUP BY can&#39;t create groups that have no rows, so the list of months must come from somewhere else.\u003c/p>\n"}]}],"problems":[]}],"problems":{"175":{"id":175,"title":"Combine Two Tables","slug":"combine-two-tables","difficulty":"Easy","module":"joins","patterns":["LEFT JOIN"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Report \u003ccode>firstName\u003c/code>, \u003ccode>lastName\u003c/code>, \u003ccode>city\u003c/code> and \u003ccode>state\u003c/code> for \u003cstrong>every\u003c/strong> person in \u003ccode>Person\u003c/code>. People without a row in \u003ccode>Address\u003c/code> still appear, with NULL \u003ccode>city\u003c/code> and \u003ccode>state\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Every person must appear, matched or not.\u003c/p>\n","\u003cp>That is a LEFT JOIN with Person on the left.\u003c/p>\n"],"solution":{"sql":"SELECT p.firstName, p.lastName, a.city, a.state\nFROM Person p\nLEFT JOIN Address a ON a.personId = p.personId;","html":"\u003cp>LEFT JOIN keeps every Person row; where no address matches, the Address columns are NULL. The address for person 9 (who does not exist) is ignored.\u003c/p>\n"},"alternatives":[],"traps":[{"sql":"SELECT p.firstName, p.lastName, a.city, a.state FROM Person p JOIN Address a ON a.personId = p.personId;","html":"\u003cp>An inner join drops people without an address.\u003c/p>\n"},{"sql":"SELECT p.firstName, p.lastName, a.city, a.state FROM Person p RIGHT JOIN Address a ON a.personId = p.personId;","html":"\u003cp>RIGHT JOIN keeps every address instead — including one whose person does not exist — and drops people without addresses.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Person","columns":[{"name":"personId","type":"INT","pk":true},{"name":"lastName","type":"VARCHAR(255)","pk":false},{"name":"firstName","type":"VARCHAR(255)","pk":false}]},{"name":"Address","columns":[{"name":"addressId","type":"INT","pk":true},{"name":"personId","type":"INT","pk":false},{"name":"city","type":"VARCHAR(255)","pk":false},{"name":"state","type":"VARCHAR(255)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Person (personId INT PRIMARY KEY, lastName VARCHAR(255), firstName VARCHAR(255));\nCREATE TABLE Address (addressId INT PRIMARY KEY, personId INT, city VARCHAR(255), state VARCHAR(255));\nINSERT INTO Person VALUES (1, 'Rossi', 'Marco'), (2, 'Okafor', 'Ada'), (3, 'Silva', 'Joao'), (4, 'Kim', 'Ji');\nINSERT INTO Address VALUES (1, 2, 'Lagos', 'LA'), (2, 3, 'Porto', 'PO'), (3, 9, 'Nowhere', 'NW');","tables":[{"name":"Person","rows":[[1,"Rossi","Marco"],[2,"Okafor","Ada"],[3,"Silva","Joao"],[4,"Kim","Ji"]]},{"name":"Address","rows":[[1,2,"Lagos","LA"],[2,3,"Porto","PO"],[3,9,"Nowhere","NW"]]}],"runs":[{"expected":{"columns":["firstName","lastName","city","state"],"rows":[["Marco","Rossi",null,null],["Ada","Okafor","Lagos","LA"],["Joao","Silva","Porto","PO"],["Ji","Kim",null,null]]}}]},{"name":"Nobody has an address","setup":"CREATE TABLE Person (personId INT PRIMARY KEY, lastName VARCHAR(255), firstName VARCHAR(255));\nCREATE TABLE Address (addressId INT PRIMARY KEY, personId INT, city VARCHAR(255), state VARCHAR(255));\nINSERT INTO Person VALUES (1, 'Wang', 'Allen'), (2, 'Alice', 'Bob');","tables":[{"name":"Person","rows":[[1,"Wang","Allen"],[2,"Alice","Bob"]]},{"name":"Address","rows":[]}],"runs":[{"expected":{"columns":["firstName","lastName","city","state"],"rows":[["Allen","Wang",null,null],["Bob","Alice",null,null]]}}]}]},"176":{"id":176,"title":"Second Highest Salary","slug":"second-highest-salary","difficulty":"Medium","module":"subqueries","patterns":["NULL when empty","DISTINCT + OFFSET"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Return the \u003cstrong>second highest distinct\u003c/strong> salary in a column named \u003ccode>SecondHighestSalary\u003c/code>. If there is no second highest salary, return a single row containing NULL.\u003c/p>\n","notesHtml":"","hints":["\u003cp>&quot;Distinct&quot;: 300 appears twice but is one salary level.\u003c/p>\n","\u003cp>Sort distinct salaries descending and skip the first.\u003c/p>\n","\u003cp>An empty result is not the same as a row holding NULL — wrap the query as a scalar subquery.\u003c/p>\n"],"solution":{"sql":"SELECT (\n  SELECT DISTINCT salary\n  FROM Employee\n  ORDER BY salary DESC\n  LIMIT 1 OFFSET 1\n) AS SecondHighestSalary;","html":"\u003cp>The inner query finds the second distinct value or nothing. Placed in the SELECT list of an outer query with no FROM, it always yields exactly one row — NULL when the inner query found nothing.\u003c/p>\n"},"alternatives":[{"title":"MAX below the MAX","sql":"SELECT MAX(salary) AS SecondHighestSalary\nFROM Employee\nWHERE salary \u003c (SELECT MAX(salary) FROM Employee);","html":"\u003cp>The largest salary smaller than the largest is the second highest distinct salary. MAX over zero rows is NULL, so the empty case is handled for free.\u003c/p>\n"},{"title":"DENSE_RANK","sql":"SELECT MAX(salary) AS SecondHighestSalary\nFROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS rnk FROM Employee) t\nWHERE rnk = 2;","html":"\u003cp>Generalizes to the N-th highest (Module 9); the outer MAX turns &quot;no rank 2&quot; into NULL.\u003c/p>\n"}],"traps":[{"sql":"SELECT salary AS SecondHighestSalary FROM Employee ORDER BY salary DESC LIMIT 1 OFFSET 1;","html":"\u003cp>Without DISTINCT the duplicate 300 is &quot;second&quot; — and with one employee you get no row instead of NULL.\u003c/p>\n"},{"sql":"SELECT DISTINCT salary AS SecondHighestSalary FROM Employee ORDER BY salary DESC LIMIT 1 OFFSET 1;","html":"\u003cp>Right value when it exists, but an empty result (not a NULL row) when it does not.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employee","columns":[{"name":"id","type":"INT","pk":true},{"name":"salary","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, salary INT);\nINSERT INTO Employee VALUES (1, 100), (2, 300), (3, 300), (4, 200);","tables":[{"name":"Employee","rows":[[1,100],[2,300],[3,300],[4,200]]}],"runs":[{"expected":{"columns":["SecondHighestSalary"],"rows":[[200]]}}]},{"name":"Only one employee","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, salary INT);\nINSERT INTO Employee VALUES (1, 100);","tables":[{"name":"Employee","rows":[[1,100]]}],"runs":[{"expected":{"columns":["SecondHighestSalary"],"rows":[[null]]}}]},{"name":"Everyone earns the same","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, salary INT);\nINSERT INTO Employee VALUES (1, 500), (2, 500);","tables":[{"name":"Employee","rows":[[1,500],[2,500]]}],"runs":[{"expected":{"columns":["SecondHighestSalary"],"rows":[[null]]}}]}]},"177":{"id":177,"title":"Nth Highest Salary","slug":"nth-highest-salary","difficulty":"Medium","module":"windows","patterns":["stored function","N-th highest distinct","LIMIT arithmetic"],"sql50":false,"order":false,"kind":"function","taskHtml":"\u003cp>Write the body of the MySQL function \u003ccode>getNthHighestSalary(N)\u003c/code>: it returns the \u003cstrong>N-th highest distinct\u003c/strong> salary in \u003ccode>Employee\u003c/code>, or NULL if there are fewer than N distinct salaries. The checker calls it with several values of N.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Distinct salaries, sorted descending; skip N − 1 of them and take one.\u003c/p>\n","\u003cp>MySQL&#39;s LIMIT/OFFSET accepts only literals or variables, not expressions like \u003ccode>N - 1\u003c/code>. Compute it first with \u003ccode>SET N = N - 1;\u003c/code>.\u003c/p>\n","\u003cp>Or rank with DENSE_RANK and pick rank N — no arithmetic in LIMIT at all.\u003c/p>\n"],"solution":{"sql":"CREATE FUNCTION getNthHighestSalary(N INT) RETURNS INT\nBEGIN\n  SET N = N - 1;\n  RETURN (\n    SELECT DISTINCT salary\n    FROM Employee\n    ORDER BY salary DESC\n    LIMIT 1 OFFSET N\n  );\nEND","html":"\u003cp>The subquery returns the N-th distinct salary, or no row — which RETURN turns into NULL. \u003ccode>SET N = N - 1\u003c/code> is there because \u003ccode>OFFSET N - 1\u003c/code> is a syntax error in MySQL.\u003c/p>\n"},"alternatives":[{"title":"DENSE_RANK","sql":"CREATE FUNCTION getNthHighestSalary(N INT) RETURNS INT\nBEGIN\n  RETURN (\n    SELECT MAX(salary)\n    FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS rnk FROM Employee) t\n    WHERE rnk = N\n  );\nEND","html":"\u003cp>DENSE_RANK numbers distinct salary levels 1, 2, 3…; MAX over the rows with rank N gives the value or NULL.\u003c/p>\n"}],"traps":[{"sql":"CREATE FUNCTION getNthHighestSalary(N INT) RETURNS INT\nBEGIN\n  RETURN (SELECT DISTINCT salary FROM Employee ORDER BY salary DESC LIMIT 1 OFFSET N - 1);\nEND","html":"\u003cp>MySQL does not allow an expression in OFFSET, even inside a function.\u003c/p>\n"},{"sql":"CREATE FUNCTION getNthHighestSalary(N INT) RETURNS INT\nBEGIN\n  SET N = N - 1;\n  RETURN (SELECT salary FROM Employee ORDER BY salary DESC LIMIT 1 OFFSET N);\nEND","html":"\u003cp>Without DISTINCT the duplicate 300 takes two places, so N = 2 returns 300.\u003c/p>\n"}],"fn":{"name":"getNthHighestSalary","args":[2]},"after":null,"starter":"CREATE FUNCTION getNthHighestSalary(N INT) RETURNS INT\nBEGIN\n  RETURN (\n    -- your query here\n    SELECT NULL\n  );\nEND","schema":[{"name":"Employee","columns":[{"name":"id","type":"INT","pk":true},{"name":"salary","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, salary INT);\nINSERT INTO Employee VALUES (1, 100), (2, 300), (3, 300), (4, 200), (5, 50);","tables":[{"name":"Employee","rows":[[1,100],[2,300],[3,300],[4,200],[5,50]]}],"runs":[{"args":[2],"expected":{"columns":["getNthHighestSalary(2)"],"rows":[[200]]}}]},{"name":"Same data, N = 1, 4, 5","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, salary INT);\nINSERT INTO Employee VALUES (1, 100), (2, 300), (3, 300), (4, 200), (5, 50);","tables":[{"name":"Employee","rows":[[1,100],[2,300],[3,300],[4,200],[5,50]]}],"runs":[{"args":[1],"expected":{"columns":["getNthHighestSalary(1)"],"rows":[[300]]}},{"args":[4],"expected":{"columns":["getNthHighestSalary(4)"],"rows":[[50]]}},{"args":[5],"expected":{"columns":["getNthHighestSalary(5)"],"rows":[[null]]}}]},{"name":"One employee, N = 1, 2","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, salary INT);\nINSERT INTO Employee VALUES (1, 100);","tables":[{"name":"Employee","rows":[[1,100]]}],"runs":[{"args":[1],"expected":{"columns":["getNthHighestSalary(1)"],"rows":[[100]]}},{"args":[2],"expected":{"columns":["getNthHighestSalary(2)"],"rows":[[null]]}}]}]},"178":{"id":178,"title":"Rank Scores","slug":"rank-scores","difficulty":"Medium","module":"windows","patterns":["DENSE_RANK","reserved word alias"],"sql50":false,"order":true,"kind":"query","taskHtml":"\u003cp>Rank the scores from highest to lowest. Equal scores share a rank, and ranks have \u003cstrong>no gaps\u003c/strong> after ties (1, 2, 2, 3). Return \u003ccode>score\u003c/code> and \u003ccode>rank\u003c/code>, ordered by \u003ccode>score\u003c/code> descending.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Ranking with shared ranks and no gaps is exactly DENSE_RANK.\u003c/p>\n","\u003cp>\u003ccode>rank\u003c/code> is a reserved word in MySQL 8 — quote the alias with backticks.\u003c/p>\n"],"solution":{"sql":"SELECT score,\n       DENSE_RANK() OVER (ORDER BY score DESC) AS `rank`\nFROM Scores\nORDER BY score DESC;","html":"\u003cp>DENSE_RANK gives tied scores the same rank and continues with the next integer. The backticks are required: RANK became a reserved word in MySQL 8.0.2.\u003c/p>\n"},"alternatives":[{"title":"Without window functions","sql":"SELECT s.score,\n       (SELECT COUNT(DISTINCT s2.score) FROM Scores s2 WHERE s2.score >= s.score) AS `rank`\nFROM Scores s\nORDER BY s.score DESC;","html":"\u003cp>A score&#39;s dense rank is the number of distinct scores greater than or equal to it — the classic pre-MySQL-8 answer.\u003c/p>\n"}],"traps":[{"sql":"SELECT score, RANK() OVER (ORDER BY score DESC) AS `rank` FROM Scores ORDER BY score DESC;","html":"\u003cp>RANK leaves gaps after ties (1, 1, 3), the problem wants none.\u003c/p>\n"},{"sql":"SELECT score, DENSE_RANK() OVER (ORDER BY score DESC) AS rank FROM Scores ORDER BY score DESC;","html":"\u003cp>Correct numbers, but MySQL 8 rejects the unquoted alias \u003ccode>rank\u003c/code> (reserved word).\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Scores","columns":[{"name":"id","type":"INT","pk":true},{"name":"score","type":"DECIMAL(3,2)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Scores (id INT PRIMARY KEY, score DECIMAL(3,2));\nINSERT INTO Scores VALUES (1, 3.20), (2, 4.10), (3, 3.75), (4, 4.10), (5, 2.95), (6, 3.75), (7, 3.40);","tables":[{"name":"Scores","rows":[[1,3.2],[2,4.1],[3,3.75],[4,4.1],[5,2.95],[6,3.75],[7,3.4]]}],"runs":[{"expected":{"columns":["score","rank"],"rows":[[4.1,1],[4.1,1],[3.75,2],[3.75,2],[3.4,3],[3.2,4],[2.95,5]]}}]},{"name":"Everyone ties but one","setup":"CREATE TABLE Scores (id INT PRIMARY KEY, score DECIMAL(3,2));\nINSERT INTO Scores VALUES (1, 3.50), (2, 3.50), (3, 3.50), (4, 1.00);","tables":[{"name":"Scores","rows":[[1,3.5],[2,3.5],[3,3.5],[4,1]]}],"runs":[{"expected":{"columns":["score","rank"],"rows":[[3.5,1],[3.5,1],[3.5,1],[1,2]]}}]}]},"180":{"id":180,"title":"Consecutive Numbers","slug":"consecutive-numbers","difficulty":"Medium","module":"windows","patterns":["consecutive rows","LAG / self-join"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>\u003ccode>Logs\u003c/code> has ids 1, 2, 3, … in order. Return every \u003ccode>num\u003c/code> that appears \u003cstrong>at least three times in a row\u003c/strong> (consecutive ids), each once, in a column \u003ccode>ConsecutiveNums\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Compare each row with the two rows before it.\u003c/p>\n","\u003cp>LAG(num, 1) and LAG(num, 2) — or join the table to itself on id + 1 and id + 2.\u003c/p>\n","\u003cp>A run can appear more than once, and a run of four contains two runs of three: de-duplicate.\u003c/p>\n"],"solution":{"sql":"SELECT DISTINCT num AS ConsecutiveNums\nFROM (\n  SELECT num,\n         LAG(num, 1) OVER (ORDER BY id) AS prev1,\n         LAG(num, 2) OVER (ORDER BY id) AS prev2\n  FROM Logs\n) t\nWHERE num = prev1 AND num = prev2;","html":"\u003cp>A row whose value equals the two previous values ends a run of at least three. DISTINCT collapses repeated runs (the 7s run twice, the 3s form a run of four).\u003c/p>\n"},"alternatives":[{"title":"Self-join on consecutive ids","sql":"SELECT DISTINCT l1.num AS ConsecutiveNums\nFROM Logs l1\nJOIN Logs l2 ON l2.id = l1.id + 1 AND l2.num = l1.num\nJOIN Logs l3 ON l3.id = l1.id + 2 AND l3.num = l1.num;","html":"\u003cp>Works because ids have no gaps. For &quot;at least N in a row&quot; with larger N, the gaps-and-islands pattern in Module 10 scales better.\u003c/p>\n"}],"traps":[{"sql":"SELECT num AS ConsecutiveNums FROM Logs GROUP BY num HAVING COUNT(*) >= 3;","html":"\u003cp>Counts total occurrences, not consecutive ones — the 5s appear three times but never three in a row.\u003c/p>\n"},{"sql":"SELECT l1.num AS ConsecutiveNums FROM Logs l1 JOIN Logs l2 ON l2.id = l1.id + 1 AND l2.num = l1.num JOIN Logs l3 ON l3.id = l1.id + 2 AND l3.num = l1.num;","html":"\u003cp>Without DISTINCT, a number is repeated once per qualifying window.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Logs","columns":[{"name":"id","type":"INT","pk":true},{"name":"num","type":"VARCHAR(10)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Logs (id INT PRIMARY KEY, num VARCHAR(10));\nINSERT INTO Logs VALUES\n  (1, '7'), (2, '7'), (3, '7'), (4, '3'), (5, '7'), (6, '3'), (7, '3'), (8, '3'), (9, '3'),\n  (10, '5'), (11, '5'), (12, '7'), (13, '7'), (14, '7'), (15, '5');","tables":[{"name":"Logs","rows":[[1,"7"],[2,"7"],[3,"7"],[4,"3"],[5,"7"],[6,"3"],[7,"3"],[8,"3"],[9,"3"],[10,"5"],[11,"5"],[12,"7"],[13,"7"],[14,"7"],[15,"5"]]}],"runs":[{"expected":{"columns":["ConsecutiveNums"],"rows":[["7"],["3"]]}}]},{"name":"The run is at the very end","setup":"CREATE TABLE Logs (id INT PRIMARY KEY, num VARCHAR(10));\nINSERT INTO Logs VALUES (1, '1'), (2, '2'), (3, '2'), (4, '1'), (5, '1'), (6, '1');","tables":[{"name":"Logs","rows":[[1,"1"],[2,"2"],[3,"2"],[4,"1"],[5,"1"],[6,"1"]]}],"runs":[{"expected":{"columns":["ConsecutiveNums"],"rows":[["1"]]}}]}]},"181":{"id":181,"title":"Employees Earning More Than Their Managers","slug":"employees-earning-more-than-their-managers","difficulty":"Easy","module":"joins","patterns":["self-join"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Find the employees who earn \u003cstrong>more\u003c/strong> than their manager. Return their names in a column called \u003ccode>Employee\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Join the table to itself: one copy for the employee, one for the manager.\u003c/p>\n","\u003cp>Match \u003ccode>e.managerId = m.id\u003c/code>, then compare the two salaries.\u003c/p>\n"],"solution":{"sql":"SELECT e.name AS Employee\nFROM Employee e\nJOIN Employee m ON m.id = e.managerId\nWHERE e.salary > m.salary;","html":"\u003cp>Aliases \u003ccode>e\u003c/code> and \u003ccode>m\u003c/code> are two roles for the same table. Employees without a manager have no match and drop out, which is right: they cannot out-earn a manager.\u003c/p>\n"},"alternatives":[{"title":"Correlated subquery","sql":"SELECT name AS Employee\nFROM Employee e\nWHERE salary > (SELECT m.salary FROM Employee m WHERE m.id = e.managerId);","html":"\u003cp>For each employee, look up the manager&#39;s salary. If there is no manager the subquery is NULL and the comparison is not TRUE.\u003c/p>\n"}],"traps":[{"sql":"SELECT e.name AS Employee FROM Employee e JOIN Employee m ON m.id = e.managerId WHERE e.salary >= m.salary;","html":"\u003cp>\u003ccode>&gt;=\u003c/code> also returns employees who earn exactly as much as their manager.\u003c/p>\n"},{"sql":"SELECT m.name AS Employee FROM Employee e JOIN Employee m ON m.id = e.managerId WHERE e.salary > m.salary;","html":"\u003cp>Returns the managers&#39; names instead of the employees&#39;.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employee","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false},{"name":"salary","type":"INT","pk":false},{"name":"managerId","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), salary INT, managerId INT);\nINSERT INTO Employee VALUES (1, 'Iris', 120000, NULL), (2, 'Jonas', 95000, 1), (3, 'Kemal', 100000, 2), (4, 'Lea', 90000, 2), (5, 'Milo', 95000, 2), (6, 'Nia', 130000, 1);","tables":[{"name":"Employee","rows":[[1,"Iris",120000,null],[2,"Jonas",95000,1],[3,"Kemal",100000,2],[4,"Lea",90000,2],[5,"Milo",95000,2],[6,"Nia",130000,1]]}],"runs":[{"expected":{"columns":["Employee"],"rows":[["Kemal"],["Nia"]]}}]},{"name":"Managers missing from the table","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), salary INT, managerId INT);\nINSERT INTO Employee VALUES (1, 'Ann', 50000, NULL), (2, 'Bob', 60000, 7), (3, 'Cid', 70000, 1), (4, 'Dee', 50000, 1);","tables":[{"name":"Employee","rows":[[1,"Ann",50000,null],[2,"Bob",60000,7],[3,"Cid",70000,1],[4,"Dee",50000,1]]}],"runs":[{"expected":{"columns":["Employee"],"rows":[["Cid"]]}}]}]},"182":{"id":182,"title":"Duplicate Emails","slug":"duplicate-emails","difficulty":"Easy","module":"aggregation","patterns":["GROUP BY + HAVING"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Report every email address that appears in more than one row of \u003ccode>Person\u003c/code>. Each duplicated email should appear \u003cstrong>once\u003c/strong>, in a column named \u003ccode>Email\u003c/code>. Emails are never NULL and are all lowercase. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Group the rows by email and count each group.\u003c/p>\n","\u003cp>Keep only groups with a count above 1 — that is a HAVING condition.\u003c/p>\n","\u003cp>Name the output column exactly \u003ccode>Email\u003c/code>.\u003c/p>\n"],"solution":{"sql":"SELECT email AS Email\nFROM Person\nGROUP BY email\nHAVING COUNT(*) > 1;","html":"\u003cp>One group per email; HAVING keeps the groups with more than one row. \u003ccode>bo@x.io\u003c/code> appears three times but, being one group, is reported once.\u003c/p>\n"},"alternatives":[{"title":"Self-join","sql":"SELECT DISTINCT p1.email AS Email\nFROM Person p1\nJOIN Person p2 ON p1.email = p2.email AND p1.id \u003c> p2.id;","html":"\u003cp>Pairs each row with a \u003cem>different\u003c/em> row that has the same email. DISTINCT is essential: an email that appears three times forms six pairs.\u003c/p>\n"}],"traps":[{"sql":"SELECT email AS Email FROM Person GROUP BY email HAVING COUNT(*) = 2;","html":"\u003cp>Misses emails that appear three or more times.\u003c/p>\n"},{"sql":"SELECT p1.email AS Email FROM Person p1 JOIN Person p2 ON p1.email = p2.email AND p1.id \u003c> p2.id;","html":"\u003cp>Without DISTINCT the self-join returns each duplicated email once per matching pair.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Person","columns":[{"name":"id","type":"INT","pk":true},{"name":"email","type":"VARCHAR(255)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Person (id INT PRIMARY KEY, email VARCHAR(255));\nINSERT INTO Person VALUES (1, 'ana@x.io'), (2, 'bo@x.io'), (3, 'ana@x.io'), (4, 'cy@x.io'), (5, 'bo@x.io'), (6, 'bo@x.io'), (7, 'dee@x.io');","tables":[{"name":"Person","rows":[[1,"ana@x.io"],[2,"bo@x.io"],[3,"ana@x.io"],[4,"cy@x.io"],[5,"bo@x.io"],[6,"bo@x.io"],[7,"dee@x.io"]]}],"runs":[{"expected":{"columns":["Email"],"rows":[["ana@x.io"],["bo@x.io"]]}}]},{"name":"No duplicates","setup":"CREATE TABLE Person (id INT PRIMARY KEY, email VARCHAR(255));\nINSERT INTO Person VALUES (1, 'a@b.c'), (2, 'd@e.f');","tables":[{"name":"Person","rows":[[1,"a@b.c"],[2,"d@e.f"]]}],"runs":[{"expected":{"columns":["Email"],"rows":[]}}]}]},"183":{"id":183,"title":"Customers Who Never Order","slug":"customers-who-never-order","difficulty":"Easy","module":"joins","patterns":["anti-join"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Return the names of customers who \u003cstrong>never\u003c/strong> placed an order, in a column called \u003ccode>Customers\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Customers with no matching order: a LEFT JOIN where the order side is NULL.\u003c/p>\n","\u003cp>NOT IN is fragile if the subquery can return NULL — check the hidden test.\u003c/p>\n"],"solution":{"sql":"SELECT c.name AS Customers\nFROM Customers c\nLEFT JOIN Orders o ON o.customerId = c.id\nWHERE o.id IS NULL;","html":"\u003cp>The classic anti-join: keep customers, attach orders if any, then keep only the rows where no order attached. Test the right table&#39;s primary key, which is never NULL in a real match.\u003c/p>\n"},"alternatives":[{"title":"NOT EXISTS","sql":"SELECT name AS Customers\nFROM Customers c\nWHERE NOT EXISTS (SELECT 1 FROM Orders o WHERE o.customerId = c.id);","html":"\u003cp>Reads exactly like the question and is immune to NULLs in \u003ccode>Orders.customerId\u003c/code>.\u003c/p>\n"}],"traps":[{"sql":"SELECT name AS Customers FROM Customers WHERE id NOT IN (SELECT customerId FROM Orders);","html":"\u003cp>Passes LeetCode&#39;s data, but returns nothing once any order has a NULL customerId (see the hidden test).\u003c/p>\n"},{"sql":"SELECT c.name AS Customers FROM Customers c JOIN Orders o ON o.customerId \u003c> c.id;","html":"\u003cp>&quot;Not equal&quot; pairs each customer with every other customer&#39;s orders — it does not find missing matches.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Customers","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false}]},{"name":"Orders","columns":[{"name":"id","type":"INT","pk":true},{"name":"customerId","type":"INT","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Customers (id INT PRIMARY KEY, name VARCHAR(255));\nCREATE TABLE Orders (id INT PRIMARY KEY, customerId INT);\nINSERT INTO Customers VALUES (1, 'Aria'), (2, 'Bea'), (3, 'Cole'), (4, 'Dev'), (5, 'Eve');\nINSERT INTO Orders VALUES (1, 3), (2, 1), (3, 3);","tables":[{"name":"Customers","rows":[[1,"Aria"],[2,"Bea"],[3,"Cole"],[4,"Dev"],[5,"Eve"]]},{"name":"Orders","rows":[[1,3],[2,1],[3,3]]}],"runs":[{"expected":{"columns":["Customers"],"rows":[["Bea"],["Dev"],["Eve"]]}}]},{"name":"An order with no customer id","setup":"CREATE TABLE Customers (id INT PRIMARY KEY, name VARCHAR(255));\nCREATE TABLE Orders (id INT PRIMARY KEY, customerId INT);\nINSERT INTO Customers VALUES (1, 'Aria'), (2, 'Bea'), (3, 'Cole');\nINSERT INTO Orders VALUES (1, 1), (2, NULL);","tables":[{"name":"Customers","rows":[[1,"Aria"],[2,"Bea"],[3,"Cole"]]},{"name":"Orders","rows":[[1,1],[2,null]]}],"runs":[{"expected":{"columns":["Customers"],"rows":[["Bea"],["Cole"]]}}]}]},"184":{"id":184,"title":"Department Highest Salary","slug":"department-highest-salary","difficulty":"Medium","module":"subqueries","patterns":["max per group with ties","tuple IN"],"sql50":false,"order":false,"kind":"query","taskHtml":"\u003cp>Find the employees who have the \u003cstrong>highest salary in their department\u003c/strong> (all of them, if several tie). Return \u003ccode>Department\u003c/code> (the department&#39;s name), \u003ccode>Employee\u003c/code> (the employee&#39;s name) and \u003ccode>Salary\u003c/code>. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>First compute the maximum salary per department.\u003c/p>\n","\u003cp>Then keep employees whose (department, salary) pair matches — ties included.\u003c/p>\n","\u003cp>Join Department for the name.\u003c/p>\n"],"solution":{"sql":"SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary\nFROM Employee e\nJOIN Department d ON d.id = e.departmentId\nWHERE (e.departmentId, e.salary) IN (\n  SELECT departmentId, MAX(salary)\n  FROM Employee\n  GROUP BY departmentId\n);","html":"\u003cp>The tuple IN keeps everyone who equals their department&#39;s maximum, so Boris and Chen both appear.\u003c/p>\n"},"alternatives":[{"title":"Correlated subquery","sql":"SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary\nFROM Employee e\nJOIN Department d ON d.id = e.departmentId\nWHERE e.salary = (SELECT MAX(x.salary) FROM Employee x WHERE x.departmentId = e.departmentId);","html":"\u003cp>For each employee, compare with the max of their own department.\u003c/p>\n"},{"title":"Window function","sql":"SELECT Department, Employee, Salary\nFROM (\n  SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary,\n         RANK() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC) AS rnk\n  FROM Employee e\n  JOIN Department d ON d.id = e.departmentId\n) t\nWHERE rnk = 1;","html":"\u003cp>RANK gives tied top earners rank 1 (Module 9).\u003c/p>\n"}],"traps":[{"sql":"SELECT d.name AS Department, e.name AS Employee, MAX(e.salary) AS Salary FROM Employee e JOIN Department d ON d.id = e.departmentId GROUP BY d.id, d.name;","html":"\u003cp>MySQL rejects \u003ccode>e.name\u003c/code> here (ONLY_FULL_GROUP_BY); engines that allow it pick an arbitrary name — and one row per department cannot show ties.\u003c/p>\n"},{"sql":"SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary FROM Employee e JOIN Department d ON d.id = e.departmentId ORDER BY e.salary DESC LIMIT 1;","html":"\u003cp>Finds the single highest salary overall, not per department.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employee","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false},{"name":"salary","type":"INT","pk":false},{"name":"departmentId","type":"INT","pk":false}]},{"name":"Department","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), salary INT, departmentId INT);\nCREATE TABLE Department (id INT PRIMARY KEY, name VARCHAR(255));\nINSERT INTO Department VALUES (1, 'IT'), (2, 'Sales'), (3, 'Ops'), (4, 'Legal');\nINSERT INTO Employee VALUES (1, 'Anya', 85000, 1), (2, 'Boris', 92000, 1), (3, 'Chen', 92000, 1), (4, 'Dale', 70000, 1),\n  (5, 'Emil', 60000, 2), (6, 'Faye', 75000, 2), (7, 'Gus', 50000, 3);","tables":[{"name":"Employee","rows":[[1,"Anya",85000,1],[2,"Boris",92000,1],[3,"Chen",92000,1],[4,"Dale",70000,1],[5,"Emil",60000,2],[6,"Faye",75000,2],[7,"Gus",50000,3]]},{"name":"Department","rows":[[1,"IT"],[2,"Sales"],[3,"Ops"],[4,"Legal"]]}],"runs":[{"expected":{"columns":["Department","Employee","Salary"],"rows":[["IT","Boris",92000],["IT","Chen",92000],["Sales","Faye",75000],["Ops","Gus",50000]]}}]},{"name":"A whole department tied","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), salary INT, departmentId INT);\nCREATE TABLE Department (id INT PRIMARY KEY, name VARCHAR(255));\nINSERT INTO Department VALUES (1, 'Art'), (2, 'Law'); INSERT INTO Employee VALUES (1, 'Xia', 100, 1), (2, 'Yan', 100, 1), (3, 'Zak', 100, 1), (4, 'Wu', 50, 2);","tables":[{"name":"Employee","rows":[[1,"Xia",100,1],[2,"Yan",100,1],[3,"Zak",100,1],[4,"Wu",50,2]]},{"name":"Department","rows":[[1,"Art"],[2,"Law"]]}],"runs":[{"expected":{"columns":["Department","Employee","Salary"],"rows":[["Art","Xia",100],["Art","Yan",100],["Art","Zak",100],["Law","Wu",50]]}}]}]},"185":{"id":185,"title":"Department Top Three Salaries","slug":"department-top-three-salaries","difficulty":"Hard","module":"patterns","patterns":["top N distinct per group","DENSE_RANK"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>A \u003cstrong>high earner\u003c/strong> is an employee whose salary is among the \u003cstrong>top three distinct salaries\u003c/strong> of their department. Return \u003ccode>Department\u003c/code> (name), \u003ccode>Employee\u003c/code> (name) and \u003ccode>Salary\u003c/code> for every high earner. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>&quot;Top three distinct salaries&quot;: ties share a place, and the numbering must not skip.\u003c/p>\n","\u003cp>DENSE_RANK per department, ordered by salary descending.\u003c/p>\n","\u003cp>Filter the rank in an outer query (window functions cannot go in WHERE).\u003c/p>\n"],"solution":{"sql":"SELECT Department, Employee, Salary\nFROM (\n  SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary,\n         DENSE_RANK() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC) AS rnk\n  FROM Employee e\n  JOIN Department d ON d.id = e.departmentId\n) ranked\nWHERE rnk \u003c= 3;","html":"\u003cp>IT&#39;s distinct salaries are 95k, 90k, 85k, 80k: the top three levels cover five people (two tie at 90k, two at 85k). Sales has only two people, both included.\u003c/p>\n"},"alternatives":[{"title":"Correlated count (no window functions)","sql":"SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary\nFROM Employee e\nJOIN Department d ON d.id = e.departmentId\nWHERE (SELECT COUNT(DISTINCT e2.salary)\n       FROM Employee e2\n       WHERE e2.departmentId = e.departmentId AND e2.salary > e.salary) \u003c 3;","html":"\u003cp>An employee is a high earner if fewer than three distinct salaries in their department are higher than theirs.\u003c/p>\n"}],"traps":[{"sql":"SELECT Department, Employee, Salary FROM (SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary, RANK() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC) AS rnk FROM Employee e JOIN Department d ON d.id = e.departmentId) t WHERE rnk \u003c= 3;","html":"\u003cp>RANK skips after ties (1, 2, 2, 4), so the 85k earners are lost.\u003c/p>\n"},{"sql":"SELECT Department, Employee, Salary FROM (SELECT d.name AS Department, e.name AS Employee, e.salary AS Salary, ROW_NUMBER() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC) AS rn FROM Employee e JOIN Department d ON d.id = e.departmentId) t WHERE rn \u003c= 3;","html":"\u003cp>ROW_NUMBER keeps exactly three people and drops tied colleagues.\u003c/p>\n"}],"fn":null,"after":null,"starter":null,"schema":[{"name":"Employee","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false},{"name":"salary","type":"INT","pk":false},{"name":"departmentId","type":"INT","pk":false}]},{"name":"Department","columns":[{"name":"id","type":"INT","pk":true},{"name":"name","type":"VARCHAR(255)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), salary INT, departmentId INT);\nCREATE TABLE Department (id INT PRIMARY KEY, name VARCHAR(255));\nINSERT INTO Department VALUES (1, 'IT'), (2, 'Sales'), (3, 'Legal');\nINSERT INTO Employee VALUES\n  (1, 'Ana', 95000, 1), (2, 'Ben', 90000, 1), (3, 'Cai', 90000, 1), (4, 'Dev', 85000, 1),\n  (5, 'Eli', 80000, 1), (6, 'Fox', 85000, 1), (7, 'Gia', 60000, 2), (8, 'Hub', 70000, 2);","tables":[{"name":"Employee","rows":[[1,"Ana",95000,1],[2,"Ben",90000,1],[3,"Cai",90000,1],[4,"Dev",85000,1],[5,"Eli",80000,1],[6,"Fox",85000,1],[7,"Gia",60000,2],[8,"Hub",70000,2]]},{"name":"Department","rows":[[1,"IT"],[2,"Sales"],[3,"Legal"]]}],"runs":[{"expected":{"columns":["Department","Employee","Salary"],"rows":[["IT","Ana",95000],["IT","Ben",90000],["IT","Cai",90000],["IT","Dev",85000],["IT","Fox",85000],["Sales","Hub",70000],["Sales","Gia",60000]]}}]},{"name":"Few distinct salaries, and a tie for third","setup":"CREATE TABLE Employee (id INT PRIMARY KEY, name VARCHAR(255), salary INT, departmentId INT);\nCREATE TABLE Department (id INT PRIMARY KEY, name VARCHAR(255));\nINSERT INTO Department VALUES (1, 'Ops'), (2, 'Dev'); INSERT INTO Employee VALUES (1, 'Ari', 100, 1), (2, 'Bea', 100, 1), (3, 'Cyd', 50, 1), (4, 'Dov', 90, 2), (5, 'Eno', 80, 2), (6, 'Fia', 70, 2), (7, 'Gus', 70, 2), (8, 'Hal', 60, 2);","tables":[{"name":"Employee","rows":[[1,"Ari",100,1],[2,"Bea",100,1],[3,"Cyd",50,1],[4,"Dov",90,2],[5,"Eno",80,2],[6,"Fia",70,2],[7,"Gus",70,2],[8,"Hal",60,2]]},{"name":"Department","rows":[[1,"Ops"],[2,"Dev"]]}],"runs":[{"expected":{"columns":["Department","Employee","Salary"],"rows":[["Ops","Ari",100],["Ops","Bea",100],["Ops","Cyd",50],["Dev","Dov",90],["Dev","Eno",80],["Dev","Fia",70],["Dev","Gus",70]]}}]}]},"196":{"id":196,"title":"Delete Duplicate Emails","slug":"delete-duplicate-emails","difficulty":"Easy","module":"modifying","patterns":["self-join DELETE","dedupe"],"sql50":true,"order":false,"kind":"dml","taskHtml":"\u003cp>Write a \u003cstrong>DELETE\u003c/strong> that removes duplicate emails from \u003ccode>Person\u003c/code>, keeping for each email only the row with the \u003cstrong>smallest \u003ccode>id\u003c/code>\u003c/strong>. The checker runs your statement and then looks at the whole table (row order does not matter).\u003c/p>\n","notesHtml":"","hints":["\u003cp>A row must go if another row has the same email and a smaller id.\u003c/p>\n","\u003cp>MySQL&#39;s multi-table DELETE: \u003ccode>DELETE p1 FROM Person p1 JOIN Person p2 ON …\u003c/code> deletes the rows of p1 that find a partner.\u003c/p>\n","\u003cp>A subquery on \u003ccode>Person\u003c/code> inside \u003ccode>DELETE FROM Person\u003c/code> triggers MySQL error 1093 unless you wrap it in a derived table.\u003c/p>\n"],"solution":{"sql":"DELETE p1\nFROM Person p1\nJOIN Person p2\n  ON p1.email = p2.email\n AND p1.id > p2.id;","html":"\u003cp>Every row that has a same-email partner with a smaller id is deleted; the smallest id per email has no such partner and survives. (For \u003ca href=\"mailto:dee@x.io\">dee@x.io\u003c/a>, id 5 survives even though row 7 was inserted first.)\u003c/p>\n"},"alternatives":[{"title":"Comma join","sql":"DELETE p1\nFROM Person p1, Person p2\nWHERE p1.email = p2.email\n  AND p1.id > p2.id;","html":"\u003cp>The same multi-table DELETE with the old join syntax — the version most LeetCode answers use.\u003c/p>\n"},{"title":"Keep list in a derived table","sql":"DELETE FROM Person\nWHERE id NOT IN (\n  SELECT id FROM (SELECT MIN(id) AS id FROM Person GROUP BY email) AS keep\n);","html":"\u003cp>Selecting the survivors through a derived table materializes it first, which sidesteps MySQL error 1093.\u003c/p>\n"}],"traps":[{"sql":"DELETE FROM Person WHERE id NOT IN (SELECT MIN(id) FROM Person GROUP BY email);","html":"\u003cp>Logically right, but MySQL refuses to read \u003ccode>Person\u003c/code> in a subquery while deleting from it (error 1093).\u003c/p>\n"},{"sql":"DELETE p1 FROM Person p1 JOIN Person p2 ON p1.email = p2.email AND p1.id \u003c p2.id;","html":"\u003cp>Keeps the largest id per email instead of the smallest.\u003c/p>\n"}],"fn":null,"after":"SELECT * FROM Person","starter":null,"schema":[{"name":"Person","columns":[{"name":"id","type":"INT","pk":true},{"name":"email","type":"VARCHAR(255)","pk":false}]}],"datasets":[{"name":"Example data","setup":"CREATE TABLE Person (id INT PRIMARY KEY, email VARCHAR(255));\nINSERT INTO Person VALUES (7, 'dee@x.io'), (1, 'ana@x.io'), (2, 'bo@x.io'), (3, 'ana@x.io'), (4, 'cy@x.io'), (5, 'dee@x.io'), (6, 'bo@x.io'), (8, 'ana@x.io');","tables":[{"name":"Person","rows":[[7,"dee@x.io"],[1,"ana@x.io"],[2,"bo@x.io"],[3,"ana@x.io"],[4,"cy@x.io"],[5,"dee@x.io"],[6,"bo@x.io"],[8,"ana@x.io"]]}],"runs":[{"expected":{"columns":["id","email"],"rows":[[1,"ana@x.io"],[2,"bo@x.io"],[4,"cy@x.io"],[5,"dee@x.io"]]}}]},{"name":"One email three times","setup":"CREATE TABLE Person (id INT PRIMARY KEY, email VARCHAR(255));\nINSERT INTO Person VALUES (5, 'x@y.z'), (2, 'x@y.z'), (9, 'x@y.z'), (4, 'solo@y.z');","tables":[{"name":"Person","rows":[[5,"x@y.z"],[2,"x@y.z"],[9,"x@y.z"],[4,"solo@y.z"]]}],"runs":[{"expected":{"columns":["id","email"],"rows":[[2,"x@y.z"],[4,"solo@y.z"]]}}]}]},"197":{"id":197,"title":"Rising Temperature","slug":"rising-temperature","difficulty":"Easy","module":"joins","patterns":["self-join on dates","DATEDIFF"],"sql50":true,"order":false,"kind":"query","taskHtml":"\u003cp>Return the \u003ccode>id\u003c/code> of every day whose \u003ccode>temperature\u003c/code> is higher than the \u003cstrong>previous calendar day&#39;s\u003c/strong>. A day whose previous day has no record does not count. Any order.\u003c/p>\n","notesHtml":"","hints":["\u003cp>Pair each day with the day before it: a self-join.\u003c/p>\n","\u003cp>Ids are not dates — id 5 comes after id 4 but not the day after. Match on dates.\u003c/p>\n","\u003cp>\u003ccode>DATEDIFF(today, yesterday) = 1\u003c/code> works across month boundaries.\u003c/p>\n"],"solution":{"sql":"SELECT w.id\nFROM Weather w\nJOIN Weather y ON DATEDIFF(w.recordDate, y.recordDate) = 1\nWHERE w.temperature > y.temperature;","html":"\u003cp>Each row \u003ccode>w\u003c/code> is paired with the row exactly one day earlier. If that day is missing there is no partner, so the day is excluded — as required.\u003c/p>\n"},"alternatives":[{"title":"DATE_SUB","sql":"SELECT w.id\nFROM Weather w\nJOIN Weather y ON y.recordDate = DATE_SUB(w.recordDate, INTERVAL 1 DA
